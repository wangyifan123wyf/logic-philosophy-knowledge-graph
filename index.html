"desc": "密尔和普特南夸大了逻辑数学中的经验因素，忽视了相对独立性。", "detail": "(1)逻辑和数学相对于经验具有相当大的独立性，可脱离经验自主发展。(2)逻辑思考和数学思考可按自身逻辑进行，不涉及经验。(3)密尔普特南的论述过于粗糙，蒯因的整体主义经验论精致得多。"}]}]}, {"id": "8-7", "name": "逻辑真理的可修正性", "category": 2, "symbolSize": 32, "desc": "论证逻辑真理在原则上可修正，变异逻辑提供了现实例证，但修正必须十分慎重。", "children": [{"id": "8-7-1", "name": "蒯因的可修正论", "category": 3, "symbolSize": 26, "desc": "逻辑真理可错且原则上可修正，在顽强经验面前逻辑数学规律也不例外。", "children": [{"id": "8-7-1-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "蒯因最先明确指出逻辑真理在原则上都是可修正的。", "detail": "(1)逻辑真理含有经验内容，不具有绝对必然性，只具有相对于语言框架和思维规律的相对必然性。(2)逻辑真理必定是可错或可证伪的，可因经验理由被修正。(3)各种变异逻辑系统的出现为逻辑可被修正提供了现实例证。"}, {"id": "8-7-1-2", "name": "经典诘难", "category": 4, "symbolSize": 22, "desc": "蒯因自相矛盾：既主张逻辑可修正，又认为变异逻辑改变了论题不可比较。", "detail": "(1)蒯因认为变异逻辑改变了联结词的意义因而改变了论题。(2)他认为当变异常学家否定不矛盾律时，记号'﹁'确实就不再可以看作否定了。(3)若如此，变异逻辑与经典逻辑不仅没有竞争关系，甚至不可比较，可修正性便成空话。"}]}, {"id": "8-7-2", "name": "变异逻辑改变论题之辩", "category": 3, "symbolSize": 26, "desc": "反驳蒯因：变异逻辑未完全改变论题，且与经典逻辑可比较。", "children": [{"id": "8-7-2-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "变异逻辑与经典逻辑在谈论同样的联结词，可比较且存在冲突。", "detail": "(1)变异逻辑并未完全改变论题，仍在谈论同样联结词、有效性和真，只是赋予不同意义。(2)各变异逻辑都在处理语句之间的蕴涵关系并试图提供不同推理有效性标准。(3)变异逻辑创立者的本意是想替代或至少修正经典逻辑。"}, {"id": "8-7-2-2", "name": "论证依据", "category": 4, "symbolSize": 22, "desc": "存在翻译程序可将变异逻辑译入经典逻辑，显示前者常更弱。", "detail": "(1)直觉主义逻辑和相干逻辑都是由去掉经典逻辑的某些公理和定理得到的更弱系统。(2)哥德尔利用翻译在直觉主义逻辑中重新解释经典逻辑，得到命题演算上的等价结果。(3)直觉主义命题逻辑可在模态系统S4中得到解释。"}, {"id": "8-7-2-3", "name": "代表人物", "category": 4, "symbolSize": 22, "desc": "哥德尔利用翻译证明直觉主义逻辑可解释经典逻辑命题演算。", "detail": "(1)哥德尔利用翻译在直觉主义逻辑中重新解释经典逻辑。(2)对于命题演算，若古典地├E则直觉主义地├E'。(3)直觉主义命题逻辑还可在模态系统S4中解释。"}]}, {"id": "8-7-3", "name": "逻辑真理的局部修正说", "category": 3, "symbolSize": 26, "desc": "变异逻辑只是对经典逻辑的局部修正，不可能根本性修正。", "children": [{"id": "8-7-3-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "对逻辑的修正只能是局部修正，不可能是根本性修正。", "detail": "(1)变异逻辑并未完全改变所有联结词的所有意义，未否定经典逻辑的全部规律。(2)尽管某些经典规律在变异逻辑中不真，但没有一个在后者中假。(3)直觉主义学派认为排中律未证真也未证荒谬，有﹁﹁(p∨﹁﹁p)。(4)次协调逻辑只是削弱矛盾律，不是完全抛弃不矛盾律。"}, {"id": "8-7-3-2", "name": "论证依据", "category": 4, "symbolSize": 22, "desc": "经典逻辑根植于思维语言实践，经过长期检验，基本适用。", "detail": "(1)经典逻辑是根植于思维实践和语言实践中的，是人类认识的结晶。(2)经过长期实践检验证明基本适用，也许只是某些方面尚需修改。(3)不可能创立与经典逻辑完全不同、根本歧异的逻辑。"}]}, {"id": "8-7-4", "name": "逻辑修正的审慎原则", "category": 3, "symbolSize": 26, "desc": "逻辑在理论上可修正，但实践中必须慎之又慎。", "children": [{"id": "8-7-4-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "让逻辑不受伤害始终是合理的策略。", "detail": "(1)逻辑真理起源于关于日常语言用法及基于此的思维经验，具有极大稳定性。(2)逻辑在整个科学体系中处于核心地位，其改变会引起科学体系的强烈振荡。(3)作者赞同蒯因的主张：让逻辑不受伤害始终是一个合理的策略。(4)新逻辑理论必须经长时间检验才能获得合法地位。"}]}]}, {"id": "8-8", "name": "关于\"思维基本规律\"", "category": 2, "symbolSize": 32, "desc": "论证思维四律是用元语言表述的元规则，而非系统内的内定理。", "children": [{"id": "8-8-1", "name": "矛盾律与排中律的元规则定位", "category": 3, "symbolSize": 26, "desc": "矛盾律和排中律是构造和检验逻辑演算系统的根本指导原则。", "children": [{"id": "8-8-1-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "矛盾律和排中律是用元语言表述的元规则，不是内定理。", "detail": "(1)矛盾律语形表述：在同一思维过程中，一个思想及其否定不能并存或相容。(2)矛盾律语义表述：一个思想及其否定不能同真。(3)排中律语形表述：对于同一思想或者肯定或者否定，不存在第三种选择。(4)排中律语义表述：每一断定或者是真的或者是假的，构成二值原则的基础。"}, {"id": "8-8-1-2", "name": "论证依据", "category": 4, "symbolSize": 22, "desc": "﹁(p∧﹁p)只是矛盾律在命题演算中的表现形式，不是矛盾律本身。", "detail": "(1)矛盾律推动着人们追寻形式系统的无矛盾性证明，其元规则作用显露无疑。(2)﹁(p∧﹁p)只是遵循矛盾律构造的命题演算系统内的一个重言式。(3)(p∨﹁p)只是排中律在命题演算中的表现形式。(4)不能把元规则与其在内定理层次的表现形式混同。"}]}, {"id": "8-8-2", "name": "同一律的基础作用", "category": 3, "symbolSize": 26, "desc": "同一律要求符号单义、规则明确，其元规则作用体现在逻辑演算的所有方面。", "children": [{"id": "8-8-2-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "同一律保证思维的确定性和前后一贯性，是构造形式系统的基础。", "detail": "(1)语形表述：在同一思维过程中，每一思想都必须保持自身的确定和同一。(2)语义表述：任何思想是真的就是真的，是假的就是假的。(3)其元规则作用体现在：特制单义人工符号、递归定义合式公式、严格定义证明概念、区分元语言与对象语言等。"}]}, {"id": "8-8-3", "name": "充足理由律与分离规则", "category": 3, "symbolSize": 26, "desc": "充足理由律的形式表述即分离规则，要求理由真实且能从理由推出结论。", "children": [{"id": "8-8-3-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "充足理由律的语形表述就是分离规则：从A和A→B推出B。", "detail": "(1)充足理由律要求两条：理由必须真实；从理由能够推出结论。(2)其语形表述即分离规则：若├A且├A→B则├B。(3)语义表述：从A真和A→B真推出B真。(4)任何逻辑系统不可没有分离规则。"}, {"id": "8-8-3-2", "name": "论证依据", "category": 4, "symbolSize": 22, "desc": "反驳四条否定充足理由律的主要论据，证明其独特作用。", "detail": "(1)莱布尼茨论错了不等于不能用旧瓶装新酒。(2)能用永真式表达并非成为思维基本规律的必要条件，否则犯了把元规则贬为内定理的错误。(3)充足理由律的独特作用在于保证思维的论证性，同一律矛盾律排中律不能保证。(4)要求理由真实并非超出形式逻辑范围：在一完全可靠的系统中定理与永真可互译。"}]}, {"id": "8-8-4", "name": "元规则与内定理的层次区分", "category": 3, "symbolSize": 26, "desc": "思维四律属元理论层次，系统内定理属对象理论层次，二者不可混淆。", "children": [{"id": "8-8-4-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "将思维四律混同于系统内定理是一个根本性理论错误。", "detail": "(1)必须区分对象语言与元语言、内定理与元定理、内定理与元规则。(2)内定理是用对象语言表述的系统内接受命题，元定理是用元语言表述的关于系统的命题。(3)思维四律是用元语言表述的元公理或元规则，是构造逻辑演算系统的出发点。(4)四律在演算系统内的表现形式不即是这些规律自身，两者属于完全不同的理论层次。"}]}]}]}, {"id": "c09", "name": "第九章 对逻辑悖论的反思", "desc": "正文 · 共4个小节", "isAppendix": false, "children": [{"name": "一、悖论的定义和类型", "id": "9-1", "category": 2, "symbolSize": 32, "desc": "悖论的定义、类型与经典案例分析", "children": [{"name": "悖论定义说（四种涵义与共识三要素）", "id": "9-1-1", "category": 3, "symbolSize": 26, "desc": "四种涵义辨析与共识三要素的修正定义", "children": [{"name": "核心主张", "id": "9-1-1-1", "category": 4, "symbolSize": 22, "desc": "悖论是从合理前提经有效推导得矛盾等价式", "detail": "(1)悖论的四种涵义辨析：违反常识的真命题(似非而是)、似是而非的深刻命题、导出矛盾命题、推出矛盾等价式。只有第三种和第四种是真正的悖论。(2)张建军三要素说：共识、逻辑推导、矛盾等价式是构成悖论的三要素。(3)作者修正定义：如果从看起来合理的前提出发，通过看似正确有效的逻辑推导，得出了两个自相矛盾的命题或其等价式p↔￣1p，则称得出了悖论。"}, {"name": "论证依据", "id": "9-1-1-2", "category": 4, "symbolSize": 22, "desc": "四种涵义辨析与张建军三要素说的支撑", "detail": "(1)悖论的四种涵义辨析区分了真正悖论与一般反常命题。(2)张建军三要素说：共识(公认合理的背景知识)、逻辑推导(严格有效的推理)、矛盾等价式(p↔￣1p)。(3)作者将第三种和第四种意义的悖论都看作真正的悖论。"}, {"name": "经典诘难", "id": "9-1-1-3", "category": 4, "symbolSize": 22, "desc": "不少悖论不表现为矛盾等价式，勉强化归不自然", "detail": "(1)不少悖论并不表现为矛盾等价式，如布拉里—弗蒂悖论、康托尔悖论、里查德悖论等，勉强化归于等价式不自然。(2)第一种第二种涵义容易混淆真正悖论与一般反常命题的界限。(3)矛盾等价式作为必要条件过于强硬。"}, {"name": "代表人物", "id": "9-1-1-4", "category": 4, "symbolSize": 22, "desc": "张建军、弗兰克尔、作者陈波等", "detail": "(1)张建军提出共识三要素说。(2)弗兰克尔给出第四种悖论定义出处。(3)《中国大百科全书·哲学》和《辞海》采用第四种定义。(4)作者陈波提出修正定义，将第三种和第四种意义的悖论都看作真正的悖论。"}, {"name": "修正版本", "id": "9-1-1-5", "category": 4, "symbolSize": 22, "desc": "放宽定义为导出矛盾命题或证明矛盾等价式", "detail": "(1)作者将第三种和第四种意义的悖论都看作真正的悖论。(2)定义放宽为导出两个互相矛盾的命题，或者证明了矛盾命题的等价式。(3)不再严格要求矛盾等价式作为唯一标准。"}]}, {"name": "拉姆塞悖论分类（语形悖论与语义悖论）", "id": "9-1-2", "category": 3, "symbolSize": 26, "desc": "语形悖论与语义悖论的二分法及统一", "children": [{"name": "核心主张", "id": "9-1-2-1", "category": 4, "symbolSize": 22, "desc": "悖论分为逻辑—数学悖论和语义悖论两大类", "detail": "(1)逻辑—数学悖论(语形悖论)不涉及内容，只与类、集合、基数、序数等数学概念相关。(2)语义悖论与意义、命名、指称、定义、断定、真、假等心理或语义概念相关。(3)语形悖论能用符号逻辑体系的语言表述，只出现于数学中。"}, {"name": "论证依据", "id": "9-1-2-2", "category": 4, "symbolSize": 22, "desc": "两类悖论的具体列举与特征区分", "detail": "(1)语形悖论包括布拉里—弗蒂悖论、康托尔悖论、罗素悖论、理发师悖论。(2)语义悖论包括说谎者悖论、里查德悖论、贝里悖论、格雷林悖论。(3)语义悖论不出现于数学中，源自心理学或认识论中关于意义、指称、断定等概念的含混。"}, {"name": "经典诘难", "id": "9-1-2-3", "category": 4, "symbolSize": 22, "desc": "汤姆森证明两类悖论有共同对角线结构", "detail": "(1)汤姆森证明两类悖论有共同的对角线结构，实际上取消了拉姆塞的分类。(2)在形式系统L’中可以同时表达两类悖论且可相互转换，说明二者只有相对意义。(3)两类悖论的区别仅是表层的。"}, {"name": "代表人物", "id": "9-1-2-4", "category": 4, "symbolSize": 22, "desc": "拉姆塞、汤姆森、罗素", "detail": "(1)拉姆塞在1925年《数学基础》中首次提出两类悖论的分类。(2)汤姆森以对角线定理统一两类悖论。(3)罗素发现并分析多个悖论，为分类提供了素材。"}, {"name": "修正版本", "id": "9-1-2-5", "category": 4, "symbolSize": 22, "desc": "汤姆森之后统称为对角线悖论", "detail": "(1)汤姆森之后所有此类悖论统称为对角线悖论。(2)两类悖论可相互转换，分类只有相对意义。(3)统一于对角线结构后不再强调语形与语义的二分。"}]}, {"name": "说谎者悖论及其变形（语义悖论核心）", "id": "9-1-3", "category": 3, "symbolSize": 26, "desc": "最典型语义悖论及其多种变形分析", "children": [{"name": "核心主张", "id": "9-1-3-1", "category": 4, "symbolSize": 22, "desc": "说谎者语句真当且仅当假，揭示真假深层矛盾", "detail": "(1)一个人说「我正在说的这句话是假话」，这句话真当且仅当这句话假。(2)是最典型的语义悖论，揭示了日常语义概念中真、假的深层矛盾。(3)通过自我指称说自己为假导致逻辑循环。"}, {"name": "论证依据", "id": "9-1-3-2", "category": 4, "symbolSize": 22, "desc": "从埃匹门尼德到欧布里德斯的严格形式化", "detail": "(1)埃匹门尼德原版：「所有的克里特岛人都说谎」。(2)欧布里德斯改述为严格形式：一个人说唯一一句话「我正在说的这句话是假话」。(3)多种变形：明信片悖论(两张明信片互相指称)、经验悖论(砝码悖论)、转圈悖论——通过直接或间接自我指称说自己为假。"}, {"name": "经典诘难", "id": "9-1-3-3", "category": 4, "symbolSize": 22, "desc": "自指命题无意义说与同层次自指的必然矛盾", "detail": "(1)中世纪有人认为含有自我指称的命题不是命题、无意义。(2)明信片悖论和转圈悖论暴露了同一层次的自我指称必然导致矛盾。(3)简单否定命题意义不足以彻底解决悖论。"}, {"name": "代表人物", "id": "9-1-3-4", "category": 4, "symbolSize": 22, "desc": "埃匹门尼德、欧布里德斯、中世纪逻辑学家", "detail": "(1)埃匹门尼德提出最早版本的说谎者。(2)欧布里德斯给出严格形式化表述。(3)中世纪经院逻辑学家研究各种变形并讨论其解决方案。"}, {"name": "修正版本", "id": "9-1-3-5", "category": 4, "symbolSize": 22, "desc": "说真话者变形不构成悖论，语言分层或真值空缺", "detail": "(1)说谎者悖论的说真话者变形：「本语句是真的」不构成悖论。(2)塔斯基通过语言分层避免悖论。(3)克里普克等人通过真值空缺避免悖论。"}]}, {"name": "罗素悖论与集合论悖论（语形悖论核心）", "id": "9-1-4", "category": 3, "symbolSize": 26, "desc": "罗素悖论动摇素朴集合论基础的逻辑分析", "children": [{"name": "核心主张", "id": "9-1-4-1", "category": 4, "symbolSize": 22, "desc": "不以自身为元素的集合之集导出矛盾等价式", "detail": "(1)把所有不以自身为元素的集合组成集合S，则S属于S当且仅当S不属于S。(2)涉及集合、属于等基本概念，动摇了素朴集合论的基础。(3)正常集合与非正常集合的分类导致矛盾。"}, {"name": "论证依据", "id": "9-1-4-2", "category": 4, "symbolSize": 22, "desc": "概括规则导出罗素悖论及布拉里—弗蒂、康托尔悖论", "detail": "(1)根据概括规则定义S：x∈S↔x∉x，用S替换x得S∈S↔S∉S。(2)布拉里—弗蒂悖论：所有序数的集合导出其序数既等于δ又等于δ+1。(3)康托尔悖论：所有集合的集合μ，其幂集基数既大于μ又小于等于μ。"}, {"name": "经典诘难", "id": "9-1-4-3", "category": 4, "symbolSize": 22, "desc": "理发师悖论作为伪悖论，概括规则使用不当", "detail": "(1)理发师悖论作为罗素悖论的日常变形，很容易被否定前提——根本不可能有这样一个理发师，被称为伪悖论。(2)揭示了素朴集合论概括规则的使用不当导致不合法总体。(3)真正悖论难以如此轻易消解。"}, {"name": "代表人物", "id": "9-1-4-4", "category": 4, "symbolSize": 22, "desc": "罗素、策梅罗、康托尔、布拉里—弗蒂", "detail": "(1)罗素于1902年发现罗素悖论。(2)策梅罗独立发现同一悖论。(3)康托尔最早发现布拉里—弗蒂悖论。(4)布拉里—弗蒂于1897年重新发现该悖论。"}, {"name": "修正版本", "id": "9-1-4-5", "category": 4, "symbolSize": 22, "desc": "ZF(C)分离公理与BG(C)区分集合和真类", "detail": "(1)公理集合论ZF(C)修改概括规则为分离公理模式，禁止集合自属。(2)BG(C)区分集合和真类，真类不能作为其他集合的元素。(3)两系统准等价，BG(C)是ZF(C)的保守扩充。"}]}, {"name": "汤姆森对角线定理（两类悖论统一结构）", "id": "9-1-5", "category": 3, "symbolSize": 26, "desc": "康托尔对角线方法揭示所有悖论的共同结构", "children": [{"name": "核心主张", "id": "9-1-5-1", "category": 4, "symbolSize": 22, "desc": "所有主要悖论均具有相同的对角线结构", "detail": "(1)设S是任一集合，R是至少在S上有定义的任意关系，则S中不存在这样的元素，它与且仅与S中所有那些与其自身没有R关系的元素具有R关系。(2)所有主要悖论均有此结构，对角线定理的一阶逻辑表达是一阶逻辑定理。(3)统一了两类悖论。"}, {"name": "论证依据", "id": "9-1-5-2", "category": 4, "symbolSize": 22, "desc": "各主要悖论均可纳入对角线结构分析", "detail": "(1)格雷林悖论：没有形容词汇集含有对且只对非自谓形容词为真的形容词。(2)里查德悖论：正整数集合中有一无命名的集合。(3)罗素悖论与说谎者悖论(采用冗余真理论后)也符合对角线结构。"}, {"name": "经典诘难", "id": "9-1-5-3", "category": 4, "symbolSize": 22, "desc": "理发师悖论易消解为伪悖论，其他则不然", "detail": "(1)理发师悖论很容易通过否定前提消解，被称为伪悖论。(2)其他悖论否定前提则不那么容易。(3)对角线结构的普遍性并不能说明所有悖论同等严重。"}, {"name": "代表人物", "id": "9-1-5-4", "category": 4, "symbolSize": 22, "desc": "汤姆森、康托尔", "detail": "(1)汤姆森于1962年发表《论几个悖论》，提出对角线定理。(2)康托尔创立对角线方法，为汤姆森定理提供了技术基础。(3)后来的逻辑学家将所有此类悖论统称为对角线悖论。"}, {"name": "修正版本", "id": "9-1-5-5", "category": 4, "symbolSize": 22, "desc": "统称对角线悖论，两类悖论实际可相互转换", "detail": "(1)后来的逻辑学家把所有此类悖论统称为对角线悖论。(2)两类悖论实际可相互转换，分类只有相对意义。(3)对角线结构成为悖论分析的统一框架。"}]}]}, {"name": "二、悖论产生的原因", "id": "9-2", "category": 2, "symbolSize": 32, "desc": "悖论产生的深层原因系统分析", "children": [{"name": "自我指称说（恶性循环原则）", "id": "9-2-1", "category": 3, "symbolSize": 26, "desc": "悖论总与自我指称关联，罗素的恶性循环原则", "children": [{"name": "核心主张", "id": "9-2-1-1", "category": 4, "symbolSize": 22, "desc": "悖论总与自我指称有关联，构成恶性循环", "detail": "(1)自我指称指一个总体的元素、分子或部分直接或间接地指称这个总体本身。(2)罗素认为一切悖论都犯了恶性循环谬误，提出恶性循环原则禁止不合法的总体。(3)没有一个整体能包含只能借助这个整体才能定义的元素。"}, {"name": "论证依据", "id": "9-2-1-2", "category": 4, "symbolSize": 22, "desc": "直接循环与间接循环的具体案例分析", "detail": "(1)直接循环：说谎者悖论中主语指称整个语句本身；罗素悖论中「不以自身为元素的集合的集合」直接自指。(2)间接循环：明信片悖论(苏格拉底—柏拉图互相指称)、转圈悖论(有穷多个句子首尾相接，奇数个假则构成悖论)、砝码悖论(最后一命题迂回说自己假)。(3)所有现有悖论经分析均为自我指称。"}, {"name": "经典诘难", "id": "9-2-1-3", "category": 4, "symbolSize": 22, "desc": "自指并非必然致悖，许多日常自指无害", "detail": "(1)自我指称并非必然造成悖论——说谎者悖论的说真话者变形「本语句是真的」不造成悖论；转圈中偶数个假也不构成悖论(良性循环)。(2)许多日常自指无害，如「本语句是用中文书写的」。(3)霍夫斯塔德认为自我指称、自相缠绕是宇宙普遍现象。"}, {"name": "代表人物", "id": "9-2-1-4", "category": 4, "symbolSize": 22, "desc": "罗素、霍夫斯塔德", "detail": "(1)罗素提出恶性循环原则，禁止不合法总体。(2)霍夫斯塔德在《哥德尔、艾舍尔、巴赫》中提出怪圈理论，论证自指是普遍现象。(3)作者陈波持中间立场：并非一切自指都导致悖论，但能够导致悖论就是应防范的理由。"}, {"name": "修正版本", "id": "9-2-1-5", "category": 4, "symbolSize": 22, "desc": "能导致悖论就是应限制自指的理由", "detail": "(1)作者认为：并非一切自指都导致悖论。(2)但能够导致悖论就是应该防范、限制乃至禁止自我指称的理由。(3)此立场类似于交通规则：违反不总导致事故，但可能导致事故就应遵守。"}]}, {"name": "否定概念说（自指加否定构成自我否定）", "id": "9-2-2", "category": 3, "symbolSize": 26, "desc": "悖论成因在于自我指称加否定构成的自我否定", "children": [{"name": "核心主张", "id": "9-2-2-1", "category": 4, "symbolSize": 22, "desc": "悖论与否定直接相联系，自指加否定成自我否定", "detail": "(1)悖论总是与否定直接相联系。(2)悖论的成因在于由概念或命题的自我指称加上否定构成的自我否定。(3)若无自我否定，尽管有自指或尽管有否定，都不构成悖论。"}, {"name": "论证依据", "id": "9-2-2-2", "category": 4, "symbolSize": 22, "desc": "含否定与不含否定的自指案例对比分析", "detail": "(1)不以自身为元素的集合、非自谓的谓词、说自身为假的语句——都包含否定。(2)仅有自指无否定(「本语句是真的」)或仅有否定无自指(「他正在说的那句话是假的」)均不构成悖论。(3)「不属于空集的所有元素构成的集合」确实存在(即全集)，说明自指加否定并非一定致悖。"}, {"name": "经典诘难", "id": "9-2-2-3", "category": 4, "symbolSize": 22, "desc": "自指加否定并非必然导致悖论", "detail": "(1)自指加否定并非必然导致悖论，例如「本语句不是中文语句」「本人不是所有中国人中最聪明的中国人」都不构成悖论。(2)由此有人提出绝对否定概念说，但绝对概念又涉及总体和无限。(3)需要结合第三个因素统一考察。"}, {"name": "代表人物", "id": "9-2-2-4", "category": 4, "symbolSize": 22, "desc": "夏基松、郑毓信", "detail": "(1)夏基松、郑毓信提出绝对否定概念导致悖论的观点。(2)他们将否定概念极端化、绝对化视为悖论的根源。(3)但绝对概念本身又涉及总体和无限问题。"}, {"name": "修正版本", "id": "9-2-2-5", "category": 4, "symbolSize": 22, "desc": "绝对否定涉及总体和无限，需结合第三因素", "detail": "(1)所谓绝对否定实际上涉及总体和无限问题。(2)需要结合自我指称、否定概念、总体无限三个因素统一考察悖论成因。(3)单一因素不足以解释所有悖论。"}]}, {"name": "总体与无限说（实无穷与潜无穷）", "id": "9-2-3", "category": 3, "symbolSize": 26, "desc": "悖论与总体和无限相关，潜无穷做实无穷把握", "children": [{"name": "核心主张", "id": "9-2-3-1", "category": 4, "symbolSize": 22, "desc": "悖论产生与总体和无限有关", "detail": "(1)罗素认为凡涉及一个集合的全部元素者，它一定不是这一集合的一个元素。(2)与悖论相关的总体有两类：涉及有穷的(砝码悖论、转圈悖论)和涉及无穷的(各种大全集)。(3)悖论源于对潜无穷对象做实无穷把握。"}, {"name": "论证依据", "id": "9-2-3-2", "category": 4, "symbolSize": 22, "desc": "有穷总体与无穷总体两类案例的具体分析", "detail": "(1)有穷总体：砝码悖论「共有五个命题，两个真两个假，第五个说假比真多」。(2)无穷总体：所有不以自身为元素的集合之集、所有序数的集合、所有基数的集合。(3)大多数逻辑—数学悖论源自对潜无穷对象做实无穷把握——「……的集合」是潜无穷过程，「所有……的集合」是已完成整体，由此导致悖论。"}, {"name": "经典诘难", "id": "9-2-3-3", "category": 4, "symbolSize": 22, "desc": "直接自指多涉有穷，涉无穷一般只致无穷倒退", "detail": "(1)直接自指和间接自指大多数涉及有穷，若涉及无穷一般只形成无穷倒退而不导致悖论。(2)潜无穷与实无穷的区分本身就是哲学难题，难以严格界定。(3)有穷总体导致的悖论难以用总体无限说解释。"}, {"name": "代表人物", "id": "9-2-3-4", "category": 4, "symbolSize": 22, "desc": "罗素、公理集合论者", "detail": "(1)罗素提出恶性循环原则和不合法总体的概念。(2)公理集合论者禁止对潜无穷对象做实无穷处理。(3)ZF(C)和BG(C)系统均限制不合法总体的形成。"}, {"name": "修正版本", "id": "9-2-3-5", "category": 4, "symbolSize": 22, "desc": "不允许对潜无穷对象做实无穷处理以克服悖论", "detail": "(1)克服悖论的办法之一是不允许对潜无穷对象做实无穷处理。(2)后来的公理集合论大致沿此途径发展。(3)但仍需结合自我指称和否定概念两个因素才能完整解释悖论成因。"}]}]}, {"name": "三、主要的悖论解决方案", "id": "9-3", "category": 2, "symbolSize": 32, "desc": "主要悖论解决方案的系统考察与评价", "children": [{"name": "公理集合论方案（ZF与BG系统）", "id": "9-3-1", "category": 3, "symbolSize": 26, "desc": "通过修改概括规则避免集合论悖论", "children": [{"name": "核心主张", "id": "9-3-1-1", "category": 4, "symbolSize": 22, "desc": "修改或限制素朴集合论概括规则以排除悖论", "detail": "(1)通过修改或限制素朴集合论的概括规则来避免悖论。(2)ZF(C)否定概括原则的任意性，改为分离公理模式——只能在已有集合中分离出满足条件的子集。(3)BG(C)不修改概括规则而区分集合和真类，真类不能作为其他集合的元素。"}, {"name": "论证依据", "id": "9-3-1-2", "category": 4, "symbolSize": 22, "desc": "罗素悖论的四前提及两系统各自的否定策略", "detail": "(1)罗素悖论基于四个前提：概括原则、S∈S有意义、集合可作为自身元素、一阶逻辑。(2)ZF(C)否定前提一：分离公理模式(从已有集合中分离)、正则公理(禁止集合自属)。(3)BG(C)否定前提二：区分集合与真类，限制元素资格。(4)两系统准等价：BG(C)是ZF(C)的保守扩充。"}, {"name": "经典诘难", "id": "9-3-1-3", "category": 4, "symbolSize": 22, "desc": "公理选择的任意性、特设性与一致性相对性问题", "detail": "(1)公理选择存在任意性和特设性——主要动机是避免悖论。(2)公理本身有真假对错问题，不是自明的。(3)系统的一致性问题只能相对解决(哥德尔不完全性定理)，无法在系统内部证明自身一致性。"}, {"name": "代表人物", "id": "9-3-1-4", "category": 4, "symbolSize": 22, "desc": "策梅罗、斯柯伦、弗兰克尔、冯·诺伊曼、哥德尔", "detail": "(1)策梅罗于1908年建立第一个公理集合论系统。(2)斯柯伦、弗兰克尔完善ZF系统。(3)冯·诺伊曼、贝尔纳斯、哥德尔建立BG系统。(4)两系统迄今均未发现新悖论。"}, {"name": "修正版本", "id": "9-3-1-5", "category": 4, "symbolSize": 22, "desc": "两系统均未发现新悖论，满足数学需要", "detail": "(1)目前ZF(C)和BG(C)两个系统均没有发现新的悖论。(2)所做的工作能够得到数学需要的集合论。(3)公理集合论是目前最成功的悖论解决方案之一。"}]}, {"name": "罗素类型论（简单类型论与分支类型论）", "id": "9-3-2", "category": 3, "symbolSize": 26, "desc": "通过集合分层禁止自我指称避免悖论", "children": [{"name": "核心主张", "id": "9-3-2-1", "category": 4, "symbolSize": 22, "desc": "基于恶性循环原则，通过集合分层禁止自指", "detail": "(1)基于恶性循环原则：没有一个整体能包含只能借助这个整体才能定义的元素。(2)通过给集合分层——低层集合只能作为高一层集合的元素——禁止自我指称来避免悖论。(3)简单类型论与分支类型论两种形式。"}, {"name": "论证依据", "id": "9-3-2-2", "category": 4, "symbolSize": 22, "desc": "简单类型论T与分支类型论RT的技术构造", "detail": "(1)简单类型论T：个体为0型，集合比其元素高1型，xi∈yj是合式公式仅当j=i+1。(2)分支类型论RT：同一型内再分直谓与非直谓层次，非直谓涉及该类型全体。(3)引入还原公理：每一非直谓性质都有直谓性质与之等价。"}, {"name": "经典诘难", "id": "9-3-2-3", "category": 4, "symbolSize": 22, "desc": "特设性强，禁止一切自指过宽，还原公理自毁", "detail": "(1)特设性强——唯一理由是避免悖论，缺乏独立的理论依据。(2)禁止一切自我指称过宽，许多良性自指如「本语句不是用斜体字印刷的」也被排除。(3)分支类型论使实数等无法做单一断定。(4)还原公理等于取消分支类型论。"}, {"name": "代表人物", "id": "9-3-2-4", "category": 4, "symbolSize": 22, "desc": "罗素", "detail": "(1)罗素于1908年发表《以类型论为基础的数理逻辑》，系统提出类型论。(2)类型论是罗素解决悖论的最主要贡献。(3)尽管有特设性，类型论推动了后来逻辑学和数学基础的发展。"}, {"name": "修正版本", "id": "9-3-2-5", "category": 4, "symbolSize": 22, "desc": "虽有特设性，但推动了逻辑学和数学基础发展", "detail": "(1)类型论虽有明显的特设性。(2)但推动了后来逻辑学和数学基础的重要发展。(3)后来的公理集合论方案在技术上超越了类型论，成为主流方案。"}]}, {"name": "塔斯基语义学（语言分层与真定义）", "id": "9-3-3", "category": 3, "symbolSize": 26, "desc": "区分对象语言与元语言，分层定义真概念", "children": [{"name": "核心主张", "id": "9-3-3-1", "category": 4, "symbolSize": 22, "desc": "悖论源于日常语言的语义封闭性，需语言分层", "detail": "(1)悖论源于日常语言的语义封闭性——包含自身表达式名称和真、假等语义谓词。(2)避免悖论需区分对象语言和元语言，将真概念相对于特定语言层次进行定义。(3)语义封闭的语言必然包含悖论。"}, {"name": "论证依据", "id": "9-3-3-2", "category": 4, "symbolSize": 22, "desc": "T模式导致悖论，真定义需实质充分性与形式正确性", "detail": "(1)日常语言加T模式「X是真语句当且仅当p」导致悖论。(2)真定义需满足实质充分性(衍推T模式所有特例)和形式正确性(语言分层、明确结构、元语言更丰富)。(3)对较贫乏语言可无矛盾地给出真定义；对较丰富语言(如形式算术)不可能——真的不可定义性定理。"}, {"name": "经典诘难", "id": "9-3-3-3", "category": 4, "symbolSize": 22, "desc": "强烈特设性、实际操作不可行、语言层次终结问题", "detail": "(1)强烈特设性——与日常语言直觉冲突。(2)实际操作不可行——克里普克举例迪安与尼克松互相指称无法分层。(3)亨迪卡IF逻辑可构造包含自身真定义的一致语言，反驳语义封闭性要求。(4)语言层次终结问题——若有一统一的元语言，则它本身是语义封闭的。"}, {"name": "代表人物", "id": "9-3-3-4", "category": 4, "symbolSize": 22, "desc": "塔斯基、乌卡谢维奇、亨迪卡、桑朵", "detail": "(1)塔斯基在《形式化语言中的真概念》中系统提出语言分层理论。(2)乌卡谢维奇对真概念的形式化做出贡献。(3)亨迪卡、桑朵提出IF逻辑，构造可包含自身真定义的一致语言。"}, {"name": "修正版本", "id": "9-3-3-5", "category": 4, "symbolSize": 22, "desc": "克里普克倒转塔斯基程序，追溯真值的有根性", "detail": "(1)克里普克将塔斯基程序倒过来。(2)从具体语句追溯其真值的根据(有根性)，避免语言分层。(3)通过真值空缺和固定点理论处理悖论性语句。"}]}, {"name": "克里普克真理论（有根性与固定点）", "id": "9-3-4", "category": 3, "symbolSize": 26, "desc": "单一真谓词通过真值空缺避免悖论", "children": [{"name": "核心主张", "id": "9-3-4-1", "category": 4, "symbolSize": 22, "desc": "单一真谓词可用于自身语言，悖论语句处于空缺", "detail": "(1)只存在一个真谓词，可运用于含有自身谓词的语言而不会导致悖论。(2)通过允许真值空缺并使悖论性语句处于空缺中避免悖论。(3)核心概念是有根性、固定点和真值空缺。"}, {"name": "论证依据", "id": "9-3-4-2", "category": 4, "symbolSize": 22, "desc": "克林尼强三值逻辑、有根性与固定点的技术构造", "detail": "(1)克林尼强三值逻辑模型提供语义基础。(2)有根性：语句真值可通过程序归结为某个不含真谓词语句的真值。(3)固定点：本身不含真谓词而可凭经验或逻辑数学手段确定真值的语句。(4)无根语句是悖论性的，在任何固定点中既不真也不假——处于真值空缺中。"}, {"name": "经典诘难", "id": "9-3-4-3", "category": 4, "symbolSize": 22, "desc": "需元语言，强化说谎者悖论无法解决", "detail": "(1)极小固定点的归纳定义在集合论语言中而非对象语言中给出，需要元语言。(2)有些断定无法在对象语言中给出，如「本语句是假的」不是真的。(3)有根性不属于对象语言，强化说谎者悖论「本语句是假的或无根的」无法解决。(4)克里普克承认塔斯基层次的幽灵依然与我们同在。"}, {"name": "代表人物", "id": "9-3-4-4", "category": 4, "symbolSize": 22, "desc": "克里普克、马丁、伍德努夫、克林尼", "detail": "(1)克里普克于1975年发表《真理论纲要》，系统提出有根性与固定点理论。(2)马丁、伍德努夫是先行的探索者。(3)克林尼提供三值逻辑模型的数学基础。"}, {"name": "修正版本", "id": "9-3-4-5", "category": 4, "symbolSize": 22, "desc": "较塔斯基更直观但需元语言，无根本差异", "detail": "(1)与塔斯基相比更符合直观(有根性、单一真谓词)。(2)但仍需元语言，与塔斯基没有根本差异。(3)克里普克承认塔斯基层次的幽灵依然存在。"}]}, {"name": "次协调逻辑（容纳真矛盾）", "id": "9-3-5", "category": 3, "symbolSize": 26, "desc": "将矛盾圈禁使之不扩散，矛盾律不普遍有效", "children": [{"name": "核心主张", "id": "9-3-5-1", "category": 4, "symbolSize": 22, "desc": "悖论是思维中固有的，应容纳而非拒斥", "detail": "(1)悖论是思维中固有的，正确的态度不是拒斥而是学会与之相处。(2)将矛盾圈禁使之不扩散、不危害理论整体。(3)矛盾律￣1(A∧￣1A)不普遍有效，从矛盾推不出任意公式。"}, {"name": "论证依据", "id": "9-3-5-2", "category": 4, "symbolSize": 22, "desc": "Cn系列次协调逻辑的技术构造与性质", "detail": "(1)经典逻辑中不协调必导致不足道(从矛盾推出一切)。(2)次协调逻辑Cn系列：矛盾律不普遍有效；从A和￣1A推不出任意公式；容纳大多数经典逻辑推理模式。(3)Cn有合适的语义学，可靠、完全且命题逻辑可判定。(4)次协调性是次于经典逻辑但远高于完全不协调系统的协调性。"}, {"name": "经典诘难", "id": "9-3-5-3", "category": 4, "symbolSize": 22, "desc": "修改矛盾律需要充足理由，辩证法不矛盾于逻辑", "detail": "(1)矛盾律在思维和科学理论构造中起中心作用，修改矛盾律需充足理由。(2)以往方案有缺陷，并非转而承认悖论为真矛盾的充足理由。(3)辩证法与形式逻辑并不矛盾，辩证法只是超越了形式逻辑。"}, {"name": "代表人物", "id": "9-3-5-4", "category": 4, "symbolSize": 22, "desc": "普里斯特、达·科斯塔、赫兹伯格", "detail": "(1)普里斯特是次协调逻辑的倡导者，主张悖论为真矛盾。(2)达·科斯塔于20世纪60年代创立Cn系统，奠定次协调逻辑的技术基础。(3)赫兹伯格提出素朴语义学方案。"}, {"name": "修正版本", "id": "9-3-5-5", "category": 4, "symbolSize": 22, "desc": "作者坚持矛盾律不可动摇，悖论必须予以排除", "detail": "(1)作者陈波坚持矛盾律不可动摇。(2)悖论是逻辑矛盾而非真矛盾，必须予以排除。(3)次协调逻辑的方案虽然创新，但不能取代经典的排除悖论方案。"}]}]}, {"name": "四、关于悖论的一些思考", "id": "9-4", "category": 2, "symbolSize": 32, "desc": "关于悖论若干问题的哲学反思与辩论", "children": [{"name": "自我指称合法性之辩", "id": "9-4-1", "category": 3, "symbolSize": 26, "desc": "自我指称是否应该被禁止的哲学辩论", "children": [{"name": "核心主张", "id": "9-4-1-1", "category": 4, "symbolSize": 22, "desc": "作者主张自我指称非法应该避免", "detail": "(1)作者认为自我指称是非法的，应该避免。(2)含有自我指称的语句是有意义的，但能够导致悖论就是防范、限制乃至禁止的理由。(3)反对禁止自指的主要理由——会失去数学和逻辑学最有意义的领域——需要确证。"}, {"name": "论证依据", "id": "9-4-1-2", "category": 4, "symbolSize": 22, "desc": "中世纪逻辑学家、皮尔士、几种方案的论证", "detail": "(1)中世纪逻辑学家认为自指命题无意义。(2)皮尔士认为断言性命题必须有外部对象，无外部对象的符号无意义。(3)几种主要方案(类型论、公理集合论、语言分层)都通过避免自指避免悖论。(4)作者类比：违反交通规则不总导致事故，但可能导致事故就应遵守规则。"}, {"name": "经典诘难", "id": "9-4-1-3", "category": 4, "symbolSize": 22, "desc": "霍夫斯塔德的怪圈理论，禁止自指损失太大", "detail": "(1)霍夫斯塔德论证自我指称是自然界普遍现象。(2)禁止一切自指会牺牲大部分数学和逻辑学最有意义的领域。(3)当下主流是限制真概念而非限制自指，说明禁止自指的方案并非唯一出路。"}, {"name": "代表人物", "id": "9-4-1-4", "category": 4, "symbolSize": 22, "desc": "皮尔士、林邦瑾、霍夫斯塔德、陈波", "detail": "(1)皮尔士认为无外部对象的符号无意义。(2)林邦瑾主张悖论是佯悖。(3)霍夫斯塔德以怪圈理论论证自指的普遍性。(4)作者陈波持禁止自指的立场。"}, {"name": "修正版本", "id": "9-4-1-5", "category": 4, "symbolSize": 22, "desc": "作者承认立场似过强，但保持原有立场", "detail": "(1)作者承认其观点似乎过强了。(2)当下主流是限制真概念而非自我指称。(3)但作者仍保持原有立场，认为能够导致悖论就是限制自指的充足理由。"}]}, {"name": "悖论与逻辑矛盾之辩", "id": "9-4-2", "category": 3, "symbolSize": 26, "desc": "悖论是逻辑矛盾还是辩证矛盾的哲学辨析", "children": [{"name": "核心主张", "id": "9-4-2-1", "category": 4, "symbolSize": 22, "desc": "悖论是逻辑矛盾而非辩证矛盾", "detail": "(1)悖论是逻辑矛盾，不是辩证矛盾。(2)其特殊性在于：推理过程合乎逻辑，前提错误的隐蔽性极强。(3)所证明的是条件命题p→(q↔￣1q)∨(q∧￣1q)，根据否定后件式，p不成立。"}, {"name": "论证依据", "id": "9-4-2-2", "category": 4, "symbolSize": 22, "desc": "辩证矛盾与逻辑矛盾的区别，悖论的两个特殊性", "detail": "(1)辩证矛盾是在不同方面或意义上说的互相否定，如「剩余价值既在又不在流通中产生」。(2)悖论的两个特殊性：推理严格合乎逻辑；前提直观合理或可接受。(3)不能说证明了一个矛盾，证明的是条件句真命题，矛盾不能成立，故前提必不成立。(4)冯·赖特的证明：说谎者悖论中需否定的前提是「主语·本语句·指称·本语句是假的·」。"}, {"name": "经典诘难", "id": "9-4-2-3", "category": 4, "symbolSize": 22, "desc": "次协调逻辑认为悖论是真矛盾，国内第三种矛盾说", "detail": "(1)次协调逻辑认为悖论是真矛盾，应被容纳而非排除。(2)国内有人认为悖论是辩证矛盾或第三种矛盾。(3)霍夫斯塔德等将悖论本体论化，认为矛盾嵌入实在的结构中。"}, {"name": "代表人物", "id": "9-4-2-4", "category": 4, "symbolSize": 22, "desc": "冯·赖特、马克思、恩格斯、毛泽东、陈波", "detail": "(1)冯·赖特通过否定后件式排除悖论，论证悖论即逻辑矛盾。(2)马克思、恩格斯、毛泽东持辩证矛盾说。(3)作者陈波坚持同一律、矛盾律和排中律是正确思维的基础假定。"}, {"name": "修正版本", "id": "9-4-2-5", "category": 4, "symbolSize": 22, "desc": "矛盾律不可动摇，悖论作为逻辑矛盾必须排除", "detail": "(1)作者坚持同一律、矛盾律和排中律是正确思维的基础假定。(2)矛盾律不可动摇，悖论作为逻辑矛盾必须排除。(3)将悖论视为真矛盾或辩证矛盾的方案均不可取。"}]}, {"name": "悖论能否最终解决之辩", "id": "9-4-3", "category": 3, "symbolSize": 26, "desc": "悖论能否一劳永逸解决的哲学辩论", "children": [{"name": "核心主张", "id": "9-4-3-1", "category": 4, "symbolSize": 22, "desc": "悖论只能相对解决，循环往复以至无穷", "detail": "(1)悖论应该避免和排除，但只能获得相对解决。(2)发现一个排除一个，循环往复以至无穷。(3)不可能一劳永逸地摆脱所有悖论。"}, {"name": "论证依据", "id": "9-4-3-2", "category": 4, "symbolSize": 22, "desc": "三要因未必充分，认识局限与历史相对性", "detail": "(1)目前仅找到三个必要条件(自指、否定、总体无限)，它们是否为充分条件无法断言。(2)实际情况复杂和认识能力局限，甚至不能一下子找出所有悖论。(3)公理集合论迄今未发现新悖论，已证明其价值。(4)对世界的认识在人类世代更替中完成，特定历史阶段只能达到相对认识。"}, {"name": "经典诘难", "id": "9-4-3-3", "category": 4, "symbolSize": 22, "desc": "本体论论证与认识论论证：悖论不可避免", "detail": "(1)本体论论证：自我指称、自相缠绕普遍化、实在化，悖论嵌入实在结构。(2)认识论论证：悖论根源于思维的本性，不可避免。(3)从不可避免到不应该避免只有一步之遥，为容纳悖论的观点开辟了道路。"}, {"name": "代表人物", "id": "9-4-3-4", "category": 4, "symbolSize": 22, "desc": "霍夫斯塔德、辩证法学者、陈波", "detail": "(1)霍夫斯塔德和辩证法倾向学者持本体论论证。(2)辩证法认识论学者持认识论论证。(3)作者陈波提出相对解决论——悖论只能获得相对解决。"}, {"name": "修正版本", "id": "9-4-3-5", "category": 4, "symbolSize": 22, "desc": "作者对认识论论证同情，对本体论论证缺乏同情", "detail": "(1)作者对认识论论证有些同情。(2)对本体论论证缺乏同情。(3)几种现有排除悖论的方案都具有相对性，但都有价值。(4)公理集合论已证明其排除悖论的实效。"}]}]}]}, {"id": "c10", "name": "第十章 归纳问题及其解决方案", "desc": "正文 · 共6个小节", "isAppendix": false, "children": [{"name": "归纳推理和归纳问题", "desc": "探讨归纳推理的定义、类型及休谟诘难引发的归纳合理性问题", "id": "10-1", "category": 2, "symbolSize": 32, "children": [{"name": "归纳推理的定义与六种类型", "desc": "广义归纳指一切扩展性推理，结论超出前提范围故不具保真性", "id": "10-1-1", "category": 3, "symbolSize": 26, "children": [{"name": "核心主张", "desc": "广义归纳含六种类型，结论均不具必然保真性", "id": "10-1-1-1", "category": 4, "symbolSize": 22, "detail": "(1)广义的归纳指一切扩展性推理，结论超出前提范围，前提真无法保证结论真。(2)包括六种类型：简单枚举法、排除归纳法、统计概括、类比论证、假说演绎法、预测推理。(3)完全归纳法和数学归纳法因具有必然性不属于归纳推理。"}, {"name": "论证依据", "desc": "六种归纳推理各具特征且均以扩展性为核心", "id": "10-1-1-2", "category": 4, "symbolSize": 22, "detail": "(1)简单枚举法：从S类部分对象有P推出S类所有对象有P，一遇反例即推翻。(2)排除归纳法（密尔五法）：求同法、求异法、求同求异并用法、共变法、剩余法，基于因果假设。(3)统计概括：从样本n%有P推出总体n%有P，依赖随机性和样本大小。(4)类比论证：两事物在已知属性相似推出在推出属性也相似，可靠性取决于相关程度。(5)假说演绎法：提出假说、演绎推论、交付检验，整体属扩展性推理。(6)预测推理：包含于以上各种类型之中。"}, {"name": "经典诘难", "desc": "枚举反例可推翻结论，因果假设本身未获证明", "id": "10-1-1-3", "category": 4, "symbolSize": 22, "detail": "(1)简单枚举法一遇反例即被推翻或削弱。(2)排除归纳法的有效性基于因果假设，这些假设本身有待证明。(3)假说演绎法从整体上属于扩展性推理，不具有必然性。"}, {"name": "代表人物", "desc": "培根开创排除归纳法，密尔系统总结求因果五法", "id": "10-1-1-4", "category": 4, "symbolSize": 22, "detail": "(1)培根：排除归纳法的先驱。(2)密尔：系统总结求因果五法。"}, {"name": "修正版本", "desc": "作者取广义理解，统摄一切扩展性推理形式", "id": "10-1-1-5", "category": 4, "symbolSize": 22, "detail": "(1)作者对归纳取广义理解，包含一切扩展性推理形式。"}]}, {"name": "休谟问题", "desc": "休谟质疑归纳推理的合理性，亦称归纳问题", "id": "10-1-2", "category": 3, "symbolSize": 26, "children": [{"name": "核心主张", "desc": "归纳既不能演绎辩护也不能归纳证明，其根基不具有客观真理性", "id": "10-1-2-1", "category": 4, "symbolSize": 22, "detail": "(1)休谟质疑因果关系的客观性和归纳推理的必然性。(2)归纳既不能演绎地辩护（存在从有限到无限、从过去到未来的逻辑跳跃），也不能归纳地证明（导致循环论证）。(3)归纳所依据的自然齐一律和因果律不具有客观真理性。"}, {"name": "论证依据", "desc": "因果推理源于习惯联想而非理性，自然齐一律不可证明", "id": "10-1-2-2", "category": 4, "symbolSize": 22, "detail": "(1)人类理智的对象分为观念的联系（具有直观或证明的确实性）和实际的事情（反面可能不矛盾）。(2)一切关于事实的推理建立在因果关系上，但理性不能从原因推断出结果——心灵永远可构想由任何原因而来的任何结果。(3)一切因果推理建立在经验上，一切经验推理建立在自然进程将一律不变地进行的假定上，但此假定不能逻辑证明。(4)不能借助或然论证证明将来与过去一致——或然论证本身就建立在一致性假设上。(5)从原因到结果的转移不是借助于理性，而完全来自于习惯和经验。"}, {"name": "经典诘难", "desc": "休谟将归纳置于非理性基础，引发认识论的根本危机", "id": "10-1-2-3", "category": 4, "symbolSize": 22, "detail": "(1)休谟结论有怀疑主义甚至不可知论倾向。(2)把归纳推理置于非理性、非逻辑基础上。(3)涉及认识论的根本问题——普遍必然的经验知识是否可能？如何可能？"}, {"name": "代表人物", "desc": "休谟于《人性论》和《人类理解研究》中系统提出", "id": "10-1-2-4", "category": 4, "symbolSize": 22, "detail": "(1)休谟：《人性论》（1739年）、《人类理解研究》（1748年）。"}, {"name": "修正版本", "desc": "休谟问题激发了二百余年关于归纳合理性的持续争论", "id": "10-1-2-5", "category": 4, "symbolSize": 22, "detail": "(1)休谟问题亦称归纳问题，引发了二百多年的持续讨论。"}]}, {"name": "亨普尔悖论", "desc": "尼柯德标准与等值条件冲突导致荒谬的确证结论", "id": "10-1-3", "category": 3, "symbolSize": 26, "children": [{"name": "核心主张", "desc": "非黑非乌鸦之物荒谬地确证所有乌鸦是黑的", "id": "10-1-3-1", "category": 4, "symbolSize": 22, "detail": "(1)尼柯德标准与等值条件冲突导致反直观结论：一个既不是乌鸦也不是黑色的东西（如白雪、红花）也确证所有乌鸦都是黑的。(2)揭示了确证理论的深层困难。"}, {"name": "论证依据", "desc": "等值变换使任一非黑非A物均成为确证事例", "id": "10-1-3-2", "category": 4, "symbolSize": 22, "detail": "(1)尼柯德标准：既是A又是B的个体确证所有A是B。(2)等值条件：确证一假说的事例也确证其等值假说。(3)所有乌鸦是黑的等值于所有非黑的东西是非乌鸦，按尼柯德标准，任何既不是黑的又不是乌鸦的东西确证后者，按等值条件也确证前者。(4)此结论严重违反常识和直觉。"}, {"name": "经典诘难", "desc": "需修改尼柯德标准或限制等值条件对确证的适用", "id": "10-1-3-3", "category": 4, "symbolSize": 22, "detail": "(1)解决方向：修改尼柯德标准，或认为等值条件不适合确证。"}, {"name": "代表人物", "desc": "亨普尔于1945年《确证逻辑研究》中系统阐述", "id": "10-1-3-4", "category": 4, "symbolSize": 22, "detail": "(1)亨普尔：1945年《确证逻辑研究》中提出。"}, {"name": "修正版本", "desc": "亦称全相关悖论，是休谟问题在确证理论中的变形", "id": "10-1-3-5", "category": 4, "symbolSize": 22, "detail": "(1)亦称全相关悖论，是现代归纳概率逻辑中休谟问题的变形。"}]}, {"name": "古德曼悖论", "desc": "同一观察事例因谓词不同可得相互矛盾的预测结论", "id": "10-1-4", "category": 3, "symbolSize": 26, "children": [{"name": "核心主张", "desc": "并非所有谓词都适于外推，须区分似规律与偶然陈述", "id": "10-1-4-1", "category": 4, "symbolSize": 22, "detail": "(1)运用简单枚举法从同一观察事例可得到相互矛盾的预测结论。(2)关键在于并非所有谓词都适于外推，有些谓词（如绿蓝的）若加以外推会导致荒谬预测。"}, {"name": "论证依据", "desc": "绿蓝谓词使同一证据推出绿与蓝相互矛盾的预测", "id": "10-1-4-2", "category": 4, "symbolSize": 22, "detail": "(1)定义绿蓝的(grue)：x在t前被观察到且是绿色的，或x在t后被观察到且是蓝色的。(2)已观察的翡翠既支持所有翡翠是绿色的也支持所有翡翠是绿蓝的。(3)前一结论预测t后翡翠是绿色，后一结论预测t后翡翠是蓝色——相互矛盾。(4)区分似规律陈述（含可外推谓词）和偶然陈述（含不可外推谓词）。"}, {"name": "经典诘难", "desc": "旧归纳问题无解故转向新归纳之谜：如何为归纳划界", "id": "10-1-4-3", "category": 4, "symbolSize": 22, "detail": "(1)旧的归纳问题（有效性证明）无解，古德曼提出新归纳之谜：如何给可接受的归纳与不可接受的归纳划界，以及为什么偏爱前一组而非后一组。"}, {"name": "代表人物", "desc": "古德曼于1955年《事实、虚构与预测》中提出", "id": "10-1-4-4", "category": 4, "symbolSize": 22, "detail": "(1)古德曼：1955年《事实、虚构与预测》中提出。"}, {"name": "修正版本", "desc": "归纳逻辑应制定谓词外推规则以区分可接受与不可接受的归纳", "id": "10-1-4-5", "category": 4, "symbolSize": 22, "detail": "(1)归纳逻辑应制定规则说明哪些谓词可外推，哪些不可外推。"}]}, {"name": "凯伯格悖论", "desc": "接受假说的三个合理性条件不能同时成立导致合取矛盾", "id": "10-1-5", "category": 3, "symbolSize": 26, "children": [{"name": "核心主张", "desc": "高概率接受规则使各张彩票不得头奖的合取与必有头奖矛盾", "id": "10-1-5-1", "category": 4, "symbolSize": 22, "detail": "(1)接受假说的三个合理性条件不能同时成立：在一百万张彩票中，接受每张不能得头奖是合理的，但合取后等值于没有一张得头奖，与恰好有一张得头奖矛盾。"}, {"name": "论证依据", "desc": "每张彩票不得头奖高概率合理，合取后却致矛盾", "id": "10-1-5-2", "category": 4, "symbolSize": 22, "detail": "(1)三个合理性条件：(i)接受概率为1-ε的假说合理；(ii)接受合理假说的逻辑后承合理；(iii)接受不一致假说不合理。(2)一百万张彩票各张不能得头奖的概率为0.999999，满足(i)。(3)合取一百万个命题得没有一张得头奖，满足(ii)。(4)但没有一张得头奖与售彩条件恰好有一张得头奖矛盾，违反(iii)。"}, {"name": "经典诘难", "desc": "高概率不是合理接受假说的充分条件，须附加更多约束", "id": "10-1-5-3", "category": 4, "symbolSize": 22, "detail": "(1)表明高概率不是合理接受的充分条件，接受假说的合理性需要更多约束。"}, {"name": "代表人物", "desc": "凯伯格于1961年《概率和合理信念的逻辑》中提出", "id": "10-1-5-4", "category": 4, "symbolSize": 22, "detail": "(1)凯伯格：1961年《概率和合理信念的逻辑》中提出。"}, {"name": "修正版本", "desc": "揭示了高概率接受规则在多假说情境下的不充分性", "id": "10-1-5-5", "category": 4, "symbolSize": 22, "detail": "(1)凯伯格悖论在合理接受多个假说时产生，揭示了高概率接受规则的不充分性。"}]}]}, {"name": "演绎主义和先验论的辩护", "desc": "评析将归纳改造为演绎推理或诉诸先天认知形式的辩护策略", "id": "10-2", "category": 2, "symbolSize": 32, "children": [{"name": "密尔的演绎主义辩护", "desc": "增补自然齐一律和因果律作为大前提将归纳改造成证明性三段论", "id": "10-2-1", "category": 3, "symbolSize": 26, "children": [{"name": "核心主张", "desc": "加入普遍必然大前提使归纳结论具有逻辑必然性", "id": "10-2-1-1", "category": 4, "symbolSize": 22, "detail": "(1)通过增加普遍必然的大前提（自然齐一律、普遍因果律），将归纳推理改造为证明性归纳即三段论形式，保证结论的必然真实性。"}, {"name": "论证依据", "desc": "归纳经增补大前提可纳入三段论，排除法尚需选择公设", "id": "10-2-1-2", "category": 4, "symbolSize": 22, "detail": "(1)每一个归纳都可以变成三段论形式。(2)所需大前提：自然齐一律——曾经发生过的在相似条件下将再发生且永远发生；普遍因果律（决定论原则）——每一事件必有原因。(3)排除式归纳还需选择公设：在与给定现象相关的性质中包含着实际相关的性质，且可通过反面证据枚举确定。"}, {"name": "经典诘难", "desc": "大前提的真实性无法保证，诉诸更普遍原则终陷无穷倒退", "id": "10-2-1-3", "category": 4, "symbolSize": 22, "detail": "(1)大前提（自然齐一律和因果律）的真实性如何保证？(2)诉诸更普遍原则导致无穷倒退；诉诸归纳导致循环论证。(3)只能求助于先验论或约定论。"}, {"name": "代表人物", "desc": "密尔于1843年《逻辑体系》中系统阐述证明性归纳", "id": "10-2-1-4", "category": 4, "symbolSize": 22, "detail": "(1)密尔：1843年《逻辑体系》中系统阐述。"}, {"name": "修正版本", "desc": "冯·赖特指出演绎辩护仅具相对价值，结论依赖大前提之真", "id": "10-2-1-5", "category": 4, "symbolSize": 22, "detail": "(1)冯·赖特评价：演绎主义辩护只具有纯粹相对的价值，使归纳结论的真依赖于某些另外命题的真。"}]}, {"name": "罗素的公设辩护", "desc": "以五条公设为归纳推理提供先在概然性基础的演绎主义方案", "id": "10-2-2", "category": 3, "symbolSize": 26, "children": [{"name": "核心主张", "desc": "五条公设提供先在概然性，归纳虽可错但人不得不使用", "id": "10-2-2-1", "category": 4, "symbolSize": 22, "detail": "(1)尽管归纳结论可错，但人不得不使用归纳法。(2)为归纳合理性辩护需五条公设：准永久性、可分开的因果线、因果线时空连续性、共同原因起源的结构相似性、类推公设。这些公设提供先在概然性。"}, {"name": "论证依据", "desc": "火鸡比喻揭示归纳可错，五公设各肯定某事常发生但不必然", "id": "10-2-2-2", "category": 4, "symbolSize": 22, "detail": "(1)火鸡比喻揭示归纳结论的可错性。(2)归纳法原则两点：(甲)相关联事例越多，永远相联的或然性越大；(乙)事例足够多时，普遍规律将无限接近必然。(3)五条公设每个都肯定某件事情常常发生但不是必然总是这样。(4)公设既有客观方面（大多数情况下发生）也有主观方面（提供合理可信度）。"}, {"name": "经典诘难", "desc": "公设本身知识不基于经验，其正确性面临循环论证难题", "id": "10-2-2-3", "category": 4, "symbolSize": 22, "detail": "(1)公设本身的知识不可能建立在经验之上。(2)公设的正确性如何保证？面临循环论证或无穷倒退。(3)公设存在任意性问题。"}, {"name": "代表人物", "desc": "罗素于《哲学问题》和《人类的知识》中提出五条公设", "id": "10-2-2-4", "category": 4, "symbolSize": 22, "detail": "(1)罗素：《哲学问题》《人类的知识》中提出五条公设。"}, {"name": "修正版本", "desc": "罗素方案属演绎主义，公设实质充当归纳推理的大前提", "id": "10-2-2-5", "category": 4, "symbolSize": 22, "detail": "(1)罗素方案亦可归入演绎主义——公设作为大前提使用。"}]}, {"name": "金岳霖的归纳原则先验论证", "desc": "以条件句表述归纳原则并论证其为先验永真的接受总则", "id": "10-2-3", "category": 3, "symbolSize": 26, "children": [{"name": "核心主张", "desc": "归纳原则作为永真条件句，一切反例皆为该原则的正例", "id": "10-2-3-1", "category": 4, "symbolSize": 22, "detail": "(1)归纳原则是如果……则……的条件句，前件列举例证，后件是（大概）所有A都是B。(2)该原则是先验永真的——过去、现在和未来的经验都不能否证它。"}, {"name": "论证依据", "desc": "反例使前后件同假故前真后假的情况不可能出现", "id": "10-2-3-2", "category": 4, "symbolSize": 22, "detail": "(1)归纳原则是经验构成的必要条件，只要时间不停留就要引用。(2)以往经验不能否证：当反例出现时后件为假但前件也一定为假，前件真后件假的情况不会出现。(3)未来经验也不能否证：反例成为例证时就不是将来的反例，否证的只是全称结论而非归纳原则本身。"}, {"name": "经典诘难", "desc": "偷换休谟质疑对象，论证本身陷入循环且有时间点偷换", "id": "10-2-3-3", "category": 4, "symbolSize": 22, "detail": "(1)偷换对象：休谟质疑的是从个别到全称，金改为从个别到大概全称，不是针对休谟也不能反驳休谟。(2)循环论证：论证归纳原则成立的前提条件就是归纳原则成立。(3)隐藏时间点偷换——在逻辑上不合法。(4)加上大概限制语后前件真仍不能保证后件真。"}, {"name": "代表人物", "desc": "金岳霖于《论道》和《知识论》中提出归纳原则先验论证", "id": "10-2-3-4", "category": 4, "symbolSize": 22, "detail": "(1)金岳霖：《论道》《知识论》中提出归纳原则的先验论证。"}, {"name": "修正版本", "desc": "作者认为论证虽机智但有循环之弊，学界过誉应避免", "id": "10-2-3-5", "category": 4, "symbolSize": 22, "detail": "(1)作者认为论证机智但很难说是正确的，对学界过高评价金岳霖持批评态度。"}]}, {"name": "康德的先验论辩护", "desc": "以先天认知形式统摄经验材料形成先验综合判断来消解休谟问题", "id": "10-2-4", "category": 3, "symbolSize": 26, "children": [{"name": "核心主张", "desc": "先验综合判断既扩展知识又具普遍必然性，消解归纳难题", "id": "10-2-4-1", "category": 4, "symbolSize": 22, "detail": "(1)知识始于经验但不产生于经验。(2)认知主体运用先天形式（时空、因果等范畴）统摄感觉材料，形成既扩展知识又具普遍必然性的先验综合判断。(3)休谟问题因此被消解。"}, {"name": "论证依据", "desc": "时空和十二知性范畴作为先天形式经由先验统觉综合经验", "id": "10-2-4-2", "category": 4, "symbolSize": 22, "detail": "(1)感性阶段：时空作为先天感觉形式。(2)知性阶段：因果、必然等十二范畴作为先验综合形式。(3)先验统觉（我思）进行综合。(4)科学知识由先验综合判断构成。(5)需证明的不是是否可能而是如何可能。(6)冯·赖特论证先验综合判断不存在：任何全称判断的真最终都源自词项的定义或用法——因而是分析的而非综合的。"}, {"name": "经典诘难", "desc": "先验综合判断遭逻辑经验主义驳斥，区分先验与后验标准不清", "id": "10-2-4-3", "category": 4, "symbolSize": 22, "detail": "(1)先验综合判断的概念受逻辑经验主义严厉批评。(2)确立具体因果关系时需更多原则（自然齐一律等），康德视之为主观假定。(3)区分先验和后验的标准不清。(4)冯·赖特论证：所有A是B的真最终源自词项定义，故为分析的。"}, {"name": "代表人物", "desc": "康德创立先验哲学，冯·赖特驳斥先验综合判断的存在", "id": "10-2-4-4", "category": 4, "symbolSize": 22, "detail": "(1)康德：先验哲学的创立者。(2)冯·赖特：反驳先验综合判断的存在。"}, {"name": "修正版本", "desc": "先验形式虽消解了休谟问题但先验综合判断概念本身存疑", "id": "10-2-4-5", "category": 4, "symbolSize": 22, "detail": "(1)作者认为康德用先验形式消解了休谟问题，但先验综合判断概念本身存在问题。"}]}, {"name": "约定论辩护", "desc": "科学家将未经完全证实的基本原理约定为真以推演具体定律", "id": "10-2-5", "category": 3, "symbolSize": 26, "children": [{"name": "核心主张", "desc": "科学家约定基本原理为真以推演定律，无持续反证则维持", "id": "10-2-5-1", "category": 4, "symbolSize": 22, "detail": "(1)有些基本原理已被经验初步证明但未被完全证实，科学家共同约定同意将其视为已被证明为真，据此推演出更具体的定律和原理。(2)约定后继续寻找经验证明，如无持续反证则约定维持。"}, {"name": "论证依据", "desc": "避免了先验论的困难，约定可随经验无持续反证而维持", "id": "10-2-5-2", "category": 4, "symbolSize": 22, "detail": "(1)庞卡莱等人提出约定论思想。(2)如无持续反证，约定可继续维持。(3)避免了先验论和演绎主义的某些困难。"}, {"name": "经典诘难", "desc": "约定本身的正确性和选择标准无法保证，易流于任意", "id": "10-2-5-3", "category": 4, "symbolSize": 22, "detail": "(1)从本身正确性待证明的约定不能推出归纳结论的必然真实性。(2)应约定什么、不约定什么、标准何在？(3)如何避免任意约定？(4)这些问题不比归纳问题更简单。"}, {"name": "代表人物", "desc": "庞卡莱是约定论的主要倡导者", "id": "10-2-5-4", "category": 4, "symbolSize": 22, "detail": "(1)庞卡莱等：约定论的提出者和倡导者。"}, {"name": "修正版本", "desc": "约定论与先验论一样不能为归纳提供充分的辩护", "id": "10-2-5-5", "category": 4, "symbolSize": 22, "detail": "(1)约定论与先验论一样不能提供充分的归纳辩护。"}]}]}, {"name": "归纳主义辩护和概率逻辑", "desc": "分析归纳自支持辩护与概率逻辑在回应休谟问题时的困境", "id": "10-3", "category": 2, "symbolSize": 32, "children": [{"name": "归纳主义辩护", "desc": "以归纳法在过去的成功为其辩护终陷循环论证和无穷倒退", "id": "10-3-1", "category": 3, "symbolSize": 26, "children": [{"name": "核心主张", "desc": "用归纳的成功证明归纳合理，本质是以归纳证归纳的循环", "id": "10-3-1-1", "category": 4, "symbolSize": 22, "detail": "(1)通过列举归纳法在过去的成功来为其辩护：过去成功了，所以未来也会成功，所以归纳合理。(2)这是一典型的归纳推理，面临自我辩护的无穷倒退或循环论证。"}, {"name": "论证依据", "desc": "自我纠正纲领未找到算法，归纳自支持终陷逻辑困境", "id": "10-3-1-2", "category": 4, "symbolSize": 22, "detail": "(1)自我纠正的发现逻辑（哈特里等）：若理论T假，方法本身能最终使T受反驳并自动找到更真的理论T'。但未找到这样的算法——纲领归于失败。(2)归纳自支持方案（布拉克等）：归纳规则R来自另一归纳论证，避免直接循环。但最终逃脱不了循环论证或无穷倒退。"}, {"name": "经典诘难", "desc": "休谟质疑对一切归纳自证方案同样有效且不可回避", "id": "10-3-1-3", "category": 4, "symbolSize": 22, "detail": "(1)休谟质疑对归纳主义辩护本身同样有效——用归纳证明归纳是循环论证。(2)自我纠正算法未被发现。(3)归纳自支持最终仍面临逻辑困难。"}, {"name": "代表人物", "desc": "哈特里提出自我纠正纲领，布拉克提出归纳自支持方案", "id": "10-3-1-4", "category": 4, "symbolSize": 22, "detail": "(1)哈特里、勒萨吉、普里斯特利：自我纠正纲领。(2)布拉克、布莱斯威特：归纳自支持方案。"}, {"name": "修正版本", "desc": "作者认为归纳主义辩护不可能成功已为学界普遍认识", "id": "10-3-1-5", "category": 4, "symbolSize": 22, "detail": "(1)作者认为归纳主义辩护不可能成功——几乎已被所有逻辑学家和哲学家认识。"}]}, {"name": "归纳概率逻辑", "desc": "以概率论和数理统计量化经验证据对归纳假说的支持强度", "id": "10-3-2", "category": 3, "symbolSize": 26, "children": [{"name": "核心主张", "desc": "虽不能保证结论真，但证据对假说有可量化的支持关系", "id": "10-3-2-1", "category": 4, "symbolSize": 22, "detail": "(1)虽然归纳前提不能保证结论真，但经验证据对一般命题有一定支持关系，可用概率论和数理统计对这种关系作量的测度。(2)c(h,e)表示假说h相对于证据e的确证度。"}, {"name": "论证依据", "desc": "分求初始概率和概率演算推导，含四种概率解释及诸学派", "id": "10-3-2-2", "category": 4, "symbolSize": 22, "detail": "(1)研究内容：(i)求初始概率（归纳过程）；(ii)运用概率演算公理推导其他概率（演绎过程）。(2)四种概率解释：古典解释（p=m/n）、逻辑解释（卡尔纳普的确证度C(h,e)）、主观置信度解释（拉姆塞）、频率解释（赖欣巴赫的极限频率）。(3)帕斯卡与非帕斯卡概率逻辑之分、贝叶斯派与非贝叶斯派之分。"}, {"name": "经典诘难", "desc": "有限例证除以无穷总体概率恒为零，四种解释各有困难", "id": "10-3-2-3", "category": 4, "symbolSize": 22, "detail": "(1)需要归纳原理作为附加前提，其真实性仍有待证明。(2)归纳结论涉及无穷对象，无论多少有限例证，概率总是零——归纳结论甚至得不到或然支持。(3)四种概率解释各有特殊困难。"}, {"name": "代表人物", "desc": "卡尔纳普持逻辑解释，拉姆塞持主观解释，赖欣巴赫持频率解释", "id": "10-3-2-4", "category": 4, "symbolSize": 22, "detail": "(1)卡尔纳普：逻辑解释。(2)拉姆塞：主观置信度解释。(3)赖欣巴赫：频率解释。(4)伯努利、凯恩斯：古典解释。"}, {"name": "修正版本", "desc": "作者结论：归纳概率逻辑不能为归纳合理性提供辩护", "id": "10-3-2-5", "category": 4, "symbolSize": 22, "detail": "(1)作者结论：归纳概率逻辑不能为归纳合理性提供辩护。"}]}, {"name": "波普的反归纳主义", "desc": "以可证伪性取代可证实性为标准，科学依靠试错不断进步", "id": "10-3-3", "category": 3, "symbolSize": 26, "children": [{"name": "核心主张", "desc": "全称命题只能证伪不可证实，科学标准是可证伪性", "id": "10-3-3-1", "category": 4, "symbolSize": 22, "detail": "(1)归纳不仅不能得必然真理，也不能得或然真理。(2)科学标准不是可证实性而是可证伪性。(3)科学通过问题→尝试性理论→清除错误→新问题的四段式不断进步。科学方法就是试错法。"}, {"name": "论证依据", "desc": "单称与全称命题证实证伪不对称，P1→TT→EE→P2驱动进化", "id": "10-3-3-2", "category": 4, "symbolSize": 22, "detail": "(1)单称与全称命题不对称：前者可证实可证伪，后者只能证伪不能证实。(2)黑天鹅证伪所有天鹅是白的，细菌分裂不死否定每个生物必死。(3)四段式P1→TT→EE→P2：问题→猜测性理论→批判检验反驳→新问题。(4)观察渗透理论。(5)批判的理性主义。"}, {"name": "经典诘难", "desc": "存在命题同样不对称，观察渗透理论使绝对证伪不存在", "id": "10-3-3-3", "category": 4, "symbolSize": 22, "detail": "(1)存在命题同样不对称——涉及无穷对象时永远无法证伪。(2)整体主义知识观（观察渗透理论）导致不存在纯粹的观察陈述，证伪与证实一样带有相对性——绝对证伪不存在。(3)因此归纳问题不能否定地解决——不能肯定归纳必不能得真实结论。"}, {"name": "代表人物", "desc": "波普是批判理性主义和否证逻辑的创立者", "id": "10-3-3-4", "category": 4, "symbolSize": 22, "detail": "(1)波普：批判的理性主义、否证逻辑的创立者。"}, {"name": "修正版本", "desc": "作者认为波普对归纳法的彻底否定不成立，证伪亦非绝对", "id": "10-3-3-5", "category": 4, "symbolSize": 22, "detail": "(1)作者认为波普对否证法的过分强调和对归纳法的彻底否定，都是不成立的。"}]}]}, {"name": "归纳问题在逻辑上无解", "desc": "论证归纳问题无论从正面还是反面均不可在逻辑上证成或证否", "id": "10-4", "category": 2, "symbolSize": 32, "children": [{"name": "归纳问题在逻辑上无解的论证", "desc": "演绎和归纳论证均无法给出归纳是否具有保真性的确定答案", "id": "10-4-1", "category": 3, "symbolSize": 26, "children": [{"name": "核心主张", "desc": "归纳是否既保真又扩展知识的问题在逻辑上无确定答案", "id": "10-4-1-1", "category": 4, "symbolSize": 22, "detail": "(1)是否存在既具保真性又能扩展知识的归纳推理这一问题在逻辑上无解——既不能提供绝对肯定的答案，也不能提供绝对否定的答案。"}, {"name": "论证依据", "desc": "肯定与否定两大论证方向均陷无穷倒退、循环或任意性困境", "id": "10-4-1-2", "category": 4, "symbolSize": 22, "detail": "(1)肯定答案不可行：(i)归纳论证——循环，休谟质疑有效；(ii)演绎论证——需附加前提，其真实性只有四种选择：诉诸更普遍原则（无穷倒退）、先验论（区分标准不清）、约定论（任意性）、归纳结论（循环），均不可行。(2)否定答案不可行：(i)直接证明结论否定——不可能，前提合取与结论否定不矛盾；(ii)诉诸更一般原理——陷入四种困境；(iii)举反例法——只证明不能必然得真，未证明不可能得真，且观察渗透理论说甚至无法绝对确证反例。"}, {"name": "经典诘难", "desc": "若归纳问题在逻辑上无解，是否意味着归纳辩护不可能", "id": "10-4-1-3", "category": 4, "symbolSize": 22, "detail": "(1)如果归纳问题在逻辑上无解，那么是否意味着归纳辩护是不可能的？(2)作者认为无解是基于三个虚假预设。"}, {"name": "代表人物", "desc": "陈波系统论证该无解命题，鞠实儿为先行论证者", "id": "10-4-1-4", "category": 4, "symbolSize": 22, "detail": "(1)陈波：提出归纳问题在逻辑上无解的论证。(2)鞠实儿：先行论证者。"}, {"name": "修正版本", "desc": "放弃三个虚假预设可为归纳提供合情合理的辩护", "id": "10-4-1-5", "category": 4, "symbolSize": 22, "detail": "(1)作者认为需要放弃三个虚假预设才能正确理解归纳。"}]}, {"name": "归纳问题的三个虚假预设", "desc": "普遍必然知识、演绎主义传统与感觉经验局限是休谟问题的预设", "id": "10-4-2", "category": 3, "symbolSize": 26, "children": [{"name": "核心主张", "desc": "休谟问题的三个预设均不成立，导致归纳问题在逻辑上无解", "id": "10-4-2-1", "category": 4, "symbolSize": 22, "detail": "(1)归纳问题基于三个虚假预设：(1)存在普遍必然的知识；(2)合法的推理只局限于保真性的演绎推理——演绎主义传统；(3)只能在感觉经验范围内证明因果关系的客观性。"}, {"name": "论证依据", "desc": "蒯因拆解必然知识教条，马克思以实践标准超越经验局限", "id": "10-4-2-2", "category": 4, "symbolSize": 22, "detail": "(1)休谟哲学内部不能得出存在普遍必然知识——彻底经验论与先验因素矛盾；逻辑命题也只具有相对必然性（变异逻辑证明）；蒯因整体主义知识观承认一切命题可修正。(2)演绎主义预设：用演绎标准要求归纳，指责其不具保真性——就像通过说一个人不能拔头发上天来证明他无能一样荒谬。(3)感觉经验的限制：休谟要求只在经验范围内证明因果性，但因果断言超出经验——马克思指出这是实践问题而非理论问题，成功的科学实践证明了因果知识的真理性。"}, {"name": "经典诘难", "desc": "放弃三个预设后应持何种评价标准？实践标准亦可被质疑", "id": "10-4-2-3", "category": 4, "symbolSize": 22, "detail": "(1)放弃了普遍必然知识是否会导致相对主义？(2)放弃演绎主义标准后用什么标准评价归纳？(3)实践标准也可能被质疑。"}, {"name": "代表人物", "desc": "休谟立论三预设，蒯因、马克思和布拉克提供批判资源", "id": "10-4-2-4", "category": 4, "symbolSize": 22, "detail": "(1)休谟：三个预设的来源。(2)蒯因：经验论的两个教条、整体主义。(3)马克思：实践标准。(4)布拉克：指出休谟背后的演绎主义预设。"}, {"name": "修正版本", "desc": "放弃三个虚假预设后可为归纳提供合情合理的辩护", "id": "10-4-2-5", "category": 4, "symbolSize": 22, "detail": "(1)作者认为放弃三个预设后可为归纳提供合情合理的辩护。"}]}]}, {"name": "归纳的实践必然性", "desc": "阐述归纳是人类在宇宙中必须采取且唯一可行的认知策略", "id": "10-5", "category": 2, "symbolSize": 32, "children": [{"name": "实用主义辩护", "desc": "归纳虽不保证真理却是获取真理诸策略中的最佳策略", "id": "10-5-1", "category": 3, "symbolSize": 26, "children": [{"name": "核心主张", "desc": "归纳是预测事件的最佳策略，能通过经验自我修正", "id": "10-5-1-1", "category": 4, "symbolSize": 22, "detail": "(1)归纳是人类预测事件进程的最佳策略，虽不能保证获得真理，但它的合理性在于它是诸多策略中的最佳策略。(2)归纳是自我修正的过程——让过去经验决定对未来的预测，让新经验修正否定虚假信念。"}, {"name": "论证依据", "desc": "皮尔士肇始的实用主义传统，坚持归纳策略终将达到正确结论", "id": "10-5-1-2", "category": 4, "symbolSize": 22, "detail": "(1)皮尔士首先提出实用主义归纳辩护。(2)赖欣巴赫进一步发展：坚持归纳策略最终总会达到正确的归纳结论。(3)与试错法有相似之处。"}, {"name": "经典诘难", "desc": "最佳策略需独立标准衡量，最终正确性无法得到保证", "id": "10-5-1-3", "category": 4, "symbolSize": 22, "detail": "(1)最佳策略需要独立标准来衡量。(2)最终会达到正确结论无法得到保证——可能在达到之前已停止。"}, {"name": "代表人物", "desc": "皮尔士是实用主义辩护的肇始者，赖欣巴赫是其发展者", "id": "10-5-1-4", "category": 4, "symbolSize": 22, "detail": "(1)皮尔士：实用主义归纳辩护的肇始者。(2)赖欣巴赫：主要倡导者和发展者。"}, {"name": "修正版本", "desc": "作者持同情态度但提出更为激进和彻底的实践必然性观点", "id": "10-5-1-5", "category": 4, "symbolSize": 22, "detail": "(1)作者对此持同情态度，但提出更为激进和彻底的观点。"}]}, {"name": "归纳的实践必然性", "desc": "作者论证归纳的人类学必然性和局部归纳逻辑的合理性", "id": "10-5-2", "category": 3, "symbolSize": 26, "children": [{"name": "核心主张", "desc": "归纳是人类必须且唯一可行的认知策略，结论永远只可能真", "id": "10-5-2-1", "category": 4, "symbolSize": 22, "detail": "(1)归纳是在宇宙中生存的人类必须且只能采取的认知策略，具有实践必然性。(2)人类有理由从经验的重复中建立确实性和规律性，归纳结论永远只可能真而非必然真。"}, {"name": "论证依据", "desc": "宇宙显现规律性故期待重复合理，应做局部辩护而非全局指责", "id": "10-5-2-2", "category": 4, "symbolSize": 22, "detail": "(1)人类整体作为认知主体在认识论上横空出世，除观察、实验、归纳、假说演绎法、试错法外无其他可能认知策略——归纳具有实践必然性。(2)经验中的世界并非完全无序——四季更迭、昼夜交替，既然世界不断显现重复性，期待继续重复是合理的期待。区分事实的可能性与逻辑的可能性——不能从逻辑可能推出事实可能。(3)已有局部合理的归纳方法（简单枚举、排除归纳、类比、假说演绎、概率统计等），应做局部辩护而非全局指责。(4)归纳结论永远只是可能真不是必然真——宇宙无限，人类任何时候都不能说已获得完全认识。保持健康怀疑避免独断论，对实践证明的理论保持信心避免不可知论。"}, {"name": "经典诘难", "desc": "宇宙是否有序尚需证明，实践论证本身是否仍需借助归纳", "id": "10-5-2-3", "category": 4, "symbolSize": 22, "detail": "(1)为什么宇宙一定有序？(2)实践-成功论证是否仍需借助归纳？(3)局部辩护的风险在于不同归纳方法的可靠性可能相互冲突。(4)对老前辈（如金岳霖）的学术成就评价要实事求是。"}, {"name": "代表人物", "desc": "陈波提出实践必然性，马克思恩格斯强调实践标准", "id": "10-5-2-4", "category": 4, "symbolSize": 22, "detail": "(1)陈波：实践必然性的提出者。(2)马克思：实践标准。(3)恩格斯：对不可知论的驳斥是实践。(4)金岳霖：事实上的标准。"}, {"name": "修正版本", "desc": "归纳逻辑虽不成熟但并非不可能，社会技术需要将加速其进程", "id": "10-5-2-5", "category": 4, "symbolSize": 22, "detail": "(1)作者认为现有归纳逻辑虽不成熟但并非不可能，对前景充满信心。"}]}]}, {"name": "一个全面的归纳逻辑研究纲领", "desc": "提出涵盖发现、辩护、接受、进化四环节的完整归纳逻辑纲领", "id": "10-6", "category": 2, "symbolSize": 32, "children": [{"name": "发现的逻辑", "desc": "探索从经验中建立猜测性假说的理性程序和方法论机制", "id": "10-6-1", "category": 3, "symbolSize": 26, "children": [{"name": "核心主张", "desc": "科学发现有内在逻辑和程序，非纯粹直觉或神秘创造", "id": "10-6-1-1", "category": 4, "symbolSize": 22, "detail": "(1)科学发现过程是理性过程，有其内在的程序、模式、规律、准则和方法。(2)归纳逻辑应探索从经验建立猜测性假说的逻辑机制，包括回溯推理、联想、直觉、灵感、顿悟等。"}, {"name": "论证依据", "desc": "机遇偏爱有准备的头脑，发现者皆是相关领域专家", "id": "10-6-1-2", "category": 4, "symbolSize": 22, "detail": "(1)古典归纳逻辑的发现纲领：简单枚举法、求因果法、类比法、假说演绎法。(2)反对发现无逻辑论：机遇只偏爱有准备的头脑，发现者都是相关领域专家，灵感产生于长期研究之后。(3)发现的逻辑是否可能可转换为人类能否造出具有近似人类智能的计算机——看不出原则上理论上的不可能性。"}, {"name": "经典诘难", "desc": "爱因斯坦等认为从感觉到普遍定律没有逻辑通道", "id": "10-6-1-3", "category": 4, "symbolSize": 22, "detail": "(1)爱因斯坦等认为从感觉到普遍定律没有逻辑通道，必须依靠直觉、灵感、顿悟等自由创造。"}, {"name": "代表人物", "desc": "爱因斯坦持无逻辑通道说，陈波持发现过程理性说", "id": "10-6-1-4", "category": 4, "symbolSize": 22, "detail": "(1)爱因斯坦：无逻辑通道说。(2)陈波：发现过程是理性的。"}, {"name": "修正版本", "desc": "归纳逻辑应回到并大大扩展古典发现纲领的研究领域", "id": "10-6-1-5", "category": 4, "symbolSize": 22, "detail": "(1)作者认为归纳逻辑不仅有必要回到古老的发现纲领，还要大大扩展其研究领域。"}]}, {"name": "客观辩护的逻辑", "desc": "用概率论和数理统计测度经验证据对假说的客观支持强度", "id": "10-6-2", "category": 3, "symbolSize": 26, "children": [{"name": "核心主张", "desc": "以概率量化经验证据对给定假说的客观支持度", "id": "10-6-2-1", "category": 4, "symbolSize": 22, "detail": "(1)研究经验证据对给定归纳假说的支持关系，用概率论和数理统计做工具，对支持强度作量的测度。(2)c(h,e)表示假说h相对于证据e的确证度，评价推理的归纳强度。"}, {"name": "论证依据", "desc": "含求初始概率和概率演算推导，推理强度以概率p>1/2为准则", "id": "10-6-2-2", "category": 4, "symbolSize": 22, "detail": "(1)研究内容：(i)求初始概率p(h)、p(e)的归纳方法；(ii)运用概率演算公理推导其他概率的演绎过程。(2)对概率作古典解释、逻辑解释、频率解释的概率逻辑属于此范围。(3)一个推理是归纳强的当且仅当它是合理的（前提使结论概率p>1/2）。"}, {"name": "经典诘难", "desc": "求初始概率仍是归纳过程，辩护逻辑日益演绎化、路子趋窄", "id": "10-6-2-3", "category": 4, "symbolSize": 22, "detail": "(1)求初始概率本质上仍是归纳过程，面临休谟问题。(2)各种概率解释各有困难。(3)辩护逻辑已被演绎化，路子越走越窄。"}, {"name": "代表人物", "desc": "卡尔纳普主确证度，凯恩斯主古典概率，赖欣巴赫主频率概率", "id": "10-6-2-4", "category": 4, "symbolSize": 22, "detail": "(1)卡尔纳普：确证度理论。(2)凯恩斯：古典概率。(3)赖欣巴赫：频率概率。"}, {"name": "修正版本", "desc": "作为全面纲领的组成部分，与发现、接受、进化逻辑相互补充", "id": "10-6-2-5", "category": 4, "symbolSize": 22, "detail": "(1)作为全面纲领的一部分，与其他部分相互补充。"}]}, {"name": "主观接受的逻辑", "desc": "研究认知主体的知识、信念和心理状态对假说接受的影响", "id": "10-6-3", "category": 3, "symbolSize": 26, "children": [{"name": "核心主张", "desc": "接受假说兼取决于客观证据、逻辑状态和认知主体主观因素", "id": "10-6-3-1", "category": 4, "symbolSize": 22, "detail": "(1)是否接受某个归纳假说不仅取决于客观的证据、假说自身的逻辑状态（自洽性、简单性、谦和性、精确性）和预测能力，还取决于认知主体的知识、信念、心理状态及社会文化传统等。"}, {"name": "论证依据", "desc": "含主观置信度解释、归纳接受理论和科学解释覆盖律模型", "id": "10-6-3-2", "category": 4, "symbolSize": 22, "detail": "(1)对概率作主观置信度解释的概率逻辑属于此范围。(2)亨迪卡和希尔卑伦、莱维和凯伯格的归纳接受理论。(3)科学解释的覆盖律模型。(4)研究接受假说的各种规则和方法。"}, {"name": "经典诘难", "desc": "主观因素难以量化规约，接受标准因人而异，统一逻辑难建", "id": "10-6-3-3", "category": 4, "symbolSize": 22, "detail": "(1)主观因素如何量化和规约？(2)接受标准可能因人而异，难以建立统一逻辑。(3)主观置信度与客观概率的关系需要澄清。"}, {"name": "代表人物", "desc": "拉姆塞主主观置信度，亨迪卡和凯伯格等发展接受理论", "id": "10-6-3-4", "category": 4, "symbolSize": 22, "detail": "(1)拉姆塞：主观置信度解释。(2)亨迪卡、希尔卑伦、莱维、凯伯格：归纳接受理论。"}, {"name": "修正版本", "desc": "接受的逻辑须处理比客观辩护更复杂的多维度因素", "id": "10-6-3-5", "category": 4, "symbolSize": 22, "detail": "(1)接受的逻辑需处理比辩护逻辑更复杂的因素。"}]}, {"name": "修改或进化的逻辑", "desc": "研究归纳假说在经验证据反馈下被修改、竞争和进化的机制", "id": "10-6-4", "category": 3, "symbolSize": 26, "children": [{"name": "核心主张", "desc": "假说面对经验证据不断修正进化而非简单证实或证伪", "id": "10-6-4-1", "category": 4, "symbolSize": 22, "detail": "(1)研究归纳假说面对经验证据时如何被修改、变更、进化。(2)包括自然选择的逻辑（间接评价）、通过反复竞争而进行的学习、遗传发现的逻辑三个方面。"}, {"name": "论证依据", "desc": "含波普试错法、皮亚杰发生认识论和勃克斯进化逻辑三部分", "id": "10-6-4-2", "category": 4, "symbolSize": 22, "detail": "(1)波普的证伪法和试错法——科学理论进化的方法论。(2)皮亚杰的发生认识论。(3)勃克斯的进化逻辑三部分：选择的逻辑（模拟自然选择）、机器学习、遗传发现的逻辑（含竞争、突变、间接评价、选择、优胜劣汰等）。"}, {"name": "经典诘难", "desc": "进化模型可能过于简化，理论修改方向不一定总是进化", "id": "10-6-4-3", "category": 4, "symbolSize": 22, "detail": "(1)进化模型可能过于简化和机械。(2)理论修改的方向不一定总是进化的，有时可能退化。(3)机器学习与人类学习的类比是否恰当存疑。"}, {"name": "代表人物", "desc": "波普主试错法，皮亚杰主发生认识论，勃克斯创立进化逻辑", "id": "10-6-4-4", "category": 4, "symbolSize": 22, "detail": "(1)波普：试错法。(2)皮亚杰：发生认识论。(3)勃克斯：进化的逻辑。(4)任晓明：进化认识论和进化逻辑。"}, {"name": "修正版本", "desc": "进化逻辑是全面的归纳逻辑研究纲领的有机组成部分", "id": "10-6-4-5", "category": 4, "symbolSize": 22, "detail": "(1)进化逻辑是全面的归纳逻辑研究纲领的有机组成部分。"}]}]}]}, {"id": "c11", "name": "第十一章 逻辑中的本体论承诺", "desc": "正文 · 共4个小节", "isAppendix": false, "children": [{"id": "11-1", "name": "量词和本体论承诺", "category": 2, "symbolSize": 32, "desc": "探讨量词与本体论承诺的关系，蒯因的识别标准与语义整编方法", "children": [{"id": "11-1-1", "name": "量词的两种解释", "category": 3, "symbolSize": 26, "desc": "指称解释（对象解释）诉诸变项的值；替换解释诉诸变项的替换实例", "children": [{"id": "11-1-1-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "量词有指称解释和替换解释两种根本不同的解释方式", "detail": "(1)指称解释亦称“对象解释”，诉诸变项的值，要求给出变项的取值范围即论域；(2)替换解释并不要求给出论域，诉诸变项的替换实例，替换例仍是语言实体而非语言外的实体；(3)变项的值和替换例根本不同：前者是语言外的实体，后者是能够替换变元的表达式"}, {"id": "11-1-1-2", "name": "论证依据", "category": 4, "symbolSize": 22, "desc": "哈克赞成宽容态度：两种解释都可以是正确的，各有各的用处", "detail": "(1)指称解释一向被认为是标准的解释；(2)关于替换解释的合理性尚有许多争议；(3)贝尔纳普、杜恩、林斯基、克里普克等主张宽容态度，认为两者不必构成竞争关系"}, {"id": "11-1-1-3", "name": "代表人物", "category": 4, "symbolSize": 22, "desc": "蒯因、戴维森坚持指称解释；梅兹、马库斯主张替换解释；罗素游移不定", "detail": "(1)蒯因始终如一地坚持指称解释，这对形成其本体论学说起了关键作用；(2)梅兹、马库斯等人主张替换解释；(3)罗素在这两种解释之间游移不定，时而采取指称解释，时而又采取替换解释"}]}, {"id": "11-1-2", "name": "两种解释的哲学后果", "category": 3, "symbolSize": 26, "desc": "两种解释的选择导致不同的哲学后果，共四个方面差异", "children": [{"id": "11-1-2-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "两种解释的选择不是任意的，会导致重要的哲学后果差异", "detail": "(1)不同的解释会对一个理论的本体论承诺产生不同的影响；(2)不同的解释将导致对高阶量化的不同态度；(3)不同的解释将导致对于模态谓词逻辑的不同态度；(4)不同的解释将导致给量化公式的真以不同的定义"}, {"id": "11-1-2-2", "name": "论证依据", "category": 4, "symbolSize": 22, "desc": "指称解释导致明显的本体论承诺；替换解释将本体论承诺悬置", "detail": "(1)定理∃x(Fx∨¬Fx)按指称解释承诺了至少存在一个个体；(2)按替换解释只断言替换例的存在，不是语言外实体的存在；(3)若只允许指称对象的名称作替换例，替换解释仍有本体论承诺；若允许空词项，则可暂时摆脱"}, {"id": "11-1-2-3", "name": "经典诘难", "category": 4, "symbolSize": 22, "desc": "替换解释把本体论承诺从量词转到名称上，没有最终解决问题", "detail": "(1)唯名论者不赞成高阶量化，只赞成一阶量化；(2)蒯因基于指称解释论证模态谓词逻辑不成立；(3)两种解释之间的选择标准本身需要进一步辩护"}]}, {"id": "11-1-3", "name": "蒯因的本体论承诺理论", "category": 3, "symbolSize": 26, "desc": "“存在就是成为约束变项的值”，区分事实问题与承诺问题", "children": [{"id": "11-1-3-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "“存在就是成为约束变项的值”，量词是本体论承诺的唯一载体", "detail": "(1)蒯因区分了事实问题（实际上有什么东西存在）和承诺问题（按照那个理论有什么东西存在）；(2)作出本体论承诺的既不是单称词项也不是谓词，而是约束变项；(3)“存在就是成为约束变项的值”，量词的使用是使我们卷入本体论承诺的唯一途径"}, {"id": "11-1-3-2", "name": "论证依据", "category": 4, "symbolSize": 22, "desc": "哲学家应通过语义上溯专注于语言问题，使本体论争论变成语言争论", "detail": "(1)单称词项或名字最终可凭摹状词理论消除；(2)谓词并不是抽象实体的名称；(3)语义上溯可避免传统哲学讨论存在问题的困境"}, {"id": "11-1-3-3", "name": "代表人物", "category": 4, "symbolSize": 22, "desc": "蒯因首次系统提出，最早见于《对本体论问题的逻辑探索》（1939）", "detail": "(1)口号最早出现在《对本体论问题的逻辑探索》(1939)一文中；(2)后来在《论有什么》、《逻辑和共相的实在化》等论文中有多种表述形式；(3)蒯因使用该观念揭示实在论、概念论与唯名论的差别，并将逻辑主义、直觉主义、形式主义分别类比为这三者"}]}, {"id": "11-1-4", "name": "语义整编方法", "category": 3, "symbolSize": 26, "desc": "蒯因用一阶逻辑语言改写理论以揭示本体论承诺的过程", "children": [{"id": "11-1-4-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "用一阶逻辑（标准记法）改写理论，通过约束变元揭示本体论承诺", "detail": "(1)先确定哪些量化公式是该理论的定理；(2)再研究为使这些量化公式为真，约束变项应取什么值；(3)这些值便是该理论所承诺的存在物，本体论承诺便被揭示出来"}, {"id": "11-1-4-2", "name": "论证依据", "category": 4, "symbolSize": 22, "desc": "语义整编包括语法分析和释义两个步骤", "detail": "(1)语法分析是自然语言整编的第一步，分析各种语法范畴及其语义作用；(2)释义包括消除日常语言中的模糊性、歧义性和指称失败；(3)精释消除语言中除标准记法之外的一切其他成分"}]}]}, {"id": "11-2", "name": "逻辑中的唯名论和柏拉图主义", "category": 2, "symbolSize": 32, "desc": "唯名论与柏拉图主义在抽象实体存在性问题上的根本对立", "children": [{"id": "11-2-1", "name": "唯名论的核心立场", "category": 3, "symbolSize": 26, "desc": "根本反对承认抽象实体，变项只容许取具体对象、个体为值", "children": [{"id": "11-2-1-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "唯名论语言的变项只容许取具体对象、个体为值", "detail": "(1)唯名论根本反对承认抽象的东西，甚至也不能在心造之物的有限制的意义上承认抽象的东西；(2)唯名论语言的变项只容许取具体对象、个体为值，只容许以具体对象的专名代换变项；(3)代表人物为罗素、早期蒯因、古德曼"}, {"id": "11-2-1-2", "name": "代表人物", "category": 4, "symbolSize": 22, "desc": "罗素、早期蒯因、古德曼；迈农、弗雷格、丘奇等是柏拉图主义捍卫者", "detail": "(1)罗素、早期蒯因（在某种程度上也包括后期蒯因）、古德曼是唯名论代表人物；(2)迈农、弗雷格、丘奇、普特南、大卫·刘易斯是柏拉图主义坚定捍卫者"}]}, {"id": "11-2-2", "name": "唯名论拒斥抽象实体的两大依据", "category": 3, "symbolSize": 26, "desc": "奥康剃刀（简单性原则）与同一性标准（没有同一性就没有实体）", "children": [{"id": "11-2-2-1", "name": "奥康剃刀与简单性原则", "category": 4, "symbolSize": 22, "desc": "“除非必要，勿增实体”，马赫思维经济原则，蒯因简单性原则", "detail": "(1)奥康剃刀：“除非必要，勿增实体”；(2)马赫提出“思维经济原则”；(3)罗素强调“健全的实在感”，逻辑关心实在世界和动物学一样真诚；(4)蒯因：如果两个理论能达到同样效益而其中之一承诺的实体较少，则该理论是所要选择的"}, {"id": "11-2-2-2", "name": "同一性标准（个体化原则）", "category": 4, "symbolSize": 22, "desc": "“没有同一性就没有实体”，一个外延性标准", "detail": "(1)由蒯因第一次明确提出，本身是一个外延性标准；(2)借助于这个标准才能把某个东西个体化，规定它到底是哪一个东西，并且对它进行再认；(3)蒯因承认类满足这个标准，故承认类作为抽象实体存在；(4)蒯因不承认属性、关系、意义、命题、可能个体，因为它们不满足这个标准"}]}, {"id": "11-2-3", "name": "柏拉图主义的核心立场", "category": 3, "symbolSize": 26, "desc": "主张共相或抽象物独立于人心而存在，变项容许取抽象物为值", "children": [{"id": "11-2-3-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "在实在论的语言中，变项容许取抽象物为值", "detail": "(1)实在论主张共相或抽象物独立于人心而存在，人心可以发现但不能创造；(2)逻辑中除物理个体之外，还应承认类、性质、关系、函项等共相，以及意义、概念、命题、事实、可能世界、可能个体等；(3)迈农认为凡可思维者都是对象，分为实存对象和虚存对象"}]}, {"id": "11-2-4", "name": "柏拉图主义的论证依据", "category": 3, "symbolSize": 26, "desc": "与日常语言直觉保持一致；理论系统的方便性和有用性", "children": [{"id": "11-2-4-1", "name": "经典诘难", "category": 4, "symbolSize": 22, "desc": "迈农的理论承认东西太多，使本体的宇宙过于膨胀", "detail": "(1)迈农的虚存对象理论招致强烈批评，主要是批评它承认的东西太多；(2)蒯因把迈农的宇宙斥之为“讨人嫌的”“人口过剩的”宇宙，是“本体论的贫民窟”；(3)柏拉图主义容易走向（客观或主观的）唯心主义"}, {"id": "11-2-4-2", "name": "日常语言直觉", "category": 4, "symbolSize": 22, "desc": "语言中有指称抽象共相和观念对象的词，一般认为这些词总是有所指称", "detail": "(1)语言中既有指称现实对象的词，也有表示抽象共相的词如“动物”“人性”“红色的”；(2)还有表示观念对象的词如“上帝”“鬼”“福尔摩斯”“贾宝玉”；(3)一般认为这些词总是有所指称的，丘奇认为在语义分析中需要抽象实体"}, {"id": "11-2-4-3", "name": "理论的方便性和有用性", "category": 4, "symbolSize": 22, "desc": "蒯因承认类的原因：它们对于自然科学和数学作出了贡献", "detail": "(1)类对于自然科学作出了非直接的贡献，动物学上的种和属就是类；(2)数对于自然科学的重要性，数学函数和其他抽象数学实体同样重要；(3)假如没有它们，关于世界的科学系统就会崩溃"}]}]}, {"id": "11-3", "name": "类、性质、关系、命题等的存在性", "category": 2, "symbolSize": 32, "desc": "具体考察类、性质、关系、命题、可能个体等的存在性问题", "children": [{"id": "11-3-1", "name": "类、性质、关系是否存在", "category": 3, "symbolSize": 26, "desc": "蒯因从唯名论转向承认类；但拒斥性质、关系、函数等", "children": [{"id": "11-3-1-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "蒯因承认类作为抽象实体存在，但拒斥性质、关系、函数", "detail": "(1)蒯因早期持唯名论立场，1939年认为唯名论本质上是对超验宇宙的抗议；(2)1947年与古德曼合写《走向建设性的唯名论的步骤》，完全抛弃抽象实体；(3)后来认识到坚持唯名论纲领极端困难，在《语词和对象》中承认类是数学说明所必需的"}, {"id": "11-3-1-2", "name": "论证依据", "category": 4, "symbolSize": 22, "desc": "类满足同一性标准（外延性公理）；性质、关系不满足", "detail": "(1)类满足同一性标准：两个类有相同的元素则同一；(2)属性即使是出现在所有且仅仅是相同的事物中也可以不同，如有心脏的属性不同于有肾脏的属性；(3)所有这些东西最终都可以还原为类：数可定义为某些类的类，关系可定义为某些类的类，函数都是关系"}, {"id": "11-3-1-3", "name": "经典诘难", "category": 4, "symbolSize": 22, "desc": "唯名论若彻底贯彻则经典数学有些部分不得不被牺牲掉", "detail": "(1)蒯因早期认为如果在唯名论构造下经典数学有些部分不得不被牺牲，则那些部分对科学是无关紧要的；(2)后来蒯因认识到要对数学和自然科学真正加以分析而不能加以否定的话，坚持唯名论纲领极端困难"}]}, {"id": "11-3-2", "name": "命题是否存在", "category": 3, "symbolSize": 26, "desc": "柏拉图主义者主张命题存在的四条理由；蒯因逐一驳斥", "children": [{"id": "11-3-2-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "蒯因对一切内涵性实体深恶痛绝，拒斥命题的存在", "detail": "(1)蒯因的最主要著作《语词和对象》第六章标题为“逃避内涵”，意指要避开意义、概念、命题等内涵性实体；(2)蒯因反对承认命题主要不是出于哲学上的俭省；(3)根本原因是命题不足以个体化，没有同一性就没有实体"}, {"id": "11-3-2-2", "name": "论证依据", "category": 4, "symbolSize": 22, "desc": "蒯因从翻译不确定性、同义性不可刻画、恒久句可作真值承担者等角度驳斥", "detail": "(1)柏拉图主义理由（1）：命题是翻译对象——蒯因驳：翻译不确定，不存在唯一正确翻译，命题概念错误理解了翻译本性；(2)柏拉图主义理由（2）：命题是释义基础——蒯因驳：同义性极其捉摸不定，无论用定义、可互相替换性还是语义规则都不能成功刻画；(3)柏拉图主义理由（3）：命题是真值载体——蒯因驳：恒久句可作为真值承担者，无需命题；(4)柏拉图主义理由（4）：命题是命题态度词对象——蒯因驳：态度词形成谓词而非对象名称"}, {"id": "11-3-2-3", "name": "经典诘难", "category": 4, "symbolSize": 22, "desc": "柏拉图主义者的论证：唯名论要么是无用的要么是假的", "detail": "(1)日常语言中“约翰作出了一个真陈述”是完全自然的且可以为真；(2)如果该句蕴涵陈述作为非物理实体存在，则可逻辑推出陈述确实存在；(3)如果该句不蕴涵，则唯名论所力图摆脱的语言形式在哲学上是无害的——推出唯名论或者是无用的或者是假的"}, {"id": "11-3-2-4", "name": "修正版本", "category": 4, "symbolSize": 22, "desc": "蒯因对p、q、F、G等作模式字母解释，避免本体论承诺", "detail": "(1)将p、q、F、G看作不可被量词约束的模式或模式字母；(2)保持它们的模式身份而不是当成可约束的变元；(3)理论后果：排除了高阶逻辑存在的可能性，没有对命题、性质、关系等作出本体论承诺"}]}, {"id": "11-3-3", "name": "可能个体是否存在", "category": 3, "symbolSize": 26, "desc": "可能世界语义学引入的可能个体；蒯因和克里普克等均拒斥", "children": [{"id": "11-3-3-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "可能个体是由可能世界语义学引入的，指非现实可能世界中的个体", "detail": "(1)可能个体指非现实的可能世界中的个体，如连任三届美国总统的尼克松；(2)蒯因、克里普克、亨迪卡、斯托奈克、齐硕姆等人都拒绝承认可能个体；(3)但他们拒绝的原因是各不相同的"}, {"id": "11-3-3-2", "name": "论证依据", "category": 4, "symbolSize": 22, "desc": "蒯因：不能为可能个体提供同一性标准；克里普克：可能个体不满足同一关系", "detail": "(1)蒯因：不能为可能个体提供同一性标准，无法辨认和区分两个可能个体是同一还是不同——“考虑在那个门口的可能的胖子和可能的秃子，他们是同一个可能的人还是两个？”(2)蒯因对可能世界语义学深恶痛绝，说它“在我的哲学中连梦也算不上”；(3)克里普克：可能世界只是现实世界的各种可能状况，不是与现实世界并立的另一些世界；(4)可能个体不满足同一关系的传递性和莱布尼茨的同一不可分辨原则"}, {"id": "11-3-3-3", "name": "代表人物", "category": 4, "symbolSize": 22, "desc": "蒯因基于同一性标准拒斥；克里普克基于跨界识别问题拒斥", "detail": "(1)蒯因基于同一性标准拒斥可能个体；(2)克里普克等人不承认有跨越不同可能世界的可能个体，不承认跨界同一性和跨界识别问题；(3)在现实个体之外承认可能个体，会使反事实谈论失去意义"}]}]}, {"id": "11-4", "name": "存在的三个层次或类型", "category": 2, "symbolSize": 32, "desc": "作者提出的存在分层理论：实体性存在、依附性存在、观念性存在", "children": [{"id": "11-4-1", "name": "实体性存在", "category": 3, "symbolSize": 26, "desc": "现实存在的各种各样物理个体，是亚里士多德所谓的第一性实体", "children": [{"id": "11-4-1-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "实体性存在是唯名论者承认的唯一一类存在物，也是第一性实体", "detail": "(1)包括现实存在的各种各样物理个体：太阳月亮、树木花草、飞禽走兽、男人女人、桌子板凳；(2)也包括物质名词所表示的存在如金木水火土等；(3)亚里士多德所谓“第一性实体”：既不述说一个主体，也不存在在一个主体之中；(4)实体是不依赖于其他东西特别是人而独立存在的"}, {"id": "11-4-1-2", "name": "论证依据", "category": 4, "symbolSize": 22, "desc": "理论实体（基本粒子）：实验可重复性及实践成功说明其有客观依据", "detail": "(1)现代科学中的原子、电子、光子等基本粒子被叫做“理论实体”，并不能由感官直接感知；(2)蒯因认为物理对象和诸神只是程度上而非种类上的不同，都是文化的设定物；(3)但实验的可重复性及理论在实践上的一再成功说明微观实体有客观依据；(4)实验证明它们对宏观实体可以产生因果作用，成为它们确实存在的客观证据"}]}, {"id": "11-4-2", "name": "依附性存在", "category": 3, "symbolSize": 26, "desc": "依赖于或奠基于个体的各种存在物：性质、关系、类、事实、时空、规律等", "children": [{"id": "11-4-2-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "依附性存在基于个体之上，但仍具有客观性，可视为客观的存在", "detail": "(1)个体自身有一定的性质，又与其他的个体发生一定的关系；(2)不同的个体因某些重要性质的相同而形成分层次的类别；(3)个体具有一定的性质、关系构成通常所谓的“事实”，事实相应地也具有客观性；(4)时空是物质客体的存在方式，规律也是客观存在的"}, {"id": "11-4-2-2", "name": "论证依据", "category": 4, "symbolSize": 22, "desc": "不承认类则科学体系几乎崩溃；事实不能个体化但不能因此否认其存在", "detail": "(1)要是不承认类，我们平时的说话方式会遭遇严重的困难，科学体系也几乎将崩溃；(2)事实没有明确的边界因而不能个体化，但物质性名词所表示的存在物也不能个体化却确确实实地存在着；(3)未来的彼个体相对于现在的此个体来说就是可能的个体；(4)虽然这些东西不能作为本体存在，但不能排除它们作为本体的依附物而存在"}]}, {"id": "11-4-3", "name": "观念性存在", "category": 3, "symbolSize": 26, "desc": "用语言表述的人类知识系统中的存在物，相当于波普的“世界3”", "children": [{"id": "11-4-3-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "观念性存在作为人类的精神产品存在于观念世界中，是主体间共有的精神财产", "detail": "(1)包括各种内涵性对象如意义、概念、命题；(2)各种神话故事、科学理论、文艺作品中的构造物，如龙、上帝、孙悟空、哈姆雷特、外星人等；(3)观念性存在与实体性存在、依附性存在有瓜葛：是认知主体对现实存在的对象做移花接木、拼装组合的结果"}, {"id": "11-4-3-2", "name": "论证依据", "category": 4, "symbolSize": 22, "desc": "观念性存在一经创造就获得自己独立的生命，波普用试错法概括其发展逻辑", "detail": "(1)观念性存在一经认知主体创造出来之后，就脱离主体而获得了自己独立的生命，成为一个自主发展的领域；(2)波普所概括的逻辑：P1→TT→EE→P2……（试错法）；(3)随着人类社会的发展，观念性存在对物质世界和人类社会的影响也越来越大"}]}, {"id": "11-4-4", "name": "存在与实在的区分", "category": 3, "symbolSize": 26, "desc": "“存在”不等于“实在”，实在是能对平常物质体起因果作用的东西", "children": [{"id": "11-4-4-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "存在可以是现实世界、可能世界或纯观念世界中的存在；实在只是现实世界中的存在", "detail": "(1)“存在”不等于“实在”，存在可以是现实世界中的存在、可能世界中的存在、纯观念世界中的存在；(2)实在只是现实世界中的存在，包括实体性存在和依附性存在，即我们通常所说的物质世界；(3)唯名论者把存在等同于实体性存在，预先排除了抽象实体或观念实体的存在"}, {"id": "11-4-4-2", "name": "论证依据", "category": 4, "symbolSize": 22, "desc": "实在的检验标准：能对平常大小的物质体起因果作用", "detail": "(1)凡是实在的东西应该能够对平常大小的物质体起因果作用；(2)力和力场、原子和基本粒子以直接或间接的方式与平常的物质体发生相互作用，所以它们是实在的；(3)“实在的”东西可以是具体的（各种物理个体），也可以是抽象的（性质、关系、类、规律等）"}]}]}]}, {"id": "c12", "name": "第十二章 逻辑究竟是什么？", "desc": "正文 · 共4个小节", "isAppendix": false, "children": [{"id": "12-1", "name": "关于逻辑的实在论和反实在论观点", "category": 2, "symbolSize": 32, "desc": "在逻辑真理是否需要辩护、是否具有本体论基础问题上的两种对立观点", "children": [{"id": "12-1-1", "name": "实在论的逻辑观", "category": 3, "symbolSize": 26, "desc": "逻辑真理描述独立自存的实在中一类特殊的非经验事实，具有客观性", "children": [{"id": "12-1-1-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "逻辑真理的必然性源于它描述了事物的存在状态或事实总汇，是客观的", "detail": "(1)世界具有不依赖于有关它的任何知识或经验的特性，二值原则不以我们的认知为转移；(2)一给定语句类中语句的真值条件可以超越于我们对这些真值条件的知识或识别能力而存在；(3)逻辑是一种发现而不是发明；逻辑是一门关于真理的科学"}, {"id": "12-1-1-2", "name": "论证依据", "category": 4, "symbolSize": 22, "desc": "弗雷格的组合性原则：语句的意义由构成成分的意义和逻辑常项决定", "detail": "(1)弗雷格：名称都有涵义和所指，语句作为一种复合名称，其涵义是客观的思想即命题，其所指是真值；(2)维特根斯坦区分基本命题与命题：基本命题的真值条件在于与事态一致或不一致，命题是基本命题的真值函项；(3)重言式和矛盾式空无经验内容，具有先天必然性；命题含有经验内容、是可错的"}, {"id": "12-1-1-3", "name": "代表人物", "category": 4, "symbolSize": 22, "desc": "弗雷格、早期维特根斯坦、蒯因、戴维森是实在论逻辑观的代表", "detail": "(1)弗雷格：认识是“一种不创造被认识的事物而只是把握存在着的事物的活动”，逻辑以特殊方式研究“真”这一谓词；(2)维特根斯坦在《逻辑哲学论》中提出图像论，命题是实在的图像，基本命题的真值条件在于与事态的存在一致或不一致；(3)蒯因在《逻辑哲学》中指出逻辑是语法和真两大部件的合成物，概括了逻辑的八大特征"}]}, {"id": "12-1-2", "name": "反实在论的逻辑观", "category": 3, "symbolSize": 26, "desc": "逻辑真理的必然性来自于语义约定和规则，否认其有语言外的客观基础", "children": [{"id": "12-1-2-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "约定论：逻辑真理的必然性来自于我们使用语言的方式中的语义约定", "detail": "(1)坦南特指出反实在论以四个观念为基础：可观察行为、组合性原则、确定意义、认识能力表示意义知识；(2)达米特区分三种反实在论：形而上学的、语义的、逻辑的反实在论；(3)逻辑反实在论拒绝二值原则和排中律，特别赞成直觉主义逻辑，因为后者主张“存在就是被构造”"}, {"id": "12-1-2-2", "name": "代表人物", "category": 4, "symbolSize": 22, "desc": "卡尔纳普、后期维特根斯坦是约定论代表；达米特是逻辑反实在论代表", "detail": "(1)卡尔纳普是维也纳学派核心成员，利用分析陈述和综合陈述的二元区分说明逻辑和数学命题的认识价值；(2)分析陈述有两种类型：狭义的逻辑真理（根据逻辑常项意义为真）和非逻辑的分析真理（根据描述词项意义为真）；(3)卡尔纳普提出“宽容原则”：每个人都可以自由选择他的语言规则，也可以按他所愿意的方式选择他的逻辑"}]}, {"id": "12-1-3", "name": "蒯因对约定论的系统批判", "category": 3, "symbolSize": 26, "desc": "约定论不能区分逻辑真理与经验真理；约定需要辩护，导致循环论证", "children": [{"id": "12-1-3-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "约定论并没有任何解释力，无法区分逻辑真理和经验真理", "detail": "(1)蒯因在《依据约定的真》等论著中对约定论进行了系统批判；(2)第一：约定论不能真正将逻辑真理和经验真理区别开来，因为同样的公理化方案也适用于任何其他科学；(3)第二：约定需要符合相关词项的日常用法，需要得到某种辩护和说明，由此陷入循环论证或无穷倒退——“从约定推出逻辑时就需要逻辑”"}, {"id": "12-1-3-2", "name": "经典诘难", "category": 4, "symbolSize": 22, "desc": "约定论无法说明逻辑真理的普遍适用性和认识价值", "detail": "(1)如果逻辑真理只是由于随意选取的语义规则为真，它们怎么可能普遍适用于一切科学领域？(2)独立自存的世界为什么会服从我们中某些人的一时兴起？这大概是所有奇迹中最大的奇迹；(3)若今后数学家逻辑地推出“哥德巴赫猜想是真命题”，难道没有提供任何新知识吗？因此逻辑真理的根据必须超出约定领域"}]}, {"id": "12-1-4", "name": "普赖尔的tonk反例", "category": 3, "symbolSize": 26, "desc": "普赖尔引入新联结词tonk，证明约定论无法排除任意语义规则", "children": [{"id": "12-1-4-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "普赖尔用tonk反例证明：命题联结词的意义并不仅仅在于推演规则或公理", "detail": "(1)1960年普赖尔在《循环推理标记》中引入新联结词tonk，服从两个推演规则；(2)由这些规则可以证明任意语句B可以从任意语句A推出，即任意两个语句相互等价；(3)包含tonk规则的系统是不一致的"}, {"id": "12-1-4-2", "name": "经典诘难", "category": 4, "symbolSize": 22, "desc": "约定论无法说明哪些约定是可允许的、哪些应排除，其依据和标准是什么", "detail": "(1)普赖尔结论一：一个表达式在我们能够发现包含它的推理是否有效之前，必定已经具有确定的意义；(2)普赖尔结论二：尽管卡尔纳普也会排除tonk，但没有告诉我们哪些关于常项的约定是可允许的、哪些应排除；(3)卡尔纳普无法排除语义规则和约定的任意性，对逻辑真理的说明最终陷入主观主义和相对主义"}]}, {"id": "12-1-5", "name": "两种逻辑观的派生差异", "category": 3, "symbolSize": 26, "desc": "实在论与反实在论在发现vs发明、真理vs推理、能否提供新知上对立", "children": [{"id": "12-1-5-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "实在论：逻辑是发现，是关于真理的科学；反实在论：逻辑是发明，是关于推理的科学", "detail": "(1)实在论者认为逻辑是一种发现而不是发明——逻辑学家像自然科学家一样发现逻辑真理和逻辑规律；(2)反实在论者认为逻辑是逻辑学家发明的结果，不同的逻辑学家可以构造不同的逻辑系统；(3)实在论者把逻辑视为关于真理的科学，侧重于语义学研究；(4)反实在论者把逻辑视为关于推理的科学，侧重于语形学（证明论）研究"}, {"id": "12-1-5-2", "name": "论证依据", "category": 4, "symbolSize": 22, "desc": "实在论：逻辑演绎有助于发现事实；反实在论：逻辑真理不包含任何信息", "detail": "(1)反实在论者认为逻辑真理不包含任何信息，没有认识价值；(2)实在论者持相反看法：逻辑归根结底涉及客观实在的领域，以某种方式描述着客观实在；(3)逻辑演绎的结论包含在前提中只不过像“植物包含在种子中”，逻辑真理能够提供新知"}, {"id": "12-1-5-3", "name": "修正版本", "category": 4, "symbolSize": 22, "desc": "作者倾向于实在论但认为需精致化：逻辑真理是思维的规律，间接与实在相关", "detail": "(1)逻辑真理不是实在的直接反映，它们首先是思维的规律，根植于我们的思维实践和语言实践；(2)思维实践和语言实践与外部世界有某种接近、契合与一致之处；(3)逻辑真理归根结底十分间接地与实在发生着关系，具有本体论和认识论的基础，因而具有客观性"}]}]}, {"id": "12-2", "name": "思维、语言、实在和逻辑", "category": 2, "symbolSize": 32, "desc": "关于逻辑研究对象的四种观点及其评价，论证逻辑的真正对象是思维", "children": [{"id": "12-2-1", "name": "逻辑研究思维的观点", "category": 3, "symbolSize": 26, "desc": "传统观点：逻辑是关于思维的形式结构及其规律的科学", "children": [{"id": "12-2-1-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "逻辑以思维的形式结构为对象，区分逻辑常项和变项两类要素", "detail": "(1)思维的形式结构又叫逻辑形式，是指各种具体的思维内容所共同具有的联系方式；(2)思维的形式结构含有逻辑常项和变项两类要素：常项是结构要素，变项代表内容要素；(3)自从弗雷格以来，许多逻辑学家一般不再提逻辑以思维为对象，有多重原因"}]}, {"id": "12-2-2", "name": "逻辑研究实在的观点", "category": 3, "symbolSize": 26, "desc": "源于罗素和维特根斯坦的逻辑原子论：语言与现实世界存在一一对应关系", "children": [{"id": "12-2-2-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "语言和现实世界之间具有结构同型性，逻辑形式即实在的形式", "detail": "(1)专名对应于个体，形容词对应于个体的属性，动词对应于个体之间的关系；(2)原子命题对应于原子事实，复合命题对应于复合事实；(3)命题中名称之间的逻辑结构与现实对象之间的逻辑结构是相对应的"}, {"id": "12-2-2-2", "name": "经典诘难", "category": 4, "symbolSize": 22, "desc": "作者不赞成此观点：原子事实或基本事件根本不存在，任何事实都是复合的", "detail": "(1)语言也被大量用于表示现实中不存在的完全虚构的对象；(2)“张三生病了”这一事实怎么可能是原子的？它可能由一个或几个原因引起，可能显现为许多症状；(3)“没有发生的事实”这一概念本身就包含矛盾；(4)企图通过语言及其结构去直接把握现实世界及其结构只是一厢情愿的空想"}]}, {"id": "12-2-3", "name": "逻辑研究语言的观点", "category": 3, "symbolSize": 26, "desc": "现代形式逻辑以人工语言为对象，新兴语言逻辑以自然语言为对象", "children": [{"id": "12-2-3-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "为严格区分逻辑学和心理学，认为逻辑直接以语言符号为对象", "detail": "(1)基本出发点是要严格区分逻辑学和心理学；(2)乌卡谢维奇指出：逻辑与思维的关系并不比数学与思维的关系多，逻辑中的心理主义是逻辑衰败的标志；(3)他们不同意逻辑以思维或现实世界为对象，根据大量表面现象得出逻辑以语言符号为对象的结论"}, {"id": "12-2-3-2", "name": "经典诘难", "category": 4, "symbolSize": 22, "desc": "作者不赞成此观点：被表面现象所误导，语言是逻辑的中介对象而非真正对象", "detail": "(1)语言确实是逻辑的直接研究对象，但问题在于为什么会如此；(2)语言是思维的外化形式，是思维的活化石，舍掉语言思维不能成为研究的对象；(3)乔姆斯基的深层结构与表层结构理论支持：逻辑研究语言是为着研究由其深层结构决定和表达的深层语义（概念、命题、推理）"}]}, {"id": "12-2-4", "name": "逻辑研究推理形式有效性的观点", "category": 3, "symbolSize": 26, "desc": "逻辑的中心课题是推理，是从推理形式的角度区分有效推理与无效推理", "children": [{"id": "12-2-4-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "逻辑是一门关于推理形式有效性的科学，不是描述性的而是规范性的", "detail": "(1)逻辑的中心课题是推理或论证，但并不研究推理的一切方面；(2)从推理形式的角度把有效的推理与无效的推理区分开来；(3)作者赞成此字面说法，认为它与第一种观点（以思维为对象）并不矛盾，是后者的精确化"}]}, {"id": "12-2-5", "name": "反心理主义及其批判", "category": 3, "symbolSize": 26, "desc": "作者论证反心理主义者否认逻辑以思维为对象的论据站不住脚", "children": [{"id": "12-2-5-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "即使逻辑学和心理学同以思维为对象，也可以从三方面严格区分两者", "detail": "(1)两者研究范围之广狭不同：心理学以整个心理活动与过程为对象，逻辑学仅在思维和推理上才与心理学发生重叠；(2)侧重点不同：心理学研究具体思维活动的发生发展过程，逻辑学对发生学意义上的思维研究完全不感兴趣，只研究形式结构关系；(3)研究途径和方法不同：心理学通过刺激-反应模式采用观察、实验、归纳；逻辑通过语言中介采用分析、抽象、概括、演绎"}, {"id": "12-2-5-2", "name": "论证依据", "category": 4, "symbolSize": 22, "desc": "思维的心理学是经验科学侧重于事实问题；逻辑学是规范科学侧重于规范问题", "detail": "(1)“对于思维和认识必须区分事实问题和规范问题”；(2)历史上有人或现在仍然有人把它们混同并不意味着它们必然混同；(3)既然同时以人为对象的学科可区分为伦理学、社会学等不同门类，为什么单单逻辑学一研究思维就必然混同于心理学呢？"}]}]}, {"id": "12-3", "name": "逻辑和非逻辑的划界标准", "category": 2, "symbolSize": 32, "desc": "探讨逻辑真理的划界问题：哲学标准和形式标准及逻辑学分类体系", "children": [{"id": "12-3-1", "name": "划界问题的提出", "category": 3, "symbolSize": 26, "desc": "由逻辑真理的相对性引起：形式化方法普遍应用，不同逻辑系统相互抵触", "children": [{"id": "12-3-1-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "为何有些形式系统是逻辑而有些不是？是什么使一个系统成为逻辑系统？", "detail": "(1)形式公理化方法已可应用于数学、哲学、物理学甚至生物学，这些系统与逻辑在结构上类似；(2)模态对应理论中某些在直观上不成立的公式如Dc、Tc也可以找到对应关系条件；(3)经典逻辑系统和变异逻辑系统相对于不同解释而真，但它们之间可能相互抵触——有彼此相互抵触的逻辑真理吗？"}]}, {"id": "12-3-2", "name": "划界的哲学标准", "category": 3, "symbolSize": 26, "desc": "自明性标准不成立；题材中立性和普遍适用性是可接受的标准", "children": [{"id": "12-3-2-1", "name": "自明性标准的批判", "category": 4, "symbolSize": 22, "desc": "自明性在很大程度上是心理学的主观概念，很多现代逻辑真理很不自明", "detail": "(1)自明性是一个本身并不自明的概念；(2)传统逻辑具有明显的直观背景，其逻辑规律往往是清楚明白的；(3)现代逻辑是抽象的形式公理系统，挑选公理时依据的不是直观性和自明性，而是一致性、独立性、完全性等现代标准；(4)有的模态逻辑系统含有极其不直观的公理，即使是专业模态逻辑学家也无法解释其直观意义"}, {"id": "12-3-2-2", "name": "题材中立性标准", "category": 4, "symbolSize": 22, "desc": "逻辑对于这个世界没有作出任何实质性断言，是纯粹形式的或题材中立的", "detail": "(1)蒯因正是因为集合论和高阶逻辑不具有题材中立性而将其排斥在逻辑之外；(2)一阶逻辑提供了识别本体论承诺的技术和方法，但它本身没有作出任何特殊的本体论承诺；(3)蒯因将集合论和高阶逻辑排除在逻辑之外的理由：它们在本体论上承诺了类、命题、属性等抽象实体的存在"}, {"id": "12-3-2-3", "name": "普遍适用性标准", "category": 4, "symbolSize": 22, "desc": "一旦承认了逻辑真理的题材中立性，普遍适用性就是自然结论", "detail": "(1)逻辑普遍适用于处理含该组概念的一切命题和推理，而不管其具体内容是什么；(2)正像命题逻辑普遍适用于含命题联结词的一切推理一样，模态逻辑也普遍适用于一切含模态词的命题和推理；(3)在这种意义上，传统逻辑、经典逻辑和哲学逻辑在普适性方面没有区别"}]}, {"id": "12-3-3", "name": "划界的四种形式标准", "category": 3, "symbolSize": 26, "desc": "标准I与经典逻辑类似；标准II根据逻辑常项数目；标准III完全性；标准IV可判定", "children": [{"id": "12-3-3-1", "name": "标准I：与经典逻辑相类似", "category": 4, "symbolSize": 22, "desc": "凡与经典逻辑类似的形式系统都是逻辑系统", "detail": "(1)包括经典逻辑的扩充系统（加入新的逻辑词汇和公理）；(2)经典逻辑的择代系统（相同词汇集但不同的公理或规则）；(3)归纳逻辑（企图把支持概念形式化）；(4)问题在于：为什么一阶逻辑是逻辑？类似性未严格定义，带有模糊性和主观随意性"}, {"id": "12-3-3-2", "name": "标准II：根据逻辑常项数目", "category": 4, "symbolSize": 22, "desc": "逻辑可定义为完全根据真命题所含词项的意义而研究真命题的学科", "detail": "(1)狭义的逻辑常项包括命题联结词、量词、等词；(2)广义逻辑常项包括高阶量词、属于关系、必然/可能等模态概念；(3)问题：此标准不成其为标准——“什么是逻辑常项？什么是逻辑真理？什么是逻辑？这只不过是同一个问题的三种不同提法”"}, {"id": "12-3-3-3", "name": "标准III：完全性和勒文海姆—斯柯伦性质", "category": 4, "symbolSize": 22, "desc": "凡是完全的形式系统就是逻辑；不完全者不是逻辑", "detail": "(1)涅尔论证：形式理论不完全表明其基本概念不能完全形式化，根据纯粹形式特性应将其从逻辑中排除；(2)根据此标准，一阶谓词演算是逻辑，集合论或高阶谓词演算不是逻辑（因为不可完全），逻辑主义纲领归于失败；(3)蒯因也把完全性当作划界标准：一阶逻辑是完全的，集合论不可完全，因而不是逻辑"}, {"id": "12-3-3-4", "name": "标准IV：完全性加可判定性", "category": 4, "symbolSize": 22, "desc": "格兰杰尔主张：只有命题演算才真正是空无内容、题材中立的，才配称逻辑", "detail": "(1)可判定性意味着存在一个机械程序去判定任一公式是否为定理；(2)只有命题演算是可判定的，一阶谓词演算从整体上看是不可判定的；(3)格兰杰尔还加上哲学性标准：逻辑的对象应该只是命题或陈述，唯有命题演算才处理一般对象；(4)作者认为可判定性是一种过于狭窄的标准"}]}, {"id": "12-3-4", "name": "逻辑学的分类体系", "category": 3, "symbolSize": 26, "desc": "将逻辑学分为基本逻辑、应用逻辑和广义逻辑三大类", "children": [{"id": "12-3-4-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "作者主张框架完全性作为划界标准；实际操作上采取相对宽松的态度", "detail": "(1)基本逻辑包括经典逻辑、非经典逻辑、元逻辑、归纳逻辑；(2)应用逻辑包括模态逻辑、时态逻辑、道义逻辑、认识论逻辑等；(3)广义逻辑包括逻辑与数学交叉（高阶量词理论、集合论等）、逻辑与哲学交叉、逻辑与语言学交叉等；(4)该分类体系并非封闭的，随时准备接纳新的逻辑分支"}, {"id": "12-3-4-2", "name": "论证依据", "category": 4, "symbolSize": 22, "desc": "引用普赖尔：在严格意义上逻辑研究蕴涵和全称的性质；在宽松意义上关注一般推理原则", "detail": "(1)普赖尔：在原则上不排除谈论有机生命的逻辑的可能性；(2)某些题材比其他题材有更多的次序、更多的结构、更多的形式，更能凭借形式符号演算来处理；(3)发现一给定领域是否能处理为逻辑的唯一途径是试一试并看结果如何，不能先验地解决"}]}]}, {"id": "12-4", "name": "逻辑的一元论、多元论和工具论", "category": 2, "symbolSize": 32, "desc": "关于正确逻辑是一个还是多个的争论：一元论、多元论与工具论三种立场", "children": [{"id": "12-4-1", "name": "系统外有效性与系统内有效性", "category": 3, "symbolSize": 26, "desc": "区分两种有效性观念：系统内（语法与语义）有效性与系统外（直观）有效性", "children": [{"id": "12-4-1-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "系统内有效性分语法有效性和语义有效性；系统外有效性是直观的非形式标准", "detail": "(1)语法有效性：结论可利用推理规则从前提和公理演绎得到；(2)语义有效性：结论在使得前提为真的所有解释下都真；(3)系统外有效性：如果一个非形式论证不可能前提真而结论假，那么它就是有效的——这是一种直观的、模糊的、歧义的标准"}, {"id": "12-4-1-2", "name": "论证依据", "category": 4, "symbolSize": 22, "desc": "在理想的（既可靠又完全的）形式系统中，定理集与逻辑真理集完全重合", "detail": "(1)在一个既可靠又完全的形式系统中，逻辑定理集与逻辑真理集完全重合；(2)系统外有效性观念的模糊性和歧义性为逻辑学家进行形式构造时留下了很大的自由空间和选择余地；(3)多元论者认为说存在一个完全确定的系统外有效性观念是无视事实的妄说"}]}, {"id": "12-4-2", "name": "逻辑一元论", "category": 3, "symbolSize": 26, "desc": "只有唯一一个正确的逻辑：经典逻辑及其扩充；其他逻辑与之竞争", "children": [{"id": "12-4-2-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "正确的逻辑只有唯一的一个，经典逻辑及其扩充一起构成了那个正确的逻辑", "detail": "(1)一元论者认为存在一个确定的系统外的有效性观念；(2)凡与这个观念相符合的逻辑系统就是正确的，否则就是不正确的；(3)经典逻辑及其扩充一起构成那个唯一正确的逻辑，而其他逻辑则与经典逻辑及其扩充构成竞争关系"}, {"id": "12-4-2-2", "name": "代表人物", "category": 4, "symbolSize": 22, "desc": "莱斯涅夫斯基：所有多值系统都是纯粹的游戏，只有一个可靠的逻辑系统", "detail": "(1)波兰逻辑学家莱斯涅夫斯基指出：所有多值系统都是纯粹的游戏，只有一个可靠的逻辑系统即正统的标准系统；(2)有人按照同一精神把所有的非经典的多值逻辑贬为“似逻辑的形式主义”"}]}, {"id": "12-4-3", "name": "逻辑多元论", "category": 3, "symbolSize": 26, "desc": "正确的逻辑系统不只一个；不同逻辑反映直观有效性的不同方面", "children": [{"id": "12-4-3-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "不同逻辑系统之间的竞争是表面的，内在是相容的", "detail": "(1)系统外有效性观念具有模糊性和歧义性，不同逻辑系统反映直观有效性观念的不同方面；(2)不同逻辑之间的竞争是表面的，因为逻辑常项的意义完全取决于它们出现于其中的系统的公理和推理规则；(3)当某些合式公式在一个系统内逻辑真但不在另一个系统内逻辑真时，说明这些公式具有不同的意义——经典逻辑和非经典逻辑都可以是正确的"}, {"id": "12-4-3-2", "name": "论证依据", "category": 4, "symbolSize": 22, "desc": "仅以“如果…则…”的多种解释为例说明多元论的合理性", "detail": "(1)实质蕴涵、严格蕴涵、相干蕴涵、衍推、直觉主义蕴涵、反事实蕴涵等阐释都各有道理；(2)很难分出绝对的高下优劣；(3)如果硬要说其中的某一个正确而其他均不正确，就近乎是完全主观和任意的事情"}]}, {"id": "12-4-4", "name": "逻辑工具论", "category": 3, "symbolSize": 26, "desc": "分为激进工具论和温和工具论；逻辑是推理工具，选择取决于适用性和方便性", "children": [{"id": "12-4-4-1", "name": "激进工具论", "category": 4, "symbolSize": 22, "desc": "逻辑只是推理工具，对于工具没有正确不正确的问题，只有是否适用的问题", "detail": "(1)不承认有系统外有效性，而只承认系统内有效性；(2)只允许“内部”问题（一逻辑系统是否一致与可靠），不承认“外部问题”（一逻辑系统是否正确）；(3)此观点显然大成问题：“如果一个人能够从A推出A并且B，无论这可能是多么方便有用，绝不能成为把这个推理选作有效定理的理由”"}, {"id": "12-4-4-2", "name": "温和工具论", "category": 4, "symbolSize": 22, "desc": "逻辑也有正确与否问题：凡具有保真性的逻辑就是正确的逻辑", "detail": "(1)C.I.刘易斯指出：系统的简单性和方便性、与心理限制和精神习惯的一致等充当选择“好逻辑”的标准；(2)任何通行的或被接受的推理模式必定是语用地决定的；(3)一个系统被接受并不意味着那些不同的系统是假的，而是意味着对于指导和检验日常推理来说它们是相对贫乏的工具"}]}, {"id": "12-4-5", "name": "多元论与温和工具论的结合", "category": 3, "symbolSize": 26, "desc": "作者赞成多元论与温和工具论的结合；真理常常存在于各种极端的平衡之中", "children": [{"id": "12-4-5-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "由于系统外有效性的模糊性，正确逻辑不只一个而有好多个", "detail": "(1)不同的阐释都各有道理，很难分出绝对的高下优劣；(2)不妨承认它们都具有某种程度的正确性，任其自由发展；(3)不同逻辑之间的选择可用温和工具论的标准：看它们是否充分适用于某种特殊的目的"}, {"id": "12-4-5-2", "name": "论证依据", "category": 4, "symbolSize": 22, "desc": "有些逻辑特别适用于处理某些领域推理，方便性和适用性是选择标准", "detail": "(1)在绝对主义和相对主义之下还可以区分出不同的立场；(2)范·海耶诺特的术语：绝对主义（只存在唯一一个正确的逻辑）vs相对主义（否定回答）；(3)作者赞成相对主义下的多元论与温和工具论结合"}]}]}]}, {"id": "a01", "name": "附录一 语句的真、真的语句、真", "desc": "附录 · 共3个小节", "isAppendix": true, "children": [{"id": "13-1", "name": "\"语句的真\"：只有一个真概念", "category": 2, "symbolSize": 32, "desc": "探讨\"真\"作为语句的性质，只有一个真概念", "children": [{"id": "13-1-1", "name": "真理符合论", "category": 3, "symbolSize": 26, "desc": "语句的真在于与实在或事实的符合与对应", "children": [{"id": "13-1-1-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "语句的真在于词语与世界的关系", "detail": "(1)语句的真不在于词语与词语的关系，而在于词语与世界的关系，或内容与世界的关系。(2)语句所表述的内容与对象在世界中的存在方式或状况的符合与对应。(3)亚里士多德：\"说是者为是，或说非者为非，是真的。\""}, {"id": "13-1-1-2", "name": "论证依据", "category": 4, "symbolSize": 22, "desc": "合乎常识直观，亚里士多德最初表述", "detail": "(1)最合乎人们的常识和直观。(2)亚里士多德的最初表述：\"说是者为非，或说非者为是，是假的；而说是者为是，或说非者为非，是真的。\""}, {"id": "13-1-1-3", "name": "经典诘难", "category": 4, "symbolSize": 22, "desc": "事实难以个体化，符合关系难刻画", "detail": "(1)什么是事实？事实能否个体化？事实一词用法歧异——有时指客观对象，有时指感觉经验，有时指陈述记载，有时指理论原理。(2)什么是符合关系？逻辑原子论假定事实独立自主，但原子命题并非相互独立，且事实无法清楚切分为不同单元。(3)戴维森指出：若一个语句符合一个事实，则它将符合所有事实。(4)符合论有本体论承诺（承认外部世界）、认识论超验立场和二值原则承诺。"}, {"id": "13-1-1-4", "name": "代表人物", "category": 4, "symbolSize": 22, "desc": "亚里士多德、罗素、早期维特根斯坦等", "detail": "(1)亚里士多德。(2)罗素、早期维特根斯坦、奥斯汀。(3)绝大多数逻辑经验论者。(4)塔斯基。(5)苏珊·哈克。"}, {"id": "13-1-1-5", "name": "修正版本", "category": 4, "symbolSize": 22, "desc": "塔斯基T模式、哈克版等不设定事实版本", "detail": "(1)塔斯基T模式：x是真的当且仅当p，不涉及\"事实\"概念，在形式语言中给出实质充分、形式正确的真定义。(2)苏珊·哈克版本：\"说一个断言是真的，所说的简单地就是：事情确实如它所说的那样。\"(3)不假定事实的本体论地位的符合论版本。"}]}, {"id": "13-1-2", "name": "实用主义真理论", "category": 3, "symbolSize": 26, "desc": "概念意义由实践结果确定，真信念造成差别", "children": [{"id": "13-1-2-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "概念意义由实验或实践结果确定", "detail": "(1)一个概念的意义是由运用它所产生的\"实验的\"或\"实践的\"结果来确定的。(2)不造成任何差别的差别就不是差别。(3)若一个信念或语句为真，会在实践中造成什么样的差别？"}, {"id": "13-1-2-2", "name": "代表人物", "category": 4, "symbolSize": 22, "desc": "皮尔士、詹姆士、杜威", "detail": "(1)皮尔士（Peirce）。(2)詹姆士（James）。(3)杜威（Dewey）。"}]}, {"id": "13-1-3", "name": "真理冗余论", "category": 3, "symbolSize": 26, "desc": "\"p是真的\"等同于p，真谓词多余", "children": [{"id": "13-1-3-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "\"p是真的\"等同于p，真谓词可删除", "detail": "(1)\"p是真的\"仅仅等同于p，或者说\"p是真的\"只不过意味着断定p、接受p、同意p等。(2)\"真的\"和\"假的\"这两个谓词是多余的，可删除而不会引起任何语义上的损失。(3)根本没有孤立的真理问题，有的只是语言混乱。"}, {"id": "13-1-3-2", "name": "代表人物", "category": 4, "symbolSize": 22, "desc": "拉姆塞、艾耶尔、斯特劳森、格罗弗", "detail": "(1)拉姆塞（Ramsey），1927年最早提出。(2)艾耶尔（Ayer）、斯特劳森（Strawson）、格罗弗（Grover）等人加以充实和发展。"}, {"id": "13-1-3-3", "name": "修正版本", "category": 4, "symbolSize": 22, "desc": "在新近文献中变形为\"紧缩论\"", "detail": "(1)在新近的文献中，冗余论被变形为\"紧缩论\"（deflationary theories of truth，或deflationism）。"}]}, {"id": "13-1-4", "name": "作者立场：符合论最合理", "category": 3, "symbolSize": 26, "desc": "符合论隐含断定真理客观性，不应放弃", "children": [{"id": "13-1-4-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "符合论基本思想比较合理", "detail": "(1)尽管符合论也有不少理论上的困难，但它的基本思想是比较合理的。(2)符合论隐含地断定了真理的客观性，客观性是真理的一个最本质的特征。(3)金岳霖指出：\"符合说不容易放弃，……放弃也许只是在明文的表示上放弃，而保留是非正式的骨子里的保留。\""}]}]}, {"id": "13-2", "name": "原子论的\"真理\"概念：真的语句", "category": 2, "symbolSize": 32, "desc": "真理看作一个个真的语句或命题", "children": [{"id": "13-2-1", "name": "数学真理", "category": 3, "symbolSize": 26, "desc": "如\"2+2=4\"等数学命题为真的真理", "children": [{"id": "13-2-1-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "指\"2+2=4\"等数学命题", "detail": "(1)数学真理指这样的语句、命题或公式，如\"2+2=4\"，\"等量加等量其和仍相等\"，\"x×(y+z)=(x×y)+(x×z)\"等。(2)这些语句、命题或公式因何为真，与实在和感觉经验的关系如何等问题，是数学哲学的研究课题。"}]}, {"id": "13-2-2", "name": "语义真理", "category": 3, "symbolSize": 26, "desc": "基于语言约定或习惯为真的命题", "children": [{"id": "13-2-2-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "为真根据在于语言约定或习惯", "detail": "(1)语义真理指这样的语句或命题，例如\"单身汉是未婚男子\"，\"如果张三比李四胖，则李四比张三瘦\"等。(2)这些语句或命题为真的根据在于词典，在于人们共同的语言约定或语言习惯。"}]}, {"id": "13-2-3", "name": "逻辑真理", "category": 3, "symbolSize": 26, "desc": "在所有解释中为真的逻辑公式及例证", "children": [{"id": "13-2-3-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "在所有解释中为真的合式公式", "detail": "(1)逻辑真理指这样的逻辑公式及其例证，如\"p∨﹁p\"、\"﹁∃x(Fx∧﹁Fx)\"、三段论推理等。(2)蒯因给出了定义逻辑真理的5种方式：根据结构为真、根据替换为真、根据模型为真、根据证明程序为真、根据语法为真。(3)一般定义：\"一个合式公式是在L中逻辑真的，当且仅当它在L中的所有解释中为真。\""}]}, {"id": "13-2-4", "name": "休谟之叉", "category": 3, "symbolSize": 26, "desc": "人类知识分为观念联系和实际事情两类", "children": [{"id": "13-2-4-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "知识分为观念联系和实际事情两类", "detail": "(1)关于观念联系的知识：代表是几何、代数、算术和逻辑学，命题与世界状况和感觉经验无关，具有直觉和演绎的确定性和明白性。(2)关于实际事情的知识：建立在因果关系之上，例如\"太阳明天将不从东方升起\"，真假取决于世界状况和感觉经验，不具有普遍必然性。"}, {"id": "13-2-4-2", "name": "代表人物", "category": 4, "symbolSize": 22, "desc": "休谟", "detail": "(1)休谟（Hume），经验论者，认为一切知识起源于感性知觉。"}]}, {"id": "13-2-5", "name": "莱布尼茨的真理分类", "category": 3, "symbolSize": 26, "desc": "推理的真理必然，事实的真理偶然", "children": [{"id": "13-2-5-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "推理的真理必然，事实的真理偶然", "detail": "(1)推理的真理是必然的，它的否定是不可能的，依据矛盾原则，在所有可能世界中都为真。(2)事实的真理是偶然的，它的否定是可能的，依据充足理由原则，只在有些可能世界中为真。(3)莱布尼茨的\"推理的真理\"较宽泛，包括狭义的逻辑真理、数学真理和其他必然为真的真理。"}, {"id": "13-2-5-2", "name": "代表人物", "category": 4, "symbolSize": 22, "desc": "莱布尼茨", "detail": "(1)莱布尼茨（Leibniz）。"}]}, {"id": "13-2-6", "name": "康德的分析/综合区分", "category": 3, "symbolSize": 26, "desc": "分析命题与综合命题的区分", "children": [{"id": "13-2-6-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "分析命题不增新内容，综合命题增加", "detail": "(1)分析命题：谓词未给主词概念增加任何东西，只是通过分析把主词概念分解为分概念；否定导致逻辑矛盾；必然的、先验的。(2)综合命题：在主词概念上增加了一个谓词，谓词不能由对主词概念的任何分析而抽绎出来；否定不会造成逻辑矛盾；偶然的、经验的。(3)康德容许先验综合命题存在——谓词不是从主词分析出来但又必定与主词联结，既增添新内容又具有普遍必然性。"}, {"id": "13-2-6-2", "name": "代表人物", "category": 4, "symbolSize": 22, "desc": "康德", "detail": "(1)康德（Kant）。"}, {"id": "13-2-6-3", "name": "修正版本", "category": 4, "symbolSize": 22, "desc": "逻辑经验论者重新定义并排斥先验综合", "detail": "(1)重新定义分析命题和综合命题，使之适用于一切形式的命题：分析命题效准仅依据符号定义，综合命题效准决定于经验事实。(2)排斥先验综合命题的存在，认为任何必然命题无例外地都是分析命题。(3)将分析/综合、必然/偶然、先验/后验三组区分完全等同。"}]}]}, {"id": "13-3", "name": "整体论的\"真理\"概念：理论体系", "category": 2, "symbolSize": 32, "desc": "真理应作为理论体系而存在", "children": [{"id": "13-3-1", "name": "本体论论证", "category": 3, "symbolSize": 26, "desc": "认识对象是整体，真理应以系统方式存在", "children": [{"id": "13-3-1-1", "name": "布拉德雷的绝对唯心论", "category": 4, "symbolSize": 22, "desc": "实在本身是统一融贯的\"绝对\"整体", "detail": "(1)布拉德雷认为，实在本身就是一个统一且融贯的整体，他称之为\"绝对\"。(2)只有作为整体的绝对本身才是真实的，只考虑绝对的某个部分只能获得部分的真实性。(3)关于现象的感觉经验不能为认识绝对提供可靠基础，唯有把关于部分的认识置于关于绝对的整体性认识之中，才能判别和保证它们的真理性。"}, {"id": "13-3-1-2", "name": "黑格尔的绝对理念", "category": 4, "symbolSize": 22, "desc": "绝对理念是全部真理，存在于对立统一中", "detail": "(1)黑格尔认为，整个世界表现为纯粹概念的矛盾运动，当达到绝对理念时，便达到了真理。(2)真理存在于现实事物的总和与相互关系之中，存在于对立面的统一之中，真理是全面的和具体的。(3)真理是一个矛盾发展的过程，同一句格言，从饱经风霜的老人嘴里说出来与从初出茅庐的小伙子嘴里说出来，具有完全不同的内涵。"}, {"id": "13-3-1-3", "name": "马克思列宁辩证唯物论真理观", "category": 4, "symbolSize": 22, "desc": "真理是主观对客观的正确反映", "detail": "(1)真理是人的主观认识对客观现实的正确反映，其中包含着不以人的意志为转移的客观内容。(2)真理是全面的，它\"是由现象、现实的一切方面的总和以及它们的（相互）关系构成的\"。(3)真理是主观与客观的具体的历史的统一，有其自身适用的具体条件和范围。(4)真理不是凝固不变的僵死教条，而是充满活力的无限运动过程。(5)真理是相对性和绝对性的辩证的历史的统一。"}]}, {"id": "13-3-2", "name": "认识论论证", "category": 3, "symbolSize": 26, "desc": "命题与命题比较而非与纯粹事实比较", "children": [{"id": "13-3-2-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "无法直接达到实在，命题系统整体面对经验", "detail": "(1)纽拉特认为，我们不可能脱离语言和思想而直接达到实在，命题与\"事实\"的对照本质上是系统内命题与命题的对照。(2)我们看到的世界是我们\"能够\"看到的世界，也是我们\"希望\"看到的世界，关于世界的\"事实\"已经被我们自己的概念框架所污染。(3)蒯因指出：\"我们关于外界的陈述不是个别的，而是仅仅作为一个整体来面对感觉经验的法庭的\"，具有经验意义的单位是整个科学。"}, {"id": "13-3-2-2", "name": "代表人物", "category": 4, "symbolSize": 22, "desc": "纽拉特、蒯因", "detail": "(1)纽拉特（Neurath）。(2)蒯因（Quine）。"}]}, {"id": "13-3-3", "name": "真理融贯论", "category": 3, "symbolSize": 26, "desc": "命题的真在于与命题系统其他成员融贯", "children": [{"id": "13-3-3-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "融贯者为真，不融贯者为假", "detail": "(1)一个命题的真不在于它与实在、事实的符合或对应，而在于它与它所从属的命题系统中其他成员是否融贯。(2)融贯者为真，不融贯者为假。真理在于一组信念的各个元素之间的一种融贯关系。(3)一个命题是真的，当且仅当，它是一个融贯的命题集合中的元素。"}, {"id": "13-3-3-2", "name": "论证依据", "category": 4, "symbolSize": 22, "desc": "基于矛盾律和\"系统\"概念", "detail": "(1)理论基础是矛盾律和\"系统\"概念。(2)融贯性在于系统内各命题之间的相容性、关联性和系统本身的丰富性。(3)相容性：一组命题互不冲突和排斥，可以同时成立。(4)关联性：强关联指任一命题衍推其他命题且被衍推；弱关联指任一命题可被系统内其他命题逻辑地推出。(5)丰富性：是否把一定范围内的真命题都包括进来，使系统足够大和足够丰富。"}, {"id": "13-3-3-3", "name": "经典诘难", "category": 4, "symbolSize": 22, "desc": "融贯非充分条件，多系统不相容，无穷倒退", "detail": "(1)自身融贯只是必要条件而非充分条件，神话、谎话、宗教理论也可能自身融贯，但它们不是真理而是谬误。(2)可能存在两个甚至多个互不相容且自身融贯的命题系统，根据融贯论它们都是真的，但合成更大系统则不再融贯，融贯论陷入自相矛盾。(3)融贯性陷入无穷倒退：系统本身的真理性取决于在更大系统内与其他系统的融贯，无穷递推。(4)融贯论以内部真理性取代外部真理性，存在严重的理论困难。"}, {"id": "13-3-3-4", "name": "代表人物", "category": 4, "symbolSize": 22, "desc": "莱布尼茨、黑格尔、布拉德雷、纽拉特等", "detail": "(1)17世纪唯理论传统：莱布尼茨、笛卡尔、斯宾诺莎。(2)19世纪：黑格尔、布拉德雷。(3)20世纪逻辑经验论者：纽拉特、亨普尔。(4)晚近：雷谢尔（Rescher）。"}, {"id": "13-3-3-5", "name": "合理因素", "category": 4, "symbolSize": 22, "desc": "融贯是必要条件，强调真理的总体性", "detail": "(1)自身融贯尽管不是真理的充分条件，但却是必要条件。如果能证明某个命题与其他已知为真的命题系统相容，那么它为真至少是可能的；如果能进一步证明它是其他已知为真的命题的逻辑推论
