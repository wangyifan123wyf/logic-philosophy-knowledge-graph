  h += '<span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + escH(node.name) + '</span>';
  h += '</div>';

  if (hk && (ex || depth < 1)) {
    kids.forEach(function(cid) {
      var cn = nodeMap[cid];
      if (cn) h += buildOutlineNode(cn, depth + 1);
    });
  }
  return h;
}

function updateOutlineSelection() {
  var ol = document.getElementById('tree-outline');
  if (ol.classList.contains('on')) {
    buildOutline();
  }
}

// ==================== SEARCH ====================
var searchEl = document.getElementById('search');
var searchResultsEl = document.getElementById('search-results');
var searchClearEl = document.getElementById('search-clear');
var searchActiveIdx = -1;
var searchMatches = [];

searchEl.addEventListener('input', function() {
  var q = searchEl.value.trim().toLowerCase();
  searchClearEl.classList.toggle('show', q.length > 0);
  if (q.length < 1) {
    searchResultsEl.classList.remove('show');
    searchMatches = [];
    searchActiveIdx = -1;
    return;
  }
  // Search in nodeList
  searchMatches = nodeList.filter(function(n) {
    return n.name.toLowerCase().indexOf(q) >= 0 || (n.desc && n.desc.toLowerCase().indexOf(q) >= 0);
  }).slice(0, 20);
  searchActiveIdx = -1;
  renderSearchResults();
});

searchEl.addEventListener('keydown', function(e) {
  if (e.key === 'ArrowDown') {
    e.preventDefault();
    searchActiveIdx = Math.min(searchActiveIdx + 1, searchMatches.length - 1);
    renderSearchResults();
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    searchActiveIdx = Math.max(searchActiveIdx - 1, -1);
    renderSearchResults();
  } else if (e.key === 'Enter') {
    e.preventDefault();
    if (searchActiveIdx >= 0 && searchActiveIdx < searchMatches.length) {
      selectSearchResult(searchMatches[searchActiveIdx]);
    } else if (searchMatches.length > 0) {
      selectSearchResult(searchMatches[0]);
    }
  } else if (e.key === 'Escape') {
    clearSearch();
  }
});

searchEl.addEventListener('focus', function() {
  if (searchEl.value.trim().length > 0) {
    searchEl.dispatchEvent(new Event('input'));
  }
});

function renderSearchResults() {
  if (searchMatches.length === 0 && searchEl.value.trim().length > 0) {
    searchResultsEl.innerHTML = '<div class="sr-empty">未找到匹配节点</div>';
    searchResultsEl.classList.add('show');
    return;
  }
  if (searchMatches.length === 0) {
    searchResultsEl.classList.remove('show');
    return;
  }
  searchResultsEl.innerHTML = searchMatches.map(function(n, i) {
    var d = n.depth || 0;
    var isApp = n.isApp || false;
    var color = getColor(d, isApp);
    var pathNames = getPathToRoot(n.id).map(function(pid) {
      return nodeMap[pid] ? nodeMap[pid].name : pid;
    }).slice(0, -1).join(' › ');
    return '<div class="sr-item' + (i === searchActiveIdx ? ' active' : '') + '" onclick="selectSearchResultById(\'' + n.id + '\')">' +
      '<span class="sr-dot" style="background:' + color + '"></span>' +
      escH(n.name) +
      '<span class="sr-path">' + escH(pathNames) + '</span>' +
      '</div>';
  }).join('');
  searchResultsEl.classList.add('show');
}

function selectSearchResult(n) {
  selectSearchResultById(n.id);
}

function selectSearchResultById(id) {
  searchResultsEl.classList.remove('show');
  searchEl.value = '';
  searchClearEl.classList.remove('show');
  searchMatches = [];
  searchActiveIdx = -1;
  navigateTo(id);
}

window.clearSearch = function() {
  searchEl.value = '';
  searchResultsEl.classList.remove('show');
  searchClearEl.classList.remove('show');
  searchMatches = [];
  searchActiveIdx = -1;
};

// Close search results when clicking outside
document.addEventListener('click', function(e) {
  if (!searchResultsEl.contains(e.target) && e.target !== searchEl) {
    searchResultsEl.classList.remove('show');
  }
  if (!document.getElementById('fav-dropdown').contains(e.target) && e.target !== document.getElementById('btn-fav')) {
    document.getElementById('fav-dropdown').classList.remove('show');
  }
});

// ==================== BREADCRUMB ====================
function updateBreadcrumb() {
  var bc = document.getElementById('breadcrumb');
  if (!selectedNodeId) {
    bc.classList.remove('show');
    return;
  }
  var path = getPathToRoot(selectedNodeId);
  if (path.length <= 1) {
    bc.classList.remove('show');
    return;
  }
  bc.innerHTML = path.map(function(pid, i) {
    var pn = nodeMap[pid];
    var pname = pn ? pn.name : pid;
    if (i === path.length - 1) {
      return '<span class="bc-item bc-current">' + escH(pname) + '</span>';
    }
    return '<span class="bc-item" onclick="navigateTo(\'' + pid + '\')">' + escH(pname) + '</span><span class="bc-sep">›</span>';
  }).join('');
  bc.classList.add('show');
}

// ==================== KEYBOARD ====================
document.addEventListener('keydown', function(e) {
  // Don't handle if typing in search
  if (document.activeElement === searchEl) return;

  if (e.key === 'Escape') {
    closePanel();
    document.getElementById('fav-dropdown').classList.remove('show');
  }
  if (e.key === 'r' || e.key === 'R') {
    if (!e.ctrlKey && !e.metaKey) resetAll();
  }
  if (e.key === 'f' || e.key === 'F') {
    if (!e.ctrlKey && !e.metaKey && selectedNodeId) {
      toggleFavorite();
    }
  }
  if (e.key === 'ArrowLeft' && selectedNodeId && parentMap[selectedNodeId]) {
    e.preventDefault();
    navigateTo(parentMap[selectedNodeId]);
  }
  if (e.key === 'ArrowRight' && selectedNodeId) {
    e.preventDefault();
    var kids = childrenMap[selectedNodeId] || [];
    if (kids.length > 0) navigateTo(kids[0]);
  }
  // Ctrl+Z / Ctrl+Y for history
  if ((e.key === 'z' || e.key === 'Z') && e.ctrlKey && !e.shiftKey) {
    e.preventDefault();
    navBack();
  }
  if ((e.key === 'y' || e.key === 'Y') && e.ctrlKey || (e.key === 'z' || e.key === 'Z') && e.ctrlKey && e.shiftKey) {
    e.preventDefault();
    navForward();
  }
  // Ctrl+F focus search
  if ((e.key === 'f' || e.key === 'F') && e.ctrlKey) {
    e.preventDefault();
    searchEl.focus();
  }
});

function navBack() {
  if (navIndex > 0) {
    navIndex--;
    var id = navHistory[navIndex];
    selectedNodeId = id;
    // Ensure visible
    var ancestors = getAncestors(id);
    var needRebuild = false;
    ancestors.forEach(function(aid) {
      if (!expandedSet[aid]) { expandedSet[aid] = true; needRebuild = true; }
    });
    if (needRebuild) { refreshVisibility(); }
    showPanel(id);
  }
}

function navForward() {
  if (navIndex < navHistory.length - 1) {
    navIndex++;
    var id = navHistory[navIndex];
    selectedNodeId = id;
    var ancestors = getAncestors(id);
    var needRebuild = false;
    ancestors.forEach(function(aid) {
      if (!expandedSet[aid]) { expandedSet[aid] = true; needRebuild = true; }
    });
    if (needRebuild) { refreshVisibility(); }
    showPanel(id);
  }
}

// ==================== RESET ====================
function resetAll() {
  expandedSet = {};
  selectedNodeId = null;
  navHistory = [];
  navIndex = -1;
  refreshVisibility();
  renderChart();
  closePanel();
  document.getElementById('breadcrumb').classList.remove('show');
  showToast('视图已重置');
}
window.resetAll = resetAll;

// ==================== TOAST ====================
var toastTimer = null;
function showToast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.style.display = 'block';
  t.style.background = 'rgba(30, 180, 100, 0.92)';
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(function() { t.style.display = 'none'; }, 2000);
}

// ==================== POSITION MONITOR ====================
var lastCheck = 0;
function monitor() {
  if (!chart || curNodes.length === 0) {
    requestAnimationFrame(monitor);
    return;
  }
  var now = Date.now();
  if (now - lastRenderTime < 2500) {
    requestAnimationFrame(monitor);
    return;
  }
  if (now - lastCheck < 80) {
    requestAnimationFrame(monitor);
    return;
  }
  lastCheck = now;

  var updates = [];
  curNodes.forEach(function(n) {
    if (!visibleSet[n.id]) return;
    if (n.id === dragId) return;
    var pos = idealPos[n.id];
    if (!pos) return;
    var dx = n.x - pos.x, dy = n.y - pos.y;
    var dist = Math.sqrt(dx * dx + dy * dy);
    if (dist < 1) return;

    var factor;
    if (n._d <= 1) factor = 0.5;
    else if (n._d === 2) factor = 0.12;
    else if (n._d === 3) factor = 0.08;
    else factor = 0.04;

    n.x = n.x - dx * factor;
    n.y = n.y - dy * factor;
    if (dist < 2) { n.x = pos.x; n.y = pos.y; }
    updates.push({ id: n.id, x: n.x, y: n.y });
  });

  if (updates.length > 0) {
    chart.setOption({ series: [{ data: updates }] }, { silent: true });
  }
  requestAnimationFrame(monitor);
}

// ==================== PARTICLE BACKGROUND ====================
var particleCanvas, pCtx, particles = [];
function initParticles() {
  particleCanvas = document.getElementById('particles');
  if (!particleCanvas) return;
  particleCanvas.width = window.innerWidth;
  particleCanvas.height = window.innerHeight;
  pCtx = particleCanvas.getContext('2d');

  var count = Math.floor((window.innerWidth * window.innerHeight) / 8000);
  particles = [];
  for (var i = 0; i < count; i++) {
    particles.push({
      x: Math.random() * window.innerWidth,
      y: Math.random() * window.innerHeight,
      r: Math.random() * 0.8 + 0.2,
      vx: (Math.random() - 0.5) * 0.15,
      vy: (Math.random() - 0.5) * 0.15,
      opacity: Math.random() * 0.4 + 0.1
    });
  }
}

function animateParticles() {
  if (!particleCanvas || !pCtx) return;
  pCtx.clearRect(0, 0, particleCanvas.width, particleCanvas.height);

  particles.forEach(function(p) {
    p.x += p.vx;
    p.y += p.vy;

    if (p.x < 0) p.x = particleCanvas.width;
    if (p.x > particleCanvas.width) p.x = 0;
    if (p.y < 0) p.y = particleCanvas.height;
    if (p.y > particleCanvas.height) p.y = 0;

    pCtx.beginPath();
    pCtx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    pCtx.fillStyle = 'rgba(120, 160, 220, ' + p.opacity + ')';
    pCtx.fill();
  });

  // Draw subtle connections between nearby particles
  for (var i = 0; i < particles.length; i++) {
    for (var j = i + 1; j < particles.length; j++) {
      var dx = particles[i].x - particles[j].x;
      var dy = particles[i].y - particles[j].y;
      var dist = Math.sqrt(dx * dx + dy * dy);
      if (dist < 80) {
        pCtx.beginPath();
        pCtx.moveTo(particles[i].x, particles[i].y);
        pCtx.lineTo(particles[j].x, particles[j].y);
        pCtx.strokeStyle = 'rgba(100, 140, 200, ' + (0.04 * (1 - dist / 80)) + ')';
        pCtx.lineWidth = 0.4;
        pCtx.stroke();
      }
    }
  }

  requestAnimationFrame(animateParticles);
}

// ==================== STARTUP ====================
initParticles();
animateParticles();
initChart();
requestAnimationFrame(monitor);
