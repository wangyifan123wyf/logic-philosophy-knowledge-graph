，那么它就必定为真。(2)融贯论在隐含的形式中强调真理的总体性和全面性——这是一个正确而深刻的洞见。实在是一个处于普遍联系和相互制约中的整体，关于这个整体的真理性认识也必定以知识系统的形式出现。"}]}]}]}, {"id": "a02", "name": "附录二 \"逻辑的可修正性\"再思考", "desc": "附录 · 共7个小节", "isAppendix": true, "children": [{"id": "14-1", "name": "一、小引：一个严肃和困难的话题", "category": 2, "symbolSize": 32, "desc": "引出两类人必须考虑逻辑数学的认识论地位及蒯因的逻辑可修正论", "children": [{"id": "14-1-1", "name": "蒯因的逻辑可修正论", "category": 3, "symbolSize": 26, "desc": "知识总体被经验不充分决定，任何知识包括逻辑数学均可修正", "children": [{"id": "14-1-1-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "知识整体论下逻辑数学处于核心但仍可被经验反例修正", "detail": "(1)我们的知识总体被观察和经验所不充分决定 (2)该总体内的每一个部分（包括逻辑和数学）都与感觉经验内容相关联，只是有远近多少的差别 (3)在顽强不屈的经验反例面前，该总体内的任何知识都是可以修正的，逻辑和数学知识也不例外 (4)由于逻辑和数学处于该总体的核心部分，根据最小代价最大收益原则，让逻辑和数学不受伤害始终是一个合理的策略"}, {"id": "14-1-1-2", "name": "代表人物", "category": 4, "symbolSize": 22, "desc": "蒯因于20世纪50年代明确提出该论题", "detail": "(1)蒯因：先是一位有哲学关怀的逻辑学家，后来转型成为有逻辑学背景的哲学家，在20世纪50年代明确提出了“逻辑的可修正性”论题"}]}, {"id": "14-1-2", "name": "作者的四点创新", "category": 3, "symbolSize": 26, "desc": "作者在蒯因和哈克研究基础上的四项理论创新与突破", "children": [{"id": "14-1-2-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "系统揭示逻辑真理相对性等四项创新", "detail": "(1)系统地揭示了逻辑真理的相对性，它们的真、必然性等是建立在许多假设、原则和语义解释之上的，一旦更改其中的某些假设、原则和语义解释，逻辑真理就不再是分析的、必然的 (2)证明逻辑系统的可靠性和完全性只是证成一个逻辑系统的必要条件，而不是充分条件；除了元逻辑证成外，还需要有认识论证成 (3)对逻辑常项的提炼和解释，以及在此基础上对公理和推理规则的选择，是造成逻辑本身可修正的根本原因 (4)证明思维四律（同一律、矛盾律、排中律和充足理由律）是用元语言表述的元公理或元规则，它们是构造或检验一个逻辑演算系统的根本指导原则，不能表述为重言式"}]}]}, {"id": "14-2", "name": "二、概念澄清：“逻辑”和“可修正性”", "category": 2, "symbolSize": 32, "desc": "澄清“逻辑”和“可修正性”两个关键概念的多重含义", "children": [{"id": "14-2-1", "name": "作为研究对象的逻辑与作为理论形态的逻辑", "category": 3, "symbolSize": 26, "desc": "可修正的只能是逻辑学家构造的理论形态逻辑", "children": [{"id": "14-2-1-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "区分客观逻辑与理论逻辑，后者才可修正", "detail": "(1)作为研究对象的“逻辑”是我们在实际使用着的逻辑，是一种客观形态的东西，存在于人类的语言实践和思维实践中 (2)作为理论形态的逻辑，即逻辑学家所构造的各种逻辑学说或逻辑系统，是对客观逻辑的描写、刻画或重构，是一种“发现”而不是“发明”，有描述性成分，就有真假对错之分 (3)可以修正的只能是逻辑学家所构造出来的、作为理论形态的“逻辑”，即获得公认的逻辑学说和逻辑系统"}]}, {"id": "14-2-2", "name": "狭义的逻辑和广义的逻辑", "category": 3, "symbolSize": 26, "desc": "狭义仅指一阶逻辑，广义指经典加变异加扩充逻辑", "children": [{"id": "14-2-2-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "讨论可修正性时严格指经典逻辑", "detail": "(1)狭义的逻辑仅指一阶逻辑，即由命题演算和狭义谓词演算所合成的统一的逻辑系统，具有可靠性和完全性 (2)广义的逻辑则是指“经典逻辑＋变异逻辑＋扩充逻辑” (3)当我们讨论“逻辑的可修正性”时，严格地指经典逻辑，因为它是获得最大共识的“逻辑”"}]}, {"id": "14-2-3", "name": "修正的三种含义", "category": 3, "symbolSize": 26, "desc": "改正为不足道修正，扩充为足道修正，替换为实质性修正", "children": [{"id": "14-2-3-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "三种修正：改正、扩充、替换，重要程度递增", "detail": "(1)改正（correction）：因疏忽、懈怠、能力不足或认知局限出现失误，如公理或推理规则选择有问题，这是不足道的修正，司空见惯 (2)扩充（extension）：在一阶逻辑基础上添加新的逻辑常项、公理、推理规则，得到模态逻辑等扩充逻辑，这是足道的修正，冲撞扩展了原有知识边界 (3)替换（replacement）：认为一阶逻辑的某些基本假设、原则或前提不正确，应予以修正，构造出相干逻辑、直觉主义逻辑、次协调逻辑等与经典逻辑构成竞争替代关系的系统，这是实质性修正"}]}]}, {"id": "14-3", "name": "三、经典逻辑不能完全证成自身", "category": 2, "symbolSize": 32, "desc": "从基本原则、保真性、逻辑常项三方面论证经典逻辑不能完全证成自身", "children": [{"id": "14-3-1", "name": "经典逻辑的基本原则与假定", "category": 3, "symbolSize": 26, "desc": "外延原则、二值原则、存在假定、由假得全原则、实无穷抽象法", "children": [{"id": "14-3-1-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "经典逻辑建立在五项可受挑战的基本原则或假定之上", "detail": "(1)外延原则：处理语词、语句时只考虑它们的外延，语词的外延是它所指称的对象，语句的外延是它所具有的真值 (2)二值原则：任一命题或者为真或者为假，没有任何命题不具有真假值，也没有任何命题具有除真假之外的其他值 (3)存在假定：个体域非空，量词毫无例外地具有存在含义，并且单称词项总是指称个体域中的某个个体 (4)由假得全原则：经典逻辑的定理A∧¬A→B，意思是从逻辑矛盾推出任一命题，亦称“扩展律”或“爆炸律” (5)采用实无穷抽象法：把无穷当作一个已经完成的整体，而不只是一个潜在的无穷延伸的过程"}]}, {"id": "14-3-2", "name": "变异逻辑对经典原则的挑战", "category": 3, "symbolSize": 26, "desc": "变异逻辑基于合理理由否定或修改矛盾律和排中律", "children": [{"id": "14-3-2-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "某些原则和假定已被变异逻辑基于合理理由修改", "detail": "(1)相干逻辑、直觉主义逻辑、次协调逻辑等变异逻辑已对经典逻辑的某些原则和假定予以否定或修改 (2)其修改常常是基于某些好的至少是合理的理由之上，有相当充分的根据 (3)“思维中不能允许自相矛盾”虽几乎是逻辑学的绝对命令，但其效力是否强大到任何逻辑矛盾都会导致理论自毁，值得怀疑"}, {"id": "14-3-2-2", "name": "经典诘难", "category": 4, "symbolSize": 22, "desc": "三方面的实例质疑矛盾律的绝对效力", "detail": "(1)科学史上常见的事实是：在一个发展得很好的理论中发现了逻辑矛盾，且一时找不到消除办法，科学家通常不会抛弃该理论，而是维持对它的信任，让该理论继续发展 (2)在复杂的法律体系中，有些法律条文相互冲突，这应该算作正常的情形而不是例外，但这种情形通常不会导致该法律体系的废止 (3)要求数据库中来源复杂的数据相互之间没有任何矛盾和冲突，恐怕是不现实的奢求，最好的办法就是把那些矛盾禁锢起来，不让其兴风作浪，让该系统继续发展和运作"}, {"id": "14-3-2-3", "name": "代表人物", "category": 4, "symbolSize": 22, "desc": "次协调逻辑学家主张禁锢而非消除矛盾", "detail": "(1)次协调逻辑学家：当在一个系统中发现矛盾且一时又找不到消除矛盾的办法时，最好的办法就是把那些矛盾禁锢起来，不让其兴风作浪，让该系统继续发展和运作，直到某一天能够消除矛盾为止"}]}, {"id": "14-3-3", "name": "二值原则和排中律的认知根源", "category": 3, "symbolSize": 26, "desc": "二值原则和排中律是人类不得已而采取的一种认知策略", "children": [{"id": "14-3-3-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "二值原则和排中律可在特殊情景下作出修改和限制", "detail": "(1)在具体的认知实践中，我们只能对无穷多的认知对象作出粗略的A或非A的划分 (2)在遇到模糊词项（如“秃头”“谷堆”）、未来偶然命题（如“明天将要发生海战”）、悖论或需要更大精确性时，可以对二值原则和排中律作出修改和限制 (3)这必然导致对经典逻辑本身的修改，因为它严格地以二值原则和排中律为基础"}, {"id": "14-3-3-2", "name": "论证依据", "category": 4, "symbolSize": 22, "desc": "世界的无限性与认知的有限性迫使采用二值策略", "detail": "(1)世界在时空上是无限的 (2)我们在具体时空背景下的认知能力却是十分有限的 (3)于是我们忽略那些与我们目前的认知没有关系或关系不大的对象（非A），而集中关注那些与我们目前的认知密切相关的对象（A）"}]}, {"id": "14-3-4", "name": "经典逻辑保真性的相对性", "category": 3, "symbolSize": 26, "desc": "保真性只能相对于一阶模型被证明，不具有绝对意义", "children": [{"id": "14-3-4-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "经典逻辑的保真性证明是相对于一阶模型的，具有相对性", "detail": "(1)保真性是指从真实的前提出发，运用经典逻辑的推理工具，只能推出真实的结论 (2)必须在一阶模型〈U, ρ〉中证明经典逻辑的保真性（可靠性） (3)“一阶”模型等于给该类模型施加了某些特殊的限制条件，假如更换模型，原来的结果是否仍然成立，必须重新予以证明"}, {"id": "14-3-4-2", "name": "论证依据", "category": 4, "symbolSize": 22, "desc": "MP保真性证明自身使用MP导致循环，哥德尔第二不完全性定理", "detail": "(1)变形规则MP保真性的证明本身也使用了MP规则，这或者是循环论证，或者是在元语言层次上的无穷倒退 (2)哥德尔第二不完全性定理表明，没有任何充分的数学理论能够证明它自己的相容性 (3)在标准的数学理论中，我们不能定义一般的真概念，而只能定义相对于某个或某类模型的真概念，模型中的真概念与一般的真概念是很不相同的"}, {"id": "14-3-4-3", "name": "代表人物", "category": 4, "symbolSize": 22, "desc": "哈特里·菲尔德于2008年牛津大学洛克讲演中论证", "detail": "(1)哈特里·菲尔德（Hartry Field）：于2008年在英国牛津大学做洛克讲演，论证经典推理保留在古典模型中的真，但古典模型错误地表征了实在 (2)菲尔德指出，在任何有意义的真理论中，或者不可能证明所有的公理都是真的，或者不可能证明所有的推理规则保真"}]}, {"id": "14-3-5", "name": "逻辑常项选择的不完全证成", "category": 3, "symbolSize": 26, "desc": "逻辑常项的选择决定什么是逻辑，学界未能给出充分证成", "children": [{"id": "14-3-5-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "逻辑常项的选择标准均可商议，缺乏客观根据", "detail": "(1)经典逻辑只承认狭义的逻辑常项（命题联结词、量词、等词），不接受广义的逻辑常项（高阶量词、属于关系、必然可能等概念） (2)狭义和广义逻辑常项的划分决定了什么是逻辑形式、逻辑真理、逻辑后承、逻辑系统乃至逻辑本身 (3)选择的理由和标准（语法标准、题材中立性、置换不变等）在仔细追问之下都有可商议之处，没有获得普遍认可"}, {"id": "14-3-5-2", "name": "论证依据", "category": 4, "symbolSize": 22, "desc": "诸概念相互关联自我循环，只能接受规则循环证成", "detail": "(1)什么是逻辑常项、什么是逻辑形式、什么是逻辑后承、什么是逻辑真理、什么是逻辑系统、什么是逻辑，都只不过是同一个问题的不同提法，它们相互关联，你中有我我中有你 (2)诉诸其中的某一个概念去解释其他的概念，都带有某种自我循环的性质 (3)博格西安认为，我们只能接受某种形式的规则循环的证成，无法得到完全非循环的证成"}, {"id": "14-3-5-3", "name": "代表人物", "category": 4, "symbolSize": 22, "desc": "塔斯基、博格西安、MacFarlane", "detail": "(1)塔斯基：明确指出找不到什么客观根据能允许我们在两组语言项之间划出严格界限 (2)博格西安：详细考察了“演绎能够被证成吗”的各种回答，认为我们只能接受规则循环的证成 (3)MacFarlane：撰写“Logical Constants”词条，系统讨论逻辑常项的选择标准"}]}]}, {"id": "14-4", "name": "四、逻辑抽象的三层模型", "category": 2, "symbolSize": 32, "desc": "提出逻辑抽象的三层模型：思维方式、认知实践抽象化、逻辑多元论", "children": [{"id": "14-4-1", "name": "第一层：逻辑根植于思维方式", "category": 3, "symbolSize": 26, "desc": "逻辑深深植根于思维方式，与外部世界有间接而遥远的关联", "children": [{"id": "14-4-1-1", "name": "亚里士多德的十范畴", "category": 4, "symbolSize": 22, "desc": "十范畴：实体、性质、数量、关系、时间、地点、姿态、状况、活动、遭受", "detail": "(1)实体范畴是其他范畴的中心，是存在的中心，所有其他九个范畴都是围绕实体范畴而旋转的 (2)属性范畴在一个命题中只能做谓词，不能做主词；实体范畴只能做主词，不能做谓词 (3)逻辑后果是对命题做主谓式分析，在此基础上发展出关于直言命题、直接推理、直言三段论的学说，即最早的系统化逻辑理论—词项逻辑 (4)这套逻辑理论勾勒的世界图景：世界由一些个体（第一实体）及个体的类别（第二实体）所组成，这些实体具有一定的属性"}, {"id": "14-4-1-2", "name": "康德的范畴表和判断表", "category": 4, "symbolSize": 22, "desc": "四组十二范畴配合四组十二判断，提供更复杂的世界图景", "detail": "(1)范畴表含四组十二范畴：量（统一性、多样性、总体性）、质（实在、否定、限制）、关系（实体和偶性、原因和结果、交互作用）、模态（可能性、实然性、必然性） (2)判断表也相应地包括四组十二种判断 (3)康德提供了远比亚里士多德更为丰富的内容，提供了更为复杂的世界图景：世界仍然由对象和对象的类别组成，且相互处于复杂的关联之中，最重要的关联是因果关联 (4)在逻辑上，康德仍没有摆脱命题的主谓式分析的窠臼，但增加了基于因果关联的命题之间的条件联系"}, {"id": "14-4-1-3", "name": "弗雷格的主目-函数分析", "category": 4, "symbolSize": 22, "desc": "用主目-函数分析取代主谓式分析，建立量化的谓词逻辑", "detail": "(1)函数的特点是：有空位（自变元、主目），不饱和，需要填充；填充之后经过适当的函数运算可以得到一个值（应变元） (2)弗雷格对函数概念进行了扩展，提出“概念是其值为真值的函数”这个重要命题 (3)这种命题形式是逻辑构造赖以出发的最基本的命题结构，在它们的基础上添加命题联结词和量词，就能建立功能强大的量化的谓词逻辑 (4)这套逻辑提供的世界图景：世界仍由个体和个体的类别所组成，不仅具有一定的性质，而且还处于一定的关系之中，这个世界因此成为一个相互关联的整体"}]}, {"id": "14-4-2", "name": "第二层：逻辑是对认知实践的抽象化和理想化", "category": 3, "symbolSize": 26, "desc": "逻辑学家研究如何用形式手段确保从真前提得到真结论", "children": [{"id": "14-4-2-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "逻辑是对认知实践的抽象化和理想化的结果", "detail": "(1)逻辑学家在进行逻辑研究时预先有一定目的，例如把日常思维中用自然语言表述的某种类型或某个范围内的推理形式化 (2)逻辑学家并不研究推理者的心理发生过程及相关细节，而是着重研究：假如我们从真的前提出发，用什么样的形式手段与规则能够确保得到真的结论 (3)由于日常语言中的非形式论证以及系统外的有效性概念并不足够清晰，不同的逻辑学家对它们就会有不同的理解和诠释，并构造出互有差异甚至不相容的逻辑系统"}, {"id": "14-4-2-2", "name": "代表人物", "category": 4, "symbolSize": 22, "desc": "苏珊·哈克论述形式系统与非形式论证的关系", "detail": "(1)苏珊·哈克：指出“形式逻辑系统力图把非形式论证形式化，力图用精确、严格、可一般化的术语来表述它们”，并提出了可接受的形式逻辑系统的标准：仅当非形式论证在系统外的意义上是有效的，形式论证在系统内才应该是有效的"}]}, {"id": "14-4-3", "name": "第三层：逻辑系统是多元的", "category": 3, "symbolSize": 26, "desc": "非形式论证经多种形式化路径产生多个逻辑系统并存的局面", "children": [{"id": "14-4-3-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "逻辑多元论：多个不同甚至不相容的逻辑系统可以并存", "detail": "(1)非形式论证基于系统外的有效性（直观有效性），形式论证依据系统内的有效性 (2)不同的逻辑学家对非形式论证和系统外的有效性概念有不同的理解和诠释，由此造成多个不同的逻辑或逻辑系统并存的局面 (3)这种观点被称为“逻辑多元论”"}]}, {"id": "14-4-4", "name": "麦迪的自然主义逻辑观", "category": 3, "symbolSize": 26, "desc": "逻辑植根于人类认知结构，逻辑真理偶然，非先天非分析", "children": [{"id": "14-4-4-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "麦迪的三个论题：认知结构决定基本逻辑、世界相应特征、信念来源", "detail": "(1)人类是如此构成的，他们使用康德—弗雷格的形式和范畴去把这个世界概念化，因此他们的思维受制于一个基本的逻辑 (2)在很大程度上，这个世界具有与那些形式和范畴相对应的普遍的结构特征，但也存在例外的情形，在那里甚至那个基本逻辑也失去了它的基础 (3)人类相信逻辑的那些基本部分，是因为它们是由他们的基本概念机制所指定的 (4)逻辑真理是偶然的，逻辑不是先天的，逻辑真理与基本的物理真理的差别仅仅是程度问题而不是类型的不同"}, {"id": "14-4-4-2", "name": "代表人物", "category": 4, "symbolSize": 22, "desc": "皮奈诺普·麦迪：美国加州大学尔湾分校杰出教授", "detail": "(1)皮奈诺普·麦迪（Penelope Maddy）：美国加州大学尔湾分校杰出教授、美国文理科学院院士、符号逻辑协会会长，于2001年在美国哲学会发表专题讲演《对逻辑的自然主义审察》，系统阐述其自然主义逻辑观"}]}]}, {"id": "14-5", "name": "五、逻辑系统的构造程序和评价标准", "category": 2, "symbolSize": 32, "desc": "逻辑研究方法论与其他科学无本质区别，主要采用假说-演绎程序", "children": [{"id": "14-5-1", "name": "假说-演绎程序", "category": 3, "symbolSize": 26, "desc": "从发现问题到价值证成的六阶段假说-演绎构造程序", "children": [{"id": "14-5-1-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "逻辑研究的方法论与其他科学的方法论没有本质性区别", "detail": "(1)发现问题，确立研究目标：如莱布尼茨要发明普遍语言和理性演算，弗雷格要把数学化归于逻辑，当代计算机科学和人工智能对逻辑学提出新要求 (2)进行预备性的“经验”考察：澄清有关概念与命题，消除歧义与不精确之处，弄清楚它们之间实际发生的逻辑关系 (3)构造形式系统：设计形式语言，配备演绎装置，推出所需的全部定理 (4)对形式系统的元逻辑证成：合格系统应具有可靠性、相容性、完全性、独立性、可判定性、范畴性等元逻辑特性，其中可靠性是最重要的特性 (5)对形式系统的认识论证成：看该系统是否与人们日常的认知实践相吻合，有没有严重抵触甚至违背日常语言直观和常识的情形 (6)对形式系统的价值性或实用性证成：看其是否有足够的理论价值和实践价值，是否有助于解决没有它就不能解决或解决得不够好的问题"}]}]}, {"id": "14-6", "name": "六、逻辑的可修正性为什么难以被认同？", "category": 2, "symbolSize": 32, "desc": "分析逻辑可修正性难以被认同的三个认知障碍及作者回应", "children": [{"id": "14-6-1", "name": "三个认知障碍", "category": 3, "symbolSize": 26, "desc": "三大认知障碍导致逻辑可修正性难以被认同", "children": [{"id": "14-6-1-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "三个误认导致对逻辑可修正性的抵制", "detail": "(1)逻辑与外部世界和人类经验有很遥远的关联，以至使人们误以为完全没有关联 (2)逻辑在人类知识体系中处于中心地位，修改逻辑将付出巨大代价，由此使人们觉得逻辑不能被修改，但这个过渡是不合法的 (3)修改逻辑时也要使用逻辑，以至使人们认为逻辑的可修正性是一个自我挫败的论题"}]}, {"id": "14-6-2", "name": "作者的回应", "category": 3, "symbolSize": 26, "desc": "对三个认知障碍的逐一反驳与澄清", "children": [{"id": "14-6-2-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "逻辑与世界关联、科学革命先例、修正的局部性", "detail": "(1)不是我们把某种认知结构加给了这个世界，而是这个世界传授给我们这种认知结构；这种认知结构对于单个认知主体是某种先天东西，但对于整个人类主体是在与这个世界打交道的过程中获得的，因而有实在论和经验论的起源 (2)人类知识体系剧烈变动的事情已经发生过而且还将继续发生，即所谓“科学革命”：从地心说到日心说，从神创论到进化论，从绝对时空观到相对时空观，每一次变动都是剧烈的，它们确实发生了，同样的事情在原则上对于逻辑也可能发生 (3)逻辑的可修正性是指局部的、部分的可修正性，我们仍然可以使用那大部分未被修改的逻辑去指导和评价新的修改，并且修正还可以间接的方式进行：例如用T1去修改T2，用T2去修改T3…用Tn去修改T1，逻辑的可修正性论题并不是一个完全自我挫败的论题"}]}]}, {"id": "14-7", "name": "七、结语：逻辑中的可错论和可修正论", "category": 2, "symbolSize": 32, "desc": "逻辑中的可修正论就是可错论，两者没有本质区别", "children": [{"id": "14-7-1", "name": "可错论即修正论", "category": 3, "symbolSize": 26, "desc": "“逻辑是可修正的”与“逻辑真理是可错的”本质上相同", "children": [{"id": "14-7-1-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "逻辑因具有描述性成分而可错，可修正论即等于可错论", "detail": "(1)逻辑之所以是可修正的，就是因为它直接反映、刻画、精释了我们的认知实践，间接描述、刻画了我们所面对的外部世界，反映了我们最深层、最基本的思维方式 (2)逻辑或逻辑真理具有某种描述性成分，而描述就有真假对错之分，因此逻辑真理是可错的（falsifiable） (3)“逻辑是可修正的”与“逻辑（真理）是可错的”这两种说法之间没有本质区别，逻辑中的可修正论就是可错论，可错论就是可修正论"}, {"id": "14-7-1-2", "name": "代表人物", "category": 4, "symbolSize": 22, "desc": "苏珊·哈克、皮奈诺普·麦迪的可错主义与自然主义", "detail": "(1)苏珊·哈克：指出贯穿她全部哲学探索（包括逻辑哲学）始终的就是“可错主义”（fallibilism） (2)皮奈诺普·麦迪：认为逻辑在某些实际的语境中局部失效，在某些想象的世界中整个失效，但在极其广大的领域中极其有用；鼓励不喜欢“逻辑为假”说法的人用适用性的缺失去替换真的缺失"}]}]}]}, {"id": "a03", "name": "附录三 逻辑：一个生长和变动的概念", "desc": "附录 · 共10个小节", "isAppendix": true, "children": [{"id": "15-1", "name": "客观形态的逻辑和理论形态的逻辑", "category": 2, "symbolSize": 32, "desc": "区分客观形态的逻辑与理论形态的逻辑，探讨逻辑可修正性", "children": [{"id": "15-1-1", "name": "客观形态的逻辑", "category": 3, "symbolSize": 26, "desc": "我们实际使用着的逻辑，与规律同义，是理论逻辑的研究对象", "children": [{"id": "15-1-1-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "客观形态的逻辑和理论形态的逻辑\n在谈论有关“逻辑”的话题时，我觉得，在下面两者之", "detail": "(1)客观形态的逻辑和理论形态的逻辑\n在谈论有关“逻辑”的话题时，我觉得，在下面两者之。"}]}, {"id": "15-1-2", "name": "理论形态的逻辑", "category": 3, "symbolSize": 26, "desc": "逻辑学家对客观逻辑探索的结果，表现为逻辑学说或系统", "children": [{"id": "15-1-2-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "理论形态的逻辑是发现而非发明，含有描述性成分", "detail": "(1)理论形态的逻辑是逻辑学家对客观形态逻辑探索的结果，具体表现为各种逻辑学说或系统\n(2)是对客观逻辑的反映、刻画或重构，是“发现”而不是“发明”\n(3)发现含有描述性成分，描述有真假对错之分"}, {"id": "15-1-2-2", "name": "论证依据", "category": 4, "symbolSize": 22, "desc": "受蒯因影响，逻辑是可修正的，逻辑真理是可错的", "detail": "(1)逻辑是可修正的，逻辑真理是可错的\n(2)客观形态的逻辑无法修正，它是存在那里的东西\n(3)可以修正的只能是作为理论形态的逻辑"}]}]}, {"id": "15-2", "name": "弗雷格的反心理主义", "category": 2, "symbolSize": 32, "desc": "弗雷格反心理主义原则的内容、论证及引发的问题", "children": [{"id": "15-2-1", "name": "弗雷格的反心理主义原则", "category": 3, "symbolSize": 26, "desc": "弗雷格为捍卫逻辑客观性而提出的反心理主义原则", "children": [{"id": "15-2-1-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "始终严格区分心理的与逻辑的、主观的与客观的", "detail": "(1)始终要把心理的东西和逻辑的东西、主观的东西和客观的东西严格区别开来\n(2)在外部世界和内心世界之外，设立由思想组成的“第三域”\n(3)逻辑学是研究真的规律的科学，即研究思想及其结构的科学"}, {"id": "15-2-1-2", "name": "论证依据", "category": 4, "symbolSize": 22, "desc": "思想不同于外部事物和观念，是客观的、可分享的", "detail": "(1)思想与外部事物不同：后者是物质的和可感知的，思想是非物质和不可感知的\n(2)思想与观念不同：观念是私人的、只为单个人拥有；思想可为许多人所分享\n(3)思想有真假：真不是思想的属性，也不是符合关系，“真”是不可定义的"}, {"id": "15-2-1-3", "name": "经典诘难", "category": 4, "symbolSize": 22, "desc": "混淆主体间性与客观性，把握思想的方式成问题", "detail": "(1)混淆了“主体间性”与“客观性”：思想不依赖个别人但依赖整个人类，而纯客观的东西不依赖于整个人类\n(2)若思想独立于人类且不可感知，人类究竟如何“把握”思想？\n(3)把“心理的”等同于“主观的”“私人的”做贬义使用，但心理学也是客观的自然科学"}, {"id": "15-2-1-4", "name": "代表人物", "category": 4, "symbolSize": 22, "desc": "弗雷格（Gottlob Frege）", "detail": "(1)弗雷格提出反心理主义原则，将逻辑与心理严格分开\n(2)其代表作包括《思想》等，系统阐述了第三域理论\n(3)其工作为现代逻辑奠定了基础，但反心理主义引出的问题比解决的问题还多"}, {"id": "15-2-1-5", "name": "修正版本", "category": 4, "symbolSize": 22, "desc": "有必要重新审视弗雷格反心理主义的效力和影响", "detail": "(1)需要重新审视反心理主义的效力和影响\n(2)即使对心理现象也可以做客观研究，心理学规律也是客观规律\n(3)作者拟写《逻辑学中的心理主义和反心理主义》但未完成"}]}]}, {"id": "15-3", "name": "逻辑与人类思维", "category": 2, "symbolSize": 32, "desc": "逻辑研究思维的两个面向及逻辑规范的根源问题", "children": [{"id": "15-3-1", "name": "逻辑研究思维的两个方面", "category": 3, "symbolSize": 26, "desc": "事实问题：人实际如何思维；规范问题：人应该如何思维", "children": [{"id": "15-3-1-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "逻辑研究推理有效性，而推理是思维过程，与思维相关", "detail": "(1)事实问题：人类实际上如何思维，包括发生机理、演变机制、具体过程模式等，属于经验心理学\n(2)规范问题：人类应该如何思维，遵循什么模式程序方法准则才能保证思维效率安全和可靠\n(3)逻辑是研究推理形式有效性的科学，推理过程是思维过程，故逻辑与人类思维不可分割"}, {"id": "15-3-1-2", "name": "论证依据", "category": 4, "symbolSize": 22, "desc": "有效论证是正确思维的表达，二者规律一致", "detail": "(1)亨迪卡指出：有效论证可以看成正确思维的一种表达，正确思维可以看成内在性的有效论证\n(2)正确思维的规律和有效论证的规律是一致的\n(3)承认逻辑以推理为对象，就是承认逻辑以思维为对象"}, {"id": "15-3-1-3", "name": "代表人物", "category": 4, "symbolSize": 22, "desc": "亨迪卡（Jaakko Hintikka）", "detail": "(1)亨迪卡论证了正确思维与有效论证之间的对应关系\n(2)其观点被作者引用来支持逻辑与思维关联的立场\n(3)反对将逻辑与人类思维完全割裂的形式主义观点"}]}, {"id": "15-3-2", "name": "逻辑规范的根源问题", "category": 3, "symbolSize": 26, "desc": "逻辑规范从人类实际思维中提取，非外部强加", "children": [{"id": "15-3-2-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "逻辑规范应从人类实际思维中提取，非逻辑学家任意立法", "detail": "(1)自然界有层次结构和规律，通过自然选择训导人类按此思维和行动\n(2)人类的思考习惯逐渐沉淀结晶为思维的模式程序结构方法和准则\n(3)逻辑学家从实际考察中归纳总结提炼重构，形成逻辑理论系统，再传授给大众"}, {"id": "15-3-2-2", "name": "论证依据", "category": 4, "symbolSize": 22, "desc": "不可接受的推理形式首先因实质理由而非形式理由被拒斥", "detail": "(1)不能接受(p→q)∧q→p等推理形式，理由首先不是形式的而是实质的\n(2)日常思维中不可靠的推理形式即使有相应语义理论使其“有效”，仍不能用于日常思维\n(3)逻辑学家不能随心所欲构造系统，偏离人类实际思维的系统无人使用"}]}]}, {"id": "15-4", "name": "向人类的实际思维领域进军", "category": 2, "symbolSize": 32, "desc": "AI推动逻辑研究不确定性推理，当代逻辑的新特点与现状", "children": [{"id": "15-4-1", "name": "计算机科学和人工智能的推动", "category": 3, "symbolSize": 26, "desc": "计算机科学和AI是21世纪逻辑发展的主要动力源泉", "children": [{"id": "15-4-1-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "AI需模拟人的能动性创造性思维，推动研究不确定性推理", "detail": "(1)AI的难点在于模拟人的能动性创造性思维，包括学习抉择尝试修正推理等因素\n(2)逻辑学将不得不全面研究人的思维活动，着重研究不确定性推理\n(3)由此发展出的逻辑理论将具有更强的可应用性"}, {"id": "15-4-1-2", "name": "论证依据", "category": 4, "symbolSize": 22, "desc": "四个重点研究课题涵盖常识推理、归纳判断、知识推理等", "detail": "(1)如何在逻辑中处理常识推理中的弗协调非单调和容错性因素\n(2)如何使机器人具有人的创造性智能，如从经验证据中建立归纳判断\n(3)如何进行知识表示和知识推理，特别是基于已有知识库的推理\n(4)如何结合各种语境因素进行自然语言理解和推理"}]}, {"id": "15-4-2", "name": "当代逻辑研究的新特点", "category": 3, "symbolSize": 26, "desc": "描写性强、技术上复杂、高度不确定，以可应用性为导向", "children": [{"id": "15-4-2-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "当代逻辑突破必然性推理藩篱，具有三个新特点", "detail": "(1)直接明显的描写性，甚至有所谓的“描述逻辑”\n(2)技术上的异常复杂，因为要处理的因素太多\n(3)高度的不确定性，因为不断有新的信息流涌入导致前提和推理关系改变"}, {"id": "15-4-2-2", "name": "论证依据", "category": 4, "symbolSize": 22, "desc": "面临二难困境：简单无用与复杂不可用之间的矛盾", "detail": "(1)主要导向是实际可应用性，形式标准如可靠性和完全性退居次要地位\n(2)若考虑因素太简单，技术上可控但偏离直观常识太远，几乎无用\n(3)若考虑因素太多，技术上太复杂难以应用，且仍达不到确定性，本质上靠猜测"}]}, {"id": "15-4-3", "name": "作者对现状的评估", "category": 3, "symbolSize": 26, "desc": "逻辑学处于相对低潮或变革前夜，主张扎实基础工作", "children": [{"id": "15-4-3-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "逻辑学处于相对低潮或新变革前夜，不宜盲目追逐前沿", "detail": "(1)逻辑学发展整体上处于相对低潮或新的变革前夜\n(2)逻辑学家处于解放思想摸着石头过河的阶段，研究焦点分散\n(3)主张做扎扎实实的基础性学术工作，如编撰教科书、逻辑史研究等"}]}]}, {"id": "15-5", "name": "批判性思维和非形式逻辑", "category": 2, "symbolSize": 32, "desc": "批判性思维的涵义、精神、课程及在中国面临的困境", "children": [{"id": "15-5-1", "name": "批判性思维的四种涵义", "category": 3, "symbolSize": 26, "desc": "批判性思维有四重涵义，不应单纯技艺化", "children": [{"id": "15-5-1-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "批判性思维有四种涵义：运动、人格、课程、技能", "detail": "(1)指起源于美国后来风行欧美的一场教育改革运动\n(2)指一种人格特质和思维习惯\n(3)指一种旨在培养批判性思维习惯和能力的课程设置\n(4)指一套体现批判性思维气质和倾向的思维技能"}, {"id": "15-5-1-2", "name": "论证依据", "category": 4, "symbolSize": 22, "desc": "源于美国社会动荡和教育改革，口号是与日常生活相关", "detail": "(1)源于20世纪六七十年代美国社会动荡，学生要求课程与热点话题相关\n(2)口号：逻辑教学应该“与人们的日常生活相关，与人们的日常思维相关”\n(3)20世纪中叶教育改革运动要求从知识传输转向人格素质和能力培养"}]}, {"id": "15-5-2", "name": "批判性思维的核心精神", "category": 3, "symbolSize": 26, "desc": "服膺理性逻辑，健康怀疑主义，把一切送上理智的法庭", "children": [{"id": "15-5-2-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "批判性思维是精神气质人生态度思维习惯，核心是理性论证", "detail": "(1)批判性思维服膺理性逻辑和真理，是一种讲道理的健康怀疑主义态度\n(2)基本主张：任何观点或思想都可以且应该受到质疑和批判，都应通过理性论证为自身辩护\n(3)核心特征：心灵开放独立自主充满自信，不迷信权威，尊重科学尊重他人，力求客观公正"}]}, {"id": "15-5-3", "name": "批判性思维课程", "category": 3, "symbolSize": 26, "desc": "以论证的识别评价建构为核心，以案例教学为主", "children": [{"id": "15-5-3-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "课程以论证为核心，含谬误理论定义理论，理论上不复杂", "detail": "(1)批判性思维课程应以论证的识别评价和建构为核心\n(2)还包括谬误理论定义理论等内容\n(3)理论上并不复杂，知识含量不高，以案例教学为主"}]}, {"id": "15-5-4", "name": "中国缺乏批判性思维环境", "category": 3, "symbolSize": 26, "desc": "政治课以相信为目的，多数课程以知识传播为主", "children": [{"id": "15-5-4-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "中国目前缺乏批判性思维环境，单靠一门课程难担重任", "detail": "(1)政治课教学以让学生相信为目的，多数课程以知识传播老师讲授为主\n(2)对原有知识的背诵记忆熟悉理解应用占了最大比重\n(3)在此环境下仅由一门批判性思维课程培养人格特质和思维习惯难乎其难"}]}]}, {"id": "15-6", "name": "法律与逻辑：法律逻辑", "category": 2, "symbolSize": 32, "desc": "立法与司法中的逻辑问题，法律逻辑的发展方向", "children": [{"id": "15-6-1", "name": "立法中的逻辑问题", "category": 3, "symbolSize": 26, "desc": "法律概念的清晰性、条文的无歧义性及与宪法的一致性", "children": [{"id": "15-6-1-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "立法涉及法律概念清晰、条文无歧义、与宪法一致性等", "detail": "(1)法律概念的清晰性\n(2)法律条文的无歧义性\n(3)某个法律条文与宪法及其他法律条文的一致性\n(4)对法律或条文的证成：理论根据实践必要性及操作可行性"}]}, {"id": "15-6-2", "name": "司法中的逻辑问题", "category": 3, "symbolSize": 26, "desc": "侦查逻辑、证据认定、证据与法律链接中的逻辑问题", "children": [{"id": "15-6-2-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "司法三环节各有特殊逻辑问题：侦查、证据认定、量刑", "detail": "(1)犯罪证据的寻找与发现即侦查的逻辑，需大量应用归纳推理假说演绎法类比推理等\n(2)证据真伪性的认定即控告与抗辩，利用合理怀疑是抗辩方利器\n(3)犯罪证据与法律条文的链接即量刑，控辩双方如何说服法官或陪审团"}, {"id": "15-6-2-2", "name": "论证依据", "category": 4, "symbolSize": 22, "desc": "基于无罪推定原则，伤害无辜比让罪犯逃逸危害更大", "detail": "(1)秉持无罪推定原则：在证明某人有罪之前假定所有被告无罪\n(2)谁控告谁举证，证据需经法庭认定接受\n(3)人们相信伤害无辜是比让罪犯逃逸危害更大的事情，参看《十二怒汉》"}]}]}, {"id": "15-7", "name": "逻辑理论形态的多样性", "category": 2, "symbolSize": 32, "desc": "逻辑的历史发展、三大源头及一元论与多元论之争", "children": [{"id": "15-7-1", "name": "逻辑的历史发展", "category": 3, "symbolSize": 26, "desc": "从亚里士多德到AI驱动的逻辑，经历多种形态演变", "children": [{"id": "15-7-1-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "逻辑经历几千年发展，形态多样，从亚里士多德到当代", "detail": "(1)亚里士多德创立大一统逻辑体系，三段论为核心\n(2)斯多亚派研究复合命题推理及悖论；中世纪在词项属性推论悖论模态逻辑方面卓有建树\n(3)近代归纳逻辑和经验科学方法论兴起\n(4)莱布尼茨倡导普遍文字和理性演算，布尔构造逻辑代数，弗雷格罗素构造一阶和高阶逻辑\n(5)刘易斯克里普克构造现代模态逻辑语义学；冯·赖特提出广义模态逻辑\n(6)计算机科学和AI推动逻辑向人类思维各具体领域进军"}]}, {"id": "15-7-2", "name": "逻辑的三大源头", "category": 3, "symbolSize": 26, "desc": "古希腊、古印度因明正理、中国先秦名辩学", "children": [{"id": "15-7-2-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "三大源头仅古希腊逻辑有连续发展史，阿拉伯逻辑保存亚氏著作", "detail": "(1)三大源头：古希腊逻辑（亚里士多德）、古印度因明和正理论、中国先秦名辩学\n(2)只有古希腊逻辑通过古罗马和中世纪进入拉丁语世界有连续发展历史\n(3)阿拉伯逻辑保存了几乎全部亚里士多德著作，对中世纪拉丁世界逻辑发展至关重要"}]}, {"id": "15-7-3", "name": "逻辑一元论与多元论", "category": 3, "symbolSize": 26, "desc": "作者对语言文化相对主义多元论持保留态度", "children": [{"id": "15-7-3-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "不同民族能沟通必有共同基础即逻辑，是自然界所教导的", "detail": "(1)由逻辑形态多样性引出逻辑一元还是多元的问题\n(2)最近有人提出逻辑相对于语言和文化的多元性论题，作者认为是过于大胆的推论\n(3)操不同语言文化的民族能相互沟通，必有共同基础即逻辑，逻辑是自然界教导甚至强迫我们接受的东西"}]}]}, {"id": "15-8", "name": "中国古代究竟有没有逻辑？", "category": 2, "symbolSize": 32, "desc": "墨家逻辑的内容与方法论，中国逻辑史研究的范式反思", "children": [{"id": "15-8-1", "name": "墨家逻辑", "category": 3, "symbolSize": 26, "desc": "讨论了名辞说辩，提炼七种论式及止式，兼及其他思想家", "children": [{"id": "15-8-1-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "墨家讨论了名辞说辩，提炼七种具体论式及止式", "detail": "(1)名：以名举实，种类有达名类名私名形貌之名非形貌之名兼名体名等\n(2)辞：以辞抒意，种类有合假尽或必且等\n(3)说与辩：以说出故，说所以明也；辩争彼也辩胜当也\n(4)七种具体论式：或假效辟侔援推；止主要用于反驳"}, {"id": "15-8-1-2", "name": "论证依据", "category": 4, "symbolSize": 22, "desc": "引《墨子·小取》及邓析孔子惠施公孙龙荀子韩非等", "detail": "(1)《墨子·小取》论辩的总说明涉及论辩的伦理目的作用方法规则等\n(2)除墨家外，邓析孔子惠施公孙龙荀子韩非等人对逻辑学也多有贡献\n(3)《易经》中也隐藏着理解中国传统思维方式的密码"}]}, {"id": "15-8-2", "name": "中国逻辑史研究方法论", "category": 3, "symbolSize": 26, "desc": "不应以西方形式逻辑为唯一范式，应提炼中国特有内容", "children": [{"id": "15-8-2-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "中国逻辑史应按本来面目重写，提炼为西方逻辑所缺乏的东西", "detail": "(1)大多数成果以西方形式逻辑为研究范式在中国思想家那里找相应材料往里面套\n(2)几乎把一部中国逻辑史变成了西方逻辑史的注脚\n(3)中国逻辑史应该按其本来面目重写，提炼出为中国逻辑所特有的内容"}, {"id": "15-8-2-2", "name": "代表人物", "category": 4, "symbolSize": 22, "desc": "沈有鼎周文英杨沛荪温公颐崔清田李匡武孙中原等", "detail": "(1)沈有鼎《墨经的逻辑学》1980\n(2)周文英《中国逻辑思想史稿》1987\n(3)杨沛荪主编《中国逻辑史教程》1988\n(4)温公颐主编《中国逻辑史教程》1988初版2001修订本崔清田为第二主编\n(5)李匡武主编《中国逻辑史》5卷本1989\n(6)孙中原的墨辩研究等"}]}]}, {"id": "15-9", "name": "思维四律的特殊地位", "category": 2, "symbolSize": 32, "desc": "思维四律是元规则而非重言式，各自具有独特作用", "children": [{"id": "15-9-1", "name": "同一律的元规则作用", "category": 3, "symbolSize": 26, "desc": "贯穿逻辑系统构造全过程，体现在每个符号公式定理中", "children": [{"id": "15-9-1-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "同一律作为元规则贯穿逻辑系统构造的每一个环节", "detail": "(1)创制单义的人工语言符号克服自然语言中的多义性或歧义性\n(2)递归定义合式公式避免自然语言语法的模糊性和松散性\n(3)严格定义证明概念排除随意引入的暗含假设和错误推理步骤\n(4)区分对象语言与元语言内定理和元定理基本规则和导出规则语法和语义"}]}, {"id": "15-9-2", "name": "矛盾律的元规则作用", "category": 3, "symbolSize": 26, "desc": "推动探索追寻发现形式系统的无矛盾性证明", "children": [{"id": "15-9-2-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "矛盾律告诉我们包含矛盾的系统不成立会崩溃坍塌", "detail": "(1)在形式系统构造完毕后从语形和语义两方面证明系统的无矛盾性\n(2)矛盾律推动人们去探索追寻发现无矛盾性证明\n(3)包含矛盾的系统不成立会崩溃或坍塌掉"}]}, {"id": "15-9-3", "name": "排中律的元规则作用", "category": 3, "symbolSize": 26, "desc": "与矛盾律构成二值原则，是整个经典逻辑的基础", "children": [{"id": "15-9-3-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "排中律和矛盾律构成二值原则，刻画真假特性", "detail": "(1)语义表述：对于任一命题A，要么A真要么A假\n(2)与矛盾律一起构成二值原则：任一命题或者是真的或者是假的二者必居其一且只居其一\n(3)是整个经典逻辑包括命题演算和谓词演算的基础"}]}, {"id": "15-9-4", "name": "充足理由律的重构", "category": 3, "symbolSize": 26, "desc": "作者对充足理由律的重构，确保思维论证性的根本原则", "children": [{"id": "15-9-4-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "充足理由律要求确定思想为真必须有逻辑上充足的理由", "detail": "(1)对所要论证的观点必须给出理由\n(2)给出的理由必须真实至少是论辩双方所能接受的\n(3)从给出的理由必须能够合逻辑地推出所要论证的论点\n(4)违反三条要求的错误分别是：没有理由、理由虚假和推不出来"}, {"id": "15-9-4-2", "name": "论证依据", "category": 4, "symbolSize": 22, "desc": "充足理由律是谬误理论的根基，至关重要不可或缺", "detail": "(1)充足理由律的作用在于确保思维的论证性即要求用合逻辑的方式去讲道理\n(2)谬误是有缺陷的推理和论证，其缺陷表现在不讲道理讲歪道理和推不出来\n(3)即使不是全部至少绝大部分思维谬误是由于违反充足理由律的要求而导致的\n(4)没有充足理由律整个谬误理论就失去根基"}, {"id": "15-9-4-3", "name": "代表人物", "category": 4, "symbolSize": 22, "desc": "莱布尼茨（原始提出者），作者（改造者）", "detail": "(1)莱布尼茨最早表述充足理由原则：任何真实陈述必有其充足理由\n(2)对莱布尼茨表述的非议：这样的充足理由只有上帝才能知道\n(3)作者对充足理由律加以改造使之成为逻辑规律和思维的基本指导原则"}]}]}, {"id": "15-10", "name": "逻辑的可修正性问题", "category": 2, "symbolSize": 32, "desc": "逻辑可修正的理由、优先保护逻辑的策略及其积极意义", "children": [{"id": "15-10-1", "name": "逻辑可修正的理由", "category": 3, "symbolSize": 26, "desc": "三个理由：经典逻辑的隐含预设、哲学分歧、逻辑常项解释差异", "children": [{"id": "15-10-1-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "逻辑在原则上可修正，逻辑真理可错，有三方面理由", "detail": "(1)经典逻辑有不少隐含预设：要求对象域非空量词都有存在涵义名称都有所指没有空名，其他逻辑学家可能不同意这些预设而构造不同系统\n(2)哲学立场上的分歧是实质性分歧：如二值原则预设实在论立场，直觉主义者不同意，对存在性断言提出存在等于被构造的更高标准\n(3)对逻辑常项的不同直观解释导致不同逻辑系统：如对蕴涵和推理关系的不同理解导致经典逻辑相干逻辑直觉主义逻辑等的差异"}, {"id": "15-10-1-2", "name": "代表人物", "category": 4, "symbolSize": 22, "desc": "达米特（Michael Dummett）及直觉主义者", "detail": "(1)达米特研究二值原则与实在论立场的关系\n(2)直觉主义者及受其影响的哲学家不同意实在论的二值预设\n(3)他们提出存在等于被构造的标准，对逻辑施加了更为严格的限制"}]}, {"id": "15-10-2", "name": "优先保护逻辑的理由", "category": 3, "symbolSize": 26, "desc": "逻辑处于信念网核心，修改逻辑会导致整个信念网坍塌", "children": [{"id": "15-10-2-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "让逻辑不受伤害始终是应该优先选择的策略", "detail": "(1)逻辑理论所含描述性因素最少离经验世界最远得到修正的机会最小\n(2)如蒯因所言逻辑处于信念网的核心地带对整个信念网起支撑作用\n(3)修改逻辑会导致整个信念网坍塌按最小代价获取最大收益原则修改逻辑是最不应该采取的策略"}]}, {"id": "15-10-3", "name": "承认逻辑可修正的积极意义", "category": 3, "symbolSize": 26, "desc": "杜绝先验真理绝对真理，断掉独断论教条主义的后路", "children": [{"id": "15-10-3-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "承认逻辑可修正确保了自由思考和科学发展的空间", "detail": "(1)如果连逻辑也与经验有关联也可以被修改就没有什么东西不可以被修改\n(2)由此可杜绝一切所谓的先验真理分析真理和绝对真理\n(3)断掉认识论上的独断论教条主义和专制主义的后路\n(4)为自由思考和科学的进一步发展敞开道路提供空间"}]}]}]}, {"id": "a04", "name": "附录四 归纳问题：罗素与金岳霖", "desc": "附录 · 共5个小节", "isAppendix": true, "children": [{"id": "16-1", "name": "一个简短的历史回顾", "category": 2, "symbolSize": 32, "desc": "罗素与金岳霖围绕归纳问题的中西哲学交流背景", "children": [{"id": "16-1-1", "name": "罗素1920年来华讲学", "category": 3, "symbolSize": 26, "desc": "罗素9个月在华60余场讲演，形成\"罗素热\"", "children": [{"id": "16-1-1-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "罗素在华讲学涵盖哲学、逻辑、社会改造等20余主题", "detail": "(1)1920年10月抵上海，在沪杭宁长京保等地讲学9个月。(2)北京五大系列讲演：《哲学问题》《心的分析》《物的分析》《数学逻辑》《社会结构学》。(3)北大师生成立\"罗素学说研究会\"，罗素每两周参加一次活动。"}, {"id": "16-1-1-2", "name": "代表人物", "category": 4, "symbolSize": 22, "desc": "罗素（1872—1970），英国哲学家、逻辑学家", "detail": "(1)应中国多个学术团体邀请访华。(2)讲演被记录整理在报刊发表或出版社印行。(3)访华后著《中国问题》（1922）。"}]}, {"id": "16-1-2", "name": "金岳霖从政治学转向哲学", "category": 3, "symbolSize": 26, "desc": "金岳霖留美后受格林、休谟、罗素影响转向哲学", "children": [{"id": "16-1-2-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "金岳霖的理智探讨从政治学完全转向哲学和逻辑学", "detail": "(1)1914年赴宾夕法尼亚大学留学，先学商业后改政治学。(2)1920年获哥伦比亚大学政治学博士学位。(3)1921-1925年赴欧洲游学，在伦敦读休谟《人性论》和罗素《数学的原则》后转向哲学。"}, {"id": "16-1-2-2", "name": "代表人物", "category": 4, "symbolSize": 22, "desc": "金岳霖（1895—1984），中国哲学家和逻辑学家", "detail": "(1)1926年起在清华大学任教，创办哲学系。(2)曾任中国逻辑学会会长。(3)学术代表作：《逻辑》(1936)《论道》(1940)《知识论》(1948完成，1983出版)。"}]}, {"id": "16-1-3", "name": "休谟与罗素的双重影响", "category": 3, "symbolSize": 26, "desc": "休谟《人性论》和罗素《数学的原则》决定金岳霖哲学方向", "children": [{"id": "16-1-3-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "两本书使金岳霖感受归纳说不通、因果靠不住", "detail": "(1)休谟《人性论》使金岳霖感到\"归纳说不通，因果靠不住，而科学在理论上的根基动摇\"。(2)罗素《数学的原则》使他认识到日常生活中常用概念也可有精深分析，从此注重分析。(3)金岳霖认为不把知识论问题理出条理，无法系统回答休谟问题。"}]}, {"id": "16-1-4", "name": "金岳霖三大代表作与归纳问题", "category": 3, "symbolSize": 26, "desc": "以《论道》为本体论基础、《知识论》为认识论准备回答休谟", "children": [{"id": "16-1-4-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "知识论需本体论基础，三书构成系统回答休谟问题的框架", "detail": "(1)《论道》(1940)讲本体论，为解决休谟问题奠定基础。(2)《知识论》(1948)讲认识论，为回答休谟问题做准备。(3)多篇论文提出与罗素类似的先验主义归纳证成。"}]}]}, {"id": "16-2", "name": "休谟问题及其影响", "category": 2, "symbolSize": 32, "desc": "休谟从经验论立场对因果关系必然性和归纳合理性提出根本质疑", "children": [{"id": "16-2-1", "name": "休谟的经验论基本原则", "category": 3, "symbolSize": 26, "desc": "思维全部材料来自知觉，观念是印象的摹本", "children": [{"id": "16-2-1-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "一切观念或比较微弱的知觉是我们的印象或比较生动的知觉的摹本", "detail": "(1)知觉分为印象和观念，印象最强烈最生动。(2)人类理智对象分为\"观念的联系\"和\"实际的事情\"。(3)关于观念间联系的知识凭借直观或演证即可发现其确实性。"}, {"id": "16-2-1-2", "name": "代表人物", "category": 4, "symbolSize": 22, "desc": "休谟（1711—1776）在《人性论》(1739)和《人类理智研究》(1748)", "detail": "(1)休谟将洛克和贝克莱的经验主义哲学发展到逻辑终局。(2)其怀疑主义论证史称\"休谟问题\"或\"归纳问题\"。(3)休谟常用\"或然论证\"和\"因果推理\"表述，未用\"归纳推理\"术语。"}]}, {"id": "16-2-2", "name": "预测归纳推理", "category": 3, "symbolSize": 26, "desc": "从已观察到的情况断言推移到尚未观察到的情况的推理形式", "children": [{"id": "16-2-2-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "归纳推理从有限已观察事例跳到全称结论和未来预测", "detail": "(1)例1：迄今太阳每天都从东方升起，所以太阳明天仍将从东方升起。(2)例2：迄今所观察的火都是热的，并且这是火，所以这是热的。(3)休谟关于预测归纳推理的说法一般性地适用于归纳推理的各种形式。"}, {"id": "16-2-2-2", "name": "论证依据", "category": 4, "symbolSize": 22, "desc": "两个逻辑跳跃：有限到无限、过去到未来均无演绎保证", "detail": "(1)从实际观察到的有限事例跳到涉及潜无穷对象的全称结论。(2)从过去、现在的经验跳到对未来的预测。(3)适用于有限的不一定适用于无限，将来与过去、现在可能不同。"}]}, {"id": "16-2-3", "name": "休谟怀疑论证的十二步重构", "category": 3, "symbolSize": 26, "desc": "按本文理解将休谟关于因果关系和归纳推理的论证重构为12步", "children": [{"id": "16-2-3-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "以自然齐一律为基础的因果推理不是逻辑上有效的推理", "detail": "(1)思维材料全来自知觉（印象和观念）。(2)人类知识分\"观念间联系\"和\"实际事情\"两类。(3)后一类知识建立在因果关系上。(4)一切因果推理建立在经验上，原因与结果是不同事件。(5)因果关系三要素中\"必然性\"是经验观察中所没有的。(6)因果推理必须依赖自然齐一律。"}, {"id": "16-2-3-2", "name": "论证依据", "category": 4, "symbolSize": 22, "desc": "自然齐一律既无演证证明也无概然证明，诉诸能力概念亦无效", "detail": "(7)对自然齐一律无法提供演证证明，自然的进程可以改变不蕴涵矛盾。(8)概然推断建立于\"经验过的与未经验过的类似\"假设上，不能来自概然推断，否则循环。(9)诉诸\"能力\"概念也不行，因为能力来自可感性质的观察，做推断时仍须依赖自然齐一律。"}, {"id": "16-2-3-3", "name": "经典诘难", "category": 4, "symbolSize": 22, "desc": "我们只能假设却永远不能证明经验过的对象必然类似于未发现的对象", "detail": "(10)自然齐一律没有得到有效的证明。(11)以自然齐一律为基础的因果推理不是逻辑上有效的推理。(12)休谟结论：不但理性不能发现因果最终联系，经验指出恒常结合后也不能凭理性相信为什么把经验扩大到所观察的特殊事例之外。"}]}, {"id": "16-2-4", "name": "自然齐一律", "category": 3, "symbolSize": 26, "desc": "\"我们所没有经验过的例子必然类似于我们所经验过的例子\"", "children": [{"id": "16-2-4-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "自然的进程是永远一致地继续同一不变的", "detail": "(1)因果推理必须依赖于类似原则或自然齐一律。(2)自然齐一律无法提供演证式的证明。(3)自然齐一律也不能提供概然性论证，否则导致循环论证和无穷倒退。"}, {"id": "16-2-4-2", "name": "经典诘难", "category": 4, "symbolSize": 22, "desc": "感官最多告诉我们过去一直如此，并未告诉我们将来仍然如此", "detail": "(1)感官只告诉我们现象间的先后关系和恒常汇合，不是必然的因果关系。(2)因果律和自然齐一律没有经验证据，只不过出自习惯性心理联想。(3)\"习惯是人生的伟大指导\"。"}, {"id": "16-2-4-3", "name": "代表人物", "category": 4, "symbolSize": 22, "desc": "休谟最早系统质疑自然齐一律的证明可能性", "detail": "(1)休谟指出对自然齐一律的演证证明和概然证明均不可能。(2)他将自然齐一律的信念归结为习惯性心理联想。(3)罗素回应：\"习惯律本身就是一个因果律\"。"}]}, {"id": "16-2-5", "name": "归纳问题的现代重构", "category": 3, "symbolSize": 26, "desc": "从演绎证成、归纳证成、因果基础三方面质疑归纳推理合理性", "children": [{"id": "16-2-5-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "归纳推理既无演绎证成亦无归纳证成，因果基础亦未证明", "detail": "(1)归纳推理不能得到演绎主义证成：两个逻辑跳跃无演绎保证。(2)归纳推理的有效性也不能归纳地证明：用归纳成功证明归纳导致循环或无穷倒退。(3)归纳推理以普遍因果律和自然齐一律为基础，两者客观真理性未被证明。"}, {"id": "16-2-5-2", "name": "经典诘难", "category": 4, "symbolSize": 22, "desc": "涉及\"普遍必然的经验知识是否可能？如何可能？\"的根本问题", "detail": "(1)休谟的诘难是深刻的，极富挑战性。(2)最终涉及人类的认识能力及其限度等根本性问题。(3)\"归纳法是自然科学的胜利，却是哲学的耻辱。"}]}, {"id": "16-2-6", "name": "五种归纳证成方案", "category": 3, "symbolSize": 26, "desc": "哲学家提出演绎主义、先验论、概率主义、实用主义、反归纳主义五种方案", "children": [{"id": "16-2-6-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "五种主要进路各有代表人物但总体上都不太成功", "detail": "(1)演绎主义证成：增加普遍必然大前提确保结论必然真，首推密尔。(2)先验论或约定论证成：增加先验性前提或社会约定，代表人物康德、罗素、金岳霖、庞卡莱。(3)概率主义证成：用贝叶斯方法发展概率归纳逻辑做局部辩护。(4)实用主义证成：归纳是获得真理的最佳自我修正策略，代表人物皮尔士、赖欣巴赫。(5)反归纳主义立场：波普等人坚持。"}, {"id": "16-2-6-2", "name": "代表人物", "category": 4, "symbolSize": 22, "desc": "密尔、康德、庞卡莱、皮尔士、赖欣巴赫、波普等", "detail": "(1)密尔首推演绎主义证成。(2)康德是先验论代表人物，罗素和金岳霖也是。(3)庞卡莱是约定论代表人物。(4)皮尔士和赖欣巴赫是实用主义代表人物。(5)卡尔·波普坚持反归纳主义立场。"}]}]}, {"id": "16-3", "name": "罗素对归纳的证成", "category": 2, "symbolSize": 32, "desc": "罗素从休谟解读、因果律、归纳原则、经验公设四个方面证成归纳", "children": [{"id": "16-3-1", "name": "罗素对休谟的激进误读", "category": 3, "symbolSize": 26, "desc": "罗素将休谟解读为彻底怀疑论者，否定因果关系和归纳推理", "children": [{"id": "16-3-1-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "休谟代表死胡同，\"从经验和观察什么也不能知晓\"", "detail": "(1)罗素认为休谟是\"哲学家当中一个最重要的人物\"，把经验主义发展到逻辑终局。(2)休谟的学说分客观方面和主观方面：客观方面认为单纯枚举归纳不是妥当论证；主观方面将因果必然性归结为习惯性心理联想。(3)罗素认为\"整个19世纪内以及20世纪到此为止的非理性的发展，是休谟破坏经验主义的当然后果\"。"}, {"id": "16-3-1-2", "name": "论证依据", "category": 4, "symbolSize": 22, "desc": "罗素区分休谟学说的客观方面与主观方面分别回应", "detail": "(1)客观方面：不管观察多少甲和乙连结事例，不成为预料未来相连的理由，只是预料的原因。(2)主观方面：因屡次观察甲乙连结，结果有甲的印象便有乙的观念。(3)罗素批评：\"习惯律本身就是一个因果律\"。"}, {"id": "16-3-1-3", "name": "经典诘难", "category": 4, "symbolSize": 22, "desc": "罗素的解读是误读和过度引申，休谟结论其实是温和而有节制的", "detail": "(1)休谟没有否定因果关系的客观性和必然性，只是说我们不知道。(2)休谟没有否定归纳推理的合理性，只是说其在逻辑上无法证明。(3)\"休谟并没有说在原因和结果之间没有必然联系，他只是说我们不可能知道这样一种可能的必然性。\""}, {"id": "16-3-1-4", "name": "代表人物", "category": 4, "symbolSize": 22, "desc": "罗素促成对休谟的激进误读在20世纪哲学中占据主导地位", "detail": "(1)罗素在《西方哲学史》《哲学问题》《人类的知识》等著作中反复讨论休谟。(2)他把休谟解读为彻底的怀疑论者甚至不可知论者。(3)他认为\"重要的是揭明在经验主义哲学范围内是否存在对休谟的解答\"。"}]}, {"id": "16-3-2", "name": "因果律分析", "category": 3, "symbolSize": 26, "desc": "罗素讨论因果律的意义、迄今有效的证据和将来有效的证据三问题", "children": [{"id": "16-3-2-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "因果律使我们从某些事件的存在推出另一事件的存在", "detail": "(1)因果律的意义：\"在同时或不同时的不同事件之间有恒定不变的关系，因而给定了整个宇宙在任何时间中的状态，每一先前的和以后的事件在理论上都可以作为这个时间内某些事件的函数加以规定\"。(2)因果律迄今有效的证据：我们真正发现的只是现象间的恒常\"接续\"或\"共存\"，必然性的信念只是出自动物式的习惯性联想。(3)因果律将来有效的证据：不能单凭过去的未来经验解答，须寻找某种原则。"}, {"id": "16-3-2-2", "name": "经典诘难", "category": 4, "symbolSize": 22, "desc": "用\"过去的未来\"论证\"未来的未来\"是以未决问题作为论据", "detail": "(1)我们对于过去的未来虽具有经验，但对于未来的未来却并没有经验。(2)问题在于：未来的未来是否和过去的未来相似？(3)罗素建议转换问题：如果关于未来的推论正当有效，所必然包含的原则是什么？"}]}, {"id": "16-3-3", "name": "归纳原则", "category": 3, "symbolSize": 26, "desc": "罗素设定先验归纳原则，给出两种表述并论证其不可被经验否证或证明", "children": [{"id": "16-3-3-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "归纳原则是先验的，因其内在证据成立而无须经验证据", "detail": "(1)第一种表述：甲乙联系事例越多则新事例中它们相联系的或然性越大，事例足够多时或然性无限接近必然性。(2)第二种表述：甲种事物和乙种事物相联系事例越多则永远相联系的或然性越大，足够多时几乎可确定永远联系。(3)罗素暗中接受休谟结论，将归纳结论改为\"（大概）所有S都是P\"。"}, {"id": "16-3-3-2", "name": "论证依据", "category": 4, "symbolSize": 22, "desc": "三个理由：不可被经验否证、不可凭经验证明、一切常识科学所必须预设", "detail": "(1)归纳原则不能被经验所否证：反例只改变原有或然率，不证明过去的或然性估计错了。(2)归纳原则不能凭经验来证明：所有基于经验的论证都以归纳原则为前提，用经验证明则循环论证。(3)归纳原则是一切常识、行为、习惯和科学推理所必须预设的：\"要么我们认识某种不经过经验的事物，要么科学是一种无稽之谈。\""}, {"id": "16-3-3-3", "name": "经典诘难", "category": 4, "symbolSize": 22, "desc": "罗素的三理由中仅第二理由成立，第一和第三不成立", "detail": "(1)反例出现缩小概率虽不反驳原来的概率计算过程，但反驳了原来的归纳结论。(2)预先假定常识科学合理可靠等于预先承认归纳推理合理可靠，是典型的循环论证。(3)罗素并没有成功地证明归纳原则是先验的。"}, {"id": "16-3-3-4", "name": "代表人物", "category": 4, "symbolSize": 22, "desc": "罗素在《哲学问题》(1912)中系统阐述归纳原则", "detail": "(1)罗素几乎完全接受休谟的归纳怀疑论。(2)但他认为归纳法作为增加概括性命题概率的手段仍很重要。(3)他试图寻找先验原则为归纳推理辩护，实质上是为常识和科学辩护。"}]}, {"id": "16-3-4", "name": "五个经验公设", "category": 3, "symbolSize": 26, "desc": "罗素在《人类的知识》中提出准永久性、因果线、时空连续性、结构、类推五公设", "children": [{"id": "16-3-4-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "用五个经验公设代替先验归纳原则为科学推理提供或然性基础", "detail": "(1)罗素推翻此前观点：\"归纳作为一个逻辑原则是无效的\"。(2)但科学和常识大致可靠，非演证性推理也常常可靠。(3)需寻找一组经验公设，作为归纳推理的大前提。"}, {"id": "16-3-4-2", "name": "论证依据", "category": 4, "symbolSize": 22, "desc": "五公设：准永久性、因果线、时空连续性、结构、类推", "detail": "(1)准永久性公设：任一事件A，在相邻时空有一个与A非常相似的事件。(2)可以彼此分开的因果线的公设：从一系列事件中一两个分子可推论所有其他分子的情况（最重要）。(3)时空连续性公设：不相邻事件间有因果关联时存在中间环节。(4)结构公设：结构相似的复合事件围绕中心分布时都属同一起源的因果线。(5)类推的公设：已知A产生B，若观察到A但无法观察B，B的出现具有或然性。"}, {"id": "16-3-4-3", "name": "经典诘难", "category": 4, "symbolSize": 22, "desc": "公设只表示或然性不表示确实性，本身无确实性者难为别者担保", "detail": "(1)罗素一方面说公设为科学推理提供了充分必要条件，另一方面说这些公设是\"经验的\"，只有或然性没有确实性。(2)\"本身没有确实性的东西怎么能够为别的东西的确实性提供担保\"。(3)罗素态度矛盾：既接受休谟怀疑论又试图先验地证成，注定失败。"}, {"id": "16-3-4-4", "name": "修正版本", "category": 4, "symbolSize": 22, "desc": "罗素从《哲学问题》的归纳原则方案转向《人类的知识》的经验公设方案", "detail": "(1)早期方案：《哲学问题》(1912)中的先验归纳原则，后意识到其中问题而放弃。(2)后期方案：《人类的知识》(1948)中的五个经验公设。(3)两套方案均为非演证性推理辩护，但罗素最终认为数学概率论也没有为归纳提供或然性理由。"}]}, {"id": "16-3-5", "name": "归纳问题能最终解决吗", "category": 3, "symbolSize": 26, "desc": "罗素否定此前方案并考察数学概率论后得出否定结论", "children": [{"id": "16-3-5-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "罗素的归纳态度是矛盾的：接受怀疑论又试图为常识科学辩护", "detail": "(1)罗素否定密尔、康德、庞卡莱等的方案，认为\"一直还没有够得上对手的应战\"。(2)凯恩斯概率论和频率说也不能为归纳提供或然性理由。(3)\"为归纳法本身找出根据是不可能的，因为我们可以证明归纳法导致虚妄和导致真理是同样常见的。\""}, {"id": "16-3-5-2", "name": "经典诘难", "category": 4, "symbolSize": 22, "desc": "同时持有矛盾断言：归纳常伪多于真，却又试图先验证成它", "detail": "(1)如果归纳法导致虚妄和真理同样常见的前断言为真，试图证成归纳就是根本上不可能被完成的事情。(2)罗素无法同时兼顾休谟怀疑论和为常识科学辩护两方面。(3)作者结论：罗素的尝试注定失败，情况也确实如此。"}]}]}, {"id": "16-4", "name": "金岳霖对归纳的证成", "category": 2, "symbolSize": 32, "desc": "金岳霖从批评休谟知识论、因果关系、归纳永真性、先验性四方面证成归纳", "children": [{"id": "16-4-1", "name": "对休谟知识论的批评", "category": 3, "symbolSize": 26, "desc": "金岳霖认为休谟问题出在本体论假设太少和认识论不懂共相殊相关联", "children": [{"id": "16-4-1-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "休谟缺点不在因果论本身而在整个哲学：本体论和认识论均有问题", "detail": "(1)本体论上假设太少：印象和意象来源太有限、范围太小，实在种类不多。(2)理论上既不能承认假设，自己的假设都变成非理性的。(3)在理论遇困难时不增加假设，而以与理论毫不相干的\"习惯\"解释困难。"}, {"id": "16-4-1-2", "name": "论证依据", "category": 4, "symbolSize": 22, "desc": "金岳霖采取相反的路径：增加必需的假设，从常识出发", "detail": "(1)《知识论》从两条假设出发：\"有正觉\"（区别于梦觉幻觉错觉的可靠感觉经验）和\"有外物\"（不依赖于认知者而独立存在的对象）。(2)借助\"常识\"和\"本能的信仰\"为假设辩护：\"相信见闻底实在，相信外物之有都是本能的信仰\"。(3)\"常识底任何部分都是可以批评的，但它决不是可以完全推翻的\"，\"修改常识底最后根据依然是常识\"。"}, {"id": "16-4-1-3", "name": "经典诘难", "category": 4, "symbolSize": 22, "desc": "休谟只囿于感觉经验不承认理性抽象，不懂个别与一般的关联", "detail": "(1)休谟\"哲学只让他承认意象不让他承认意念；意象是具体的，意念是抽象的\"。(2)休谟\"无形之中承认有普遍，而在其正式的哲学中又不承认有真正的普遍\"。(3)不懂得\"特殊的事实表现于普遍的理\"和\"共相的关联或固然的理\"呈现于特殊事实之中。"}, {"id": "16-4-1-4", "name": "修正版本", "category": 4, "symbolSize": 22, "desc": "金岳霖承认共相殊相相互渗透，强调意念的摹状和规范双重作用", "detail": "(1)承认共相和殊相、具体和抽象、经验和理性之间的相互联系和渗透。(2)概念作为形容工具：描写所与所呈现的共相关联，是此关联的符号。(3)概念作为范畴：是我们应付将来的所与的办法。\"这两方面是不能分开的，概念不形容，它也不能范畴……概念不范畴也不能形容\"。"}]}, {"id": "16-4-2", "name": "理有固然，势无必至", "category": 3, "symbolSize": 26, "desc": "金岳霖区分必然与固然、理与势，论证因果关系的可靠性", "children": [{"id": "16-4-2-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "因果关系是\"理有固然\"，但具体实现\"势无必至\"", "detail": "(1)\"理\"表示共相的关联，\"势\"表示殊相的生灭。(2)\"理\"区分为\"纯理\"（逻辑命题，必然）和\"实理\"（因果命题、自然律，固然）。(3)\"固然不是必然\"：固然的理是普遍的真命题或自然律，没有例外，\"一定靠得住\"，是\"事物之无可逃的\"。"}, {"id": "16-4-2-2", "name": "论证依据", "category": 4, "symbolSize": 22, "desc": "逻辑命题是纯理和必然，因果命题是实理和固然，因果实现看背景条件", "detail": "(1)逻辑命题是先天命题也是必然命题：\"只有逻辑关系是必然的\"。(2)因果关系命题是实理：表示共相之间关联，具有普遍性，没有例外发生。(3)因果具体实现\"势无必至\"：作为原因的atmsm发生后，结果btnsn是否发生取决于许多背景条件，有的促进有的阻碍。"}, {"id": "16-4-2-3", "name": "经典诘难", "category": 4, "symbolSize": 22, "desc": "普遍性与个别性、无所逃与受限制性之间存在冲突", "detail": "(1)因果关系的普遍性与因果实现的个别性之间存在冲突。(2)因果关系之\"无所逃\"与因果实现的受限制性之间存在冲突。(3)金岳霖虽充分肯定因果关系的可靠性，但没有提出令人信服的论证，归纳证成方案基础并不稳固。"}]}, {"id": "16-4-3", "name": "归纳原则的永真性论证", "category": 3, "symbolSize": 26, "desc": "金岳霖论证归纳原则永真，反例只推翻后件不推翻原则本身", "children": [{"id": "16-4-3-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "归纳原则是先验的永真的原则，只要经验继续着总是真的", "detail": "(1)归纳原则表述为条件句：\"如果……则……\"，前件列举例子，后件是结论式的普遍命题。(2)后件为\"（大概）（a，b）φ（a，b）\"，等值于所有a和b具有φ关系的全称命题合取。(3)\"大概\"表示例证与结论的关系质：例证代表普遍情形程度高则大概程度高。"}, {"id": "16-4-3-2", "name": "论证依据", "category": 4, "symbolSize": 22, "desc": "分时间打住和不打住两种情形，论证归纳原则永不被推翻", "detail": "(1)时间在tn时打住：结论变为历史总结，是完全归纳，但完全归纳不是真正归纳推理。(2)时间不打住且新证据为正例时：不能推翻原归纳结论和归纳原则本身。(3)时间不打住且新证据为反例时：反例推翻后件，但前件也因时间变换而变假，前件真后件假的情况未出现，归纳原则毫发无损。"}, {"id": "16-4-3-3", "name": "经典诘难", "category": 4, "symbolSize": 22, "desc": "论证包含严重逻辑错误：改变质疑对象、随意变换时间点、循环论证", "detail": "(1)改变了休谟质疑的对象：休谟质疑的是从个别得出全称命题，金岳霖改为得出\"（大概）所有A都是B\"。(2)随意改变\"现在\"的时间参考点：将在tn时作出的归纳概括说成是在tn+i时作出的，使反例被包括在前件中。(3)通过假定归纳原则成立去论证归纳原则成立，是典型的循环论证。"}]}, {"id": "16-4-4", "name": "归纳原则的先验性", "category": 3, "symbolSize": 26, "desc": "归纳原则是经验的必要条件、接受总则，不能被经验确证或反证", "children": [{"id": "16-4-4-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "归纳原则是先验的，是经验底必要条件", "detail": "(1)\"如果它是假的，世界虽有，然而是任何知识者所不能经验的\"。(2)不能想象到一种\"我们可以经验而同时归纳原则为假的世界\"。(3)归纳原则不是重言式：它假设了特定事例存在、普遍联系存在、特称命题为全称命题所包含、全称命题在有顺序的事例中得以实现。"}, {"id": "16-4-4-2", "name": "论证依据", "category": 4, "symbolSize": 22, "desc": "归纳原则是接受总则，任何意念的引用同时是归纳原则的引用", "detail": "(1)当我们说\"这是一张桌子\"时，我们实际上在做\"抽象\"和\"普遍化\"的工作。(2)当我们面对杂多对象时，必须用概念、范畴将其分门别类。(3)\"其实任何意念底引用同时是归纳原则底引用\"：意念对所与的\"收容\"\"应付\"\"范畴\"\"规律\"都有归纳原则的影子。"}]}]}, {"id": "16-5", "name": "比较和评论", "category": 2, "symbolSize": 32, "desc": "罗素与金岳霖归纳证成的五点相同、两点相异及中西哲学交流启示", "children": [{"id": "16-5-1", "name": "罗素与金岳霖的五点相同", "category": 3, "symbolSize": 26, "desc": "出发点和信念相似、对休谟解读相似、诉诸先验假设、加\"大概\"限制语、均失败", "children": [{"id": "16-5-1-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "两人都相信常识和科学的合理性并试图为之辩护", "detail": "(1)出发点和信念类似：都相信习惯、常识和科学的合理性和力量，试图在面对休谟挑战时为其辩护。(2)都把休谟问题解读成归纳问题且解读得相当激进：罗素几乎把休谟解释成彻底的怀疑论者和不可知论者，金岳霖受其影响。(3)都诉诸先验假设证成归纳：罗素先提归纳原则后提经验公设，金岳霖只取归纳原则。(4)都给归纳结论加上\"大概\"限制语：等于暗中接受了休谟的质疑。(5)归纳证成尝试都失败了：罗素兼顾矛盾断言不可能成功，金岳霖论证中有近似诡辩的步骤。"}, {"id": "16-5-1-2", "name": "经典诘难", "category": 4, "symbolSize": 22, "desc": "取消休谟问题而非回答休谟问题，给\"大概\"限制语无济于事", "detail": "(1)诉诸先验前提等于取消了休谟问题赖以产生的经验论前提，不是在回答休谟问题而是取消它。(2)加\"大概\"限制语也不能保证归纳原则永远成立，附加归纳原理本身真实性仍待证明。(3)当归纳结论涉及潜无穷对象时，无论例证多大，概率总是零。"}]}, {"id": "16-5-2", "name": "罗素与金岳霖的两点相异", "category": 3, "symbolSize": 26, "desc": "对休谟态度不同、归纳证成方案的数量和侧重点不同", "children": [{"id": "16-5-2-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "罗素态度犹豫悲观，金岳霖态度坚决自信", "detail": "(1)对休谟哲学态度不同：罗素基本接受休谟的认识论前提和怀疑论结论，辩护时常信心不足；金岳霖对休谟批评多于肯定，认为本体论假设太少、认识论不懂共相殊相关联。(2)归纳证成方案不同：罗素先后提出两套方案（归纳原则和经验公设），金岳霖只有一套方案，侧重论证\"将来不可能推翻以往\"。"}]}, {"id": "16-5-3", "name": "金岳霖论证的逻辑错误", "category": 3, "symbolSize": 26, "desc": "金岳霖改变了休谟质疑的对象且论证中含有近似诡辩的步骤", "children": [{"id": "16-5-3-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "论证虽机智但无效，包含严重的逻辑错误", "detail": "(1)改变了休谟质疑的对象：从全称命题改为\"（大概）所有A都是B\"，不能反驳休谟质疑。(2)论证中包含近似诡辩的步骤：随意地改变\"现在\"所指的时间点使反例变成正例。(3)循环论证：使用\"否定后件式\"的前提条件是作为充分条件假言命题的归纳原则必须成立。"}]}, {"id": "16-5-4", "name": "中西哲学交流的启示", "category": 3, "symbolSize": 26, "desc": "金岳霖尝试不成功，融入国际哲学界的使命由王浩以华裔美国人身份完成", "children": [{"id": "16-5-4-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "中国哲学家走上国际哲学舞台仍是一项有待完成的使命", "detail": "(1)以金岳霖为代表的一代中国哲学家有留学西洋经历，试图按西方以问题为导向的方式研究哲学。(2)金岳霖是其中的佼佼者，但从总体上看尝试并不成功。(3)1949年后中国向世界打开的门又被关上，融入国际哲学界的任务由金岳霖的学生王浩以华裔美国人身份完成。(4)走上国际哲学舞台对于中国哲学工作者来说仍是有待完成的使命。"}]}]}]}, {"id": "a05", "name": "附录五 \"休谟＋康德＋笛卡尔\"如何可能？", "desc": "附录 · 共6个小节", "isAppendix": true, "children": [{"id": "17-1", "name": "引言", "category": 2, "symbolSize": 32, "desc": "评介陈晓平《贝叶斯方法与科学合理性》，引出核心问题", "children": [{"id": "17-1-1", "name": "陈著的四项学术内容", "category": 3, "symbolSize": 26, "desc": "概述休谟质疑、非概率解答、贝叶斯方案、康德先验哲学改造", "children": [{"id": "17-1-1-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "以贝叶斯方法为纲领探讨归纳合理性与科学合理性问题", "detail": "(1)概述休谟对因果关系和归纳推理的质疑，认为其威胁经验科学的合理性。(2)考察非概率式解答：罗素、金岳霖、波普等人的方案。(3)以贝叶斯方法对休谟问题和归纳悖论给出贝叶斯式解决方案。(4)贝叶斯辩护是局部辩护且以先验假设为基础，引出对康德哲学的考察与改造。(5)运用贝叶斯方法分析分析与综合、还原与突现、反事实条件句、迪昂—蒯因问题等科学合理性疑难。"}, {"id": "17-1-1-2", "name": "论证依据", "category": 4, "symbolSize": 22, "desc": "该书很有技术含量，用当代学术风格写作，是作者长期研究的结果", "detail": "(1)传统哲学主要用思辨，当代哲学大量运用数学、语言学、逻辑学等技术手段。(2)陈著写给学术共同体的专家，目的在于推进相关问题的深入研究。(3)作者在归纳逻辑领域浸淫多年，不断追踪研究进展，逐步发展出独到看法和哲学体系。"}, {"id": "17-1-1-3", "name": "代表人物", "category": 4, "symbolSize": 22, "desc": "陈晓平，著有《归纳逻辑和归纳悖论》(1994)和《贝叶斯方法与科学合理性》(20", "detail": "(1)先前出版《归纳逻辑和归纳悖论》，是归纳逻辑知识的重要参考书。(2)新著延续前书主题和学术风格，是一本很有分量的专著。(3)陈晓平试图用\"休谟＋康德＋笛卡尔\"的方式回答和解决休谟问题。"}]}, {"id": "17-1-2", "name": "a priori中译名辨析", "category": 3, "symbolSize": 26, "desc": "陈晓平主张将a priori译为\"先验的\"而非\"先天的\"", "children": [{"id": "17-1-2-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "a priori本义是先于经验，译\"先天\"不妥，应译\"先验\"", "detail": "(1)transzendental→transcendental→建议译\"先验论的\"。(2)transzendent→transcendent→保持\"超验的\"传统译法。(3)apriori→a priori→译\"先验\"而非\"先天\"，相应地有\"先验综合命题\"\"先验范畴\"等译法。"}, {"id": "17-1-2-2", "name": "论证依据", "category": 4, "symbolSize": 22, "desc": "《剑桥哲学辞典》对a priori的定义支持此译法", "detail": "(1)先验的(a priori)：先于或独立于经验；与后验的(a posteriori)相对。(2)用于标示认知证成方式、命题类型、知识类型、论证类型之间的区别。(3)也用于标示获得概念或观念的两种途径之间的区别。"}, {"id": "17-1-2-3", "name": "代表人物", "category": 4, "symbolSize": 22, "desc": "陈晓平提出此三词译法，本文作者陈波深表赞同", "detail": "(1)陈晓平在《贝叶斯方法与科学合理性》中讨论康德哲学时提出译名意见。(2)陈波赞同至少对\"a priori\"到\"先验的\"的译法。(3)这也是陈波本人一贯坚持的主张。"}]}, {"id": "17-1-3", "name": "\"休谟＋康德＋笛卡尔\"方案", "category": 3, "symbolSize": 26, "desc": "陈晓平试图用康德补救休谟、用笛卡尔补救康德，建构新形而上学", "children": [{"id": "17-1-3-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "贝叶斯辩护是局部辩护，需先验基础，引向康德，再以笛卡尔补救康德", "detail": "(1)即使贝叶斯框架内的辩护也只是局部而非整全辩护，必须以先验假设为基础。(2)康德哲学面临问题和困境，需引用笛卡尔的\"我思故我在\"作为补救。(3)用\"休谟＋康德＋笛卡尔\"的方式回答休谟问题和科学合理性问题，建构一套形而上学体系。(4)本文探讨的主题：\"休谟＋康德＋笛卡尔\"如何可能？"}, {"id": "17-1-3-2", "name": "代表人物", "category": 4, "symbolSize": 22, "desc": "陈晓平试图融合休谟、康德、笛卡尔三人的哲学资源", "detail": "(1)休谟：提出归纳问题和因果质疑，需要回应。(2)康德：提供先验范畴和范导原则作为归纳辩护的基础。(3)笛卡尔：提供\"我思故我在\"作为统觉的自我确证基础。"}]}]}, {"id": "17-2", "name": "休谟关于因果必然性和自然齐一律的怀疑论证成立吗？", "category": 2, "symbolSize": 32, "desc": "陈波论证休谟的怀疑论证不成立，混淆了逻辑必然性与现实必然性", "children": [{"id": "17-2-1", "name": "休谟关于原因存在必然性的主论证", "category": 3, "symbolSize": 26, "desc": "若不能证明P就不能证明Q，且P不能用演证证明", "children": [{"id": "17-2-1-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "\"一切开始存在的东西必然有一个原因\"既无直观确实性也无演证确实性", "detail": "(1)P表示\"没有某种产生原则任何东西决不能开始存在\"。Q表示\"一切开始存在的东西必然有一个原因\"。P与Q逻辑等价。(2)主论证：若不能证明P就不能证明Q；确实不能证明P；所以没有希望证明Q。(3)\"一个事物无原因地开始存在是可能的\"(﹁P)与P矛盾。"}, {"id": "17-2-1-2", "name": "代表人物", "category": 4, "symbolSize": 22, "desc": "休谟在《人性论》第三章讨论\"原因的必然性\"时提出", "detail": "(1)休谟把\"原因\"和\"产生原则\"交换使用。(2)主论证结论等于说Q没有演证的确实性。(3)主论证是否成立取决于前提（2）是否成立。"}]}, {"id": "17-2-2", "name": "休谟的次论证与CP论题", "category": 3, "symbolSize": 26, "desc": "基于各别观念可分离、可设想无因存在，援引CP论题推出可能性", "children": [{"id": "17-2-2-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "CP论题：凡是可设想的都是可能的（conceivability entails ", "detail": "(1)所有各别的观念是可以相互分离的；原因和结果的观念显然是各别的；因此原因和结果的观念可以相互分离。(2)我们可以无矛盾地设想一个事物无原因地开始存在。(3)CP论题：凡是可设想的都是可能的。(4)因此\"一个事物无原因地开始存在\"是可能的。(5)我们不能先验地驳倒﹁P，所以不能先验地证明P。"}, {"id": "17-2-2-2", "name": "代表人物", "category": 4, "symbolSize": 22, "desc": "休谟也许是CP论题最早的清晰表述者之一", "detail": "(1)休谟在关于因果性和归纳推理的怀疑论证中多次使用CP论题。(2)CP论题在当代哲学中引起诸多讨论。(3)休谟的可设想性标准：没有（逻辑）矛盾就是可设想的。"}]}, {"id": "17-2-3", "name": "逻辑必然性vs现实必然性", "category": 3, "symbolSize": 26, "desc": "因果推理的必然性（逻辑必然性）不同于因果关系的必然性（物理必然性）", "children": [{"id": "17-2-3-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "休谟论证最多证明因果不具逻辑必然性，未证明不具现实必然性", "detail": "(1)因果推理的必然性是逻辑必然性：前提真结论必真，前提真而结论假在逻辑上不可能。(2)因果关系的必然性是现实或物理必然性，如\"摩擦生热\"\"有生者有死\"。(3)休谟次论证的无矛盾设想只是逻辑可设想性，只能蕴涵逻辑可能性，不能蕴涵现实可能性。"}, {"id": "17-2-3-2", "name": "经典诘难", "category": 4, "symbolSize": 22, "desc": "休谟论证面临二难困境：结论要么是不足道的，要么未被证明", "detail": "(1)如果论证成立，最多证明\"因果关系不具有逻辑的必然性\"，但这一结论是不足道的（trivial）。(2)如果要证明\"因果关系不具有现实的必然性\"，该结论是足道的，但并没有被论证所证明。(3)既然重要前提不成立，休谟关于原因的存在没有必然性的主论证也不成立。"}]}, {"id": "17-2-4", "name": "自然齐一律的怀疑论证", "category": 3, "symbolSize": 26, "desc": "休谟用可设想性和CP论题论证自然齐一律不成立", "children": [{"id": "17-2-4-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "能无矛盾地设想自然进程改变，根据CP论题，改变是可能的", "detail": "(1)如果自然齐一律成立，自然进程将永远保持不变。(2)我们可以无矛盾地设想自然进程发生某些改变。(3)CP论题：凡是可设想的就是可能的。(4)因此自然进程发生改变是可能的。(5)所以自然齐一律不成立。"}, {"id": "17-2-4-2", "name": "经典诘难", "category": 4, "symbolSize": 22, "desc": "逻辑可设想性不能是现实可能性的证据，仅能推出逻辑可能性", "detail": "(1)休谟的可设想性门槛很低：无矛盾即设想，有矛盾即不可设想。(2)由CP论题推出的只是逻辑可能性：自然进程发生改变在逻辑上是可能的。(3)自然齐一律是关于现实世界的规律性断言，不能仅凭逻辑上可能成立的断言来反驳。(4)改用普特南的话：\"逻辑的可设想性不能是现实的可能性的证据！\""}]}, {"id": "17-2-5", "name": "逻辑可能性与现实可能性的混淆", "category": 3, "symbolSize": 26, "desc": "可无矛盾设想\"人长生不死\"不能反驳\"人必有一死\"这一现实必然性", "children": [{"id": "17-2-5-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "逻辑可设想性不能反驳物理必然性，休谟混淆了两种可能性", "detail": "(1)在逻辑上可以无矛盾地设想\"人长生不死\"，但怎么反驳\"人必有一死\"这个关于现实世界的断言？(2)在逻辑上可以无矛盾地设想\"太阳明天从西方升起\"，但怎么反驳\"太阳每天从东方升起\"这个具有物理必然性的断言？(3)作者初读休谟时就模糊意识到这一混淆。"}, {"id": "17-2-5-2", "name": "经典诘难", "category": 4, "symbolSize": 22, "desc": "休谟怀疑论证混淆逻辑必然性与现实必然性，因此论证不成立", "detail": "(1)休谟用逻辑的可设想性和CP论题推出逻辑可能性。(2)从逻辑可能性直接否定关于现实世界的规律性断言是不合法的跨越。(3)要驳倒自然齐一律须证明改变是\"现实可能的\"，但休谟并未提供这种证明。"}]}]}, {"id": "17-3", "name": "休谟持有激进的归纳怀疑论吗？", "category": 2, "symbolSize": 32, "desc": "陈波论证休谟结论是温和而有节制的，不是极端怀疑论", "children": [{"id": "17-3-1", "name": "激进解读vs温和解读", "category": 3, "symbolSize": 26, "desc": "两种对立的解读传统：激进派认为休谟否定了归纳和科学合理性", "children": [{"id": "17-3-1-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "激进解读长期占主导，陈晓平持此解读且偏于极端", "detail": "(1)激进解读：休谟论证否定了因果关系客观必然性、归纳推理合理性，威胁到整个经验科学的合理性。(2)陈晓平概括休谟结论三点：经验科学离不开归纳法；归纳法合理性无法证明；因此经验科学没有合理性。(3)陈波认为休谟论证不是极端的怀疑论，更不是不可知论。"}, {"id": "17-3-1-2", "name": "代表人物", "category": 4, "symbolSize": 22, "desc": "陈晓平持激进解读，希尔贝克等持温和解读，陈波同意温和解读", "detail": "(1)激进解读长期占据主导地位，在20世纪哲学中影响广泛。(2)陈晓平明确持有激进解读。(3)陈波本人同意希尔贝克等的温和解读。"}, {"id": "17-3-1-3", "name": "修正版本", "category": 4, "symbolSize": 22, "desc": "温和解读：休谟结论是认识论的而非本体论的", "detail": "(1)\"休谟并没有说在原因和结果之间没有必然联系，他只是说我们不可能知道这样一种可能的必然性\"。(2)休谟的结论是认识论的，而不是本体论的。(3)休谟并没有说我们不应该预期那些按迄今为止的方式运动的球，他只是说我们不可能知道这一点。"}]}, {"id": "17-3-2", "name": "休谟的温和结论", "category": 3, "symbolSize": 26, "desc": "我们只能假设却永远不能证明经验过的对象必然类似于未发现的对象", "children": [{"id": "17-3-2-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "休谟结论相当有节制：理性上无法证明，只能如实说\"不知道\"", "detail": "(1)我们在理性上没有甚至无法证明因果关系的客观必然性。(2)我们在逻辑上没有甚至无法证明归纳推理的有效性。(3)因果关系究竟是否客观必然？归纳推理能否得出必然真实结论？只能如实说\"不知道\"，至少没有确切证据说\"知道\"。"}, {"id": "17-3-2-2", "name": "经典诘难", "category": 4, "symbolSize": 22, "desc": "如\"因果关系不存在\"\"归纳不合理\"等推论是过度引申", "detail": "(1)偏离了休谟论证的本义。(2)与休谟本人所持有的其他观点相冲突。(3)有四个证据可反驳极端解读。"}]}, {"id": "17-3-3", "name": "反驳激进解读的四条证据", "category": 3, "symbolSize": 26, "desc": "休谟对因果的肯定说明、习惯源自自然、给原因下定义、反对皮浪主义", "children": [{"id": "17-3-3-1", "name": "论证依据", "category": 4, "symbolSize": 22, "desc": "四条证据证明休谟并非极端怀疑论者", "detail": "(1)休谟提供因果关系的肯定性说明：因果关系起源于现象间的恒常汇合和人的习惯性心理联想，他赞赏习惯的作用：\"习惯是人生的伟大指导\"。(2)习惯或本能是自然本身的赋予，其效力来源于自然：\"自然在我们身上植入了一种本能，使我们的思想的进行过程与自然在外界对象中的确定的过程相对应\"。(3)若休谟论证因果关系不存在、归纳不合理，为何他还给\"原因\"下两个定义并探讨判断因果的8条规则？(4)\"我们肯定我们的能力，并运用我们的理性，只是因为我们不得不如此。要不是自然是十分强大的，哲学就会使我们变成皮浪主义者。\""}]}, {"id": "17-3-4", "name": "休谟的真正意图", "category": 3, "symbolSize": 26, "desc": "挫败理性的傲慢与自负，呼唤理性的自律、节制、谨慎与谦虚", "children": [{"id": "17-3-4-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "休谟不是要摧毁理性，而是要理性认识自己的限度", "detail": "(1)\"一般说来，一位正确的推理者应当永远带有某种程度的怀疑、谨慎和谦虚。\"(2)理性在探讨崇高神秘之事时觉察到自己的鲁莽，于是谦虚地返回真正而恰当的领域——日常生活。(3)如果理性能做到这一点，\"那就太幸运了\"。"}]}]}, {"id": "17-4", "name": "归纳辩护：用康德来补救休谟？", "category": 2, "symbolSize": 32, "desc": "陈晓平以先验范畴和范导规则为归纳辩护，但该方案取消了休谟问题", "children": [{"id": "17-4-1", "name": "陈晓平的先验主义路径", "category": 3, "symbolSize": 26, "desc": "采用先验主义立场，预设先验范畴和范导规则为归纳辩护", "children": [{"id": "17-4-1-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "需肯定回答两个问题并给出根据才能解决休谟问题", "detail": "(1)问题一：对于一个随机事件而言，真正的独立重复试验是存在的吗？其根据是什么？(2)问题二：对于每一事件而言，必有一事件是它的原因（或结果）吗？其根据是什么？(3)仅当对以上两个问题都给以肯定的回答并给出其根据，休谟问题才能得到解决。"}, {"id": "17-4-1-2", "name": "代表人物", "category": 4, "symbolSize": 22, "desc": "陈晓平追随康德的榜样，采用先验主义立场", "detail": "(1)陈晓平认为康德对因果范畴的阐述有问题。(2)仅设定因果性为先验范畴还不够，必须增加随机性和统计性。(3)\"So far so good\"（到此为止一切如意）。"}]}, {"id": "17-4-2", "name": "三先验范畴与两范导规则", "category": 3, "symbolSize": 26, "desc": "因果性、随机性、统计性三先验范畴，普遍因果性和普遍随机性两范导规则", "children": [{"id": "17-4-2-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "因果、随机、统计是先验范畴，对应两范导规则", "detail": "(1)普遍因果性原则：对于每一事件存在一个先行事件是它的原因或后行事件是它的结果，内容由普遍因果律、先因后果律和因果共变律具体化。(2)普遍随机性原则：对于每一随机事件存在一个与其有恒定概率的随机性关系的事件，即独立重复试验。(3)陈晓平给出康德式回答：如果没有它们，一切经验知识都是不可能的——它们是获得经验的先决条件。"}, {"id": "17-4-2-2", "name": "修正版本", "category": 4, "symbolSize": 22, "desc": "对康德范畴体系的修正：增加随机性和统计性，修改时空观", "detail": "(1)康德错误：把空间仅看作外经验直观形式而非内经验直观形式，把时间仅看作内经验直观形式而非外经验直观形式。(2)康德的时空概念导致实质性错误，如断言欧氏几何和纯粹力学都是先验综合知识。(3)需要作出很多修改和增补。"}]}, {"id": "17-4-3", "name": "先验方案的根本困难", "category": 3, "symbolSize": 26, "desc": "先验范畴的选择有任意性，先验头衔不能避免犯错", "children": [{"id": "17-4-3-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "给某些东西加上\"先验的\"冠冕并不是它们不会错的保证", "detail": "(1)为什么因果性、随机性和统计性是先验范畴而其他范畴如\"合规律性\"不是？为什么普遍因果原则和普遍随机性原则是范导规则？(2)康德的先验范畴体系有很多缺陷和不足，需要重大修改和增补。(3)这就说明加上\"先验的\"冠冕并不保证不会错，甚至有逃避理智责任的嫌疑。"}, {"id": "17-4-3-2", "name": "论证依据", "category": 4, "symbolSize": 22, "desc": "作者在先验性问题上的立场：不承认整个人类认知中有任何先验的东西", "detail": "(1)对于整个人类的认知来说，不存在任何先验的东西：一切知识和技能都是在与自然界长期打交道过程中逐渐获得或改善的，可用自然主义方式解释。(2)对于单个个体而言，存在某些先验因素：遗传结构使人具有先天潜能（如学会语言），儿童学语言过程中接受了前人切分世界的方式和价值系统。(3)这些因素也具有经验的起源，可用经验论原理加以解释。"}]}, {"id": "17-4-4", "name": "先验方案取消而非解决休谟问题", "category": 3, "symbolSize": 26, "desc": "先验接受因果性等是与休谟经验论立场根本冲突，彻底取消问题前提", "children": [{"id": "17-4-4-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "休谟本人和其他经验论者肯定不能接受这种先验式解答", "detail": "(1)休谟是彻底的经验论者：一切知识都来源于感觉印象，凡是在思维中的东西无不先在感觉中。(2)从该立场出发考察因果关系，时间先后相继和时空邻近都可感知到，唯有必然性观念是感觉经验中没有的。(3)先验地接受因果性和普遍因果原则等，与休谟的经验论立场根本冲突。"}, {"id": "17-4-4-2", "name": "经典诘难", "category": 4, "symbolSize": 22, "desc": "先验方案将休谟问题赖以产生的前提彻底取消，也就彻底取消了问题", "detail": "(1)并非如陈晓平所说只能局部解决归纳合理性问题。(2)康德哲学主张知识起源于感觉经验材料和先天认识形式，后者赋予知识普遍必然性，彻底颠覆休谟问题赖以产生的前提。(3)陈晓平提出的先验式方案没有解决休谟问题，而是取消了休谟问题。(4)蒯因断言：\"休谟的困境就是人类的困境。\"休谟问题真的能够被取消吗？"}]}]}, {"id": "17-5", "name": "借题发挥：用笛卡尔来补救康德？", "category": 2, "symbolSize": 32, "desc": "陈晓平从\"我思故我在\"出发推出广延性之我，陈波认为如读神话", "children": [{"id": "17-5-1", "name": "康德哲学的根本缺陷", "category": 3, "symbolSize": 26, "desc": "先验直观和范畴建基于统觉这一未加说明的心理学事实，构成恶性循环", "children": [{"id": "17-5-1-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "康德的形而上学大厦面临坍塌危险：理论在逻辑上构成恶性循环", "detail": "(1)先验直观和先验范畴都是建基于统觉这种思维特性。(2)而这种思维特性只是一个不加说明的心理学事实。(3)对这一心理学事实的认识属于经验知识。(4)而一切经验知识都建基于先验直观和先验范畴——构成恶性循环。"}, {"id": "17-5-1-2", "name": "修正版本", "category": 4, "symbolSize": 22, "desc": "陈晓平方案：求助于笛卡尔的\"我思故我在\"拯救康德哲学", "detail": "(1)那个正在怀疑一切的\"我思\"就是一个具有自返性的统觉。(2)\"我思\"具有双重性：既是思维的对象又是思维本身，既是先验范畴发挥作用的素材又是先验范畴发挥作用的手段。(3)由此\"借题大发挥\"出一套康德式的形而上学体系。"}]}, {"id": "17-5-2", "name": "从\"我思\"到\"广延性之我\"的推理链", "category": 3, "symbolSize": 26, "desc": "陈晓平由\"我在怀疑\"出发，展开一系列推理推出质料的形而上学", "children": [{"id": "17-5-2-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "\"我思\"和\"我在\"之间是直接同一性关系，推出自由意志、外物存在等", "detail": "(1)既然\"我在怀疑\"即\"我在思考\"，故不可能没有一个正在怀疑或思考的\"我\"，因此\"我在\"。(2)\"我思\"中的\"我\"和\"思\"都指进行着的思维，是一个精神性的主体。(3)既然\"我\"可自由地思考，说明\"我\"有\"自由意志\"。(4)自由意志常常受阻，故可推出\"外物存在\"，于是有\"客体\"\"主体\"之分、\"本体\"\"现象\"之分。(5)\"我就是正在进行着的思维，是有其内容的，且其内容不是单一的而是多样的\"——把多样性叫做\"广延性\"，得出\"我是具有广延性的\"。"}]}, {"id": "17-5-3", "name": "从精神性\"我\"到物质性\"我\"的跨越", "category": 3, "symbolSize": 26, "desc": "陈晓平的推理比笛卡尔更直接便当，但关键跨越难以置信", "children": [{"id": "17-5-3-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "从精神性的\"我\"推出物质性的\"我\"，这一步巨大跨越如何可能？", "detail": "(1)笛卡尔必须求助于观念的清楚明白和上帝观念的无限完满性，推出上帝存在，再由上帝全知全善全能推出外物和自我真实存在。(2)陈晓平几乎不求助于笛卡尔的所有手段，推理过程更直接：\"我在思考，思考有内容，内容有多样性，这种多样性就是广延性，因此我是一个有广延性的实体，即物质性的实体！\"(3)陈波对此惊叹\"Magic！\"\"My God！\""}, {"id": "17-5-3-2", "name": "经典诘难", "category": 4, "symbolSize": 22, "desc": "一般认为广延性是物质客体的属性，精神性的\"我\"何以有广延性？", "detail": "(1)\"广延性\"是物质客体的属性，具有广延性的\"我\"就是一个物质性客体。(2)如何从精神性的\"我\"推出物质性的\"我\"？这一步巨大的跨越是如何可能的？(3)当用如此方式去拯救康德哲学时，康德本人会怎么想？会做何反应？能够接受吗？"}]}]}, {"id": "17-6", "name": "对一套新的形而上学体系的建构？", "category": 2, "symbolSize": 32, "desc": "陈晓平建构四部分形而上学体系，陈波钦佩其抱负但担忧整全体系的意义", "children": [{"id": "17-6-1", "name": "质料的形而上学", "category": 3, "symbolSize": 26, "desc": "由\"我思故我在\"展开的推理构成，是关于经验质料的形而上学", "children": [{"id": "17-6-1-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "我思是一种经验，我是一种质料，由此推出其他形而上学命题", "detail": "(1)\"因为我思是一种经验，我是一种质料\"。(2)由此推出的其他形而上学命题都是关于经验质料的。(3)进而形成一种关于质料的形而上学。"}]}, {"id": "17-6-2", "name": "形式的形而上学：8组24范畴", "category": 3, "symbolSize": 26, "desc": "陈晓平将康德4组12范畴改造为8组24范畴的先验范畴体系", "children": [{"id": "17-6-2-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "八组范畴涵盖对象、质、量、度量、界限、形式、关系、模态", "detail": "(1)关于对象的范畴：实体、属性、事态。(2)关于质的范畴：存在、虚无、实在。(3)关于量的范畴：单一、复多、集合。(4)关于度量的范畴：（基始数）一、（某数）加一、自然数集合。(5)关于界限的范畴：有限、潜无限、实无限。(6)关于形式的范畴：时间、空间、变化。(7)关于关系的范畴：因果性、随机性、统计性。(8)关于模态的范畴：必然性、可能性、实然性。"}]}, {"id": "17-6-3", "name": "理念的形而上学：5个范导规则", "category": 3, "symbolSize": 26, "desc": "自由意志普遍律、上帝存在、灵魂不灭、普遍因果律、普遍随机性", "children": [{"id": "17-6-3-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "接受康德3个范导规则，增加普遍因果律和普遍随机性两范导规则", "detail": "(1)自由意志对应的普遍律原则：按你同时期望每个人都遵守的准则去行动，引导趋向道德自律和实现意志自由。(2)上帝存在的范导原则：引导趋向至善，德福相配。(3)灵魂不灭的范导原则：引导始终不渝追求至善。(4)普遍因果律原则：对于每一事件存在先行原因是其因或后行事件是其果。(5)普遍随机性原则：对于每一随机事件存在与其有恒定概率的随机性关系的事件。"}, {"id": "17-6-3-2", "name": "代表人物", "category": 4, "symbolSize": 22, "desc": "陈晓平继承康德的三范导规则并增加两条", "detail": "(1)康德原有的三条范导规则：自由意志、上帝存在、灵魂不灭。(2)陈晓平新增两条：普遍因果律原则和普遍随机性原则。(3)方法的形而上学作为最终基础，预设演绎推理有效性、递推方法和正反合方法。"}]}, {"id": "17-6-4", "name": "对整全体系的质疑与担忧", "category": 3, "symbolSize": 26, "desc": "在科学发达、信息爆炸的当代，建构整全形而上学体系是否仍行得通？", "children": [{"id": "17-6-4-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "敬佩理智抱负，但担忧知识不够时用猜想臆测填充", "detail": "(1)陈波钦佩陈晓平的理智抱负：他不满足于\"照着讲\"而是要\"接着讲\"，这种抱负和气魄值得赞赏。(2)担忧一：在科学高度发达、分工细密的当代，沿康德黑格尔路子提出关于世界的\"整全性\"解释是否仍行得通？(3)担忧二：构造整全体系时遇到知识不够怎么办？用猜想臆测填充？(4)担忧三：体系哲学中常有很多主观任意的成分，先验范畴体系为何是8组24个而不是更多或更少？"}, {"id": "17-6-4-2", "name": "经典诘难", "category": 4, "symbolSize": 22, "desc": "罗素的告诫：对体系的爱好以及体系创造者的虚夸自负是研究哲学的陷阱", "detail": "(1)罗素告诫：\"对体系的爱好以及与之相随的体系创造者的虚夸自负是研究哲学的人必须谨防的陷阱。\"(2)陈波自述：对宏大哲学体系保持敬畏而疏远之，更喜欢哲学家字里行间显露的鲜活智慧。(3)改用胡适的话：在信息爆炸的当代，还是多深入研究一些比较具体的哲学问题，少构造一些带有整全性的哲学体系吧！"}, {"id": "17-6-4-3", "name": "修正版本", "category": 4, "symbolSize": 22, "desc": "康德先验哲学三部分vs陈晓平四部分体系：增加了方法的形而上学", "detail": "(1)康德先验哲学包括三部分：先验感性论、先验知性论和先验理性论。(2)陈晓平体系包括四部分：质料的形而上学、形式的形而上学、理念的形而上学、方法的形而上学。(3)方法的形而上学是一切形而上学的最终基础，又称\"元形而上学\"。"}]}]}]}]};

// TREE data embedded above

!function(){
'use strict';

// ==================== CONSTANTS ====================
var RING_L2 = 400;
var RING_L3 = 180;
var RING_L4 = 120;
var RADIAL_L5 = 90;
var REPULSION = 1500;
var GRAVITY = 0.02;
var DEBOUNCE_MS = 200;

// ==================== INDEXING ====================
var nodeMap = {};
var childrenMap = {};
var parentMap = {};
var depthMap = {};
var isAppendixMap = {};
var nodeList = [];  // flat list for search

function indexTree(node, parentId, depth, isApp) {
  nodeMap[node.id] = node;
  depthMap[node.id] = depth;
  if (isApp) isAppendixMap[node.id] = true;
  if (parentId) parentMap[node.id] = parentId;
  nodeList.push({id: node.id, name: node.name, desc: node.desc || '', depth: depth, isApp: !!isApp});
  var kids = (node.children || []).map(function(c) { return c.id; });
  childrenMap[node.id] = kids;
  (node.children || []).forEach(function(c) { indexTree(c, node.id, depth + 1, isApp || !!node.isAppendix); });
}
indexTree(TREE, null, 0, false);

var l2Count = (childrenMap[TREE.id] || []).length;
console.log('二级节点总数: ' + l2Count + ' (预期17), 总节点: ' + Object.keys(nodeMap).length);

// ==================== IDEAL POSITIONS ====================
var idealPos = {};
function computeAllPositions() {
  idealPos = {};
  idealPos[TREE.id] = {x: 0, y: 0};
  var l2ids = childrenMap[TREE.id] || [];
  var n2 = l2ids.length;
  l2ids.forEach(function(id, i) {
    var angle = (i / n2) * 2 * Math.PI - Math.PI / 2;
    idealPos[id] = { x: RING_L2 * Math.cos(angle), y: RING_L2 * Math.sin(angle) };
  });
  Object.keys(childrenMap).forEach(function(pid) {
    var pd = depthMap[pid] || 0;
    var kids = childrenMap[pid] || [];
    var pp = idealPos[pid];
    if (!pp || kids.length === 0) return;
    var n = kids.length;
    if (pd === 1) {
      kids.forEach(function(cid, j) {
        var a = (j / n) * 2 * Math.PI - Math.PI / 2;
        idealPos[cid] = { x: pp.x + RING_L3 * Math.cos(a), y: pp.y + RING_L3 * Math.sin(a) };
      });
    } else if (pd === 2) {
      kids.forEach(function(cid, j) {
        var a = (j / n) * 2 * Math.PI - Math.PI / 2;
        idealPos[cid] = { x: pp.x + RING_L4 * Math.cos(a), y: pp.y + RING_L4 * Math.sin(a) };
      });
    } else if (pd >= 3) {
      if (n === 1) {
        var gpid = parentMap[pid];
        var gp = gpid ? idealPos[gpid] : {x: 0, y: 0};
        var dx = pp.x - (gp.x || 0), dy = pp.y - (gp.y || 0);
        var dist = Math.sqrt(dx * dx + dy * dy) || 1;
        idealPos[kids[0]] = { x: pp.x + (dx / dist) * RADIAL_L5, y: pp.y + (dy / dist) * RADIAL_L5 };
      } else {
        kids.forEach(function(cid, j) {
          var a = (j / n) * 2 * Math.PI - Math.PI / 2;
          idealPos[cid] = { x: pp.x + RADIAL_L5 * Math.cos(a), y: pp.y + RADIAL_L5 * Math.sin(a) };
        });
      }
    }
  });
}
computeAllPositions();

// ==================== STATE ====================
var expandedSet = {};
var visibleSet = {};
var curNodes = [];
var dragId = null;
var selectedNodeId = null;     // currently selected/viewed node
var navHistory = [];           // history of visited node IDs
var navIndex = -1;
var favorites = {};            // id -> true

// Load favorites from localStorage
try {
  var stored = localStorage.getItem('logic_kg_favorites');
  if (stored) favorites = JSON.parse(stored);
} catch(e) {}

function saveFavorites() {
  try { localStorage.setItem('logic_kg_favorites', JSON.stringify(favorites)); } catch(e) {}
}

function refreshVisibility() {
  visibleSet = {};
  visibleSet[TREE.id] = true;
  (function walk(node) {
    if (expandedSet[node.id] && node.children) {
      node.children.forEach(function(c) {
        visibleSet[c.id] = true;
        walk(c);
      });
    }
  })(TREE);
}

// ==================== VISUAL HELPERS ====================
var CAT_COLORS = ['#1e3a8a', '#2563eb', '#7c3aed', '#4b5563', '#6b7280', '#9ca3af'];
var CAT_LABELS = ['根节点', '章节', '附录', '小节标题', '概念', '子概念'];
var SYM_SIZES = [90, 32, 32, 26, 22, 18];
var FONT_SIZES = [16, 14, 14, 12, 10, 10];

function getCat(depth, isApp) {
  if (depth === 0) return 0;
  if (depth === 1) return isApp ? 2 : 1;
  if (depth === 2) return 3;
  return 4;
}

function getColor(depth, isApp) {
  if (depth === 0) return CAT_COLORS[0];
  if (depth === 1) return isApp ? CAT_COLORS[2] : CAT_COLORS[1];
  if (depth === 2) return CAT_COLORS[3];
  return CAT_COLORS[4];
}

function getSymSize(depth) { return SYM_SIZES[Math.min(depth, 5)] || 18; }
function getFont(depth) { return FONT_SIZES[Math.min(depth, 5)] || 10; }

// ==================== PATH HELPERS ====================
function getPathToRoot(id) {
  var path = [];
  var cur = id;
  while (cur) {
    path.unshift(cur);
    cur = parentMap[cur];
  }
  return path;
}

function getAncestors(id) {
  var path = getPathToRoot(id);
  path.pop(); // remove self
  return path;
}

// ==================== BUILD GRAPH DATA ====================
function buildGraphData() {
  var nodes = [], links = [];
  var ids = Object.keys(visibleSet);

  // Find the path from root to selected node for highlighting
  var highlightPath = {};
  if (selectedNodeId && visibleSet[selectedNodeId]) {
    var path = getPathToRoot(selectedNodeId);
    path.forEach(function(id) { highlightPath[id] = true; });
  }

  ids.forEach(function(id) {
    var node = nodeMap[id];
    if (!node) return;
    var pos = idealPos[id] || {x: 0, y: 0};
    var d = depthMap[id] || 0;
    var isApp = isAppendixMap[id] || false;
    var cat = getCat(d, isApp);
    var hk = (childrenMap[id] || []).length > 0;
    var ex = !!expandedSet[id];
    var onPath = !!highlightPath[id];
    var isFav = !!favorites[id];

    nodes.push({
      id: id, name: node.name || '', category: cat,
      symbolSize: onPath ? getSymSize(d) * 1.12 : getSymSize(d),
      x: pos.x, y: pos.y,
      fixed: d <= 1,
      _d: d, _hk: hk, _ex: ex, _ix: pos.x, _iy: pos.y, _isApp: isApp,
      _onPath: onPath, _isFav: isFav,
      itemStyle: {
        color: onPath ? brightenColor(getColor(d, isApp)) : getColor(d, isApp),
        borderColor: onPath ? 'rgba(255,255,255,0.55)' : (d <= 1 ? 'rgba(255,255,255,0.35)' : 'rgba(255,255,255,0.16)'),
        borderWidth: onPath ? (d <= 1 ? 3 : 1.8) : (d === 0 ? 2.5 : (d === 1 ? 1.8 : 0.8)),
        shadowBlur: onPath ? 22 : (d <= 1 ? 16 : 0),
        shadowColor: onPath ? 'rgba(130,180,255,0.6)' : (d <= 1 ? 'rgba(37,99,235,0.45)' : 'transparent')
      },
      label: {
        show: true, position: 'right', distance: 15,
        fontSize: onPath ? getFont(d) + 1 : getFont(d),
        color: onPath ? '#e8f0ff' : (d <= 1 ? '#d0dcff' : (d === 2 ? '#b0b8cc' : '#888f9c')),
        fontWeight: onPath ? 'bold' : (d <= 1 ? 'bold' : 'normal'),
        formatter: function(p) {
          var n = p.name || '';
          var suffix = isFav ? ' ⭐' : '';
          return (n.length > 16 ? n.slice(0, 15) + '\u2026' : n) + suffix;
        }
      }
    });
  });

  ids.forEach(function(id) {
    var kids = childrenMap[id] || [];
    kids.forEach(function(cid) {
      if (!visibleSet[cid]) return;
      var sd = depthMap[id] || 0;
      var onPath = highlightPath[id] && highlightPath[cid];
      var op = onPath ? 0.9 : (sd === 0 ? 0.7 : (sd === 1 ? 0.6 : 0.4));
      var el = sd === 0 ? RING_L2 : (sd === 1 ? RING_L3 : (sd === 2 ? RING_L4 : 100));
      links.push({
        source: id, target: cid,
        lineStyle: {
          color: onPath ? 'rgba(150,200,255,' + op + ')' : 'rgba(100,140,220,' + op + ')',
          width: onPath ? 1.8 : 1,
          curveness: 0.12, opacity: op
        },
        force: { edgeLength: el }
      });
    });
  });

  return { nodes: nodes, links: links };
}

function brightenColor(hex) {
  var r = parseInt(hex.slice(1, 3), 16);
  var g = parseInt(hex.slice(3, 5), 16);
  var b = parseInt(hex.slice(5, 7), 16);
  r = Math.min(255, r + 50);
  g = Math.min(255, g + 40);
  b = Math.min(255, b + 50);
  return '#' + [r, g, b].map(function(v) { return v.toString(16).padStart(2, '0'); }).join('');
}

// ==================== ECHARTS ====================
var chart = null;
var container = document.getElementById('chart');
var lastRenderTime = 0;

function baseOption() {
  return {
    backgroundColor: 'transparent',
    animation: true, animationDuration: 500, animationEasing: 'cubicInOut',
    tooltip: {
      show: true, trigger: 'item', confine: true,
      formatter: function(p) {
        if (p.dataType !== 'node') return '';
        var node = nodeMap[p.data.id];
        var desc = node ? node.desc || '' : '';
        var d = p.data._d || 0;
        var s = '<div style="max-width:320px;padding:4px 0">';
        s += '<b style="color:#aaccff;font-size:13px">' + escH(p.data.name || '') + '</b>';
        if (p.data._isFav) s += ' <span style="color:#f0b90b">⭐</span>';
        s += '<div style="color:#6b8ab8;font-size:10px;margin:3px 0">' + (CAT_LABELS[d] || '') + '</div>';
        if (desc) s += '<div style="color:#b0bdd0;font-size:11px;line-height:1.5">' + escH(desc) + '</div>';
        if (p.data._hk) s += '<div style="color:#6a90cc;font-size:10px;margin-top:3px">' + (p.data._ex ? '▼ 点击收起子节点' : '▶ 点击展开子节点') + '</div>';
        s += '</div>'; return s;
      },
      backgroundColor: 'rgba(6,11,31,0.96)', borderColor: 'rgba(80,120,220,0.35)', borderWidth: 1,
      textStyle: { color: '#c8d4f0', fontSize: 11 },
      extraCssText: 'border-radius:10px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:0 8px 30px rgba(0,0,0,0.5)'
    },
    series: [{
      type: 'graph', layout: 'force', roam: true, draggable: true,
      scaleLimit: { min: 0.3, max: 2.5 },
      categories: [
        { name: '根节点' }, { name: '正文章节' }, { name: '附录' },
        { name: '小节标题' }, { name: '概念' }
      ],
      force: {
        initIterations: 40, repulsion: REPULSION, gravity: GRAVITY,
        edgeLength: 200, layoutAnimation: true, friction: 0.6
      },
      emphasis: {
        focus: 'adjacency',
        scale: 1.18,
        lineStyle: { width: 2.5 },
        itemStyle: { shadowBlur: 24, shadowColor: 'rgba(80,140,240,0.7)' },
        label: { fontWeight: 'bold', fontSize: 15 }
      },
      blur: { itemStyle: { opacity: 0.2 }, lineStyle: { opacity: 0.06 } },
      lineStyle: { opacity: 0.5, curveness: 0.15 }
    }]
  };
}

function renderChart() {
  if (!chart) return;
  var g = buildGraphData();
  curNodes = g.nodes;
  var opt = baseOption();
  opt.series[0].data = g.nodes;
  opt.series[0].links = g.links;
  lastRenderTime = Date.now();
  chart.setOption(opt, { notMerge: true });
  updateBreadcrumb();
  updateFavButton();
  updateOutlineSelection();
}

// ==================== INIT CHART ====================
function initChart() {
  if (chart) { chart.dispose(); chart = null; }
  chart = echarts.init(container, null, { devicePixelRatio: Math.min(window.devicePixelRatio || 1, 1.5) });
  renderChart();

  chart.on('click', function(p) {
    if (p.dataType === 'node') {
      clickNode(p.data.id);
    } else if (p.componentType === 'series' && !p.data) {
      closePanel();
    }
  });

  chart.on('dblclick', function(p) {
    if (p.dataType === 'node') {
      focusNodeById(p.data.id);
    }
  });

  chart.on('mousedown', function(p) {
    if (p.dataType === 'node') dragId = p.data.id;
  });
  chart.on('mouseup', function(p) {
    if (p.dataType === 'node') {
      var d = depthMap[p.data.id];
      if (d != null && d <= 1) snapBack(p.data.id);
    }
    dragId = null;
  });

  window.addEventListener('resize', onResize);
}

// ==================== NODE CLICK ====================
function clickNode(id) {
  var kids = childrenMap[id] || [];
  var hk = kids.length > 0;

  // Add to history
  if (navIndex < navHistory.length - 1) {
    navHistory = navHistory.slice(0, navIndex + 1);
  }
  if (navHistory[navHistory.length - 1] !== id) {
    navHistory.push(id);
    navIndex = navHistory.length - 1;
  }

  selectedNodeId = id;
  updateFavButton();

  if (!hk) {
    showPanel(id);
    renderChart(); // re-render for path highlighting
    return;
  }

  if (expandedSet[id]) {
    collapseRecursive(id);
  } else {
    expandedSet[id] = true;
  }

  refreshVisibility();
  renderChart();
}

function collapseRecursive(id) {
  delete expandedSet[id];
  var kids = childrenMap[id] || [];
  kids.forEach(function(cid) { collapseRecursive(cid); });
}

// ==================== SNAP BACK ====================
function snapBack(id) {
  if (!chart) return;
  var pos = idealPos[id];
  if (!pos) return;
  curNodes.forEach(function(n) { if (n.id === id) { n.x = pos.x; n.y = pos.y; } });
  chart.setOption({ series: [{ data: [{ id: id, x: pos.x, y: pos.y }] }] }, { silent: true });
}

// ==================== RESIZE ====================
var resizeTimer = null;
function onResize() {
  if (resizeTimer) clearTimeout(resizeTimer);
  resizeTimer = setTimeout(function() {
    if (chart) chart.resize();
    initParticles();
    resizeTimer = null;
  }, DEBOUNCE_MS);
}

// ==================== DETAIL PANEL ====================
function showPanel(id) {
  var node = nodeMap[id];
  if (!node) return;
  var d = depthMap[id] || 0;
  var isApp = isAppendixMap[id] || false;
  var cat = getCat(d, isApp);
  var color = getColor(d, isApp);

  selectedNodeId = id;

  document.getElementById('pdot').style.background = color;
  document.getElementById('pdot').style.boxShadow = '0 0 20px ' + color;
  document.getElementById('pname').textContent = node.name || '';
  document.getElementById('ptag').textContent = (CAT_LABELS[cat] || '') + ' · ' + (node.id || '');

  var body = document.getElementById('pbody'), h = '';

  // Path
  var path = getPathToRoot(id);
  if (path.length > 1) {
    h += '<div class="sec"><div class="lbl">📍 路径</div><div class="txt">';
    h += path.map(function(pid, i) {
      var pn = nodeMap[pid];
      var pname = pn ? pn.name : pid;
      if (i === path.length - 1) return '<span class="path-item" style="color:#b0c8f8;font-weight:600">' + escH(pname) + '</span>';
      return '<span class="path-item" onclick="event.stopPropagation();navigateTo(\'' + pid + '\')">' + escH(pname) + '</span><span class="path-sep">›</span>';
    }).join('');
    h += '</div></div>';
  }

  // Stats
  h += '<div class="sec"><div class="lbl">📊 统计</div><div class="txt" style="font-size:12px;color:#8899bb">';
  h += '深度: ' + d + ' · 子节点: ' + ((childrenMap[id] || []).length || 0) + ' · 收藏: ' + (favorites[id] ? '⭐ 是' : '否');
  h += '</div></div>';

  // Description
  if (node.desc) {
    h += '<div class="sec"><div class="lbl">📖 概述</div><div class="txt">' + escH(node.desc) + '</div></div>';
  }

  // Detail
  if (node.detail) {
    h += '<div class="sec"><div class="lbl">📝 详细内容</div><div class="txt">' + escH(node.detail) + '</div></div>';
  }

  // Parent
  if (parentMap[id] && nodeMap[parentMap[id]]) {
    var p = nodeMap[parentMap[id]];
    h += '<div class="sec"><div class="lbl">⬆ 父节点</div><div class="kids"><span class="kc" onclick="event.stopPropagation();navigateTo(\'' + parentMap[id] + '\')">' + escH(p.name) + '</span></div></div>';
  }

  // Children
  var kids = childrenMap[id] || [];
  if (kids.length > 0) {
    var ex = !!expandedSet[id];
    h += '<div class="sec"><div class="lbl">🔗 子节点 (' + kids.length + '个) <span style="color:' + (ex ? '#4ade80' : '#f59e0b') + ';font-size:10px">' + (ex ? '已展开' : '已收起') + '</span></div>';
    h += '<div class="kids">';
    h += kids.map(function(cid) {
      var cn = nodeMap[cid];
      return cn ? '<span class="kc" onclick="event.stopPropagation();navigateTo(\'' + cid + '\')">· ' + escH(cn.name) + '</span>' : '';
    }).filter(Boolean).join('<br/>');
    h += '</div></div>';
  } else {
    h += '<div class="sec"><div class="lbl">📌 末端节点</div><div class="txt" style="color:#8899aa">无下级子节点。点击其他节点可继续浏览知识结构。</div></div>';
  }

  // Siblings
  if (parentMap[id]) {
    var sibs = childrenMap[parentMap[id]] || [];
    var otherSibs = sibs.filter(function(sid) { return sid !== id; });
    if (otherSibs.length > 0) {
      h += '<div class="sec"><div class="lbl">↔ 同级节点 (' + (sibs.length - 1) + '个)</div>';
      h += '<div class="kids">';
      h += otherSibs.map(function(sid) {
        var sn = nodeMap[sid];
        return sn ? '<span class="kc" onclick="event.stopPropagation();navigateTo(\'' + sid + '\')">· ' + escH(sn.name) + '</span>' : '';
      }).filter(Boolean).join('<br/>');
      h += '</div></div>';
    }
  }

  body.innerHTML = h;

  document.getElementById('panel').classList.add('on');
  document.getElementById('overlay').classList.add('on');
  updateFavButton();
  renderChart();
}

function escH(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

window.closePanel = function() {
  document.getElementById('panel').classList.remove('on');
  document.getElementById('overlay').classList.remove('on');
};

// ==================== NAVIGATION ====================
function navigateTo(id) {
  // First make sure all ancestors are expanded so the node is visible
  var ancestors = getAncestors(id);
  var needRebuild = false;
  ancestors.forEach(function(aid) {
    if (!expandedSet[aid]) {
      expandedSet[aid] = true;
      needRebuild = true;
    }
  });
  if (needRebuild) {
    refreshVisibility();
    renderChart();
  }
  // Show the panel
  showPanel(id);
  // Highlight
  selectedNodeId = id;
  renderChart();
  // Center on node
  centerOnNode(id);
}

function centerOnNode(id) {
  if (!chart) return;
  var node;
  for (var i = 0; i < curNodes.length; i++) {
    if (curNodes[i].id === id) { node = curNodes[i]; break; }
  }
  if (node) {
    chart.dispatchAction({ type: 'highlight', seriesIndex: 0, dataIndex: i });
    // Flash the node briefly
    setTimeout(function() { chart.dispatchAction({ type: 'downplay', seriesIndex: 0 }); }, 1500);
  }
}

// ==================== FOCUS MODE ====================
function focusNode() {
  if (selectedNodeId) focusNodeById(selectedNodeId);
}
window.focusNode = focusNode;

function focusNodeById(id) {
  // Expand all descendants of this node
  expandAllDescendants(id);
  refreshVisibility();
  renderChart();
  // Try to center
  if (chart) {
    try {
      var nodes = curNodes.filter(function(n) { return n.id === id; });
      if (nodes.length > 0) {
        chart.dispatchAction({ type: 'highlight', seriesIndex: 0 });
      }
    } catch(e) {}
  }
  showToast('已聚焦: ' + (nodeMap[id] ? nodeMap[id].name : id));
}

function expandAllDescendants(id) {
  expandedSet[id] = true;
  var kids = childrenMap[id] || [];
  kids.forEach(function(cid) { expandAllDescendants(cid); });
}

function expandAllHere() {
  if (selectedNodeId) {
    expandAllDescendants(selectedNodeId);
    refreshVisibility();
    renderChart();
    showToast('已展开全部子节点');
  }
}
window.expandAllHere = expandAllHere;

// ==================== FAVORITES ====================
function toggleFavorite() {
  if (!selectedNodeId) return;
  if (favorites[selectedNodeId]) {
    delete favorites[selectedNodeId];
  } else {
    favorites[selectedNodeId] = true;
  }
  saveFavorites();
  updateFavButton();
  updateFavDropdown();
  renderChart();
}

function updateFavButton() {
  var btn = document.getElementById('btn-fav-toggle');
  if (!btn) return;
  if (selectedNodeId && favorites[selectedNodeId]) {
    btn.textContent = '⭐ 已收藏';
    btn.classList.add('fav-active');
  } else {
    btn.textContent = '☆ 收藏';
    btn.classList.remove('fav-active');
  }
}

function toggleFavDropdown() {
  var dd = document.getElementById('fav-dropdown');
  var show = !dd.classList.contains('show');
  dd.classList.toggle('show', show);
  if (show) updateFavDropdown();
}
window.toggleFavDropdown = toggleFavDropdown;

function updateFavDropdown() {
  var list = document.getElementById('fav-list');
  var favIds = Object.keys(favorites);
  if (favIds.length === 0) {
    list.innerHTML = '<div class="fav-empty">暂无收藏，点击面板中的 ☆ 收藏节点</div>';
    return;
  }
  list.innerHTML = favIds.map(function(fid) {
    var n = nodeMap[fid];
    var name = n ? n.name : fid;
    return '<div class="fav-item" onclick="navigateTo(\'' + fid + '\');toggleFavDropdown();">' +
      '<span style="color:#f0b90b">⭐</span> ' + escH(name) +
      '<span class="fav-remove" onclick="event.stopPropagation();removeFav(\'' + fid + '\')">✕</span>' +
      '</div>';
  }).join('');
}
window.updateFavDropdown = updateFavDropdown;

function removeFav(id) {
  delete favorites[id];
  saveFavorites();
  updateFavDropdown();
  updateFavButton();
  renderChart();
}
window.removeFav = removeFav;

// ==================== TREE OUTLINE ====================
function toggleOutline() {
  var ol = document.getElementById('tree-outline');
  var show = !ol.classList.contains('on');
  ol.classList.toggle('on', show);
  if (show) buildOutline();
  document.getElementById('btn-outline').classList.toggle('active', show);
}
window.toggleOutline = toggleOutline;

function buildOutline() {
  var body = document.getElementById('to-body');
  body.innerHTML = buildOutlineNode(TREE, 0);
}

function buildOutlineNode(node, depth) {
  var kids = childrenMap[node.id] || [];
  var hk = kids.length > 0;
  var ex = !!expandedSet[node.id];
  var isSel = node.id === selectedNodeId;
  var d = depthMap[node.id] || 0;
  var isApp = isAppendixMap[node.id] || false;
  var color = getColor(d, isApp);

  var h = '<div class="to-node' + (isSel ? ' active' : '') + '" style="padding-left:' + (16 + depth * 18) + 'px" onclick="navigateTo(\'' + node.id + '\');toggleOutline();">';
  if (hk) {
    h += '<span class="to-toggle' + (ex ? ' open' : '') + '">▶</span>';
  } else {
    h += '<span style="width:16px;flex-shrink:0"></span>';
  }
  h += '<span class="to-dot" style="background:' + color + '"></span>';
