迅速有效地把握自然语言表达式在具体语境中的语用涵义。(3)它将有助于计算机的自然语言理解、人与计算机之间的对话以及人的正确思维和成功交际，极有发展前途。"}]}]}, {"id": "4-8", "name": "实体—属性理论", "category": 2, "symbolSize": 32, "desc": "主词S从外延指实体，谓词P从内涵表属性，系词'是'表属性内在于实体。", "children": [{"id": "4-8-1", "name": "实体—属性解释模式", "category": 3, "symbolSize": 26, "desc": "'S是P'意为存在个体x使S指称x，存在性质f使P意谓f，且f属于x。", "children": [{"id": "4-8-1-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "主词S从外延解释指称实体，谓词P从内涵解释代表属性，系词表属性内在于实体。", "detail": "(1)主词S从外延角度解释，指称或代表实体。(2)谓词P从内涵角度解释，代表实体所具有的性质或状态。(3)系词'是'表示谓词所表示的性质或状态'内在于'主词所代表的实体之中。(4)命题'S是P'的意义为下列合取：存在个体x使S指称x，存在性质f使P意谓f，f属于x。"}, {"id": "4-8-1-2", "name": "论证依据", "category": 4, "symbolSize": 22, "desc": "比外延理论解释'姑娘都是美丽可爱的'等命题自然得多，更符合日常语言直观。", "detail": "(1)用这种观点解释'姑娘都是美丽可爱的''所有的金子都是闪光的''他是一片好心''金属都是导电的'等命题。(2)比用外延理论解释自然得多。(3)更符合人们的日常语言直观。"}]}, {"id": "4-8-2", "name": "亚里士多德十范畴", "category": 3, "symbolSize": 26, "desc": "亚里士多德区分十种范畴，以实体为中心，其他九个范畴围绕实体旋转。", "children": [{"id": "4-8-2-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "实体是不依赖于其他东西而独立存在者，是其他一切事物的本质、原因和存在根据。", "detail": "(1)实体在其最严格、最原始、最根本的意义上，是既不述说一个主体，也不存在于一个主体之中的东西。(2)实体是其他一切事物的本质、原因和存在根据。(3)实体是历经变化而保持不变者，在时间历程中能够允许相反的属性。(4)实体分为第一性实体(个别事物)、第二性实体(种和属)，第一性实体是所有其他东西的基础和主体。"}, {"id": "4-8-2-2", "name": "代表人物", "category": 4, "symbolSize": 22, "desc": "亚里士多德在《范畴篇》中详细阐述十范畴理论及实体学说。", "detail": "(1)亚里士多德区分了十种范畴：实体、数量、性质、关系、地点、时间、姿势、所有、主动、被动。(2)他把第一性实体(个别事物)视为一切存在的基础。(3)在第二性实体中，种比属更真正地是实体，因为种与第一性实体更为接近。"}]}, {"id": "4-8-3", "name": "主谓式命题分析范式", "category": 3, "symbolSize": 26, "desc": "实体与属性范畴的区分演变为命题中主词和谓词的区分，决定传统逻辑面貌。", "children": [{"id": "4-8-3-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "第一性实体只能作主词，属性范畴只能作谓词，形成主谓式命题分析范式。", "detail": "(1)第一性实体只能被其他事物所述说，在句子中只能作主词，不能作谓词。(2)第二性实体既可述说个别事物又可被属所述说，既可作主词也可作谓词。(3)其他九个属性范畴在其正常用法中只能作谓词，不能作主词。(4)亚氏的范畴理论决定了其整个逻辑学理论的面貌，使主谓式命题及其推理关系成为研究主题。"}]}, {"id": "4-8-4", "name": "个别—一般理论", "category": 3, "symbolSize": 26, "desc": "从实体—属性理论演变而来，认为主词代表个别，谓词代表一般，个别就是一般。", "children": [{"id": "4-8-4-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "在'S是P'中主词代表个性(个别)，谓词代表共性(一般)，个别就是一般。", "detail": "(1)直言命题中主词和谓词的关系充当了哲学上个别和一般的关系的载体。(2)代表性表述：'在'妈妈是人''铁是金属''树叶是绿的'等判断中，主词代表个性，谓词代表共性，主词和谓词的关系就是个性(个别)和共性(一般)的关系。'"}, {"id": "4-8-4-2", "name": "论证依据", "category": 4, "symbolSize": 22, "desc": "黑格尔认为判断是概念中潜藏的个别和一般诸矛盾环节的明确揭示与展开。", "detail": "(1)黑格尔认为判断是从概念那里发展出来的，概念本身包含着个性与共性诸矛盾环节。(2)在'玫瑰花是红的'中，主词'玫瑰花'是个别，谓词'红'是一般，'红'是'玫瑰花'本身所具有的。(3)柏拉图认为个别具体事物通过'分有'或'摹仿'一般性的理念而获得自身的实在性。"}, {"id": "4-8-4-3", "name": "经典诘难", "category": 4, "symbolSize": 22, "desc": "罗素指出黑格尔混淆了表示谓词的'是'与表示同一关系的'是'，得出错误论断。", "detail": "(1)罗素指出许多重大哲学和逻辑错误都是由混淆'是'的不同意义造成的。(2)黑格尔把表示谓词的'是'与表示同一关系的'是'相混淆，得出'个别就是一般'的错误论断。(3)他的思辨哲学大厦其实是建立在沙滩上的。"}, {"id": "4-8-4-4", "name": "代表人物", "category": 4, "symbolSize": 22, "desc": "柏拉图、黑格尔是源头，列宁进行了唯物辩证的批判改造。", "detail": "(1)柏拉图：认为在可感世界之外存在理念世界，一般是本原性、基础性的存在，个别是派生性的。(2)黑格尔：认为判断是概念中潜藏的个别和一般诸矛盾环节的明确揭示与展开。(3)列宁：对上述观点进行唯物辩证改造，指出'个别就是一般'中包含辩证法一切要素的萌芽。"}, {"id": "4-8-4-5", "name": "修正版本", "category": 4, "symbolSize": 22, "desc": "列宁指出任何个别都是一般，一般只能在个别中存在，任何个别都不能完全包括在一般中。", "detail": "(1)从最简单、最普通、最常见的命题开始就已经有辩证法：个别就是一般。(2)个别一定与一般相联而存在，一般只能在个别中存在，只能通过个别而存在。(3)任何个别(不论怎样)都是一般，任何一般都是个别的一部分或一方面或本质。(4)在任何命题中都可以且应当发现辩证法一切要素的萌芽。"}]}, {"id": "4-8-5", "name": "作者三点批判", "category": 3, "symbolSize": 26, "desc": "作者对个别—一般理论提出三点批评：缺陷、以偏概全、错误假定。", "children": [{"id": "4-8-5-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "个别—一般理论无法建立属于关系与包含于关系的区分，且不能解释关系命题。", "detail": "(1)第一点：个别—一般理论能解释许多语言现象，但无法建立属于关系与包含于关系的区分。属于关系禁自返、反对称、不传递；包含于关系自返、非对称、传递。(2)罗素指出，这种混淆不仅模糊了对判断和推理形式的全部研究，而且把事物与性质的关系等弄得暧昧不清。(3)第二点：若将个别—一般理论推广到一切语言现象则是错误的，不能解释同一关系和关系命题等。"}, {"id": "4-8-5-2", "name": "论证依据", "category": 4, "symbolSize": 22, "desc": "基本假定错误：并非一切命题都是主谓式命题，关系命题不可化归为主谓式。", "detail": "(1)第三点：个别—一般理论是建立在一切命题都是主谓式命题的错误假定之上的。(2)历史上许多大逻辑学家和大哲学家如莱布尼茨、康德都未能逃脱这一假定的束缚。(3)关系命题如'2<3''曹丕和曹植是兄弟''约翰把一朵漂亮的玫瑰花献给了玛丽'不能化归为主谓式命题。"}, {"id": "4-8-5-3", "name": "经典诘难", "category": 4, "symbolSize": 22, "desc": "将'2<3'化归为'2是小于3的'后，简单的传递推理反而变得无效。", "detail": "(1)把'2<3'化归为'2是小于3的'后，换位得到'小于3的是2'，从真命题推出假命题，推理无效。(2)如此简单的关系命题都不能化归为主谓式命题，更别说更复杂的了。(3)说一切命题都是主谓式命题或以化归为主谓式命题是错误的。"}, {"id": "4-8-5-4", "name": "代表人物", "category": 4, "symbolSize": 22, "desc": "罗素特别指出混淆属于与包含于关系在哲学上的严重后果。", "detail": "(1)罗素指出属于和包含于的区分是由皮亚诺和弗雷格各自独立做出的，是从希腊时代以来真正逻辑的第一个重大进步。(2)他明确指出了这种混淆所导致的哲学危害。(3)作者同意罗素的上述说法。"}]}]}, {"id": "4-9", "name": "概要性评论", "category": 2, "symbolSize": 32, "desc": "作者从'是'的九种分析中得出关于逻辑哲学立场、逻辑多元论和方法论的三个启示。", "children": [{"id": "4-9-1", "name": "'是'之分析与逻辑哲学立场", "category": 3, "symbolSize": 26, "desc": "对'是'的不同解释隐藏着理解不同哲学立场特别是不同逻辑类型的秘密。", "children": [{"id": "4-9-1-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "对'是'之意义的精确分析对于逻辑学和哲学都极为重要。", "detail": "(1)存在理论引发出本体论、存在是不是谓词的论战、罗素摹状词理论和自由逻辑。(2)外延理论发展出只考虑和处理词项甚至语句外延的外延逻辑。(3)内涵理论正在发展既考虑表达式内涵又考虑其外延的内涵逻辑。(4)扩大理论后来发展出专门的时态逻辑和模态逻辑。(5)相似理论正在发展新修辞学、非形式逻辑、语用逻辑等新分支。(6)语用理论正在发展既考虑抽象意义又考虑具体意义的自然语言逻辑。(7)实体—属性理论和个别—一般理论派生出西方哲学史上至关重要的范畴之间的历史关联。"}]}, {"id": "4-9-2", "name": "逻辑多元论", "category": 3, "symbolSize": 26, "desc": "正确的逻辑不止一种，逻辑在本质上是多元的。", "children": [{"id": "4-9-2-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "语言现象纷繁复杂，没有一种理论能对所有语言现象都具有普遍绝对的解释力。", "detail": "(1)前述各种理论各有各的局限，各有各所面临的问题。(2)上述理论都不能解释某些语言现象，如'走一步是一步，给多少是多少'等。(3)只要一种逻辑或哲学理论能够解释某类特定的语言现象，在一定范围和一定程度上是适用的，它就有存在的权利，就应该得到生长和发展。(4)由此得出的结论是：正确的逻辑不止一种，逻辑在本质上是多元的。"}]}, {"id": "4-9-3", "name": "分析方法论启示", "category": 3, "symbolSize": 26, "desc": "从简单概念背后发现深刻思想，从'小处'入手通过严密分析推出大结论。", "children": [{"id": "4-9-3-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "在一些习以为常、貌似简单的概念和命题背后，也许潜藏着深刻的思想。", "detail": "(1)西方分析哲学家善于从'小处'入手，通过严格、细致、深入的分析和研究，最后推出大结论。(2)波普从分析证实与证伪的不对称入手，提出证伪原则，发展了否证法和证伪主义。(3)罗素从分析'存在悖论'入手，发展摹状词理论，最后引出'外部世界是基于感觉材料的逻辑构造'的哲学结论。(4)蒯因从分析分析命题和综合命题的二分入手，得出科学知识整体论等重要哲学结论。"}, {"id": "4-9-3-2", "name": "论证依据", "category": 4, "symbolSize": 22, "desc": "蒯因从本体论承诺入手，提出'存在就是作为约束变项的值''没有同一性就没有实体'。", "detail": "(1)蒯因从区分本体论事实与本体论承诺入手，追寻本体论承诺的承担者。(2)提出两个重要命题：'存在就是作为约束变项的值'，'没有同一性就没有实体'。(3)论证了'本体论与自然科学具有同等地位'，把被维也纳学派作为伪科学拒斥的本体论重新请回哲学殿堂。(4)开辟了通过科学语言的逻辑分析去澄清本体论立场的新途径。"}, {"id": "4-9-3-3", "name": "代表人物", "category": 4, "symbolSize": 22, "desc": "罗素、蒯因、波普是善于从小处入手推出大结论的分析哲学家典范。", "detail": "(1)罗素从'存在悖论'分析入手，发展了摹状词理论和逻辑构造论。(2)蒯因从分析经验论的两个教条入手，以两篇经典论文《经验论的两个教条》和《论有什么》为明证。(3)波普从分析证实与证伪不对称入手，提出证伪原则。(4)作者总结：学问的至境就在于从简单中看出复杂，又能从复杂中把握简单。"}]}]}]}, {"id": "c05", "name": "第五章 推理、后承关系和蕴涵", "desc": "正文 · 共9个小节", "isAppendix": false, "children": [{"id": "5-1", "name": "推理的有效性和蕴涵", "category": 2, "symbolSize": 32, "desc": "阐述推理的涵义与后承关系，论证推理可化归为蕴涵式，提出推理理论五要求。", "children": [{"id": "5-1-1", "name": "推理的涵义与后承关系", "category": 3, "symbolSize": 26, "desc": "推理有思维过程和语言载体两种涵义，后承关系可从语形和语义角度研究。", "children": [{"id": "5-1-1-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "后承关系是推理中前提与结论间的关系，可从语形和语义两个角度研究。", "detail": "(1)推理有两种涵义：一是从前提根据规则得出命题的思维过程；二是由前提和结论构成的语言载体。(2)语法后承Γ├A指从Γ根据系统变形规则得到A；根岑在矢列演算中作了系统研究，发展出证明论。(3)语义后承Γ╞A指如果Γ中每个语句为真则A必定为真；波尔查诺最早研究语义后承，塔斯基用模型概念给出精确定义。(4)后承运算具有自返性、传递性、单调性和紧致性，塔斯基的研究导致模型论的创立。"}, {"id": "5-1-1-2", "name": "代表人物", "category": 4, "symbolSize": 22, "desc": "塔斯基、根岑和波尔查诺是后承关系研究的主要代表人物。", "detail": "(1)波尔查诺最早对语义后承概念作研究。(2)塔斯基在《论逻辑后承》(1936)等论文中用模型概念精确定义逻辑后承：X逻辑地得自K的语句，当且仅当K的每一个模型也是X的模型。(3)根岑在《对逻辑演绎的探究》(1935)中提出一阶逻辑的矢列演算，成为证明论的基础。"}]}, {"id": "5-1-2", "name": "蕴涵式化归", "category": 3, "symbolSize": 26, "desc": "一切推理可化归为蕴涵式，推理有效性的判定归结为蕴涵式永真性的判定。", "children": [{"id": "5-1-2-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "推理有效性的判定最后被归结为相应蕴涵式永真性的判定。", "detail": "(1)一切推理都可根据条件化规则表示为一个蕴涵式，即将所有前提合取为前件、结论为后件。(2)推理形式A₁,…,Aₙ├B有效当且仅当命题形式A₁∧…∧Aₙ→B是重言式。(3)古希腊斯多亚学派已认识到：一个推论有效，只要其结论从前提的合取逻辑地推出。"}, {"id": "5-1-2-2", "name": "论证依据", "category": 4, "symbolSize": 22, "desc": "对蕴涵的不同理解导致对推理有效性的不同判定。", "detail": "(1)持严格蕴涵、相干蕴涵、衍推观点的逻辑学家不承认实质蕴涵判定有效的某些推理，如A,所以如果B则A；﹁A,所以如果A则B；A∧﹁A,所以B。(2)直觉主义者不承认排中律的有效性。(3)这些差别的造成渊源于对条件命题前后件关系（蕴涵）的不同理解。"}, {"id": "5-1-2-3", "name": "代表人物", "category": 4, "symbolSize": 22, "desc": "现代逻辑学家和斯多亚学派均认同推理可化归为蕴涵式。", "detail": "(1)现代逻辑学家的共识：论证形式A₁,…,Aₙ├B有效当且仅当A₁∧…∧Aₙ→B是重言式。(2)斯多亚学派认为：以前提的合取为前件、以结论为后件的条件命题为真时，推论就是真正有效的。"}]}, {"id": "5-1-3", "name": "条件命题即省略推理", "category": 3, "symbolSize": 26, "desc": "一个条件命题在双重意义上是省略的、浓缩的推理。", "children": [{"id": "5-1-3-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "条件命题本质上是省略了前提和中间推理步骤的浓缩推理。", "detail": "(1)条件命题在双重意义上是省略的：一是省略了一定数量的前提（如普遍规律、经验事实等）；二是省略了一系列中间推理步骤。(2)当一个人断定'如果A则B'时，他实际上断定了从A能够推出B。(3)塔斯基认为：'如果……那么……'常常和某种确信结合在一起，即后件必然可由前件推出。"}, {"id": "5-1-3-2", "name": "代表人物", "category": 4, "symbolSize": 22, "desc": "塔斯基持有条件命题即省略推理的观点。", "detail": "(1)塔斯基指出：日常语言中只有当两个语句有形式与内容上的联系时才用'如果……那么……'连接，这种联系常常和确信后件必然可由前件推出结合在一起。(2)罗素从'2+2=5'推出'罗素和某主教是一个人'的例子展示了多重前提和中间步骤的省略。"}]}, {"id": "5-1-4", "name": "推理理论五要求", "category": 3, "symbolSize": 26, "desc": "好的推理理论应满足保真性、内容相关性、独立性、题材中立性和简单性。", "children": [{"id": "5-1-4-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "一个有效的推理或好的推理理论最好同时满足五个要求。", "detail": "(1)保真性：确保从真前提只能推出真结论，是有效推理最起码的要求。(2)内容相关性：前提和结论应存在共同内容或意义，引导从前提到结论的思想流程。(3)独立性：两个命题间是否存在推理关系，与命题单独具有的真假、模态等性质无关。(4)题材中立性或普遍适用性：逻辑应普遍适用于一切领域和学科。(5)简单性：在同等条件下逻辑上越简单的理论越好。"}, {"id": "5-1-4-2", "name": "论证依据", "category": 4, "symbolSize": 22, "desc": "每个要求均有各自的合理性依据。", "detail": "(1)保真性本质上是一个代入标准：如果一个推理形式的特例有真前提和假结论，则该推理形式无效。(2)独立性要求从内容相关性派生：正因前提和结论间存在意义关联，推出关系才独立于命题单独的逻辑性质。(3)简单性原则有三方面依据：本体论上反映自然界的统一性、方法论上体现美学与科学的统一、实用上越简单越易掌握。(4)斯蒂芬·里德详细阐述了保真性的代入标准。"}, {"id": "5-1-4-3", "name": "代表人物", "category": 4, "symbolSize": 22, "desc": "斯蒂芬·里德和爱因斯坦分别阐述了保真性和简单性原则。", "detail": "(1)斯蒂芬·里德指出保真性本质上是一个代入标准：用模式字母置换推理中除逻辑常项外的词项，检验是否有真前提假结论的特例。(2)爱因斯坦指出：'逻辑简单的东西当然不一定就是物理上真实的东西，但是物理上真实的东西一定是逻辑上简单的东西。'"}]}]}, {"id": "5-2", "name": "实质蕴涵和形式蕴涵", "category": 2, "symbolSize": 32, "desc": "阐述实质蕴涵的起源与发展、形式蕴涵的意义及实质蕴涵怪论。", "children": [{"id": "5-2-1", "name": "实质蕴涵的起源与发展", "category": 3, "symbolSize": 26, "desc": "斐洛最早提出实质蕴涵，弗雷格重新发现，罗素和怀特海推广。", "children": [{"id": "5-2-1-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "条件命题为真当且仅当并非前件真而后件假。", "detail": "(1)斐洛认为条件命题在前三种情况（真真、假假、假真）下为真，仅在前件真后件假时为假。(2)斐洛说：'一个正确的条件命题是一个并不开始于真而结束于假的命题。'(3)实质蕴涵只考察前后件的真假关系，撇开前后件在其他方面的一切联系。"}, {"id": "5-2-1-2", "name": "经典诘难", "category": 4, "symbolSize": 22, "desc": "实质蕴涵不符合自然语言'如果……则……'的原义，违反直觉和常识。", "detail": "(1)一部分逻辑学家认为实质蕴涵与自然语言中'如果……则……'存在意义差别，造成反直观的怪论，因而是不可接受的。(2)另一部分逻辑学家（如塔斯基）认为这种差别是正常的，因为自然语言概念带有模糊性和歧义性，实质蕴涵在简便性方面胜过任何其他蕴涵理论。"}, {"id": "5-2-1-3", "name": "代表人物", "category": 4, "symbolSize": 22, "desc": "斐洛、弗雷格、罗素和怀特海是实质蕴涵的主要代表人物。", "detail": "(1)古希腊麦加拉派学者斐洛最早提出实质蕴涵观点，在麦加拉派和斯多亚派内部引起论战。(2)弗雷格1879年在《概念文字》中重新独立发现实质蕴涵，构造了第一个基于实质蕴涵的一阶逻辑公理系统。(3)罗素和怀特海在《数学原理》(1910-1913)中推广了实质蕴涵，引起广泛注意和持久争论。(4)皮尔士最早注意到斐洛的实质蕴涵观点。"}]}, {"id": "5-2-2", "name": "形式蕴涵", "category": 3, "symbolSize": 26, "desc": "形式蕴涵是实质蕴涵在谓词逻辑中的表现，由罗素提出。", "children": [{"id": "5-2-2-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "形式蕴涵是'φx恒蕴涵ψx'形式的命题，与命题函项相关。", "detail": "(1)形式蕴涵不是与命题而是与命题函项相关：'x是人蕴涵着x是有死的'恒真，即对于所有的x而言，如果x是人则x是有死的。(2)'苏格拉底是人蕴涵着苏格拉底是有死的'实际意谓的是形式蕴涵而非省略推理。(3)形式蕴涵坚持实质蕴涵的要求（并非前件真后件假），但要求此关系对个体变元的所有取值成立。"}, {"id": "5-2-2-2", "name": "代表人物", "category": 4, "symbolSize": 22, "desc": "罗素在《数学原理》和《数理哲学导论》中阐述了形式蕴涵。", "detail": "(1)罗素认为'所有的人都是有死的'等值于''x是人蕴涵着x是有死的'恒真'。(2)罗素指出：当意思是'φx蕴涵ψx'恒真时，'φx恒蕴涵ψx'这种形式的命题称为形式蕴涵。(3)形式蕴涵实际上是实质蕴涵的要求在谓词逻辑中的表现，并不是独立于实质蕴涵的另外一种蕴涵。"}]}, {"id": "5-2-3", "name": "实质蕴涵怪论", "category": 3, "symbolSize": 26, "desc": "实质蕴涵产生反直观的怪论，如真命题被任一命题所蕴涵等。", "children": [{"id": "5-2-3-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "实质蕴涵的核心怪论有四类，均违反日常推理直觉。", "detail": "(1)A→(B→A)：真命题被任一命题所蕴涵。(2)﹁A→(A→B)：假命题蕴涵任一命题。(3)(A→B)∨(B→A)：任意两个命题之间有蕴涵关系。(4)(A∧B→C)→((A→C)∨(B→C))：如果两命题一起蕴涵结论，则或其中一个蕴涵该结论。"}, {"id": "5-2-3-2", "name": "论证依据", "category": 4, "symbolSize": 22, "desc": "这些怪论违反独立性要求，仅根据命题真值就能确立推出关系。", "detail": "(1)实质蕴涵怪论相当于说：命题之间的推出关系仅仅根据命题的真值就能成立，这违反独立性要求。(2)真命题之间可能具有也可能不具有推出关系，假命题之间亦然，推出关系不能仅由真假判定。(3)按实质蕴涵本义，这些公式确实是定理，但违反直观。"}, {"id": "5-2-3-3", "name": "修正版本", "category": 4, "symbolSize": 22, "desc": "严格蕴涵、相干蕴涵等替代方案试图避免实质蕴涵怪论。", "detail": "(1)刘易斯提出严格蕴涵以避免实质蕴涵怪论，但产生自身的严格蕴涵怪论。(2)相干逻辑学家提出相干蕴涵以排除不相干谬误。(3)衍推逻辑结合严格蕴涵和相干蕴涵，试图同时避免不相干谬误和模态谬误。"}]}]}, {"id": "5-3", "name": "严格蕴涵", "category": 2, "symbolSize": 32, "desc": "阐述严格蕴涵的提出与定义、与实质蕴涵的比较、其怪论及评价。", "children": [{"id": "5-3-1", "name": "严格蕴涵的提出与定义", "category": 3, "symbolSize": 26, "desc": "麦柯尔最早提出严格蕴涵，刘易斯系统发展并构造模态逻辑系统。", "children": [{"id": "5-3-1-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "A严格蕴涵B当且仅当不可能A真而B假，反映命题间的必然性关系。", "detail": "(1)严格蕴涵定义为﹁◇(A∧﹁B)，即A真B假在逻辑上不可能。(2)A严格蕴涵B所断定的是B已逻辑地暗含于A之中，B是A的逻辑后承，从A推出B是逻辑必然的。(3)严格蕴涵一旦为真就总是为真，与A、B本身的具体真假无关。"}, {"id": "5-3-1-2", "name": "代表人物", "category": 4, "symbolSize": 22, "desc": "麦柯尔、刘易斯和朗格福德是严格蕴涵的主要代表人物。", "detail": "(1)英国逻辑学家麦柯尔1880年最早提出严格蕴涵，引入模态词'必然'，用符号'：'表示。(2)美国逻辑学家C.I.刘易斯1912年发表《蕴涵和逻辑代数》，提出严格蕴涵概念，不满足于实质蕴涵过弱的推演能力。(3)刘易斯和朗格福德1932年在《符号逻辑》中构造了模态命题逻辑系统S1-S5，创立了现代模态逻辑。"}]}, {"id": "5-3-2", "name": "严格蕴涵与实质蕴涵的比较", "category": 3, "symbolSize": 26, "desc": "严格蕴涵反映必然性关系，推演能力弱于实质蕴涵但避免了多数怪论。", "children": [{"id": "5-3-2-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "严格蕴涵比实质蕴涵更强但推演能力更弱，两者有本质不同。", "detail": "(1)从内容看：实质蕴涵反映命题之间的具体真假关系，严格蕴涵反映命题之间的必然性关系。(2)从推演能力看：实质蕴涵只要求当下不是前件真后件假，严格蕴涵要求不可能前件真后件假，推演能力比实质蕴涵弱。(3)如果A严格蕴涵B则必然有A实质蕴涵B，反之不然。'(4)以A严格蕴涵B为前提、以B为结论的推理是有效的'与'A严格蕴涵B'几乎是一回事。"}]}, {"id": "5-3-3", "name": "严格蕴涵怪论", "category": 3, "symbolSize": 26, "desc": "严格蕴涵避免了实质蕴涵怪论，却产生了自身的严格蕴涵怪论。", "children": [{"id": "5-3-3-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "必然命题被任一命题严格蕴涵，不可能命题严格蕴涵任一命题。", "detail": "(1)□B→(A严格蕴涵B)：必然命题被任一命题所严格蕴涵。(2)﹁◇A→(A严格蕴涵B)：不可能命题严格蕴涵任一命题。(3)(A∧﹁A)严格蕴涵B：逻辑矛盾严格蕴涵任一命题。(4)A严格蕴涵(B∨﹁B)：逻辑真理被任一命题所严格蕴涵。"}, {"id": "5-3-3-2", "name": "论证依据", "category": 4, "symbolSize": 22, "desc": "刘易斯承认上述怪论为有效原理，它们是其所接受的推理规则的逻辑后果。", "detail": "(1)刘易斯认为这些严格蕴涵悖论是令人惊讶的但仍是逻辑中有效的原理。(2)刘易斯承认(A∧﹁A)→B为有效，并一步步证明其推导过程，反问谁能指出哪一步不正确。(3)刘易斯承认的推理规则包括：合取消去、析取引入、析取三段论、蕴涵传递律等。(4)严格蕴涵怪论是上述规则的逻辑后果。"}, {"id": "5-3-3-3", "name": "修正版本", "category": 4, "symbolSize": 22, "desc": "相干逻辑学家通过拒斥部分推理规则来避免严格蕴涵怪论。", "detail": "(1)要避免严格蕴涵怪论，必须至少拒斥刘易斯所承认的某些推理规则。(2)相干逻辑学家正是通过拒斥析取三段论等规则来避免不相干谬误。(3)严格蕴涵系统后来逐渐远离蕴涵研究，转而专门研究逻辑模态，演变成为模态逻辑。"}]}, {"id": "5-3-4", "name": "严格蕴涵的评价", "category": 3, "symbolSize": 26, "desc": "严格蕴涵具有保真性和半独立性，但普适性和简单性不如实质蕴涵。", "children": [{"id": "5-3-4-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "严格蕴涵具有保真性和半独立性，但未考虑命题间内容相关性。", "detail": "(1)严格蕴涵具有保真性：如果A严格蕴涵B，则A真B假是不可能的。(2)严格蕴涵独立于命题的真假但不独立于模态：仅凭知道B的必然性就能知道A严格蕴涵B，仅凭知道A的不可能性就能知道A严格蕴涵B，故只有半独立性。(3)严格蕴涵没有直接考虑前提和结论之间在内容方面的相关性。(4)严格蕴涵在普适性和简单性方面比实质蕴涵稍差。"}]}]}, {"id": "5-4", "name": "相干蕴涵和衍推", "category": 2, "symbolSize": 32, "desc": "阐述相干蕴涵与相干原理、系统R、衍推系统E及对相干逻辑的评价。", "children": [{"id": "5-4-1", "name": "相干蕴涵与相干原理", "category": 3, "symbolSize": 26, "desc": "相干蕴涵要求A与B有共同意义内容，由贝尔纳普的相干原理形式刻画。", "children": [{"id": "5-4-1-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "A相干蕴涵B当且仅当A与B具有共同意义内容，可逻辑地推出B。", "detail": "(1)冯·赖特：从A推出B当且仅当我们不知道A假或B真就能知道如果A则B为真。(2)吉奇：A推出B当且仅当我们有一个既定的程序知道如果A则B，但不是要先知道非A或B。(3)阿克曼：A严密蕴涵B表达A和B之间的逻辑关系，使得B的内容是A的内容的一部分，与真值毫无关系。"}, {"id": "5-4-1-2", "name": "论证依据", "category": 4, "symbolSize": 22, "desc": "贝尔纳普的相干原理：命题间内容共同性由变元的共同出现保证。", "detail": "(1)贝尔纳普1960年提出相干原理：如果A相干蕴涵B，则A和B至少有一个共同的命题变元。(2)在推导出B的过程中真正使用了而不仅仅是经过了A。(3)R系统的一个元定理推论：如果A是R的定理，则A中每一个命题变元不可能只出现一次。因此实质蕴涵怪论的相干变形都不是R的定理。"}, {"id": "5-4-1-3", "name": "代表人物", "category": 4, "symbolSize": 22, "desc": "阿克曼、贝尔纳普、安德森、冯·赖特和吉奇是相干蕴涵的主要提出者。", "detail": "(1)冯·赖特和吉奇最早对相干蕴涵给出直觉刻画。(2)阿克曼提出'严密蕴涵'（后称相干蕴涵），1956年构造了相干逻辑系统π′和ε′。(3)贝尔纳普1960年提出著名的相干原理，将内容共同性形式化为变元共同出现。(4)安德森和贝尔纳普1959年提出相干逻辑的R系统。"}]}, {"id": "5-4-2", "name": "相干逻辑系统R", "category": 3, "symbolSize": 26, "desc": "R系统以相干蕴涵为核心，拒绝析取三段论以避免不相干谬误。", "children": [{"id": "5-4-2-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "R系统排除'真命题为任一命题所蕴涵'等蕴涵怪论。", "detail": "(1)R系统由相干蕴涵和真值联结词构造而成，相干原理是R系统的根本特征。(2)R不把析取三段论（﹁A,A∨B├B）作为规则，一旦接受它就会导出逻辑矛盾相干蕴涵任一命题，导致不相干谬误。(3)R系统排除了不相干谬误：由一个命题推出另一个意义上毫不相关的命题。"}, {"id": "5-4-2-2", "name": "论证依据", "category": 4, "symbolSize": 22, "desc": "安德森和贝尔纳普区分了'或'的真值意义和内涵意义。", "detail": "(1)析取'∨'有两种意义：真值意义和内涵意义，后者要求A和B之间有意义方面的关联。(2)从A推出A∨B仅当'∨'做真值意义理解；从A∨B和﹁A推出B仅当'∨'做内涵意义理解。(3)在相干蕴涵意义上，从A和A→B推出B（肯定前件式）在R中不成立。"}, {"id": "5-4-2-3", "name": "经典诘难", "category": 4, "symbolSize": 22, "desc": "R系统虽免除了不相干谬误，却无法避免模态谬误。", "detail": "(1)如果一个必然命题由实然命题推演出来，则犯了模态谬误。R有定理(A∧(A→B))→B，若加入E系统会导致模态谬误。(2)R中的(A∧(A→B))→B说：如果A实然真，则由逻辑真理A→B得到的结论B是实然真的。但在模态逻辑中，必然命题的推论应是必然真的，R不能满足此要求。"}]}, {"id": "5-4-3", "name": "衍推逻辑系统E", "category": 3, "symbolSize": 26, "desc": "衍推结合严格蕴涵与相干蕴涵，反映命题间内容上的必然联系。", "children": [{"id": "5-4-3-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "衍推既反映命题间的必然联系，又反映命题间内容上的相互关联。", "detail": "(1)衍推反映必然关系：如果A衍推B，则这种关系独立于A与B的实际情况，A衍推B必然为真。(2)衍推反映内容关联：如果A衍推B，则A与B相干，有共同的意义内容或命题变元。(3)内尔森指出：'蕴涵（即衍推）是意义之间的必然联系。'(4)衍推系统E是一个相干的严格蕴涵系统。"}, {"id": "5-4-3-2", "name": "论证依据", "category": 4, "symbolSize": 22, "desc": "E系统既是相干逻辑又是模态逻辑，同时免除不相干谬误和模态谬误。", "detail": "(1)E中相干原理成立：若A衍推B是E之定理，则A和B至少有一个共同的命题变元。(2)E是模态逻辑：若A衍推B是E的定理，则A衍推B必然为真；从逻辑规律导出的结论C必然为真。(3)E有定理(A衍推B)→((B衍推A)→((A衍推C)→(B衍推C)))。(4)把□A定义为(A→A)→A，E具有类似于S4的模态结构。"}, {"id": "5-4-3-3", "name": "代表人物", "category": 4, "symbolSize": 22, "desc": "安德森和贝尔纳普在修改阿克曼系统π′基础上提出E系统。", "detail": "(1)安德森和贝尔纳普于1958年和1962年提出衍推逻辑系统E，由修改阿克曼1956年的系统π′得到。(2)内尔森在1930年论文中阐述了衍推作为'意义之间的必然联系'的观点。"}]}, {"id": "5-4-4", "name": "对相干逻辑的评价", "category": 3, "symbolSize": 26, "desc": "相干逻辑在技术上成功，但在刻画内容相关性上基本失败。", "children": [{"id": "5-4-4-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "变元的共同出现不能刻画或保证推理的前提与结论之间的内容相关性。", "detail": "(1)没有共同命题变项出现的不一定没有内容相关性：如'如果一个动物有心脏则这个动物有肾脏'。(2)有共同命题变项出现的不一定有内容相关性：如'如果狗叫，那么如果(如果狗叫则雪花飘)则雪花飘'是R定理的代入特例，但前后件之间没有内容相关性。(3)相干原理所刻画的内容相关性与日常直观中的内容相关性不是一回事。"}, {"id": "5-4-4-2", "name": "论证依据", "category": 4, "symbolSize": 22, "desc": "从逻辑上刻画推理前提与结论间的内容关联是没有出路的。", "detail": "(1)推理的具体内容千差万别，逻辑学家无法处理这些差异悬殊的内容。(2)即使去刻画内容相关的形式表现也不大可能取得成功。(3)作者援引蒯因的话：'相干逻辑学家的困境就是全部逻辑学家的困境。'(4)一个推理理论只要具有保真性就足够了，内容相关性是人们在应用推理工具时会自动考虑的事情。"}]}]}, {"id": "5-5", "name": "直觉主义蕴涵", "category": 2, "symbolSize": 32, "desc": "阐述直觉主义的数学哲学基础、直觉主义蕴涵的定义及直觉主义逻辑的特征。", "children": [{"id": "5-5-1", "name": "直觉主义的数学哲学", "category": 3, "symbolSize": 26, "desc": "布劳维尔以先验时间直觉为数学基础，主张潜无穷和存在等于被构造。", "children": [{"id": "5-5-1-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "数学是独立于经验的心灵自由创造，存在等于被构造，排中律不普遍有效。", "detail": "(1)不承认实无穷只承认潜无穷：无穷是无休止扩展的可能性或过程，而非实际得到的总体。(2)排中律不普遍有效：对于无穷论域无法逐个考察验证，且'真'被理解为被证明为真。(3)存在等于被构造：数学对象的存在以可构造为前提，能够具体给出对象或给出找到对象的程序。"}, {"id": "5-5-1-2", "name": "论证依据", "category": 4, "symbolSize": 22, "desc": "布劳维尔继承康德先验直观理论，以二一性直觉为数学基础。", "detail": "(1)先验的、原始的二一性直觉构成数学的基础，把每一个生活瞬间分解为质上不同的部分。(2)这种直觉使人认识到作为知觉单位的'一'，通过不断'并置'创造自然数、有穷序数和最小的无穷序数。(3)布劳维尔认为关于排中律的正确性问题等价于'是不是可能存在不可解的数学命题'。"}, {"id": "5-5-1-3", "name": "代表人物", "category": 4, "symbolSize": 22, "desc": "布劳维尔是直觉主义数学哲学的主要代表人物。", "detail": "(1)布劳维尔创造性地继承了康德的先验直观理论。(2)他认为任何逻辑结构都不可能独立于数学直觉。(3)直觉主义学派把从潜无穷引申出来的自然数论作为其他数学理论的基础。"}]}, {"id": "5-5-2", "name": "直觉主义蕴涵", "category": 3, "symbolSize": 26, "desc": "A直觉蕴涵B指存在构造p，与A的证明配合后可证明B真。", "children": [{"id": "5-5-2-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "A直觉蕴涵B要求A与B之间存在构造性过程。", "detail": "(1)A→B的证明p是一个构造，对于A的任何一个证明q，它都指出一个B的证明p(q)，并能验证p(q)是B的一个证明。(2)'如果A则B'要求A与B之间有一个过程，当把这个过程与证明A的过程配合起来后可以证明B真。(3)﹁A的证明就是A→(0=1)的证明，即由任意A的证明得到矛盾的构造。"}, {"id": "5-5-2-2", "name": "代表人物", "category": 4, "symbolSize": 22, "desc": "安德森、贝尔纳普和梅耶尔研究了直觉蕴涵与相干蕴涵的关系。", "detail": "(1)安德森和贝尔纳普将直觉蕴涵翻译到相干逻辑系统R和E中。(2)梅耶尔在一系列论文中发展并简化了这一思想，使用命题常项t代替命题量化。"}, {"id": "5-5-2-3", "name": "修正版本", "category": 4, "symbolSize": 22, "desc": "安德森和贝尔纳普将直觉蕴涵翻译到相干逻辑R和E中。", "detail": "(1)安德森和贝尔纳普引入命题量词，将A直觉蕴涵B定义为：存在命题p使得p∧(A∧p相干蕴涵B)。(2)梅耶尔使用命题常项t（真）代替命题量化，将A直觉蕴涵B定义为A∧t相干蕴涵B。(3)这种翻译表明直觉蕴涵与相干蕴涵之间存在深层关联。"}]}, {"id": "5-5-3", "name": "直觉主义逻辑", "category": 3, "symbolSize": 26, "desc": "直觉主义逻辑是经典逻辑的真部分，拒斥排中律等经典规律。", "children": [{"id": "5-5-3-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "直觉主义逻辑中排中律、双重否定消去等经典规律不成立。", "detail": "(1)所有直觉主义逻辑的定理都是经典逻辑的定理，因此直觉主义逻辑是经典逻辑的一个真部分。(2)下述公式不是直觉主义逻辑定理：A∨﹁A（排中律）；﹁﹁A→A（双重否定消去）；(﹁A→B)→(((B→A)→B)→B)（反证律）；﹁∀xA→∃x﹁A。(3)直觉主义逻辑具有构造性特点，是一种不同于经典逻辑的非经典逻辑。"}, {"id": "5-5-3-2", "name": "经典诘难", "category": 4, "symbolSize": 22, "desc": "直觉主义逻辑在普遍适用性和简单性方面较差。", "detail": "(1)由于拒斥排中律和反证律等日常推理中经常使用的规律，其普遍适用性和简单性较差。(2)有人批评直觉主义数学具有'缺乏力量'、'烦难'、'复杂'和'不明晰'等缺陷，这一批评也适用于直觉主义逻辑。(3)直觉主义逻辑几乎是唯一被一部分数学家实际使用并导致数学成果的非经典逻辑。"}]}]}, {"id": "5-6", "name": "反事实蕴涵", "category": 2, "symbolSize": 32, "desc": "阐述反事实蕴涵的特点及可共存性理论和可能世界语义两种主要刻画方案。", "children": [{"id": "5-6-1", "name": "反事实蕴涵的基本特征", "category": 3, "symbolSize": 26, "desc": "反事实条件句前后件为假但断定内在联系，不能用实质或严格蕴涵刻画。", "children": [{"id": "5-6-1-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "反事实条件句建立在经验基础上，要考虑前后件在内容和意义方面的联系。", "detail": "(1)反事实条件句的共同特点是前后件为假或不大可能为真，但用'如果……则……'连接后断定前后件之间存在一定的内在联系。(2)实质蕴涵只考虑前后件之间的真假关系，而反事实条件句要考虑内容联系。(3)严格蕴涵只与逻辑上的必然相关，反事实条件句则与经验上的必然相关。"}, {"id": "5-6-1-2", "name": "经典诘难", "category": 4, "symbolSize": 22, "desc": "增强前件律和传递律对反事实条件句不成立。", "detail": "(1)增强前件对反事实条件句不成立：如'倘若花瓶掉在地板上则摔碎'为真，但'倘若花瓶掉在地板上且有海绵则摔碎'为假。(2)传递律对反事实条件句不成立：从'假如卡特1979年去世则不会在1980年落选'和'假如卡特不在1980年落选则里根不能当选'推出一个明显为假的句子。(3)实质蕴涵和严格蕴涵都不适于刻画反事实条件句。"}, {"id": "5-6-1-3", "name": "修正版本", "category": 4, "symbolSize": 22, "desc": "条件句逻辑是专门处理反事实条件句的哲学逻辑分支。", "detail": "(1)逻辑学家们在近几十年内发展了'条件句逻辑'这一哲学逻辑分支，构造了为数不少的公理化条件句逻辑系统。(2)主要刻画方案包括可共存性理论和可能世界语义两种。(3)此外还有严格条件句理论、小变化理论、极大变化理论等不同方案。"}]}, {"id": "5-6-2", "name": "可共存性理论", "category": 3, "symbolSize": 26, "desc": "反事实条件句为真当且仅当前件加上可与A共存的真命题集推出B。", "children": [{"id": "5-6-2-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "反事实条件句的真值相对于由规律和真命题组成的相容集来判定。", "detail": "(1)齐硕姆、古德曼、雷谢尔等人提出可共存性理论：反事实条件句A→B为真仅当前件A加上由某些规律和真命题组成的集推出B，该集合须与A逻辑相容。(2)若A假则﹁A真，该集合中不应包含﹁A；若C与A表面相容但从C可推出﹁A，则该集合中不应包含C。(3)在雷谢尔看来，反事实条件句为真如果后件由包含前件且在其他方面'最接近于'先前假定的知识的一个相容命题集所蕴涵。"}, {"id": "5-6-2-2", "name": "代表人物", "category": 4, "symbolSize": 22, "desc": "齐硕姆、古德曼和雷谢尔是可共存性理论的主要代表。", "detail": "(1)齐硕姆(1946)和古德曼(1955)最早提出可共存性思路。(2)雷谢尔(1964)系统阐述了该理论：按确信度大小对M中命题排序，找到极大相容子集M′，使得M′∪{A}├B时反事实条件句为真。"}]}, {"id": "5-6-3", "name": "可能世界语义", "category": 3, "symbolSize": 26, "desc": "反事实条件句为真当且仅当在最类似现实世界的A-世界中B也为真。", "children": [{"id": "5-6-3-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "用可能世界集刻画反事实条件句的真值。", "detail": "(1)斯托奈克认为：A反事实蕴涵B为真当且仅当在A为真的那个最类似于现实世界的可能世界上B也为真。(2)斯托奈克用有序四元组模型〈I,R,s,[]〉刻画反事实条件句的真值，该模型决定极小条件句逻辑C2。(3)大卫·刘易斯(1973)、范·弗拉森(1974)、波洛克(1976)等人也各自用可能世界集刻画反事实条件句。"}, {"id": "5-6-3-2", "name": "代表人物", "category": 4, "symbolSize": 22, "desc": "斯托奈克、大卫·刘易斯、范·弗拉森和波洛克是可能世界语义的主要代表。", "detail": "(1)斯托奈克1968年提出用最类似可能世界刻画反事实条件句，构造了极小条件句逻辑C2。(2)大卫·刘易斯1973年在《反事实条件句》中系统发展了可能世界语义。(3)范·弗拉森和波洛克也各自提出了可能世界语义框架。"}]}]}, {"id": "5-7", "name": "自然语言中的推论", "category": 2, "symbolSize": 32, "desc": "阐述自然语言推论的三大特点、证明性推理与理由—后承关系。", "children": [{"id": "5-7-1", "name": "自然语言推论的特点", "category": 3, "symbolSize": 26, "desc": "自然语言推论在形式上是省略的、断定的，且是歧义的、需要解释的。", "children": [{"id": "5-7-1-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "自然语言推论省略背景知识、断定前提为真、且因蕴涵歧义而歧义。", "detail": "(1)形式上是省略的：交际双方承载大量共同的背景知识（语言知识、逻辑知识、百科知识），不必明确说出，推理表现为省略形式。(2)断定了前后件本身为真：自然语言中说出一个命题常常意谓着断定它为真，'既然A那么B'实际上意味着A真且A蕴涵B。(3)有歧义的、需要解释的：对蕴涵有多少种独立解释，自然语言推论就有多少种不同意义。"}, {"id": "5-7-1-2", "name": "修正版本", "category": 4, "symbolSize": 22, "desc": "自然语言逻辑应联系语境、预设和断定来分析自然语言中的推理。", "detail": "(1)自然语言逻辑必须联系语境和预设，并考虑到断定因素，把语境、背景知识、断定与蕴涵合在一起考虑。(2)否则无法说明自然语言中许多明显有效的推理的有效性，不能建立真正的自然语言逻辑。"}]}, {"id": "5-7-2", "name": "证明性推理", "category": 3, "symbolSize": 26, "desc": "证明要求前提真实且由前提必然导出结论，与推导有本质区别。", "children": [{"id": "5-7-2-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "证明的前提必须真实、首要、直接，且结论必然由前提推出。", "detail": "(1)证明的目的是论证某一知识、观点的真理性，要求前提真实且由前提能必然地导出结论。(2)明显为假的东西不能作为证明的前提，因为假的东西不能证明任何东西。(3)亚里士多德把推理分为三种：证明的推理、论辩的推理和诡辩的推理。(4)现代逻辑区分'推论'（证明性推理）和'推导'（非证明性推理），蕴涵包括推论和推导两类。"}, {"id": "5-7-2-2", "name": "代表人物", "category": 4, "symbolSize": 22, "desc": "亚里士多德以证明的三段论为推理理论的核心。", "detail": "(1)亚里士多德把逻辑看作是获得科学知识的工具和证明的科学，证明的推理是其推理理论的核心。(2)亚里士多德指出：'作为证明知识出发点的前提必须是真实的、首要的、直接的，是先于结果、比结果更容易了解的，并且是结果的原因。'(3)亚里士多德研究三段论的主旨就是证明。"}]}, {"id": "5-7-3", "name": "理由—后承关系", "category": 3, "symbolSize": 26, "desc": "波尔查诺区分了真实的理由和知识的理由，前者只在真命题间成立。", "children": [{"id": "5-7-3-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "理由—后承关系只在真命题之间成立，与逻辑蕴涵不同。", "detail": "(1)如果A和B同真并且A是B为真的理由、原因，则A是B的理由，B是A的后承。(2)逻辑蕴涵可以在假命题之间成立，而理由—后承关系只在真命题之间成立。(3)真命题之间的逻辑蕴涵并不就是理由—后承关系。"}, {"id": "5-7-3-2", "name": "论证依据", "category": 4, "symbolSize": 22, "desc": "波尔查诺区分了'真实的理由'和'知识的理由'两种不同的理由。", "detail": "(1)'理由—后承'关系中的理由是'真实的理由'：A是B为真的客观原因。(2)'理由—判断'关系中的理由是'知识的理由'：对A的知识是引出B的证据，是知道B的原因。这两种关系常常反方向进行：例如天热是温度计读数高的原因（真实理由），但温度计读数是知道天热的证据（知识理由）。"}, {"id": "5-7-3-3", "name": "代表人物", "category": 4, "symbolSize": 22, "desc": "波尔查诺在《科学论》中系统阐述了理由—后承关系。", "detail": "(1)波尔查诺在《科学论》中阐述'理由—后承'和'理由—判断'关系。(2)他区分了两种理由：真实的理由（客观因果）和知识的理由（认知证据）。"}]}]}, {"id": "5-8", "name": "应用特例：语义蕴涵", "category": 2, "symbolSize": 32, "desc": "阐述逻辑蕴涵在语言学中的应用，包括语法受定和非受定蕴涵及语义关系定义。", "children": [{"id": "5-8-1", "name": "语法受定蕴涵", "category": 3, "symbolSize": 26, "desc": "用不定短语替代句子表层结构成分得到的命题，基于深层与表层结构区分。", "children": [{"id": "5-8-1-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "语法受定蕴涵命题基于句子表层结构成分的替代而产生。", "detail": "(1)深层结构指短语或句子成分之间的内在语法关系，表层结构是各成分线性排列的结果。(2)用合适的不定短语（某人、某物、某个数量等）替代句子的每个表层结构成分，所得到的命题就是语法受定蕴涵命题。(3)例如'吴为买了三本书'的语法受定蕴涵包括：'某人买了三本书'、'吴为买了三件东西'、'某事发生'等。(4)任一语句的语法受定蕴涵命题构成一个有序的蕴涵网络。"}, {"id": "5-8-1-2", "name": "代表人物", "category": 4, "symbolSize": 22, "desc": "乔姆斯基、史密斯和威尔逊是语义蕴涵理论的主要代表。", "detail": "(1)乔姆斯基在《句法结构》(1957)中提出转换生成语法，包括句法学、音位学和语义学三部分。(2)史密斯和威尔逊将逻辑蕴涵理论系统应用于自然语言语义分析。"}]}, {"id": "5-8-2", "name": "语法非受定蕴涵", "category": 3, "symbolSize": 26, "desc": "脱离语境后仅根据词汇知识和语义规则推出来的命题。", "children": [{"id": "5-8-2-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "语法非受定蕴涵命题根据词汇知识从原语句推出，与具体语境无关。", "detail": "(1)语法非受定蕴涵命题是脱离语境后仅根据词汇知识和其他语义规则从陈述句推出来的。(2)例如'我父亲是劳动模范'推出'我爸爸是劳动模范'；'约翰买了三匹马'推出'约翰买了三只动物'。(3)'张三是一位单身汉'推出'张三是一个未结婚的男人'。(4)根据义素分析法和语义场知识，从一个命题可以得到它的许多语义蕴涵命题。"}, {"id": "5-8-2-2", "name": "论证依据", "category": 4, "symbolSize": 22, "desc": "所有语义蕴涵命题的集合表达语句的意义。", "detail": "(1)一个句子的意义相当于一组命题的集合，包括语义蕴涵命题和语用蕴涵命题。(2)只要句子本身真实，这些蕴涵命题必定真实。(3)所有语义蕴涵命题和语用蕴涵命题的全体所组成的集合才表达该语句的全部意义。"}]}, {"id": "5-8-3", "name": "语义关系定义", "category": 3, "symbolSize": 26, "desc": "用蕴涵理论定义句子的同义、对立、分析性等语义关系。", "children": [{"id": "5-8-3-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "同义当且仅当相互蕴涵，对立当且仅当一个蕴涵另一个的否定。", "detail": "(1)两个句子同义当且仅当它们具有完全相同的一组蕴涵命题，或相互蕴涵。(2)两个句子对立当且仅当其中一个句子蕴涵着另一个句子的否定。(3)一个句子的否定句是矛盾式，则它本身就是分析性的，如'单身汉是男人'。"}, {"id": "5-8-3-2", "name": "论证依据", "category": 4, "symbolSize": 22, "desc": "语义蕴涵所用到的蕴涵相当于衍推。", "detail": "(1)语义蕴涵命题之间的关系是必然关系：一个语句为真而其语义蕴涵命题不可能为假。(2)语句和语义蕴涵命题之间存在意义上的联系，语义蕴涵命题分别只表现该语句所表达意义的一部分。(3)以蕴涵命题为基础的语义理论能解释同义、矛盾、分析性、歧义等语义关系。"}]}]}, {"id": "5-9", "name": "结语：为实质蕴涵辩护", "category": 2, "symbolSize": 32, "desc": "提出对实质蕴涵的四点辩护，总结实质蕴涵是最好的蕴涵理论。", "children": [{"id": "5-9-1", "name": "实质蕴涵的共性抽象", "category": 3, "symbolSize": 26, "desc": "实质蕴涵抽象概括了'如果……则……'的共性，在各解释中最弱因而最普遍。", "children": [{"id": "5-9-1-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "实质蕴涵是对自然语言'如果……则……'各种用法的共同特性的抽象。", "detail": "(1)自然语言中'如果……则……'有七种主要涵义：条件关系、因果关系、推理关系、词义关系、假设关系、时序关系、允诺威胁等。(2)各种用法共同的逻辑性质是：当A真时B必定为真，如果A真而B假则此类命题为假。(3)实质蕴涵只考虑A、B的真值，不考虑内容意义方面的一切联系，适用范围最广、使用最方便。(4)正像任何其他科学都要抽象一样，逻辑也不能反映'如果……则……'的全部意义，而只抽象出其共同特性。"}, {"id": "5-9-1-2", "name": "论证依据", "category": 4, "symbolSize": 22, "desc": "普适性和简单性是逻辑的本质要求，实质蕴涵最好地满足了这些要求。", "detail": "(1)实质蕴涵满足保真性、普适性和简单性三个基本要求。(2)实质蕴涵的内容相关性和独立性缺失是任何其他已提出的蕴涵也没有真正满足的。(3)实质蕴涵是最弱的蕴涵，因而也是最简单、适用范围最广的一种。"}]}, {"id": "5-9-2", "name": "实质蕴涵的经验基础", "category": 3, "symbolSize": 26, "desc": "当A假或B真时蕴涵式为真具有日常语言的经验根据。", "children": [{"id": "5-9-2-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "当A假或B真时相应的蕴涵式总为真，这是有经验根据的。", "detail": "(1)当后件已为真时，无论前件真假都不会出现前件真后件假的情况，蕴涵式总为真，如'不管克林顿是不是美国总统，大白菜都是蔬菜'。(2)当前件确实为假时，无论后件真假都不会出现前件真后件假，蕴涵式总为真，如穷光蛋开空头支票的例子。(3)用'即使……也……'替换'如果……则……'后奇特性消失：'即使2+2=5，雪也是白的'只是'雪是白的'的强调说法。"}, {"id": "5-9-2-2", "name": "经典诘难", "category": 4, "symbolSize": 22, "desc": "人们通常对'当A假或B真时A→B为真'有很大保留。", "detail": "(1)人们通常对'如果2+2=5则雪是白的'、'如果2+2=5则雪是黑的'等命题皱眉头。(2)按实质蕴涵真值表这些命题都是真的，似乎反直观、不自然。(3)但通过补充语境（如加上'不管……都……'）或替换联结词（'即使……也……'），其奇特性就消失了。"}]}, {"id": "5-9-3", "name": "实质蕴涵的逻辑一致性", "category": 3, "symbolSize": 26, "desc": "如果承认﹁和∨的合理性，也应承认实质蕴涵是'如果……则……'的合理抽象。", "children": [{"id": "5-9-3-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "从前后一致性角度看，不能单修改实质蕴涵而保留对其他联结词的真值解释。", "detail": "(1)'不是A就是B'既理解为'A或者B'也等义地理解为'如果非A则B'，即A∨B与﹁A→B等值。(2)﹁A∨B与A→B等值，而﹁A∨B只在A真B假时为假，因此A→B也只在A真B假时为假。(3)当指责实质蕴涵时，会逻辑地导致指责对﹁、∨、∧作真值联结词的理解。(4)不能单单保留对﹁、∨、∧的真值函项解释而唯独修改实质蕴涵。"}]}, {"id": "5-9-4", "name": "实质蕴涵怪论无害性", "category": 3, "symbolSize": 26, "desc": "实质蕴涵怪论对于推理过程或者无用或者无害，不能合法用于推理。", "children": [{"id": "5-9-4-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "从怪论推出的蕴涵式不能再与其他前提结合用于推理，否则导致循环或矛盾。", "detail": "(1)从B推出A→B后，若再用A→B与A结合推出B，会造成逻辑循环。(2)从﹁A推出A→B后，若再用A→B与A结合推出B，会在前提中导致逻辑矛盾A∧﹁A。(3)约翰逊指出：'从蕴涵者的否定或被蕴涵者的肯定推出的蕴涵式不能再应用于其他推理中，否则会导致矛盾或循环的逻辑谬误。'"}]}, {"id": "5-9-5", "name": "推出过多与推出过少之反驳", "category": 3, "symbolSize": 26, "desc": "指责经典逻辑推出过多和推出过少均不成立。", "children": [{"id": "5-9-5-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "推出过多实为矛盾律的强调说法，推出过少涉及的非逻辑词义推理不属于纯逻辑。", "detail": "(1)关于'推出过多'：(A∧﹁A)→B是矛盾律的强调说法，意即'如果逻辑矛盾可以成立则任何命题都可以成立'，正是以另一种形式强调逻辑矛盾恒假。(2)关于'推出过少'：如'单身汉所以是未结婚的男人'依据的是词义，需要加一部词典才能说明其有效性，这不是纯粹的逻辑推理。(3)并非一切具有推理必然性的真理都是逻辑真理，还有语义真理、数学真理等。(4)当人们推出逻辑矛盾时会就此打住，不会继续推出任意命题，而会回头检查推理是否出错。"}]}]}]}, {"id": "c06", "name": "第六章 对形式化方法的哲学考察", "desc": "正文 · 共4个小节", "isAppendix": false, "children": [{"id": "6-1", "name": "形式化的一般程序及其本质", "category": 2, "symbolSize": 32, "desc": "阐述形式化的三大步骤及其与符号化、公理化的区别。", "children": [{"id": "6-1-1", "name": "预备性研究", "category": 3, "symbolSize": 26, "desc": "形式化前须先澄清概念、消除歧义、理清逻辑关系。", "children": [{"id": "6-1-1-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "要把一个理论形式化，常常需要先做一些预备性研究。", "detail": "(1)若所要形式化的理论本身概念模糊、命题有歧义、逻辑关系混乱，则无法成功形式化。(2)形式化只是把已有研究成果组织为理论体系的方法，没有深刻思想支撑的形式系统毫无价值。(3)任何成功的形式化，总是先要做一番梳理、廓清的工作，例如澄清概念与命题，消除歧义与不精确之处，弄清逻辑关系。"}, {"id": "6-1-1-2", "name": "论证依据", "category": 4, "symbolSize": 22, "desc": "若理论不成熟则形式化空洞无物或错误百出。", "detail": "(1)普特南指出：可以通过讨论'递归规则'和'语言共相'给传统的错误穿上现代的服装，但它们仍然是传统的错误。(2)一套精巧复杂的技术性架构，如果没有深刻的思想支撑着，就是一堆毫无价值的精神性垃圾。(3)语义理论的问题是要摆脱将语词的意义看作是像一系列概念之类的东西，不要对这种误入歧途的观点加以形式化。"}, {"id": "6-1-1-3", "name": "代表人物", "category": 4, "symbolSize": 22, "desc": "普赖尔、冯·赖特、亨迪卡、齐硕姆等逻辑学家。", "detail": "(1)普赖尔、冯·赖特、亨迪卡、齐硕姆等逻辑学家在构造时态逻辑、道义逻辑、认知逻辑的形式系统时，总是先在相关领域做一番哲学探究。(2)他们写有相关论题的哲学论著，或者在相应的逻辑著作中有大量的哲学讨论。"}]}, {"id": "6-1-2", "name": "形式语言", "category": 3, "symbolSize": 26, "desc": "由字母表和形成规则构成，克服自然语言的缺陷。", "children": [{"id": "6-1-2-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "形式语言具有单义性、精确性、结构简明等优点。", "detail": "(1)形式语言克服了自然语言不精确、语法混乱、表达笨拙等缺陷。(2)形式语言一经创立就脱离了与直观背景的一切联系，本身除了用自己的形状表达结构信息之外再不传达任何意义信息，因此是单义的。(3)它内部的词和句由明确陈述的句法规则递归生成，不允许有对规则的任何偏离，因此异常精确。(4)由于选用简短的符号，结构简明，书写方便，表达能力强且容易理解。"}, {"id": "6-1-2-2", "name": "论证依据", "category": 4, "symbolSize": 22, "desc": "自然语言具有不精确、语法混乱、表达笨拙三大缺陷。", "detail": "(1)自然语言不精确，具有严重的歧义。例如'打'字可作动词、量词和介词，作为动词就有24个义项，多义性和歧义性常常成为谬误推理的源泉。(2)自然语言的语法复杂、非单义甚至混乱，语法结构和思想的逻辑结构之间不存在普遍且必然的一致，使得语言有可能歪曲和臆造思想。(3)自然语言的表达方式极其笨拙，有些复杂的科学公式用自然语言根本无法表达。"}, {"id": "6-1-2-3", "name": "代表人物", "category": 4, "symbolSize": 22, "desc": "以一阶语言L为例阐明形式语言的构造与性质。", "detail": "(1)一阶语言L的字母表包括：个体变项、个体常项、谓词符号、函数符号、联结词﹁和→、量词、辅助性符号。(2)形成规则包括项的形成规则和公式的形成规则，两者都是递归定义的。(3)在一阶语言中区分项、公式、量化公式、约束变项、自由变项、开公式和闭公式等概念。"}]}, {"id": "6-1-3", "name": "演绎装置", "category": 3, "symbolSize": 26, "desc": "包括公理和变形规则，实现符号公式的严格变换。", "children": [{"id": "6-1-3-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "证明完全变成符号公式之间的变换，不涉及意义。", "detail": "(1)形式系统的演绎装置包括两部分：作为演绎出发点的公理，以及指导演绎如何进行的变形规则。(2)证明变成符号公式之间的变换，变换只涉及符号的形状而丝毫不涉及这些符号的意义。(3)形式化方法的实质：完全撇开所使用的符号的意义，撇开该符号系统所适用的对象范围，只凭借明确给出的与符号的字形相关的语法规则构造形式系统。"}, {"id": "6-1-3-2", "name": "论证依据", "category": 4, "symbolSize": 22, "desc": "以一阶逻辑形式系统K为例展示演绎装置的结构。", "detail": "(1)系统K的公理包括A1至A5共五条公理模式，涵盖命题逻辑和谓词逻辑的基本原理。(2)变形规则包括分离规则（从A和A→B推出B）和概括规则（从A推出∀xi A）。(3)在K中严格定义了证明、定理、演绎、后承等概念。证明是一个有穷非空的合式公式序列，每一步或是公理，或是由变形规则从前面公式得到。"}, {"id": "6-1-3-3", "name": "代表人物", "category": 4, "symbolSize": 22, "desc": "以一阶逻辑公理系统K为代表展示演绎装置。", "detail": "(1)系统K由一阶语言L加公理和变形规则构成。(2)K中的证明示例：通过公理A1、A2和分离规则，可以证明(A→A)是K中的定理。"}]}, {"id": "6-1-4", "name": "元逻辑研究", "category": 3, "symbolSize": 26, "desc": "以形式系统为对象，从语法和语义两个角度研究其性质。", "children": [{"id": "6-1-4-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "形式系统构造完成后即成为对象理论，需元理论研究。", "detail": "(1)以形式系统为对象的理论称为元理论，若对象是逻辑形式系统则称为元逻辑。(2)元理论从语法和语义两个角度研究形式系统：语法处理符号与符号之间的关系，语义处理符号与其所指对象之间的关系。(3)语法研究要使用语法元语言，语义研究要使用语义元语言，与用对象语言陈述的内定理相对。"}, {"id": "6-1-4-2", "name": "论证依据", "category": 4, "symbolSize": 22, "desc": "元逻辑研究系统的一致性、完全性、可判定性等特性。", "detail": "(1)一致性（相容性）有语法和语义两种涵义，是最重要的元逻辑特性，涉及形式系统能否成立。(2)完全性也有语法和语义两种涵义，涉及系统的推演能力。(3)可判定性与能行方法的概念分不开。(4)独立性涉及选择公理时是否经济。(5)范畴性指所有模型都同构。"}, {"id": "6-1-4-3", "name": "代表人物", "category": 4, "symbolSize": 22, "desc": "形式系统内使用对象语言，元理论使用元语言。", "detail": "(1)形式系统内使用的人工符号语言称为对象语言，无法刻画形式系统的性质。(2)为了完成这种说明和刻画，需要元语言，往往是自然语言加特定的符号语言。(3)语法语言如'合式公式''证明''可证''定理'等是典型语法概念；语义语言如'真''假''重言式''模型'等是典型语义概念。"}]}, {"id": "6-1-5", "name": "形式化与符号化之辨", "category": 3, "symbolSize": 26, "desc": "符号化是形式化的前提，但不等同于形式化。", "children": [{"id": "6-1-5-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "把符号化等同于形式化是错误的。", "detail": "(1)初步的符号化是指以自然语言为主同时使用人工符号表示特定概念和命题，历史悠久，几乎被应用于一切科学。(2)严格意义的符号化即构造形式语言，是形式化的前提，但只是形式化过程的一个步骤、一个环节。(3)形式系统由形式语言和演绎装置两部分构成，严格意义的符号化只是形式系统的构成要素之一。"}]}, {"id": "6-1-6", "name": "形式化与公理化之辨", "category": 3, "symbolSize": 26, "desc": "公理化是形式化的前提，但形式化比公理化更抽象。", "children": [{"id": "6-1-6-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "形式化是严格符号化与公理化相结合的产物。", "detail": "(1)公理化是从诸多概念中挑选初始概念、从命题中挑选公理，然后应用逻辑规则推演出定理的方法。(2)公理系统的对象域是事先给定的且基本用自然语言陈述；形式系统事先不假定任何论域、事后容许多种不同的解释，且全部用形式语言陈述。(3)形式化是公理化发展的高级阶段，其抽象化和符号化的程度比一般公理化高得多。"}]}]}, {"id": "6-2", "name": "模型：从现实世界到可能世界", "category": 2, "symbolSize": 32, "desc": "形式系统解释经历了从单世界假定到多世界假定的演变。", "children": [{"id": "6-2-1", "name": "现实世界模型", "category": 3, "symbolSize": 26, "desc": "亦称单世界假定，认为形式系统只能参照现实世界解释。", "children": [{"id": "6-2-1-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "形式系统内的一切符号和公式都解释为现实世界中的对象。", "detail": "(1)认为我们能够在形式系统中适当地谈论其存在的一切都必定存在于现实世界中，经过分析最终都是现实世界中的居民。(2)逻辑真理也是关于这个现实世界的真理，只不过所关注的是这个世界的更为抽象和一般的方面或特性。(3)逻辑学家应该保持一种健全的实在感。"}, {"id": "6-2-1-2", "name": "论证依据", "category": 4, "symbolSize": 22, "desc": "从亚里士多德到弗雷格罗素，公理化系统以现实空间为论域。", "detail": "(1)亚里士多德的三段论还原学说实质上是公理化实践，以自明的公理为出发点。(2)欧氏几何在给出概念和公理前就预设了由感性直观把握的现实空间为对象域。(3)欧氏几何第五公设的自明性受质疑，但罗巴切夫斯基和黎曼创立的非欧几何最终仍在现实空间中获得解释和应用。(4)非欧几何虽开始偏离实质公理化，但仍可归属于现实世界模型。"}, {"id": "6-2-1-3", "name": "代表人物", "category": 4, "symbolSize": 22, "desc": "弗雷格、罗素、蒯因是现实世界模型的典型倡导者。", "detail": "(1)弗雷格认为只有一个世界即现实世界，语言表达式的所指就是现实世界中的对象；语句的所指是其真值；逻辑规律是关于现实世界的最普遍最一般的真理。(2)罗素明确主张：'只有一个世界，这就是实在的世界'，逻辑关心实在世界也和动物学一样真诚。(3)蒯因在这方面有过之而无不及。(4)根据亨迪卡的研究，甚至哥德尔和塔斯基也持有单世界假定。"}]}, {"id": "6-2-2", "name": "抽象一般的模型", "category": 3, "symbolSize": 26, "desc": "结构加指派构成完整语义解释，是形式语义学的基础。", "children": [{"id": "6-2-2-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "结构加指派构成完整的语义解释（赋值）。", "detail": "(1)一个结构U=〈D，τ〉包括非空个体域D和映射τ，τ为个体常项指派特定个体，为函数符号指派运算，为谓词符号指派性质或关系。(2)结构上的指派ρ是对每个个体变项指派个体域中的个体。(3)赋值σ=〈U，ρ〉，使任一L项t或公式α获得确定的值。"}, {"id": "6-2-2-2", "name": "论证依据", "category": 4, "symbolSize": 22, "desc": "基于赋值定义可满足、普遍有效、模型等语义概念。", "detail": "(1)如果有赋值使一个公式为真，该公式为可满足的。(2)如果一公式对于任意赋值都是真的，称为常真公式或普遍有效式。(3)使某一公式或公式集为真的解释称为该公式或公式集的模型。(4)可靠的形式系统是所有可证公式都普遍有效的系统；完全的形式系统是凡普遍有效的公式皆可证的系统。"}, {"id": "6-2-2-3", "name": "代表人物", "category": 4, "symbolSize": 22, "desc": "希尔伯特《几何基础》构成向抽象模型过渡的关键环节。", "detail": "(1)希尔伯特在《几何基础》中不预先给定对象域，对初始概念不予定义，不给予具体涵义。(2)公理只是初始概念的隐定义，表示初始概念之间的形式结构关系。(3)选取公理的标准不是直观性和自明性，而是推出定理时的有用性及独立性。(4)希尔伯特指出：'我们必定可以用桌子、椅子和啤酒杯来代替点、线、面'。"}]}, {"id": "6-2-3", "name": "可能世界模型", "category": 3, "symbolSize": 26, "desc": "亦称多世界假定，命题真假相对于特定的可能世界。", "children": [{"id": "6-2-3-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "必然性是在所有可能世界中真，可能性是在某些可能世界中真。", "detail": "(1)莱布尼茨首倡可能世界概念：一个事态A是可能的当且仅当A不包含逻辑矛盾；由无穷多的具有各种性质的事物所形成的可能的事物的组合就是一个可能世界。(2)必然命题在所有可能世界中都真实；可能命题在某些可能世界中真实。(3)逻辑真理大致相当于在所有的可能世界中都真的真理。"}, {"id": "6-2-3-2", "name": "论证依据", "category": 4, "symbolSize": 22, "desc": "可能世界语义学使命题真假和模态概念相对化。", "detail": "(1)命题的真假相对于特定的可能世界而言，给命题赋值必须注明是在哪个可能世界之中。(2)必然性和可能性概念也相对于特定的可能世界而言，不能抽象地谈论。(3)可能世界之间具有可通达关系R：一命题在某一世界中必然，当且仅当它在与该世界有关的所有可能世界中真。(4)模型μ=〈W,R,V〉是基本概念，W是可能世界集，R是W上的二元关系，V是赋值。"}, {"id": "6-2-3-3", "name": "代表人物", "category": 4, "symbolSize": 22, "desc": "莱布尼茨首倡，克里普克、亨迪卡等人发展为严密语义学。", "detail": "(1)莱布尼茨是多世界理论的首倡者和最明确的表述者。(2)20世纪50至60年代，坎格尔、蒙塔古、普赖尔、亨迪卡和克里普克等人从莱布尼茨思想出发发展出可能世界语义学。(3)可能世界语义学为几乎所有模态逻辑系统证明了可靠性和完全性，并在哲学逻辑的广大领域获得成功应用。"}]}]}, {"id": "6-3", "name": "希尔伯特规划和形式主义", "category": 2, "symbolSize": 32, "desc": "希尔伯特规划旨在用有穷方法证明数学一致性，形式主义为其极端化。", "children": [{"id": "6-3-1", "name": "希尔伯特规划", "category": 3, "symbolSize": 26, "desc": "将数学形式化后用有穷方法证明各形式系统的一致性。", "children": [{"id": "6-3-1-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "用有穷方法证明各形式系统的一致性以保卫古典数学。", "detail": "(1)将各门数学形式化，构成形式系统或形式理论。(2)用有穷方法证明各形式系统的一致性。(3)由此导出全部数学的一致性，以此保卫古典数学。"}, {"id": "6-3-1-2", "name": "论证依据", "category": 4, "symbolSize": 22, "desc": "实无穷是数学不可缺少的理想元素，但绝对可靠性只在有穷范畴。", "detail": "(1)实无穷是数学思维中不可缺少的，数学分析在一定意义上是一部无穷的交响乐。(2)但绝对可靠性只存在于有穷的范畴内，对实无穷的任何指涉都是不那么可靠的。(3)因此将全部数学分为只包含有穷成分的现实数学和涉及实无穷的理想数学两部分。(4)尽管理想数学不具有真实的意义，但只要能证明这种理论不会导致悖论，这些数学仍是可靠的，仍应保留。"}, {"id": "6-3-1-3", "name": "经典诘难", "category": 4, "symbolSize": 22, "desc": "哥德尔第二不完全性定理给希尔伯特规划以沉重打击。", "detail": "(1)哥德尔第二不完全性定理证明：如果一个包括初等数论的形式系统是一致的，那么其一致性不能用有穷方法甚至不能用一阶逻辑和初等数论的方法来证明。(2)这表明对元理论的有穷主义要求应当放宽，应允许使用比有穷方法更强的超穷方法。(3)后来确实有人用超穷方法证明了初等数论的一致性，但这已不是希尔伯特原来的设想。"}, {"id": "6-3-1-4", "name": "代表人物", "category": 4, "symbolSize": 22, "desc": "希尔伯特是与直觉主义者论战中提出该规划的。", "detail": "(1)希尔伯特不同意直觉主义者否定实无穷和排斥排中律的做法。(2)排中律是一个普遍适用的逻辑原则，在数学中禁止使用排中律就像在天文学中禁止使用望远镜一样荒谬。(3)他认为绝对的可靠性只存在于有穷的范畴内，因此提出用有穷方法证明包含实无穷的古典数学的一致性。"}, {"id": "6-3-1-5", "name": "修正版本", "category": 4, "symbolSize": 22, "desc": "放宽有穷主义要求后发展出证明论这一重要分支。", "detail": "(1)希尔伯特规划按其本意是失败了，但却从中产生了许多积极的成果。(2)最直接的结果是证明论作为数学和逻辑的重要分支之一得以形成和发展。(3)对元理论的有穷主义要求应放宽，应允许使用比有穷方法更强的超穷方法。"}]}, {"id": "6-3-2", "name": "形式主义", "category": 3, "symbolSize": 26, "desc": "极端唯名论在数学中的表现，认为数学即符号游戏。", "children": [{"id": "6-3-2-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "数学对象的存在性和数学命题的真理性就在于一致性。", "detail": "(1)不承认数学对象的客观实在性，把数学等同于纯粹意义的符号操作。(2)数学就是符号的游戏，从事数学研究如同下棋，所驱遣的数学对象就像无实在意义的棋子。(3)对这种游戏的唯一要求就是它的无矛盾性，此外也许还要考虑到是否方便、是否富于成果以及结构上是否美。"}, {"id": "6-3-2-2", "name": "论证依据", "category": 4, "symbolSize": 22, "desc": "实无穷没有直观上可信的合理根据，数学对象是自由创造。", "detail": "(1)实在论的最大弱点是没有能力说明无穷公理的无穷无尽序列的根源。(2)鲁宾逊指出：不论从无穷总体的哪种意义来说，无穷总体都是不存在的，任何讲到或意思上含有无穷总体的说法都是没有意义的。(3)数学对象在现实世界中是不存在的，只是数学家思维的自由创造，是一种有用的虚构。"}, {"id": "6-3-2-3", "name": "经典诘难", "category": 4, "symbolSize": 22, "desc": "无矛盾性并不足以保证真理性，布劳维尔提出尖锐批评。", "detail": "(1)布劳维尔指出：形式主义数学借助于其无矛盾性证明而获得的逻辑证实包含了一种恶性循环，因为它事实上已经假定了由命题的无矛盾性可以推出它的正确性。(2)理论的无矛盾性并不足以保证其真理性，因为一个假的理论终究是假的，即使人们找不到矛盾。(3)正如一个犯罪行为总归是罪恶的，不管它有无受到法庭的判决一样。"}, {"id": "6-3-2-4", "name": "代表人物", "category": 4, "symbolSize": 22, "desc": "柯里、鲁宾逊、柯恩自称形式主义者。", "detail": "(1)柯里认为对数学的唯一要求就是无矛盾性，此外还考虑是否方便和富于成果。(2)鲁宾逊提出两条原则：无穷总体不存在，但应该照常继续搞数学。(3)柯恩认为即使最坚定的实在论者在面对充分不可达基数时也一定会退缩。(4)希尔伯特常被误认为形式主义者，但他并不认为数学只是一套没有现实意义的符号操作。"}, {"id": "6-3-2-5", "name": "修正版本", "category": 4, "symbolSize": 22, "desc": "希尔伯特的思想是形式主义的渊源但不等同于形式主义。", "detail": "(1)希尔伯特把数学分为现实数学和理想数学，不涉及实无穷的现实数学的可靠性和真理性毋庸置疑，在这一点上他严格区别于形式主义者。(2)希尔伯特被称为方法论上的实无穷论者，不完全否定实无穷，认为它是数学思维中不可缺少的。(3)形式主义是把希尔伯特某些思想极端化的结果。"}]}]}, {"id": "6-4", "name": "形式化方法的作用和限度", "category": 2, "symbolSize": 32, "desc": "形式化既有重要的方法论作用，也存在内在的局限性。", "children": [{"id": "6-4-1", "name": "新视角与新思考方式", "category": 3, "symbolSize": 26, "desc": "形式化派生出元研究，为一切科学提供新的研究方式。", "children": [{"id": "6-4-1-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "元研究以某一理论自身为对象，意义比对象理论内部研究更重大。", "detail": "(1)把语言、定理、理论区分为不同层次，要求在较高层次(n+1)上去讨论较低层次(n层)的一般性质，这是形式化研究的一个极其重要的成果。(2)元研究把锋芒对准对象理论本身，使我们在更广阔的视野中重新审查对象理论的对象、性质、根基及其正当性和有效性。(3)一门学科的重大变革，首先是在元科学层次上的变革，随后才是该门学科中基本问题的转换。"}, {"id": "6-4-1-2", "name": "论证依据", "category": 4, "symbolSize": 22, "desc": "其他科学领域已明显受元研究方式影响。", "detail": "(1)数学领域有元数学。(2)哲学领域元研究方兴未艾，有元哲学、元伦理学、元美学等。(3)其中元伦理学最为完善，几乎成为当代伦理学研究中最主要的倾向和派别。(4)作者同意'哲学需要元理论'这一看法。"}]}, {"id": "6-4-2", "name": "提高严格性和精确性", "category": 3, "symbolSize": 26, "desc": "形式系统排除模糊性和歧义性，杜绝隐含前提的错误。", "children": [{"id": "6-4-2-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "形式系统内的证明或推导极其严格，排除隐含前提的可能。", "detail": "(1)形式系统的语言排除了任何模糊性和歧义性，符号除表达结构信息外不再具有任何意义，因而是单义的。(2)形式系统内的证明严格规定每一步要么是公理，要么是已证定理，要么由变形规则得到，排除了使用任何隐含前提或未明确陈述规则的可能性。(3)形式系统一般能在有穷步内判定符号是否初始符号、序列是否为公式、公式是否为公理等。"}, {"id": "6-4-2-2", "name": "论证依据", "category": 4, "symbolSize": 22, "desc": "以中国哲学研究中的不精确和缺乏论证性为例。", "detail": "(1)人们赋予同一个'网上纽结'以诸多不同的意义，如关于'真理有无阶级性'的讨论中人们在不同意义上使用'真理''阶级性'等概念。(2)'事物都是普遍联系的'这一命题至少容许六种强弱不同的解释。(3)许多哲学论著缺乏论证性，充满新名词新材料却对关键思想轻描淡写，时常可见内容混杂、重叠甚至冲突之处。"}, {"id": "6-4-2-3", "name": "代表人物", "category": 4, "symbolSize": 22, "desc": "马里奥·邦格主张哲学研究应系统精确科学地进行。", "detail": "(1)马里奥·邦格指出：自19世纪以来唯物主义没有取得进步，部分地是由于它无视现代逻辑并拒绝向对立的哲学学习。(2)大多数唯物主义哲学家都只说日常语言，只能以不精确的方式表达观点，很少考虑以令人信服的方法进行论证。(3)哲学的本性在于爱智慧，它是说理的，应当加强论证性，使其逐步精确化、严格化。"}]}, {"id": "6-4-3", "name": "揭示潜在逻辑关系", "category": 3, "symbolSize": 26, "desc": "形式化使推理链条可无限延伸，揭示潜在的涵义和关系。", "children": [{"id": "6-4-3-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "形式系统中推理链条可无限延伸，得出无数条新定理。", "detail": "(1)在非形式化理论中推理链条常常很短，最多三四个层次或三四步。(2)在形式化系统中推理链条原则上可无限延伸，可能造成：原先没有意识到的涵义和逻辑关系被明确揭示；原先以为没有关系的被发现有关系；原先认为一致的可能揭示出潜在的逻辑矛盾。"}, {"id": "6-4-3-2", "name": "论证依据", "category": 4, "symbolSize": 22, "desc": "以道义逻辑为例说明形式化如何深化伦理学研究。", "detail": "(1)新兴的道义逻辑以包含义务、允许、禁止等概念的语句的逻辑特性和推理关系为对象。(2)它导出了许多有关这些概念的新定理，有助于把模糊的伦理学概念精确地加以规定，并把潜在的涵义和关系阐发清楚。(3)道义逻辑触及到义务和伦理规则的关系、伦理规则集的层次性、义务的冲突与矛盾及其克服等深刻的伦理学问题。"}]}, {"id": "6-4-4", "name": "有助于不同观点的比较", "category": 3, "symbolSize": 26, "desc": "形式化使模糊观点精确化后便于相互比较和批判。", "children": [{"id": "6-4-4-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "精确化后不同观点之间可进行相互比较和批判。", "detail": "(1)大而统之、简而化之的方式提出的观点几乎不能与其他观点比较，因为它不具有确定的形式，弹性较大。(2)一旦利用形式化方法使其精确化和严格化后，就可以进行相互比较和相互批判，弄清楚它们之间的真实关系。"}, {"id": "6-4-4-2", "name": "论证依据", "category": 4, "symbolSize": 22, "desc": "以时态逻辑为例说明不同时间观的形式刻画与比较。", "detail": "(1)哲学家对于时间有各种各样的看法：有始有终或无始无终、连续或离散、一维决定或多维非决定等。(2)现代时态逻辑从各种不同的哲学观点出发，构造了线性时态逻辑、枝形时态逻辑等不同的形式系统。(3)由于这些逻辑是严格构造的形式系统，它们之间的关系十分清楚，而这在直观朴素的观点中根本做不到。"}]}, {"id": "6-4-5", "name": "适用范围的狭窄性", "category": 3, "symbolSize": 26, "desc": "只有成熟自足的理论才适合形式化，且只涉及形式和逻辑方面。", "children": [{"id": "6-4-5-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "并不是一切理论都能够被形式化。", "detail": "(1)只有那些发展得比较成熟、逻辑关系比较清晰的理论才可能形式化。(2)只有那些围绕特定主题、逻辑上层层展开、自我表达自我论证的自足理论才适于形式化。(3)以论战性为主的论著不适于形式化，很不成熟的理论首要任务不是形式化而是研究自身面临的难题。"}, {"id": "6-4-5-2", "name": "论证依据", "category": 4, "symbolSize": 22, "desc": "形式化只能作用于概念形式和逻辑关系三个方面。", "detail": "(1)形式化只能在三点上起作用：更严格更精确地限定概念命题的涵义。(2)更清晰地展示概念命题之间的逻辑关系。(3)尽可能多地展开逻辑推论以揭示概念命题的潜在逻辑涵义。(4)形式化并不过问物质第一性还是精神第一性等基本哲学问题，适用范围比较狭窄。"}]}, {"id": "6-4-6", "name": "研究结果的尝试性", "category": 3, "symbolSize": 26, "desc": "形式理论只是一种暂时性和尝试性的理论，是可错的。", "children": [{"id": "6-4-6-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "应用形式化方法所得到的形式理论只是尝试性的理论。", "detail": "(1)科学理论从来不具有最终的和绝对的确定性，总是受到新的事实材料的反驳或修正。(2)无论形式理论与我们对所研究领域的非形式理解多么一致，不一致的可能性永远不会完全被排除。(3)精确性并不能保证正确性，而是使我们易于发现错误并改正它；精确性也不能保证深度和重要性，而是使我们有可能进行合理的检查。"}, {"id": "6-4-6-2", "name": "论证依据", "category": 4, "symbolSize": 22, "desc": "尝试性源自非形式思想的松散性和形式系统设计问题。", "detail": "(1)在非形式思想中总存在着某种程度的松散性或薄弱性，甚至基本命题本身就是错误的，作为出发点的这种松散性或错误必然反映为系统化理论的暂时性。(2)形式系统所选择的初始概念和公理可能不是最基本的概念或命题，或其涵义偏离原型。(3)推理规则选择不当，有些推演能力太强或过弱，可能导致在形式理论中出现悖论性结果。"}, {"id": "6-4-6-3", "name": "代表人物", "category": 4, "symbolSize": 22, "desc": "雷谢尔和马里奥·邦格强调形式理论的尝试性与可错性。", "detail": "(1)雷谢尔指出：运用形式化方法所建立的任何系统，如果与新发现的事实不相符合，即导致了迄今为止未预见到而直观上又不可接受的结果，就会被推翻。(2)马里奥·邦格指出：精确性并不能保证正确性，而是使我们易于发现错误并改正它。"}]}, {"id": "6-4-7", "name": "作用程度的有限性", "category": 3, "symbolSize": 26, "desc": "形式化方法受到三大局限性定理的严格制约。", "children": [{"id": "6-4-7-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "对于足够复杂的形式系统，存在不可消除的内在局限。", "detail": "(1)如果S是逻辑上无矛盾的，则S必然是不完全的，即并非所有的真命题都在S中可证。(2)S必然是不可判定的，即不存在可用来判定其中任一命题是否可证的算法。(3)S的真概念在本系统中是不可定义的。"}, {"id": "6-4-7-2", "name": "论证依据", "category": 4, "symbolSize": 22, "desc": "哥德尔、丘奇、图灵、塔斯基各自证明了相关的局限性定理。", "detail": "(1)哥德尔第一不完全性定理：包含形式算术系统的形式系统是不完全的；第二不完全性定理：如果这样的系统是一致的，则其一致性在本系统内不可证。(2)丘奇—图灵不可判定性定理：如果形式算术系统一致则不可判定，一阶逻辑也是不可判定的。(3)塔斯基真概念不可定义性定理：在像形式算术系统这样丰富的系统中，不能定义系统内命题的真假等语义学概念。"}, {"id": "6-4-7-3", "name": "代表人物", "category": 4, "symbolSize": 22, "desc": "哥德尔、丘奇、图灵、塔斯基揭示了形式系统的根本局限。", "detail": "(1)哥德尔于1931年证明两个不完全性定理。(2)丘奇于1936年证明形式算术系统的不可判定性。(3)图灵于1937年也证明了这一结果。(4)塔斯基于1933年证明了真概念的不可定义性。(5)最近有人证明在模态逻辑中存在无穷多个不完全的正规模态系统。"}]}]}]}, {"id": "c07", "name": "第七章 模态的形而上学", "desc": "正文 · 共6个小节", "isAppendix": false, "children": [{"id": "7-1", "name": "模态逻辑简述", "category": 2, "symbolSize": 32, "desc": "讨论模态逻辑的历史发展、基本系统和蒯因的批判", "children": [{"id": "7-1-1", "name": "模态逻辑的历史发展", "category": 3, "symbolSize": 26, "desc": "从亚里士多德到C.I.刘易斯的模态逻辑发展历程", "children": [{"id": "7-1-1-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "模态逻辑研究含模态词命题的逻辑特性及其推理关系", "detail": "(1)模态词“必然”“可能”分别用符号□、◇表示。(2)逻辑之父亚里士多德早在《解释篇》、《前分析篇》中就大量讨论模态逻辑问题。(3)麦加拉、斯多亚学派和中世纪经院哲学家也进行了很多讨论。(4)现代模态逻辑始于美国逻辑学家C.I.刘易斯，他创立了五个严格蕴涵系统S1-S5。"}, {"id": "7-1-1-2", "name": "代表人物", "category": 4, "symbolSize": 22, "desc": "模态逻辑历史发展各阶段的代表人物", "detail": "(1)古代阶段：亚里士多德。(2)中世纪阶段：麦加拉学派、斯多亚学派、中世纪经院哲学家。(3)现代阶段：C.I.刘易斯，创立严格蕴涵系统S1、S2、S3、S4和S5，成为现代模态逻辑创始人。"}]}, {"id": "7-1-2", "name": "正规模态命题逻辑系统", "category": 3, "symbolSize": 26, "desc": "以公理和推理规则定义的模态命题逻辑系统的分类", "children": [{"id": "7-1-2-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "模态命题逻辑是古典命题逻辑重言式集的扩集", "detail": "(1)模态命题逻辑是在命题演算基础上，用□和◇扩充语言并引入相关公理和变形规则而构成的。(2)古典模态逻辑满足条件(1)-(4)，包括刘易斯的S1、S2、S3。(3)正规模态逻辑满足条件(1)-(3)和(5)，以是否具有必然化规则N为区别于非正规系统的主要标志。(4)极小正规模态系统满足(1)-(3)和(5)，其他正规系统在此基础上添加公理得到。(5)常见正规模态命题逻辑系统为K、D、T、B、S4和S5。"}, {"id": "7-1-2-2", "name": "论证依据", "category": 4, "symbolSize": 22, "desc": "模态系统的形式化定义与公理基础", "detail": "(1)定义D1：一个模态命题逻辑S是古典命题逻辑重言式集的扩集。(2)五个封闭条件：□(p→q)→(□p→□q)∈S；分离规则封闭；代入规则封闭；弱必然化规则封闭；必然化规则封闭。(3)推理规则：代入规则(US)、分离规则(MP)和必然化规则为共同推理规则。(4)添加不同公理公式得到不同的正规系统。"}, {"id": "7-1-2-3", "name": "代表人物", "category": 4, "symbolSize": 22, "desc": "现代模态逻辑系统的创立者", "detail": "(1)C.I.刘易斯：创立S1-S5五个严格蕴涵系统，为现代模态逻辑创始人。"}]}, {"id": "7-1-3", "name": "模态谓词逻辑的构造", "category": 3, "symbolSize": 26, "desc": "模态命题逻辑与谓词演算结合的两种等价构造方法", "children": [{"id": "7-1-3-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "以两种等价方法构造模态谓词逻辑系统", "detail": "(1)构造模态谓词逻辑有两种等价方法：一是以谓词演算为基础加入模态词和模态公式，叫做量化逻辑的模态扩充。(2)二是以模态命题逻辑为基础，用谓词演算的语言和公理对其扩充，叫做模态命题逻辑的量化扩充。(3)有些正规模态谓词逻辑系统包含著名的巴坎公式BF：◇(∃x)F(x)→(∃x)◇F(x)。(4)包含BF的系统常简记为K+BF、D+BF、T+BF、S4+BF、S5+BF等。"}, {"id": "7-1-3-2", "name": "代表人物", "category": 4, "symbolSize": 22, "desc": "巴坎公式的提出者", "detail": "(1)巴坎(Barcan)：提出著名的巴坎公式，在模态谓词逻辑中具有重要地位。"}]}, {"id": "7-1-4", "name": "广义模态逻辑", "category": 3, "symbolSize": 26, "desc": "将模态概念扩展至道义、认知、时态等逻辑分支", "children": [{"id": "7-1-4-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "模态概念之间的关系可扩展到其他许多概念领域", "detail": "(1)1951年冯·赖特发现：在模态概念之间成立的关系可以扩展到其他许多概念之间。(2)在这一思想激励下，先后发展出道义逻辑、认知逻辑（知道逻辑、相信逻辑、问题逻辑、断定逻辑等）、时态逻辑等广义模态逻辑分支。(3)模态逻辑本身则被叫做（真势）模态逻辑。"}, {"id": "7-1-4-2", "name": "代表人物", "category": 4, "symbolSize": 22, "desc": "广义模态逻辑的发现者和推动者", "detail": "(1)冯·赖特：发现模态概念间的关系可以扩展到其他领域，推动了广义模态逻辑的发展。"}]}, {"id": "7-1-5", "name": "蒯因对模态逻辑的批判", "category": 3, "symbolSize": 26, "desc": "蒯因从动机、来源、解释三方面全面攻击模态逻辑", "children": [{"id": "7-1-5-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "整个模态逻辑都应该取消", "detail": "(1)蒯因和柏格曼在20世纪五六十年代对模态逻辑的合理性、融贯性、有用性进行了激烈抨击。(2)从动机和来源看，模态逻辑是被错误地构想出来的，源自于混淆表达式的使用与提及，是“哲学的私生子”，对科学目标来说不必要。(3)从解释方面看，模态谓词逻辑面临许多不可克服的困难，模态命题逻辑也是如此。(4)最后结论：整个模态逻辑都应该取消。"}, {"id": "7-1-5-2", "name": "论证依据", "category": 4, "symbolSize": 22, "desc": "使用与提及混淆、指称晦暗性导致不可克服的困难", "detail": "(1)模态逻辑源自混淆表达式的使用与提及，从其来源看就不合法。(2)对科学目标而言不必要。(3)模态谓词逻辑面临模态词与个体词、谓词、量词和等词相结合产生的哲学和技术难题。"}, {"id": "7-1-5-3", "name": "代表人物", "category": 4, "symbolSize": 22, "desc": "模态逻辑的主要批评者", "detail": "(1)蒯因(Quine)：模态逻辑最激烈、最全面的批评者。(2)柏格曼(Bergmann)：同样抨击模态逻辑的合理性。"}]}]}, {"id": "7-2", "name": "指称的晦暗性", "category": 2, "symbolSize": 32, "desc": "同一替换和存在概括规则在模态语境中的失效及其解决方案", "children": [{"id": "7-2-1", "name": "同一替换规则失效", "category": 3, "symbolSize": 26, "desc": "模态词造成晦暗语境使同一替换规则失效", "children": [{"id": "7-2-1-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "模态语境中指称晦暗导致同一替换从真命题得到假命题", "detail": "(1)经典谓词演算中的同一性原理：(x=y)→(F(x)↔F(y))。(2)同一替换在模态语境中不成立：从“9必然大于7”与“行星的数目＝9”，经替换得到“行星的数目必然大于7”，从真命题得假命题。(3)从“必然地，如果在暮星上有生命，那么在暮星上有生命”与“暮星＝晨星”，替换得到假命题。(4)蒯因分析原因：模态词“必然地……”和“可能地……”像引文一样是在指称上暧昧的，单称词项因而指称暧昧。"}, {"id": "7-2-1-2", "name": "论证依据", "category": 4, "symbolSize": 22, "desc": "行星数目与9、暮星与晨星的反例", "detail": "(1)真命题：(1)9必然大于7；(2)必然地，如果在暮星上有生命，那么在暮星上有生命。(2)经验真命题：(5)行星的数目＝9；(6)暮星＝晨星。(3)替换后的假命题：(3)行星的数目必然大于7；(4)必然地，如果在暮星上有生命，则在晨星上也有生命。(4)行星的数目大于7、暮星＝晨星都是偶然经验事实，不是必然的。"}, {"id": "7-2-1-3", "name": "代表人物", "category": 4, "symbolSize": 22, "desc": "指出模态语境指称晦暗性的哲学家", "detail": "(1)蒯因：证明模态词造成晦暗语境，指出重要的事情是要了解“必然地……”和“可能地……”这两个语组是在指称上暧昧的。"}]}, {"id": "7-2-2", "name": "存在概括规则失效", "category": 3, "symbolSize": 26, "desc": "模态语境中量化导致存在概括规则和全称示例规则失效", "children": [{"id": "7-2-2-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "模态语境中应用量词导致真命题推出假命题", "detail": "(1)在经典谓词逻辑中，存在概括规则：F(y)→(∃x)F(x)有效。(2)从(1)实施存在概括得(∃x)(x必然大于7)，从(2)得(∃x)□(如果在暮星上有生命，则在x上有生命)。(3)按照蒯因观点，存在就是成为约束变元的值，(7)和(8)分别承诺了一个个体存在。(4)指称9这同一个体有两种方式：自然数9（得真语句）和行星的数目（得假语句），真值不唯一，依赖于约束变元所代表的个体的指称方式。(5)全称示例原则与存在概括是同一个原理的两个方面，同样在模态语境中不成立。(6)“我们一般都不能正当地对指称暧昧的语组进行量化。”"}, {"id": "7-2-2-2", "name": "代表人物", "category": 4, "symbolSize": 22, "desc": "证明存在概括规则在模态语境中失效的逻辑学家", "detail": "(1)蒯因：证明全称示例原则与存在概括是同一个原理的两个方面，在模态语境中均不成立。"}]}, {"id": "7-2-3", "name": "失效原因分析", "category": 3, "symbolSize": 26, "desc": "同一替换和存在概括失效的两个根本原因", "children": [{"id": "7-2-3-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "跨世界外延差异和内涵决定外延导致规则失效", "detail": "(1)原因一：在一阶逻辑中只考虑词项在单个世界中的外延；在模态逻辑中需考虑词项在所有可能世界中的外延。由现实世界中外延同一，不能确保在所有可能世界中都外延同一。(2)原因二：词项之所以在不同可能世界中有不同外延，是因为词项既有外延又有内涵，内涵决定外延。同样的内涵在不同可能世界中可能识别出不同的外延。"}]}, {"id": "7-2-4", "name": "必然同一与严格指示词", "category": 3, "symbolSize": 26, "desc": "通过强化同一为必然同一和严格指示词解决替换失效", "children": [{"id": "7-2-4-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "将同一强化为所有可能世界中的必然同一", "detail": "(1)必然等同系统包含定理：x=y→□(x=y)，如果x和y等同则它们必然等同。(2)也有必然不等同系统：x≠y→□(x≠y)。(3)克里普克的严格指示词理论：专名没有涵义只有所指，在所有可能世界指称同一个体，是严格指示词。(4)摹状词有涵义，在不同可能世界可能指称不同对象，是非严格指示词。(5)在模态语境中不能用非严格指示词去替换严格指示词。"}, {"id": "7-2-4-2", "name": "代表人物", "category": 4, "symbolSize": 22, "desc": "严格指示词理论的提出者", "detail": "(1)克里普克(Kripke)：提出严格指示词理论，专名在所有可能世界指称同一个体。"}]}, {"id": "7-2-5", "name": "限界个体与等同域方案", "category": 3, "symbolSize": 26, "desc": "限界个体和等同个体域使同一空洞地成为必然同一", "children": [{"id": "7-2-5-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "个体不能跨越可能世界，各世界有相同个体集", "detail": "(1)大卫·刘易斯的限界个体理论：个体不能跨越不同的可能世界而存在，只能存在于一个可能世界中，是受制于世界的。(2)如果两个体在某个可能世界中同一，则述说它们同一的命题在任何可能世界都不会假，因为它们在其他可能世界根本不出现，同一空洞地成为必然同一。(3)等同个体域方案：令所有可能世界都有相同的个体集H(wi)=D，满足□=和□≠的赋值条件。"}, {"id": "7-2-5-2", "name": "代表人物", "category": 4, "symbolSize": 22, "desc": "限界个体理论的提出者", "detail": "(1)大卫·刘易斯(David Lewis)：提出限界个体(bound-world individual)理论。"}]}, {"id": "7-2-6", "name": "偶然等同系统", "category": 3, "symbolSize": 26, "desc": "限制同一替换规则以容纳现实世界中大量存在的偶然同一", "children": [{"id": "7-2-6-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "通过限制同一替换规则构造偶然等同系统", "detail": "(1)现实世界中偶然同一是大量存在的，如暮星=晨星，北京=中华人民共和国首都。(2)必然等同系统排除了偶然同一，这是其局限。(3)亨迪卡通过限制同一替换规则在模态语境中的使用，构造了偶然等同的系统。(4)同一替换和存在概括规则失效对于模态逻辑并不致命，哲学上有合理说明，技术上有合适办法处理。"}, {"id": "7-2-6-2", "name": "代表人物", "category": 4, "symbolSize": 22, "desc": "偶然等同系统的构造者", "detail": "(1)亨迪卡(Hintikka)：通过限制同一替换规则在模态语境中的使用构造偶然等同系统。"}]}]}, {"id": "7-3", "name": "对象的增殖", "category": 2, "symbolSize": 32, "desc": "内涵对象和可能个体导致的本体论对象增殖问题", "children": [{"id": "7-3-1", "name": "弗雷格的内涵实体观", "category": 3, "symbolSize": 26, "desc": "间接引语语境中表达式具有间接外延即内涵", "children": [{"id": "7-3-1-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "表达式外延依赖于语法环境，在间接语境中外延是内涵", "detail": "(1)弗雷格考虑外延论题不成立的间接引语语境，如“哥白尼相信地球围绕太阳旋转”，其真假不依赖于所相信东西之真假，只依赖于他是否相信子句所表达的思想。(2)在间接引语语境中，表达式不具有通常的外延，而具有间接的外延。(3)这种间接外延等同于该表达式的内涵。(4)适用于外延的组合性原则失效归因于自然语言的歧义。(5)引入∧a表示a的概念，∧a的外延是a的内涵。(6)词项所表达的概念和语句所表达的命题(思想)作为内涵性对象被引进，导致对象增殖。"}, {"id": "7-3-1-2", "name": "代表人物", "category": 4, "symbolSize": 22, "desc": "最早提出内涵实体问题的哲学家", "detail": "(1)弗雷格(Frege)：最早考虑外延论题不成立的间接引语语境，认为间接外延等同于表达式内涵。"}]}, {"id": "7-3-2", "name": "蒯因对内涵实体的批判", "category": 3, "symbolSize": 26, "desc": "接纳内涵实体不能消除量化困难且使模态逻辑蜕化为经典逻辑", "children": [{"id": "7-3-2-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "内涵实体不可接受，即使接纳也摆脱不了困境", "detail": "(1)模态语境类似于间接引语语境，词项和语句具有间接外延：概念和命题。(2)若要排除模态语境的指称晦暗性，必须在论域上施加更严格限制，只承认满足条件C的对象：刻画它们的任意两个条件是必然等值的。(3)结果：金星因具有异义名称而被排除，必须承认金星概念、暮星概念和晨星概念三个内涵对象。(4)蒯因绝对不能接受这种本体论，认为只能容许概念或属性而不能容许具体的对象。(5)即使承认内涵实体，也不能消除量化困难，反而增加同样麻烦的例子。(6)更严重的是，在模态逻辑中可推出p↔□p，“□”成为多余的，模态逻辑蜕化为经典逻辑。"}, {"id": "7-3-2-2", "name": "论证依据", "category": 4, "symbolSize": 22, "desc": "大于行星数目这一属性的反例与蜕化论证", "detail": "(1)反例论证：(9)大于9这一属性=大于9这一属性为真，根据(10)行星的数目=9替换得(11)大于行星的数目这一属性=大于9这一属性，为假。(2)命题反例：(13)9>7这一命题=9>7这一命题为真，替换得(14)假命题，存在概括得(15)假命题。(3)从条件C可推出(x=y)→□(x=y)，所有的同一都是必然的。(4)甚至可推出p↔□p，“□”成为多余，模态逻辑蜕化为经典逻辑。"}, {"id": "7-3-2-3", "name": "代表人物", "category": 4, "symbolSize": 22, "desc": "坚决反对内涵实体的逻辑学家", "detail": "(1)蒯因(Quine)：坚决反对承认像概念、命题、属性之类的抽象实体，认为这是绝对不能接受的。"}]}, {"id": "7-3-3", "name": "丘奇的内涵逻辑系统", "category": 3, "symbolSize": 26, "desc": "将弗雷格涵义和指称理论形式化为公理化逻辑系统", "children": [{"id": "7-3-3-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "数学分析确实需要概念、命题等内涵性实体", "detail": "(1)丘奇与蒯因的看法不同，认为数学分析确实需要像概念、命题这样的内涵性实体以及类、属性、关系、函数这样的抽象实体。(2)1951年发表《涵义和指称的逻辑的形式化》，提出所讨论概念的同义或同一的标准，建立了关于涵义和指称的逻辑系统。(3)卡普兰在1964年《内涵逻辑基础》中为丘奇内涵逻辑提供了语义学，后为克里普克可能世界语义学所代替。(4)蒙塔古建立了范畴语法并包含内涵逻辑，使内涵逻辑提升到新水平。"}, {"id": "7-3-3-2", "name": "代表人物", "category": 4, "symbolSize": 22, "desc": "内涵逻辑的建立者和推动者", "detail": "(1)丘奇(Church)：沿弗雷格线索建立涵义和指称逻辑系统。(2)卡普兰(Kaplan)：为丘奇内涵逻辑提供语义学。(3)蒙塔古(Montague)：建立范畴语法内含内涵逻辑，推动内涵逻辑发展。"}]}, {"id": "7-3-4", "name": "外延主义语义学", "category": 3, "symbolSize": 26, "desc": "不接纳内涵实体走外延主义道路，以可能世界语义学处理模态", "children": [{"id": "7-3-4-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "词项所指是某可能世界中的个体，语句所指是其真值", "detail": "(1)现代模态逻辑没有采取接纳内涵性实体的办法，而是走了一条外延主义的道路。(2)认为词项的所指就是某个可能世界中的个体，语句的所指就是它在某个世界中的真值，并取得了成功。(3)蒯因关于模态逻辑必然导致承认内涵性实体的指责落空了。(4)即使承认内涵实体，也能够在逻辑上给它们以融贯且合理的处理，例如视为从相应语言表达式到可能世界的函项。"}]}, {"id": "7-3-5", "name": "可能个体问题", "category": 3, "symbolSize": 26, "desc": "可能世界中可能个体的本体论地位问题", "children": [{"id": "7-3-5-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "可能世界语义学预设可能个体，其本体地位有待探讨", "detail": "(1)模态逻辑语义学最通行的是可能世界语义学：在现实世界之外有许多的可能世界，可能世界中有很多可能个体。(2)可能个体与现实世界中的个体有所不同。(3)什么是可能世界？什么是可能个体？它们在本体论上的地位如何？这些问题将在本章第五节讨论。"}]}]}, {"id": "7-4", "name": "de re模态和本质主义", "category": 2, "symbolSize": 32, "desc": "de re模态与本质主义的关联以及跨界个体问题的引出", "children": [{"id": "7-4-1", "name": "de dicto与de re模态", "category": 3, "symbolSize": 26, "desc": "模态词在量词辖域之外和之内的原则性区别", "children": [{"id": "7-4-1-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "de dicto修饰整个语句，de re修饰谓词使约束变元指称晦暗", "detail": "(1)□(∃x)F(x)中模态词置于量词之前，不在量词辖域内，修饰整个语句，是de dicto模态，不会使约束变项出现指称晦暗性。(2)(∃x)□F(x)中模态词在量词辖域内，修饰F(x)使约束变元具有指称晦暗性，是de re模态。(3)de dicto模态是加于命题之上的算子，由已有命题形成新命题。(4)de re模态是加于命题谓词之上的，由已有谓词形成新谓词，模态词是新谓词的一部分。(5)蒯因用一个博弈例子说明两者具有不同真值。"}, {"id": "7-4-1-2", "name": "代表人物", "category": 4, "symbolSize": 22, "desc": "区分de dicto和de re模态的逻辑学家", "detail": "(1)蒯因：用不容许不分胜负的博弈例子说明de dicto和de re模态具有不同真值。□(∃x)F(x)为真但(∃x)□F(x)为假。"}]}, {"id": "7-4-2", "name": "巴坎公式与个体域条件", "category": 3, "symbolSize": 26, "desc": "巴坎公式的真假取决于个体域的收缩与扩张条件", "children": [{"id": "7-4-2-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "BF要求收缩个体域，BFc要求扩张个体域", "detail": "(1)BF的前件说所有x必然是F，后件说“所有x是F”是必然的。(2)用可能世界语义学：如果在wi中所有x在可通达的所有可能世界wj中是F，则在wi可通达的所有可能世界wj中所有x是F。(3)这是要求在wj中有的个体在wi中都要有——满足此条件为收缩的个体域。(4)BFc为真的条件是：在wi中有的个体在wj都要有——满足此条件为扩张的个体域。(5)既收缩又扩张的个体域为等同的个体域。(6)“BF和BFc表示的是框架的性质，而等词则是赋值的性质或模型的性质。”"}]}, {"id": "7-4-3", "name": "de re模态致本质主义", "category": 3, "symbolSize": 26, "desc": "de re模态承认事物必然属性，回到亚里士多德的本质主义", "children": [{"id": "7-4-3-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "de re模态必然导致本质主义，本质主义不合理", "detail": "(1)(∃x)□F(x)说：存在这样的x，它必然地具有属性F。(2)(x)□F(x)说：对任意x而言，它必然地是F。(3)这就承认了事物的有些特征是其必然具有的，有些则是其偶然具有的。(4)亚里士多德认为本质特征是某些对象具有而其他对象不具有的，具有它们的对象就必然地具有的特性。(5)蒯因结论：容许(∃x)□F(x)这类语句的模态逻辑是“回到亚里士多德的本质主义”，“拥护量化模态逻辑的人必然赞成本质主义”。(6)蒯因反对本质主义，认为它讲本质属性归根结底要跑到承认共相的实在论或柏拉图主义。"}, {"id": "7-4-3-2", "name": "代表人物", "category": 4, "symbolSize": 22, "desc": "批评de re模态导致本质主义的哲学家", "detail": "(1)蒯因：论证de re模态必然导致本质主义，反对本质主义。"}]}, {"id": "7-4-4", "name": "跨界个体问题", "category": 3, "symbolSize": 26, "desc": "de re模态导致承认跨越不同可能世界的个体", "children": [{"id": "7-4-4-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "de re模态导致跨界同一性和跨界识别问题", "detail": "(1)de re模态的另一个后果是导致承认跨越世界的个体。(2)由此引出“跨越世界的同一性”和“跨越世界的辨认或识别”问题。(3)这不是两个问题而是同一个问题的两种不同说法。(4)最后与本质和本质主义有关。"}]}]}, {"id": "7-5", "name": "有关可能世界的问题", "category": 2, "symbolSize": 32, "desc": "可能世界的定义问题和本体论地位问题的讨论", "children": [{"id": "7-5-1", "name": "可能世界的定义问题", "category": 3, "symbolSize": 26, "desc": "关于可能世界能否定义以及如何定义的三种立场", "children": [{"id": "7-5-1-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "三种定义方式：心理学定义、逻辑一致性定义、不可定义说", "detail": "(1)第一种定义：可能世界包括我们能想象的任何世界，即我们能想象的任何一个世界都是可能世界，现实世界只是可能世界中的一个。这种方法借助于心理学术语定义，有陷入心理主义之嫌。(2)第二种定义：可能世界是逻辑上一致的世界，即任何不包含逻辑矛盾的世界都是可能的。莱布尼茨持此说。但有严重逻辑循环问题：用可能世界定义逻辑必然性等概念，又用逻辑一致性定义可能世界。(3)第三种态度：根本否认可能世界概念可定义，它是可能世界语义学的初始概念，只能用例举法去说明。D.刘易斯持此说。(4)作者看法：可能世界概念可以定义，可能世界就是人们能够想象的任何不包含逻辑矛盾的世界，逻辑循环指控不成立。"}, {"id": "7-5-1-2", "name": "经典诘难", "category": 4, "symbolSize": 22, "desc": "心理学定义陷入心理主义，逻辑定义陷入循环定义", "detail": "(1)心理学定义的诘难：自弗雷格以来现代逻辑学家一直避免心理主义。如果借助心理学术语定义可能世界，然后用可能世界去定义有效性、可满足性、逻辑真理等概念，就是把逻辑建立在心理主义基础上。(2)循环定义的诘难：可能世界正是用来定义逻辑必然性、可能性、有效性、可满足性等概念的，如果可能世界又用逻辑可能性、逻辑一致性来定义，就陷入循环定义。(3)麦克米切尔的回应：循环指控不成立，因为可能世界语义学从未企图去定义可能性和必然性，只是给出这些概念的一种外延语义学。"}, {"id": "7-5-1-3", "name": "代表人物", "category": 4, "symbolSize": 22, "desc": "三种可能世界定义立场的代表人物", "detail": "(1)心理学定义：通过“可想象”直观理解可能世界的学者。(2)逻辑一致性定义：莱布尼茨(Leibniz)。(3)不可定义说：D.刘易斯(D. Lewis)，认为只能用例举法说明。(4)循环指控反驳者：麦克米切尔(McMichael)。"}]}, {"id": "7-5-2", "name": "激进实在论", "category": 3, "symbolSize": 26, "desc": "可能世界与现实世界同样真实存在的实体", "children": [{"id": "7-5-2-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "可能世界是独立于语言和思想而真实存在的实体", "detail": "(1)可能世界是某种现实的、独立于我们的语言和思想而存在的实体。(2)D.刘易斯：“我们的现实世界只是多个世界中的一个。我们只把这个世界称为现实世界，并不是因为它在性质上与所有其他世界不同，只是因为它是我们所居住的世界。”(3)麦柯尔归纳的原则：可能世界存在；其他可能世界与现实世界是同样的；可能世界不能被归诸为某种基本的东西。(4)现代物理学和宇宙学中，在我们这个世界之外还存在许多其他物理性质的世界这个思想越来越得到公认。"}, {"id": "7-5-2-2", "name": "代表人物", "category": 4, "symbolSize": 22, "desc": "激进实在论的倡导者", "detail": "(1)D.刘易斯(D. Lewis)：激进实在论的代表人物，主张可能世界的实在论。(2)麦柯尔(McCall)：支持刘易斯的观点并加以归纳。(3)A.M.莫斯捷帕年科：从现代物理学和宇宙学角度支持其他可能世界存在的可能性。"}]}, {"id": "7-5-3", "name": "温和实在论/实际主义", "category": 3, "symbolSize": 26, "desc": "可能世界是现实世界的可能状态而非并列的实体", "children": [{"id": "7-5-3-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "真实存在的世界只有一个，即现实世界", "detail": "(1)可能世界并不是与现实世界并列的真实存在，真实存在的世界只有现实世界。(2)可能世界只是现实世界及其各种可能状况。(3)克里普克：可能世界是“世界可以存在的方式”或整个世界的可能状态或历史的总和，是一种抽象的实体。(4)可能世界是由我们赋予它们的描述条件所给出的，是被我们规定的，不是通过高倍望远镜看到的遥远国家。(5)克里普克建议用“世界的可能状态(或历史)”或“非真实的情形”代替“可能世界”。"}, {"id": "7-5-3-2", "name": "代表人物", "category": 4, "symbolSize": 22, "desc": "温和实在论的主要倡导者", "detail": "(1)克里普克(Kripke)：认为可能世界是“世界可以存在的方式”，是一种抽象实体。(2)斯托奈克(Stalnaker)。(3)普兰廷加(Plantinga)。(4)作者本人倾向于温和实在论，认为它比较符合我们的常识和直观。"}]}, {"id": "7-5-4", "name": "非实在论/语言学观", "category": 3, "symbolSize": 26, "desc": "可能世界只是处理命题真假的语句极大一致集", "children": [{"id": "7-5-4-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "谈论可能世界就是谈论语句的极大一致集", "detail": "(1)可能世界并不是与现实世界一样真实存在的实体，它只是处理命题的真假及其真假关系的一种技术手段。(2)卡尔纳普的“状态描述”和亨迪卡的“模型集”都相当于可能世界，但都是极大一致的语句集。(3)亚当斯：一个可能世界是满足两个条件的语句集S：对于任一语句p，p或﹁p是S的元素，二者必居其一；S的所有元素的合取为真是可能的。(4)布拉德利和斯沃茨：非现实的可能世界并不存在于物理空间之中，只存在于概念空间或逻辑空间中。"}, {"id": "7-5-4-2", "name": "经典诘难", "category": 4, "symbolSize": 22, "desc": "完全回避可能世界的本体论地位在哲学上有问题", "detail": "(1)非实在论完全避开甚至否认了可能世界的本体论地位。(2)完全忽视了可能世界思想的客观起源，而把它作为一个纯粹的技术手段，在哲学上是有问题的。"}, {"id": "7-5-4-3", "name": "代表人物", "category": 4, "symbolSize": 22, "desc": "非实在论语言学观点的代表人物", "detail": "(1)卡尔纳普(Carnap)：提出“状态描述”概念。(2)亨迪卡(Hintikka)：提出“模型集”概念。(3)亚当斯(Adams)。(4)布拉德利(Bradley)和斯沃茨(Swartz)：在《可能世界》中系统阐述非实在论观点。"}]}]}, {"id": "7-6", "name": "跨界同一性和跨界识别", "category": 2, "symbolSize": 32, "desc": "跨越可能世界的个体如何识别和同一的问题", "children": [{"id": "7-6-1", "name": "跨界识别伪问题论", "category": 3, "symbolSize": 26, "desc": "跨界识别源于对可能世界比喻的误解，实为伪问题", "children": [{"id": "7-6-1-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "可能世界只是比喻说法，跨界识别问题无需解决", "detail": "(1)亨迪卡：“跨界识别问题显示出一个严重的错误”。可能世界一词只是一种比喻说法，完全不必是一个世界即一个完整的宇宙或世界历史。(2)正像概率论中的样本集点或背景(scenarios)，被称为“世界”的唯一理由是它们是所考虑的最详尽无遗的选择物。(3)只要“可能世界”被看成是相异的宇宙，跨界识别问题看起来将是毫无希望解决的。(4)克里普克：跨界识别问题产生于过于认真地看待关于可能世界的比喻，如果把可能世界仅仅看作是我们用以谈论构想世界不同方式的说法，就根本不会有这个问题。"}, {"id": "7-6-1-2", "name": "代表人物", "category": 4, "symbolSize": 22, "desc": "认为跨界识别是伪问题的哲学家", "detail": "(1)亨迪卡(Hintikka)：指出跨界识别问题是一个严重的错误，源于按字面理解可能世界。(2)克里普克(Kripke)：认为问题产生于过于认真看待可能世界比喻。"}]}, {"id": "7-6-2", "name": "D.刘易斯的对应体理论", "category": 3, "symbolSize": 26, "desc": "个体是限界的，在其他可能世界中有对应体而非同一", "children": [{"id": "7-6-2-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "一个个体不能存在于不同可能世界，但有对应体", "detail": "(1)各个可能世界与现实世界同样真实存在，个体只能是限界个体，一个个体不能存在于不同的可能世界中，只能存在于一个世界之中。(2)由此否认了跨界识别问题。(3)但提出对应体理论：尽管一个个体只能存在于现实世界，但它在其他可能世界有自己的对应体。(4)识别标准D：对于wi中的x和wj中的y，只有当wj中没有任何事物更类似于wi中的x时，y才是wj中x的对应体。(5)对应体关系是一种类似关系，既不对称也不传递，甚至不是一一对应的。"}, {"id": "7-6-2-2", "name": "经典诘难", "category": 4, "symbolSize": 22, "desc": "对应体理论使反事实谈论成为无意义的", "detail": "(1)克里普克、亨迪卡、普兰廷加等严厉批评对应体理论。(2)按照对应体理论，当我们说“要是不发生水门事件的话，尼克松可能连任三届美国总统”时，我们并不是在谈论尼克松，而是在谈论尼克松在另一可能世界中的对应体。(3)这样一来，“对于尼克松来说，事情可能是另外一种样子”就变得毫无意义。(4)实际上在反事实谈论中，我们仍然是在谈论尼克松，而不是在谈论尼克松的对应体。"}, {"id": "7-6-2-3", "name": "代表人物", "category": 4, "symbolSize": 22, "desc": "对应体理论的提出者与批评者", "detail": "(1)D.刘易斯(D. Lewis)：提出对应体(counterpart)理论。(2)批评者：克里普克、亨迪卡、普兰廷加(Plantinga)。"}]}, {"id": "7-6-3", "name": "齐硕姆的不可解论证", "category": 3, "symbolSize": 26, "desc": "跨界个体违反莱布尼茨律和同一传递律，跨界识别不可解", "children": [{"id": "7-6-3-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "个体不能跨越不同可能世界而存在", "detail": "(1)齐硕姆1967年发表《跨越可能世界的同一性：某些问题》，论证跨界识别问题面临不可克服的困难。(2)论证一：跨界个体违反莱布尼茨同一不可分辨原则(x=y)→(F(x)↔F(y))。因为w1中的尼克松与w2中的尼克松至少有一个性质不同——存在于w1与存在于w2。(3)由此，或者否定莱布尼茨原则，或者否认尼克松可以跨越不同的可能世界而存在。前者会遭到大多数逻辑学家反对，合理的结论是后者。(4)论证二：跨越世界的个体不遵守同一关系的传递律。通过设计一个可能世界系列w1-w5中x和y逐步交换所有性质的思想实验，证明或者莱布尼茨原则不成立，或者同一关系不传递，或者个体不能跨越世界而存在。(5)前两种选择会导致人类整个知识体系的根本改变，因此个体不能跨越不同的可能世界而存在。(6)作者认为齐硕姆关于莱布尼茨同一性原则不可更改的断言太过绝对。引入时间和世界参数重新表述后，齐硕姆的论证结论不成立。"}, {"id": "7-6-3-2", "name": "代表人物", "category": 4, "symbolSize": 22, "desc": "论证跨界个体不可能的哲学家", "detail": "(1)齐硕姆(Chisholm)：可能世界理论的反对者，力图证明跨界识别不可能解决。"}]}, {"id": "7-6-4", "name": "本质主义识别方案", "category": 3, "symbolSize": 26, "desc": "以因果起源或内在结构为本质识别跨界个体", "children": [{"id": "7-6-4-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "跨界个体的识别依据是其在各可能世界中共有的本质", "detail": "(1)跨越世界的个体是存在的并且是可以识别的，识别的依据就是它们在不同可能世界中所共同具有的本质。(2)以把事物所具有的性质区分为本质属性和非本质属性为前提，故被称为“本质主义”。(3)克里普克是现代本质主义的积极倡导者：个体的因果起源或物质构成以及自然种类的内在结构，分别构成识别跨越世界而存在的个体和自然种类的根据，也分别构成相应个体和自然种类的本质。"}, {"id": "7-6-4-2", "name": "代表人物", "category": 4, "symbolSize": 22, "desc": "现代本质主义的倡导者", "detail": "(1)克里普克(Kripke)：现代本质主义的积极倡导者，认为因果起源和内在结构构成个体和自然种类的本质。"}]}, {"id": "7-6-5", "name": "作者的本质相对性学说", "category": 3, "symbolSize": 26, "desc": "本质是相对于实践需要的事物的核心特性集合", "children": [{"id": "7-6-5-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "本质主义非常重要，与科学主义、理性主义紧密相联", "detail": "(1)跨越世界的个体是不能不承认的，跨界识别问题是可以正面回答的，办法仍然是诉诸本质和本质属性。(2)本质主义非常重要，是与科学主义、理性主义紧密相联的，是与“这个世界中存在着秩序、结构、规律”的信念密切相关的。(3)反本质主义常常与非理性主义和反理性主义搅和在一起，与后现代思潮有千丝万缕的联系。(4)本文作者提出本质相对性学说，包括四个要点。"}, {"id": "7-6-5-2", "name": "论证依据", "category": 4, "symbolSize": 22, "desc": "本质相对性学说的四个要点", "detail": "(1)本质是相对于人的实践需要而言的，在确定事物的本质时要把人的实践需要考虑在内。(2)事物的本质是决定事物之所是的一组特性的集合，该集合的个别特性可以变易，但变易不能达到多数特性均变的程度，否则该事物不再是该事物。(3)本质具有派生、解释非本质特性的功能，前者是后者产生和存在的原因和根据。(4)个体和自然种类都具有本质。个体的本质是其全部历史中的核心事件；自然种类的本质是它所具有的内在结构。"}, {"id": "7-6-5-3", "name": "修正版本", "category": 4, "symbolSize": 22, "desc": "区别于克里普克起源本质说的修正版本", "detail": "(1)个体的本质既不是它所从属的类的本质，也不是克里普克所说的该个体的起源，而是该个体全部历史中的核心事件。(2)一个体的历史对于该个体来说是本质性的。"}]}]}]}, {"id": "c08", "name": "第八章 逻辑真理的性质", "desc": "正文 · 共8个小节", "isAppendix": false, "children": [{"id": "8-1", "name": "真理论的逻辑构造", "category": 2, "symbolSize": 32, "desc": "从逻辑角度讨论真值承担者和符合论，阐述塔斯基关于真的语义学定义。", "children": [{"id": "8-1-1", "name": "真值承担者理论", "category": 3, "symbolSize": 26, "desc": "辨析语句、命题、陈述、判断四者中谁是真正的真值承担者。", "children": [{"id": "8-1-1-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "命题是本来意义上的真值承担者，语句是派生意义上的。", "detail": "(1)语句有广义狭义之分，狭义语句必须能够肯定或否定，或真或假。(2)命题是语句表达的具有主体间性的思想内容，能真能假。(3)陈述与命题几乎同义，指出说或写出语句时所述说的东西。(4)判断是被实际断定为真或为假的命题，具有心理主义色彩。(5)作者赞同命题是本原的真值承担者，语句根据所表达命题的真假获得派生真值。"}, {"id": "8-1-1-2", "name": "论证依据", "category": 4, "symbolSize": 22, "desc": "语句真值的不固定性源于其所表达命题的不固定。", "detail": "(1)不同语言不同语句可表达同一命题。(2)同一语句因歧义、语境等因素可表达不同命题。(3)如'你欠我10美元'在不同情况下表达不同命题故真值不同。(4)若语句所描述的事态存在则表达命题为真，否则为假。"}, {"id": "8-1-1-3", "name": "经典诘难", "category": 4, "symbolSize": 22, "desc": "哲学家们对真值承担者归属众说纷纭，意见不一。", "detail": "(1)弗雷格认为语句是真值承担者，蒯因进一步主张恒久句才是真值承担者。(2)反对者认为语句并非名称，其真值并非其所指，语句的所指应是事实或事态。(3)判断因涉及断定主体而因人而异，具有心理主义色彩，在弗雷格之后几乎被弃置不用。"}, {"id": "8-1-1-4", "name": "代表人物", "category": 4, "symbolSize": 22, "desc": "弗雷格、蒯因主张语句；反对者主张命题为真值承担者。", "detail": "(1)弗雷格认为语句是真值承担者。(2)蒯因认为恒久句才是真值承担者。(3)反对派认为命题才是本原真值承担者。(4)奥斯汀和塞尔在言语行为理论中用FA表示以言行事行为，A为命题，F为命题态度。"}]}, {"id": "8-1-2", "name": "符合论真理观", "category": 3, "symbolSize": 26, "desc": "语句之真在于与客体在世界中的存在方式相符合或对应。", "children": [{"id": "8-1-2-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "与有关客体的事实相符合的语句为真，不符合的为假。", "detail": "(1)语句的真不在于它与其他语句的关系，而在于它与客体、与世界的关系。(2)符合论是真理的一元论，以实在论和可知论为前提。(3)塔斯基认为语义学概念只是古典符合论的现代形式。"}, {"id": "8-1-2-2", "name": "论证依据", "category": 4, "symbolSize": 22, "desc": "符合论建立在实在论和可知论两个基本前提之上。", "detail": "(1)存在独立于心灵的实体，是主体认识的对象，否则符合就失去比较基础。(2)人的认识能够达到客体，否则'相符合'就变得毫无意义。"}, {"id": "8-1-2-3", "name": "经典诘难", "category": 4, "symbolSize": 22, "desc": "符合论的三个关键概念未得到明确阐释，经不起推敲。", "detail": "(1)命题、事实和符合这三个关键性概念，特别是后两者，未得到明确的阐释。(2)根据思维与之相符合的对象不同，符合论可区分出不同形态。(3)符合论并不一定就是唯物主义的认识论和真理论。"}, {"id": "8-1-2-4", "name": "代表人物", "category": 4, "symbolSize": 22, "desc": "亚里士多德为起源，罗素、维特根斯坦、奥斯汀为现代代表。", "detail": "(1)符合论起源可追溯到古希腊的亚里士多德。(2)在现代，罗素、早期维特根斯坦、奥斯汀及绝大多数逻辑实证主义者都是倡导者和坚持者。"}]}, {"id": "8-1-3", "name": "塔斯基的语义真理论", "category": 3, "symbolSize": 26, "desc": "通过T模式和满足概念递归定义真，是符合论的现代形式化。", "children": [{"id": "8-1-3-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "真语句当且仅当p（T模式），闭语句为真即被所有序列满足。", "detail": "(1)T模式：X是真语句当且仅当p。(2)通过递归定义满足：先定义原子开语句的满足条件，再定义复合开语句的满足条件。(3)闭语句为真定义为被所有序列满足，闭语句为假定义为不被任何序列满足。"}, {"id": "8-1-3-2", "name": "论证依据", "category": 4, "symbolSize": 22, "desc": "递归程序定义满足，区分对象语言与元语言以避免悖论。", "detail": "(1)规定对象语言O的语法结构。(2)规定元语言M的语法结构及'在O中满足'。(3)通过满足定义真：一闭语句为真当且仅当被所有序列满足。(4)可推出T模式的所有特例及矛盾律排中律等普遍性定律。"}, {"id": "8-1-3-3", "name": "经典诘难", "category": 4, "symbolSize": 22, "desc": "T模式应用于日常语言时导致悖论，需加限制条件。", "detail": "(1)T模式应用于日常语言导致悖论。(2)可接受的真定义需满足实质充分性和形式正确性两个条件。(3)真不可定义性定理：算术中的真句子概念不能在一阶算术中定义。"}, {"id": "8-1-3-4", "name": "代表人物", "category": 4, "symbolSize": 22, "desc": "塔斯基创立，蒯因和哈克以更通俗方式表述。", "detail": "(1)塔斯基于1933年在《形式化语言中的真概念》中提出。(2)蒯因在《逻辑哲学》(1970)中以一阶谓词演算为对象语言表述。(3)苏珊·哈克在《逻辑哲学》(1978)中按蒯因方法表述。"}]}]}, {"id": "8-2", "name": "经典逻辑中的逻辑真", "category": 2, "symbolSize": 32, "desc": "考察逻辑真理即永真命题形式的诸种定义方案，重点阐述蒯因的五个近等价定义。", "children": [{"id": "8-2-1", "name": "莱布尼茨的推理真理观", "category": 3, "symbolSize": 26, "desc": "区分推理真理和事实真理，前者必然且在所有可能世界中真。", "children": [{"id": "8-2-1-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "推理的真理是必然的，事实的真理是偶然的。", "detail": "(1)有两种真理：推理的真理和事实的真理。(2)推理真理的否定是不可能的，在所有可能世界中真，其依据是矛盾律。(3)事实真理的否定是可能的，在有的可能世界中真，遵守充足理由律。"}, {"id": "8-2-1-2", "name": "代表人物", "category": 4, "symbolSize": 22, "desc": "莱布尼茨最先明确区分了逻辑真理和事实真理。", "detail": "(1)莱布尼茨把推理真理直接称为必然真理，事实真理直接称作偶然真理。(2)他所定义的推理真理包括狭义的逻辑真理以及数学和其他必然为真的真理。"}]}, {"id": "8-2-2", "name": "维特根斯坦的重言式真理论", "category": 3, "symbolSize": 26, "desc": "逻辑命题是重言式，没有排除任何可能情况，对一切真值可能性为真。", "children": [{"id": "8-2-2-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "逻辑命题是重言式，其真值从符号本身得知。", "detail": "(1)逻辑的命题是重言式，没有排除任何可能的情况。(2)逻辑命题对于其中所含基本命题的一切真值可能性都是真的。(3)逻辑命题的特殊标志是其真值从符号本身得知，非逻辑命题则不能。"}, {"id": "8-2-2-2", "name": "经典诘难", "category": 4, "symbolSize": 22, "desc": "王浩指出维氏混淆了有穷和无穷的区别，且假定基本命题独立。", "detail": "(1)维氏假定了所有逻辑命题能归约为真值函项演算，相当于逻辑演算判定问题可解。(2)丘奇证明判定问题并非一般可解。(3)王浩指出维氏犯了两错误：混淆有穷和无穷，假定基本命题彼此独立。(4)按维氏标准，甚至一阶逻辑也不是逻辑真理。"}]}, {"id": "8-2-3", "name": "卡尔纳普的语义L真定义", "category": 3, "symbolSize": 26, "desc": "相对于语义系统用两种方式定义L真：仅凭语义规则或所有状态描述中可满足。", "children": [{"id": "8-2-3-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "L真即真只建立在语义规则上，无需参照任何事实。", "detail": "(1)C1：语句A是L真，当且仅当A在语义系统中的真只建立在语义规则上。(2)C2：语句A是L真，当且仅当A在所有状态描述中都可满足。"}]}, {"id": "8-2-4", "name": "蒯因的逻辑真五定义", "category": 3, "symbolSize": 26, "desc": "蒯因给出结构、替换、模型、证明程序、语法五种近等价逻辑真定义。", "children": [{"id": "8-2-4-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "逻辑真理是只含逻辑词语本质出现的真语句，可随意改变其他词语而不为假。", "detail": "(1)本质出现：用另一词语替换该词语就能使陈述变成假的。(2)空的出现：用任一语法上可允许的表达式替换后真值毫无改变。(3)逻辑真理即只包含逻辑词语的本质出现的真语句。(4)五个定义：根据结构为真、根据替换为真、根据模型为真、根据证明程序为真、根据语法为真。"}, {"id": "8-2-4-2", "name": "论证依据", "category": 4, "symbolSize": 22, "desc": "五种定义在外延上等同，逻辑是语法和真两大部件的合成物。", "detail": "(1)根据结构为真：具有其逻辑构造的所有句子皆为真。(2)根据替换为真：对于谓词的所有改变都保持为真。(3)根据模型为真：被所有模型满足的模式有效。(4)根据证明程序为真：用证明规则导出的句子。(5)根据语法为真：具有同样语法结构的句子皆真，对词汇替换不可能变为假。"}, {"id": "8-2-4-3", "name": "经典诘难", "category": 4, "symbolSize": 22, "desc": "模型定义与替换定义不同，证明程序定义存在逻辑循环。", "detail": "(1)替换定义与模型定义不同，因并非每个开语句都决定一个集合。(2)证明程序定义存在逻辑循环：证明公理逻辑真需预先定义逻辑真概念。(3)新定义将逻辑结构让位于语法结构，依赖于如何语法化一个语言。"}, {"id": "8-2-4-4", "name": "代表人物", "category": 4, "symbolSize": 22, "desc": "蒯因，著有《逻辑哲学》《经验论的两个教条》等。", "detail": "(1)蒯因在1936年《根据约定的真》中最早提出。(2)在《卡尔纳普和逻辑真理》(1954)中重复该定义。(3)在《逻辑哲学》(1970)中系统给出五个近等价定义。"}]}]}, {"id": "8-3", "name": "哲学逻辑中的逻辑真", "category": 2, "symbolSize": 32, "desc": "讨论扩充系统有效性的不同等级和择代系统对经典逻辑真概念的冲突与挑战。", "children": [{"id": "8-3-1", "name": "有效性等级理论", "category": 3, "symbolSize": 26, "desc": "基于可能世界语义学区分真或有效性的五个层次和等级。", "children": [{"id": "8-3-1-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "有效性相对化：模型有效、框架有效、模型类有效、框架类有效、普遍有效。", "detail": "(1)在某可能世界上真：在一模型的某个可能世界上真。(2)模型有效：在该模型的所有可能世界上真。(3)框架有效：对框架的任意赋值都真，需R满足一定关系条件。(4)模型类有效与框架类有效：分别在每一模型或每一框架上真。(5)普遍有效：在所有框架类或所有模型类中真，经典逻辑定理属之。"}, {"id": "8-3-1-2", "name": "论证依据", "category": 4, "symbolSize": 22, "desc": "不同模态公式如D、T、B、4、E要求R满足不同的关系条件。", "detail": "(1)模态公式D、T、B、4、E分别要求R满足延续性、自返性、对称性、传递性、欧几里德性。(2)凡在某框架上真的公式在相应模型上也真，反之不然。(3)弱模型有效概念对非正规模态系统十分必要。"}, {"id": "8-3-1-3", "name": "修正版本", "category": 4, "symbolSize": 22, "desc": "弱模型有效、弱框架有效、弱模型类有效、弱框架类有效。", "detail": "(1)弱模型有效：不在模型所有可能世界上真，而在可能世界集的某个子集所包含的所有可能世界上真。(2)对非正规模态系统和某些择代系统，弱模型有效性是必要和重要的。"}]}, {"id": "8-3-2", "name": "多值逻辑对二值原则的挑战", "category": 3, "symbolSize": 26, "desc": "多值逻辑允许命题取真值之外的第三值，导致排中律和矛盾律不成立。", "children": [{"id": "8-3-2-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "某些经典逻辑有效公式在变异系统中不再是有效公式。", "detail": "(1)乌卡谢维奇三值逻辑L3中命题可取T、F、I三值。(2)L3重言式必为L2重言式，但L2重言式在L3中可取值I，不一般成立。(3)排中律p∨﹁p和矛盾律﹁(p∧﹁p)在L3中不成立。"}, {"id": "8-3-2-2", "name": "论证依据", "category": 4, "symbolSize": 22, "desc": "乌氏为处理涉及未来偶然性的句子而创立三值逻辑。", "detail": "(1)乌氏碰见'明天将要发生海战'这类涉及未来偶然性的句子，说此话时既不真也不假只是可能。(2)三值真值按真值度排列为T、I、F。(3)L3中仅含﹁、∨、∧的公式不可能是矛盾式，因所有变项取I时也必取值I。"}, {"id": "8-3-2-3", "name": "经典诘难", "category": 4, "symbolSize": 22, "desc": "变异逻辑与经典逻辑的有效公式集相互抵触，二者孰是孰非？", "detail": "(1)有些经典逻辑的有效公式不再是变异逻辑的有效公式。(2)排中律和矛盾律在经典逻辑中普遍有效，在有些变异系统中不再普遍有效。(3)有看法认为二者各自对联结词有不同解释因而不可比较，作者不同意。"}, {"id": "8-3-2-4", "name": "代表人物", "category": 4, "symbolSize": 22, "desc": "乌卡谢维奇创立三值逻辑，赖欣巴赫构造三值系统R。", "detail": "(1)乌卡谢维奇在研究亚里士多德逻辑时创立三值逻辑系统。(2)赖欣巴赫构造三值系统R，其重言式可以不是L2重言式。"}, {"id": "8-3-2-5", "name": "修正版本", "category": 4, "symbolSize": 22, "desc": "重新定义重言式为不取值F的公式，可产生非L2的重言式。", "detail": "(1)若将重言式重新定义为不取值F的公式，L3重言式集大大扩充。(2)赖欣巴赫三值系统R中～(p∨～p)不取值F，按新定义为重言式，却非L2重言式。(3)多值逻辑还可有经典二值逻辑不具备的推理作用，可作量子力学推理工具。"}]}, {"id": "8-3-3", "name": "变异逻辑对经典逻辑的全面冲突", "category": 3, "symbolSize": 26, "desc": "变异逻辑否定或修改经典逻辑基本假定，引发逻辑多元争议。", "children": [{"id": "8-3-3-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "变异逻辑是对经典逻辑真概念的一种突破和挑战。", "detail": "(1)变异逻辑否定或修改经典逻辑的某个或多个假定如二值原则。(2)两者的有效公式集或定理集发生相互抵触。(3)作者不同意二者不可比较的观点，认为变异逻辑确实构成对经典逻辑的挑战。"}]}]}, {"id": "8-4", "name": "分析性和逻辑真理", "category": 2, "symbolSize": 32, "desc": "考察分析命题和综合命题的区分及其与逻辑真理的关系，讨论蒯因的批判。", "children": [{"id": "8-4-1", "name": "康德的分析-综合命题区分", "category": 3, "symbolSize": 26, "desc": "分析命题谓词不增主词内容；综合命题给主词增添新内容。", "children": [{"id": "8-4-1-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "分析命题通过谓词分析出主词已含内容，必然且先验。", "detail": "(1)分析命题谓词不给主词增加任何东西，只是将主词中已思考的内容分析出来。(2)综合命题给主词增加一个未曾思考过的谓词，不能从主词分析出。(3)康德将分析/综合区分与必然/偶然、先验/后验区分重叠，但容许先验综合命题存在。"}, {"id": "8-4-1-2", "name": "代表人物", "category": 4, "symbolSize": 22, "desc": "康德在《纯粹理性批判》中首次明确作出这一区分。", "detail": "(1)哲学史上第一次明确作出分析命题和综合命题区分的是康德。(2)其区分既与莱布尼茨推理真理和事实真理有联系，也与休谟观念联系和事实问题有关。"}]}, {"id": "8-4-2", "name": "逻辑实证主义对分析性的修正", "category": 3, "symbolSize": 26, "desc": "重新定义分析命题为无经验内容的重言式，排斥先验综合命题。", "children": [{"id": "8-4-2-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "分析命题效准仅依据符号定义，综合命题效准决定于经验事实。", "detail": "(1)维特根斯坦和卡尔纳普将分析命题定义为没有任何经验内容的重言式。(2)艾耶尔定义：当效准仅依据符号定义时为分析命题，决定于经验事实时为综合命题。(3)排斥先验综合命题，将数学归于分析命题，科学定律归于综合命题。"}, {"id": "8-4-2-2", "name": "论证依据", "category": 4, "symbolSize": 22, "desc": "为协调彻底的经验论立场与逻辑数学命题的必然性之间的矛盾。", "detail": "(1)逻辑实证主义者坚持彻底经验论，以可证实性原则贯彻经验论立场。(2)逻辑和数学命题在原则上不可证实，若归为无意义会带来麻烦。(3)通过将分析/综合与必然/偶然、先验/后验完全等同，既坚持经验论又保持逻辑数学的必然性。"}, {"id": "8-4-2-3", "name": "代表人物", "category": 4, "symbolSize": 22, "desc": "罗素、维特根斯坦、逻辑实证主义者、艾耶尔等。", "detail": "(1)从罗素、维特根斯坦、逻辑实证主义者到日常语言哲学家都信守此区分。(2)逻辑实证主义者鼓吹最为有力，艾耶尔、卡尔纳普为主要代表。"}]}, {"id": "8-4-3", "name": "蒯因对分析-综合区分的批判", "category": 3, "symbolSize": 26, "desc": "蒯因论证分析陈述和综合陈述的界限不可能划出来。", "children": [{"id": "8-4-3-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "分析性定义依赖同义性，而同义性的所有说明方式都包含逻辑循环。", "detail": "(1)分析陈述分为逻辑真的陈述和通过同义词替换化为逻辑真的陈述。(2)后者依赖同义性说明分析性，而同义性本身也需要阐释。(3)利用同义词定义、保全真值的可替换性、语义规则说明同义性的尝试都不成功。"}, {"id": "8-4-3-2", "name": "论证依据", "category": 4, "symbolSize": 22, "desc": "还原论教条与分析-综合教条根本上同一，驳倒前者才能驳倒后者。", "detail": "(1)人们假定陈述的真理性可分析为语言成分和事实成分。(2)分析陈述就是事实成分等于零的极限陈述。(3)蒯因用整体主义知识观批判还原论：经验检验的是知识整体而非单个命题。(4)经验内容为理论整体共享，不能直接分配给单个命题。"}, {"id": "8-4-3-3", "name": "经典诘难", "category": 4, "symbolSize": 22, "desc": "蒯因证明的是在经验论基础上该界限划不出来，并不否认其他基础上的相对区分。", "detail": "(1)蒯因并不否认可以通过语义约定或语义公设建立相对的区分。(2)他所质疑的是语义约定本身的分析性得不到满意说明。(3)最终陷入无穷倒退、循环论证或纯粹主观任意的规定。"}]}, {"id": "8-4-4", "name": "逻辑真理非分析命题的结论", "category": 3, "symbolSize": 26, "desc": "作者赞同蒯因：逻辑真理不是分析命题，含有经验内容且可修正。", "children": [{"id": "8-4-4-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "逻辑真理不是分析命题，具有或多或少经验内容，在经验面前可修正。", "detail": "(1)作者同意蒯因：分析命题和综合命题的界限不可能划出来。(2)没有任何经验内容或事实成分的分析命题根本不存在。(3)逻辑和数学真理不是分析命题，不具有通常加给它们的分析性。"}]}]}, {"id": "8-5", "name": "必然性和逻辑真理", "category": 2, "symbolSize": 32, "desc": "辨析必然性词义，论证逻辑真理只有相对必然性而不具有绝对必然性。", "children": [{"id": "8-5-1", "name": "\"必然性\"的四种定义方式", "category": 3, "symbolSize": 26, "desc": "诉诸事物本质、矛盾律、可能世界和时间四种方式定义必然性。", "children": [{"id": "8-5-1-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "四种定义从不同角度出发，彼此相容，各有长短。", "detail": "(1)诉诸事物本质：必然性是由本质因素决定的确定不移的联系。(2)诉诸矛盾律：一个真理是必然的如果它的否定包含逻辑矛盾。(3)诉诸可能世界：必然真即在所有可能世界中真。(4)诉诸时间：必然发生就是总是发生，用时间量词和真定义必然性。"}, {"id": "8-5-1-2", "name": "经典诘难", "category": 4, "symbolSize": 22, "desc": "定义一难说清本质，定义二不能说明矛盾律本身的必然性，定义三难说清可能世界。", "detail": "(1)第一种定义的困难在于难以说清楚究竟什么是事物的本质。(2)第二种的困难在于不能说明矛盾律本身的必然性。(3)第三种的困难在于难以说清楚究竟什么是可能世界。"}, {"id": "8-5-1-3", "name": "代表人物", "category": 4, "symbolSize": 22, "desc": "亚里士多德、莱布尼茨、麦加拉派第奥多鲁等。", "detail": "(1)诉诸本质源自亚里士多德。(2)诉诸矛盾律和可能世界由莱布尼茨最先倡导。(3)诉诸时间由亚里士多德和第奥多鲁提出，第奥多鲁定义了现在必然性。"}]}, {"id": "8-5-2", "name": "绝对必然性与相对必然性", "category": 3, "symbolSize": 26, "desc": "亚里士多德区分：绝对必然性无条件，相对必然性以推理前提为条件。", "children": [{"id": "8-5-2-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "相对必然性是A与其他命题的关系，A本身也可以是偶然的。", "detail": "(1)绝对必然性：A普遍且无条件真，不依赖任何前提和条件。(2)相对必然性：A的真有前提有条件，是推理结论依赖前提的必然性。(3)在绝对意义上，具有相对必然性的A也可能是偶然真理。"}, {"id": "8-5-2-2", "name": "代表人物", "category": 4, "symbolSize": 22, "desc": "亚里士多德首次提出绝对必然性和相对必然性的区分。", "detail": "(1)亚里士多德用本质、定义与原因说明绝对必然性：主项a与谓项b有本质联系。(2)本质联系指b是a本质中的因素，或a是b本质中的因素。"}]}, {"id": "8-5-3", "name": "逻辑真理的相对必然性", "category": 3, "symbolSize": 26, "desc": "逻辑真理只相对于系统假定的原则和解释才必然，可随这些假定变化而改变。", "children": [{"id": "8-5-3-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "逻辑真理具有相对必然性，是相对于特定系统和解释而言的。", "detail": "(1)一个逻辑建立于基本假定之上，命题只相对于这些假定才必然。(2)逻辑命题的必然性与系统解释有关，只在相应解释中才能刻画。(3)同一命题在不同系统解释中可有不同真值。(4)使一系统定理皆真的解释不是唯一的。"}, {"id": "8-5-3-2", "name": "论证依据", "category": 4, "symbolSize": 22, "desc": "改变基本假定可导致原先必然命题不再必然，公理必然性源于常项的真值表解释。", "detail": "(1)经典逻辑建立在外延原则、二值原则、个体域非空、实无穷抽象法之上。(2)变异逻辑否定或修改这些假定后，某些经典定理不再成立，如L3中矛盾律排中律不成立。(3)命题逻辑公理的永真性来自于联结词的真值表，改变真值表可能不再永真。(4)模态逻辑有5种语义理论可彼此独立解释同一系统。"}, {"id": "8-5-3-3", "name": "经典诘难", "category": 4, "symbolSize": 22, "desc": "哲学逻辑的兴起带来对绝对主义逻辑真理观的极大冲击。", "detail": "(1)以往学者认为逻辑真理绝对正确普遍适用不容修改。(2)古代亚里士多德、近代康德、现代弗雷格和罗素是绝对主义代表。(3)康德认为逻辑从亚氏以来没有取得任何实质性进展也不需要进展。(4)作者论证表明逻辑真理具有相对性，是对绝对主义逻辑观的反驳。"}]}]}, {"id": "8-6", "name": "先验性和逻辑真理", "category": 2, "symbolSize": 32, "desc": "讨论逻辑真理是否先验，考察密尔、普特南、蒯因的经验论，得出逻辑真理含有经验内容。", "children": [{"id": "8-6-1", "name": "密尔的经验论逻辑观", "category": 3, "symbolSize": 26, "desc": "逻辑和数学命题根本上以经验为基础，是经验的一般化。", "children": [{"id": "8-6-1-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "逻辑数学命题依靠重复多次的经验，必然真理性只是一种错觉。", "detail": "(1)一切推理和证明都由归纳构成和解释。(2)逻辑和数学命题与事实或实在有关，以经验为基础。(3)关于逻辑和数学命题的必然真理性信念只是一种错觉。"}, {"id": "8-6-1-2", "name": "代表人物", "category": 4, "symbolSize": 22, "desc": "密尔是经验论者和归纳主义的主要代表。", "detail": "(1)密尔在哲学上是经验论者，在逻辑上是归纳主义的主要代表。(2)他把经验论和归纳主义贯彻到逻辑和数学命题上。"}]}, {"id": "8-6-2", "name": "普特南的拟经验逻辑观", "category": 3, "symbolSize": 26, "desc": "数学知识类似经验知识，逻辑真理可因经验理由变为假。", "children": [{"id": "8-6-2-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "逻辑是一门自然科学，数学知识并非绝对且可修正。", "detail": "(1)数学真理标准和物理学完全一样，在于思想在实践中获得成功。(2)逻辑真命题能因经验理由变假，量子力学具有逻辑上的特异性。(3)拟经验方法既非纯粹演绎也非简单归纳，类似于假说演绎法。"}, {"id": "8-6-2-2", "name": "代表人物", "category": 4, "symbolSize": 22, "desc": "普特南著有《什么是数学真理》《逻辑是经验的吗？》。", "detail": "(1)普特南在《什么是数学真理》中指出数学知识类似于经验知识。(2)在《逻辑是经验的吗？》中以欧氏几何和量子力学为例论证逻辑是经验的。"}]}, {"id": "8-6-3", "name": "蒯因的整体主义先验性批判", "category": 3, "symbolSize": 26, "desc": "逻辑和数学真理处于知识整体核心，经验内容最少但仍分有经验意义。", "children": [{"id": "8-6-3-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "逻辑真理处于知识整体核心部位，经验内容最少但与经验联系最不直接。", "detail": "(1)知识或信念构成一个整体，接受经验检验的是整体而非边缘陈述。(2)逻辑和数学真理与该整体中的其他要素一起分享经验内容。(3)它们处于知识整体的核心部位，含有的经验内容最少。"}, {"id": "8-6-3-2", "name": "论证依据", "category": 4, "symbolSize": 22, "desc": "蒯因整体主义知识观的五个要点构成对还原论的系统批判。", "detail": "(1)信念或知识作为整体面对感觉经验法庭。(2)整体内各陈述逻辑上相互联系，再评价必引起重新调整。(3)任何陈述都可被修正或免予修正，甚至逻辑数学规律。(4)经验证据对理论整体的决定是不充分的。(5)理论的评价和选择受实用主义考虑支配。"}]}, {"id": "8-6-4", "name": "逻辑真理的经验起源说", "category": 3, "symbolSize": 26, "desc": "作者认为逻辑真理含有经验成分，公理和推理规则源于语言思维经验的抽象。", "children": [{"id": "8-6-4-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "逻辑真理不是先验的，而是含有经验内容。", "detail": "(1)逻辑真理的必然性相对于公理和推理规则，后者必然性相对于常项和变项的解释。(2)关于常项和变项的解释具有经验起源，是人们对日常语言思维经验进行逻辑抽象的结果。(3)联结词的真值表只抽象出真假关系撇开其他联系，具有经验基础。"}, {"id": "8-6-4-2", "name": "论证依据", "category": 4, "symbolSize": 22, "desc": "哲学逻辑学科群体明显展示逻辑真理的经验起源。", "detail": "(1)创立时态逻辑者必先做时间哲学研究，研究道义逻辑者必注意伦理学研究。(2)逻辑理论是对思维经验做逻辑抽象的结果，当然有符不符合实际的问题。(3)不同研究结果并存且相互矛盾，各有经验根据，各有存在理由。"}, {"id": "8-6-4-3", "name": "经典诘难", "category": 4, "symbolSize": 22,
