
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>逻辑哲学研究 · 知识图谱</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
<style>

:root {
  --bg: #050a1a;
  --panel-bg: rgba(10, 16, 36, 0.97);
  --border: rgba(80, 130, 220, 0.2);
  --text: #b8c8e8;
  --accent: #4a8af4;
  --accent2: #7c3aed;
  --gold: #f0b90b;
  --danger: #ef4444;
  --success: #22c55e;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  width: 100%; height: 100%; overflow: hidden;
  font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", "Helvetica Neue", sans-serif;
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  user-select: none; -webkit-user-select: none;
}

/* ---- Particle Background ---- */
#particles {
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
  opacity: 0.6;
}

/* ---- Chart ---- */
#chart {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1;
}
#chart canvas { display: block; }

/* ---- Overlay ---- */
#overlay {
  position: fixed; inset: 0; z-index: 9; pointer-events: none;
  transition: background 0.35s;
}
#overlay.on { background: rgba(0,0,0,0.2); pointer-events: auto; }

/* ---- Top Bar ---- */
#topbar {
  position: fixed; top: 0; left: 0; right: 0; z-index: 8;
  display: flex; align-items: center; gap: 10px;
  padding: 10px 14px;
  pointer-events: none;
}
#topbar > * { pointer-events: auto; }

/* -- Search -- */
#search-wrap {
  position: relative; flex: 0 1 360px;
}
#search {
  width: 100%; height: 38px;
  padding: 0 40px 0 16px;
  border: 1px solid var(--border);
  border-radius: 20px;
  background: rgba(10, 16, 36, 0.9);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  color: #c8d4f0; font-size: 13px; outline: none;
  transition: all 0.3s;
}
#search::placeholder { color: rgba(160, 180, 210, 0.45); }
#search:focus {
  border-color: rgba(80, 140, 240, 0.55);
  box-shadow: 0 0 20px rgba(60, 120, 240, 0.15);
  background: rgba(14, 20, 44, 0.95);
}
#search-clear {
  position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
  width: 24px; height: 24px; border-radius: 50%;
  border: none; background: rgba(255,255,255,0.06);
  color: #7788aa; cursor: pointer; font-size: 14px;
  display: none; align-items: center; justify-content: center;
  transition: all 0.2s;
}
#search-clear:hover { background: rgba(255,255,255,0.15); color: #fff; }
#search-clear.show { display: flex; }

/* -- Search Results Dropdown -- */
#search-results {
  position: absolute; top: 44px; left: 0; right: 0;
  max-height: 320px; overflow-y: auto;
  background: rgba(10, 16, 36, 0.97);
  backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  border: 1px solid var(--border);
  border-radius: 12px;
  display: none;
  box-shadow: 0 12px 40px rgba(0,0,0,0.5);
  scrollbar-width: thin;
  scrollbar-color: rgba(80,130,220,0.18) transparent;
}
#search-results.show { display: block; }
#search-results .sr-item {
  padding: 9px 14px; cursor: pointer;
  color: #b0bdd0; font-size: 12.5px;
  border-bottom: 1px solid rgba(255,255,255,0.04);
  transition: all 0.15s;
  display: flex; align-items: center; gap: 8px;
}
#search-results .sr-item:last-child { border-bottom: none; }
#search-results .sr-item:hover, #search-results .sr-item.active {
  background: rgba(60, 120, 240, 0.12);
  color: #dce4ff;
}
#search-results .sr-item .sr-dot {
  width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0;
}
#search-results .sr-item .sr-path {
  color: #556788; font-size: 10px; margin-left: auto; white-space: nowrap;
}
#search-results .sr-empty {
  padding: 16px; text-align: center; color: #556688; font-size: 12px;
}

/* -- Breadcrumb -- */
#breadcrumb {
  display: flex; align-items: center; gap: 2px; flex-wrap: wrap;
  background: rgba(10, 16, 36, 0.85);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 5px 8px;
  opacity: 0; transition: opacity 0.35s;
}
#breadcrumb.show { opacity: 1; }
#breadcrumb .bc-item {
  padding: 4px 10px; border-radius: 12px;
  color: #8899bb; font-size: 11.5px; cursor: pointer;
  white-space: nowrap; transition: all 0.2s;
  border: 1px solid transparent;
}
#breadcrumb .bc-item:hover {
  background: rgba(60, 120, 240, 0.12);
  color: #c0d0f0;
  border-color: rgba(80, 130, 220, 0.3);
}
#breadcrumb .bc-sep { color: #445566; font-size: 10px; }
#breadcrumb .bc-current {
  color: #b0c8f8; font-weight: 600; cursor: default;
}

/* -- Top-right buttons -- */
#top-actions {
  margin-left: auto; display: flex; gap: 6px;
}
.top-btn {
  width: 34px; height: 34px; border-radius: 50%;
  border: 1px solid var(--border);
  background: rgba(10, 16, 36, 0.85);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  color: #8899bb; font-size: 15px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.25s;
}
.top-btn:hover, .top-btn.active {
  background: rgba(60, 120, 240, 0.15);
  border-color: rgba(80, 140, 240, 0.5);
  color: #c8d8f8;
  box-shadow: 0 0 16px rgba(60, 120, 240, 0.2);
}

/* ---- Detail Panel ---- */
#panel {
  position: fixed; right: -500px; top: 16px; bottom: 16px; width: 450px; z-index: 10;
  background: var(--panel-bg);
  backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
  border: 1px solid var(--border); border-radius: 16px 0 0 16px;
  transition: right 0.38s cubic-bezier(0.22, 0.61, 0.36, 1);
  box-shadow: -12px 0 48px rgba(0,0,0,0.55);
  display: flex; flex-direction: column; overflow: hidden;
}
#panel.on { right: 16px; }
#panel .ph {
  display: flex; align-items: flex-start; gap: 12px;
  padding: 16px 18px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
  background: linear-gradient(180deg, rgba(50,90,200,0.06) 0%, transparent 100%);
}
#panel .ph .dot {
  width: 42px; height: 42px; border-radius: 50%; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  color: #fff; font-size: 18px;
  box-shadow: 0 0 20px rgba(60, 120, 240, 0.4);
}
#panel .ph .info { flex: 1; min-width: 0; }
#panel .ph .info h3 {
  color: #dce4ff; font-size: 17px; font-weight: 600;
  line-height: 1.4; word-break: break-word;
}
#panel .ph .info .tag {
  display: inline-block; margin-top: 5px; padding: 3px 12px;
  border-radius: 12px; font-size: 10.5px;
  color: #a0bcf8; background: rgba(72,136,240,0.1);
  border: 1px solid rgba(72,136,240,0.2);
}
#panel .ph .xbtn {
  width: 30px; height: 30px; border-radius: 8px;
  border: 1px solid rgba(255,255,255,0.12);
  background: rgba(255,255,255,0.03);
  color: #8899bb; font-size: 16px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.2s; flex-shrink: 0; line-height: 1;
}
#panel .ph .xbtn:hover {
  background: rgba(255,70,70,0.15);
  border-color: rgba(255,70,70,0.4);
  color: #ff6666;
}

#panel .pb {
  flex: 1; overflow-y: auto; padding: 14px 18px 20px;
  scrollbar-width: thin;
  scrollbar-color: rgba(72,136,240,0.18) transparent;
}
#panel .pb::-webkit-scrollbar { width: 4px; }
#panel .pb::-webkit-scrollbar-track { background: transparent; }
#panel .pb::-webkit-scrollbar-thumb {
  background: rgba(72,136,240,0.2); border-radius: 2px;
}
#panel .pb .sec { margin-bottom: 16px; }
#panel .pb .sec .lbl {
  color: #5a8af0; font-size: 10.5px; font-weight: 700;
  letter-spacing: 0.5px; margin-bottom: 5px; text-transform: uppercase;
}
#panel .pb .sec .txt {
  color: var(--text); font-size: 13px; line-height: 1.8; word-break: break-word;
}
#panel .pb .sec .kids {
  color: #8899bb; font-size: 12px; line-height: 1.9;
}
#panel .pb .sec .kids .kc {
  cursor: pointer; transition: all 0.15s;
  padding: 2px 6px; border-radius: 4px; margin: 0 -2px;
  display: inline;
}
#panel .pb .sec .kids .kc:hover {
  background: rgba(60, 120, 240, 0.12); color: #c0d0f0;
}
#panel .pb .sec .path-item {
  display: inline-flex; align-items: center; gap: 2px;
  color: #6a8ab8; font-size: 11px; cursor: pointer;
  transition: color 0.15s;
}
#panel .pb .sec .path-item:hover { color: #a0c0f0; }
#panel .pb .sec .path-sep { color: #445566; margin: 0 2px; }

/* -- Panel action buttons -- */
#panel-actions {
  display: flex; gap: 6px; padding: 0 18px 14px; flex-shrink: 0;
}
.pa-btn {
  flex: 1; height: 30px; border-radius: 8px;
  border: 1px solid rgba(255,255,255,0.08);
  background: rgba(255,255,255,0.03);
  color: #8899bb; font-size: 11px; cursor: pointer;
  display: flex; align-items: center; justify-content: center; gap: 4px;
  transition: all 0.2s;
}
.pa-btn:hover {
  background: rgba(60, 120, 240, 0.1);
  border-color: rgba(80, 130, 220, 0.3);
  color: #c0d0f0;
}
.pa-btn.fav-active {
  color: #f0b90b; border-color: rgba(240, 185, 11, 0.3);
  background: rgba(240, 185, 11, 0.08);
}

/* ---- Bottom Bar ---- */
#bottombar {
  position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 8;
  display: flex; gap: 14px; flex-wrap: wrap; justify-content: center;
  background: rgba(10, 16, 36, 0.88);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  border: 1px solid rgba(72,136,240,0.14);
  border-radius: 24px; padding: 7px 18px;
}
.lg-item {
  display: flex; align-items: center; gap: 6px;
  color: #7788aa; font-size: 11px; white-space: nowrap;
  cursor: pointer; transition: color 0.2s;
  padding: 2px 6px; border-radius: 10px;
}
.lg-item:hover { color: #b0c0e0; }
.lg-item b {
  width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0;
}
.lg-item .lg-count {
  font-size: 9.5px; color: #556688; margin-left: 2px;
}

/* ---- Hint Text ---- */
#hint {
  position: fixed; bottom: 72px; left: 50%; transform: translateX(-50%); z-index: 8;
  color: rgba(255,255,255,0.28); font-size: 10.5px;
  pointer-events: none; transition: opacity 0.6s; white-space: nowrap;
}

/* ---- Toast ---- */
#toast {
  position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 100;
  background: rgba(30, 180, 100, 0.92); color: #fff;
  padding: 10px 24px; border-radius: 10px; font-size: 13px;
  display: none; pointer-events: none;
  box-shadow: 0 4px 20px rgba(0,0,0,0.3);
}

/* ---- Tree Outline Sidebar ---- */
#tree-outline {
  position: fixed; left: -380px; top: 16px; bottom: 16px; width: 340px; z-index: 10;
  background: var(--panel-bg);
  backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
  border: 1px solid var(--border); border-radius: 0 16px 16px 0;
  transition: left 0.38s cubic-bezier(0.22, 0.61, 0.36, 1);
  box-shadow: 12px 0 48px rgba(0,0,0,0.55);
  display: flex; flex-direction: column; overflow: hidden;
}
#tree-outline.on { left: 16px; }
#tree-outline .to-header {
  padding: 14px 16px; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
  flex-shrink: 0;
}
#tree-outline .to-header h3 {
  color: #b8c8e8; font-size: 14px; font-weight: 600;
}
#tree-outline .to-body {
  flex: 1; overflow-y: auto; padding: 8px 0;
  scrollbar-width: thin;
  scrollbar-color: rgba(72,136,240,0.18) transparent;
}
#tree-outline .to-body::-webkit-scrollbar { width: 4px; }
#tree-outline .to-body::-webkit-scrollbar-track { background: transparent; }
#tree-outline .to-body::-webkit-scrollbar-thumb {
  background: rgba(72,136,240,0.2); border-radius: 2px;
}
.to-node {
  display: flex; align-items: center; gap: 8px;
  padding: 7px 16px; cursor: pointer; transition: all 0.15s;
  color: #8899bb; font-size: 12.5px;
}
.to-node:hover { background: rgba(60, 120, 240, 0.08); color: #c0d0f0; }
.to-node .to-dot {
  width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0;
}
.to-node .to-toggle {
  width: 16px; height: 16px; font-size: 8px; line-height: 16px;
  text-align: center; color: #556688; flex-shrink: 0;
  transition: transform 0.2s;
}
.to-node .to-toggle.open { transform: rotate(90deg); }
.to-node.active {
  background: rgba(60, 120, 240, 0.15);
  color: #c8d8f8;
  border-left: 2px solid var(--accent);
}

/* ---- Favorites Dropdown ---- */
#fav-dropdown {
  position: fixed; top: 54px; right: 60px; z-index: 11;
  width: 280px; max-height: 360px;
  background: rgba(10, 16, 36, 0.97);
  backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  border: 1px solid var(--border);
  border-radius: 12px;
  display: none; flex-direction: column;
  box-shadow: 0 12px 40px rgba(0,0,0,0.5);
  overflow: hidden;
}
#fav-dropdown.show { display: flex; }
#fav-dropdown .fav-hd {
  padding: 10px 14px; border-bottom: 1px solid var(--border);
  font-size: 11px; color: #6678a0; font-weight: 600;
  letter-spacing: 0.5px; flex-shrink: 0;
}
#fav-dropdown .fav-list {
  flex: 1; overflow-y: auto;
  scrollbar-width: thin;
  scrollbar-color: rgba(72,136,240,0.18) transparent;
}
#fav-dropdown .fav-item {
  padding: 9px 14px; cursor: pointer; font-size: 12px;
  color: #b0bdd0; border-bottom: 1px solid rgba(255,255,255,0.03);
  display: flex; align-items: center; gap: 8px;
  transition: all 0.15s;
}
#fav-dropdown .fav-item:hover {
  background: rgba(60, 120, 240, 0.1); color: #d0dcff;
}
#fav-dropdown .fav-item .fav-remove {
  margin-left: auto; color: #556688; font-size: 14px;
  cursor: pointer; padding: 2px 6px; border-radius: 4px;
}
#fav-dropdown .fav-item .fav-remove:hover {
  color: #ef4444; background: rgba(239, 68, 68, 0.1);
}
#fav-dropdown .fav-empty {
  padding: 20px; text-align: center; color: #556688; font-size: 12px;
}

/* ---- Responsive ---- */
@media (max-width: 768px) {
  #panel { width: calc(100vw - 32px); right: -100vw; }
  #panel.on { right: 16px; }
  #tree-outline { width: calc(100vw - 48px); left: -100vw; }
  #tree-outline.on { left: 16px; }
  #topbar { flex-wrap: wrap; }
  #search-wrap { flex: 1 1 200px; }
  #breadcrumb { order: 3; flex: 1 1 100%; }
  #bottombar { padding: 5px 12px; gap: 8px; }
  .lg-item { font-size: 10px; }
  #hint { bottom: 64px; font-size: 9px; }
}

</style>
</head>
<body>

<canvas id="particles"></canvas>
<div id="chart"></div>
<div id="overlay" onclick="closePanel()"></div>

<!-- Top Bar -->
<div id="topbar">
  <div id="search-wrap">
    <input type="text" id="search" placeholder="🔍 搜索概念、章节、人物…" autocomplete="off">
    <button id="search-clear" onclick="clearSearch()">✕</button>
    <div id="search-results"></div>
  </div>
  <div id="breadcrumb"></div>
  <div id="top-actions">
    <button class="top-btn" id="btn-fav" onclick="toggleFavDropdown()" title="收藏夹">⭐</button>
    <button class="top-btn" id="btn-outline" onclick="toggleOutline()" title="目录树">☰</button>
    <button class="top-btn" id="btn-reset" onclick="resetAll()" title="重置视图 (R)">↺</button>
  </div>
</div>

<!-- Detail Panel -->
<div id="panel">
  <div class="ph">
    <div class="dot" id="pdot">●</div>
    <div class="info">
      <h3 id="pname"></h3>
      <span class="tag" id="ptag"></span>
    </div>
    <button class="xbtn" onclick="closePanel()" title="关闭 Esc">✕</button>
  </div>
  <div class="pb" id="pbody"></div>
  <div id="panel-actions">
    <button class="pa-btn" id="btn-fav-toggle" onclick="toggleFavorite()">☆ 收藏</button>
    <button class="pa-btn" onclick="focusNode()">⊙ 聚焦</button>
    <button class="pa-btn" onclick="expandAllHere()">⇲ 展开全部</button>
  </div>
</div>

<!-- Tree Outline Sidebar -->
<div id="tree-outline">
  <div class="to-header">
    <h3>📑 目录结构</h3>
    <button class="xbtn" onclick="toggleOutline()" title="关闭">✕</button>
  </div>
  <div class="to-body" id="to-body"></div>
</div>

<!-- Favorites Dropdown -->
<div id="fav-dropdown">
  <div class="fav-hd">⭐ 收藏节点</div>
  <div class="fav-list" id="fav-list"></div>
</div>

<!-- Bottom Legend -->
<div id="bottombar">
  <div class="lg-item"><b style="background:#1a3a8a;box-shadow:0 0 6px rgba(30,60,140,0.6)"></b>根节点</div>
  <div class="lg-item"><b style="background:#2563eb"></b>正文章节</div>
  <div class="lg-item"><b style="background:#7c3aed"></b>附录</div>
  <div class="lg-item"><b style="background:#4b5563"></b>小节</div>
  <div class="lg-item"><b style="background:#6b7280"></b>概念</div>
</div>

<!-- Hint -->
<div id="hint"></div>

<!-- Toast -->
<div id="toast"></div>

<script>
var TREE = {"id": "root", "name": "逻辑哲学研究", "desc": "陈波著 · 系统阐述现代逻辑哲学的完整体系", "children": [{"id": "c01", "name": "第一章 什么是逻辑哲学？", "desc": "正文 · 共5个小节", "isAppendix": false, "children": [{"id": "1-1", "name": "逻辑哲学的兴起", "category": 2, "symbolSize": 32, "desc": "追溯逻辑哲学产生的历史进程与主要代表人物及其观点贡献", "children": [{"id": "1-1-1", "name": "经典逻辑的基本原则", "category": 3, "symbolSize": 26, "desc": "一阶逻辑赖以建立的四个基本假定或原则", "children": [{"id": "1-1-1-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "一阶逻辑建立在外延原则、二值原则等四个基本假定之上", "detail": "(1)外延原则：处理语词语句时只考虑外延，语词外延是所指对象，语句外延是真值；外延论题保证等值替换保持真值不变。(2)二值原则：任一命题或真或假，非真即假，不存在真值空白或真值间隙。(3)个体域非空：量词具有存在涵义，单称词项总是指称个体域中某个个体，不允许空词项。(4)采用实无穷抽象法，可研究本质上是非构造性对象。"}, {"id": "1-1-1-2", "name": "经典诘难", "category": 4, "symbolSize": 22, "desc": "对实质蕴涵不符合日常推理直觉的激烈抨击", "detail": "(1)实质蕴涵不符合自然语言中'如果…则…'的原义。(2)不符合日常思维中的逻辑推理关系。(3)违反人们的常识和直觉，被认为不可接受。"}, {"id": "1-1-1-3", "name": "代表人物", "category": 4, "symbolSize": 22, "desc": "为数理逻辑创立做出奠基性贡献的逻辑学家", "detail": "(1)莱布尼茨于17世纪最先提出创立数理逻辑的设想，力图构建'通用语言'和'通用数学'。(2)德摩根、布尔、弗雷格、皮亚诺、罗素和怀特海等好几代逻辑学家不懈努力。(3)希尔伯特和阿克曼于1928年证明一阶谓词演算的一致性，哥德尔于1930年证明其完全性。"}, {"id": "1-1-1-4", "name": "实质蕴涵", "category": 4, "symbolSize": 22, "desc": "经典逻辑中条件句的真值函项解释", "detail": "(1)实质蕴涵把条件句真值看作各子语句的真值函项。(2)条件句'如果p则q'为真当且仅当并非p真而q假。(3)除p真q假时条件句为假外，p真q真、p假q假、p假q真三种情况均为真。"}]}, {"id": "1-1-2", "name": "非经典逻辑的兴起", "category": 3, "symbolSize": 26, "desc": "因否定或修改经典逻辑基本原则而建立的新逻辑分支", "children": [{"id": "1-1-2-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "放弃或修改经典逻辑的某一基本原则以建立新逻辑系统", "detail": "(1)多值逻辑放弃二值原则，命题可取真、假之外的其他值，矛盾律和排中律不再成立。(2)模态逻辑、相干逻辑、直觉主义逻辑等用严格蕴涵、相干蕴涵、衍推等取代实质蕴涵。(3)自由逻辑和偏逻辑修改个体域非空假定，允许单称词项无所指称。(4)内涵逻辑修改外延原则，既考虑表达式外延也考虑内涵。"}, {"id": "1-1-2-2", "name": "经典诘难", "category": 4, "symbolSize": 22, "desc": "经典逻辑与非经典逻辑并存引发的根本性哲学问题", "detail": "(1)经典逻辑和非经典逻辑是什么关系？它们是同样正确的还是相互竞争的？(2)是不是仅有一个正确的逻辑系统？有没有可能存在着同样正确的不同系统？(3)什么是推理的有效性？什么是逻辑真理？有效性和逻辑真理能否解释为与某一形式系统相关？"}, {"id": "1-1-2-3", "name": "代表人物", "category": 4, "symbolSize": 22, "desc": "推动和创立各种非经典逻辑分支的逻辑学家", "detail": "(1)刘易斯提出严格蕴涵并创立模态逻辑。(2)海廷创立直觉主义逻辑。(3)安德森和贝尔纳普发展相干逻辑。(4)冯·赖特等人发展道义逻辑、认知逻辑等哲学逻辑分支。"}, {"id": "1-1-2-4", "name": "主要分支", "category": 4, "symbolSize": 22, "desc": "各类非经典逻辑系统及其修改的基本假定", "detail": "(1)放弃二值原则：多值逻辑、量子逻辑、模糊逻辑、自由逻辑、偏逻辑。(2)修改实质蕴涵：模态逻辑（严格蕴涵）、相干逻辑（相干蕴涵）、直觉主义逻辑（直觉主义蕴涵）、反事实条件句逻辑（反事实蕴涵）。(3)修改外延原则：内涵逻辑。(4)其他新分支：次协调逻辑、条件句逻辑、非单调逻辑。"}]}, {"id": "1-1-3", "name": "弗雷格的逻辑哲学贡献", "category": 3, "symbolSize": 26, "desc": "第一个真正意义上的逻辑哲学家及其三项主要贡献", "children": [{"id": "1-1-3-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "提出逻辑哲学研究的三条基本原则", "detail": "(1)始终要把心理的东西和逻辑的东西、主观的东西和客观的东西明确区别开来。逻辑具有客观性，心理过程具有主观性，逻辑与任何心理过程无关。(2)决不能孤立地问一个语词的意义是什么，语词只有在语言的实际运用中、在语句的语境中才能获得意义。(3)强调对象和概念的区别，把语句作为基本的意义单位并分析其内部结构，区分出专名和概念词。"}, {"id": "1-1-3-2", "name": "代表人物", "category": 4, "symbolSize": 22, "desc": "弗雷格及其经典论文", "detail": "(1)德国数学家兼哲学家弗雷格（1848—1925），第一个真正意义上的逻辑哲学家。(2)三篇经典论文：《函项和概念》（1891）、《概念和对象》（1892）、《涵义和指称》（1892）。"}, {"id": "1-1-3-3", "name": "涵义与所指的区分", "category": 4, "symbolSize": 22, "desc": "明确区分表达式的涵义和所指，提出外延论题", "detail": "(1)一个表达式的涵义是客观的，与该表达式在说话者和听话者那里产生的任何心理状态无关。(2)提出了著名的外延论题。(3)注意到外延论题在某些特殊情况下不成立。"}, {"id": "1-1-3-4", "name": "逻辑主义纲领", "category": 4, "symbolSize": 22, "desc": "主张全部数学可以化归于逻辑", "detail": "(1)认为可以在逻辑的基础上证明全部数学的可靠性。(2)用逻辑概念定义数学概念，从逻辑中推导出数学定理。(3)为实现此目标而持之不懈地努力。"}]}, {"id": "1-1-4", "name": "罗素的逻辑哲学贡献", "category": 3, "symbolSize": 26, "desc": "逻辑原子论、摹状词理论、类型论与逻辑主义纲领", "children": [{"id": "1-1-4-1", "name": "代表人物", "category": 4, "symbolSize": 22, "desc": "罗素及其主要著作与逻辑主义实践", "detail": "(1)罗素（1872—1970），与逻辑有关的主要著作包括《数学原理》（与怀特海合著）、《我们关于外间世界的知识》、《逻辑原子论哲学》等。(2)1905年发表的《论指示》已成为逻辑哲学的经典性论文。(3)从逻辑演算出发加上无穷公理和选择公理，推导出集合论、一般算术和大部分数学。"}, {"id": "1-1-4-2", "name": "逻辑原子论", "category": 4, "symbolSize": 22, "desc": "世界由原子事实构成，语言与实在具有结构同型性", "detail": "(1)世界由事实构成，命题与事实对应，事实使一个命题为真或为假。(2)最简单的事实叫做原子事实，与原子事实对应的是原子命题；分子命题是原子命题的真值函项，与复合事实对应。(3)一切知识都可以用原子命题和分子命题表述，整个世界是建立在原子事实之上的逻辑构造。(4)根本假定：语言和世界具有结构的同型性。"}, {"id": "1-1-4-3", "name": "摹状词理论", "category": 4, "symbolSize": 22, "desc": "名称的意义就是它的所指，摹状词不是独立的意义单位", "detail": "(1)名称的意义就是它的所指。真正的专名只有像'这''那'等少数几个逻辑专名。(2)普通专名只不过是伪装的摹状词，摹状词在句子中的出现是可消除的，因而不是独立的意义单位。(3)哲学结论：存在不是个体的性质而是命题函项的性质，整个世界都是基于感觉材料之上的逻辑构造。"}, {"id": "1-1-4-4", "name": "类型论", "category": 4, "symbolSize": 22, "desc": "基于禁止恶性循环原则解决集合论悖论的理论", "detail": "(1)产生悖论的根源在于假定一类事物可以包括只能根据该类的全体才能定义的东西作为分子。(2)一切类所构成的类还是类，这样的类是'不合法的整体'，承认它会导致恶性循环和自相矛盾。(3)提出'禁止恶性循环原则'，创立类型论以解决悖论。"}]}, {"id": "1-1-5", "name": "维特根斯坦的逻辑哲学贡献", "category": 3, "symbolSize": 26, "desc": "前期图像说与后期语言游戏说及意义即使用的口号", "children": [{"id": "1-1-5-1", "name": "代表人物", "category": 4, "symbolSize": 22, "desc": "维特根斯坦及其前后期代表作", "detail": "(1)维特根斯坦（1889—1951），哲学分为前期和后期。(2)前期代表作《逻辑哲学论》（1922），提出图像说。(3)后期代表作《哲学研究》（1953），提出语言游戏说。"}, {"id": "1-1-5-2", "name": "图像说", "category": 4, "symbolSize": 22, "desc": "命题是实在的图像，语言与实在在结构上相似", "detail": "(1)命题是实在的图像，命题是我们所设想的实在的模型。(2)语言与实在、命题与事实都处于形式关系之中，在结构上相似，因此可由语言去推论世界。(3)区分基本命题和复合命题：基本命题的真值条件在于与事实一致或不一致，复合命题是基本命题的真值函项。(4)重言式和矛盾式对世界无所叙说，没有任何经验内容；命题则含有经验内容。"}, {"id": "1-1-5-3", "name": "语言游戏说", "category": 4, "symbolSize": 22, "desc": "后期哲学把语言看作游戏，强调语言的多样性和无本质性", "detail": "(1)语言游戏与其他游戏有一系列类似之处：自主性、无需证明、非推论性、无需反思、多样性、遵守规则、变易性、无本质等。(2)宗旨是彻底清除以往哲学研究中由于误用语言而产生的一切混乱。(3)摒弃把意义看作实体的观念，使对语言的研究从追求意义转向语言的实际用法。"}, {"id": "1-1-5-4", "name": "意义即使用", "category": 4, "symbolSize": 22, "desc": "一个词的意义在于它在语言中的用法", "detail": "(1)一个词的意义在于它在语言中的用法。(2)特别强调语境，强调语言游戏整体对其中角色的制约。"}]}, {"id": "1-1-6", "name": "卡尔纳普的逻辑哲学贡献", "category": 3, "symbolSize": 26, "desc": "可证实性原则、宽容规则与形式化语义学体系", "children": [{"id": "1-1-6-1", "name": "代表人物", "category": 4, "symbolSize": 22, "desc": "卡尔纳普及其重要著作", "detail": "(1)卡尔纳普（1891—1970），重要著作有《世界的逻辑构造》、《语言的逻辑句法》、《语义学引论》、《意义和必然性》等。(2)从塔斯基关于对象语言和元语言的区分出发，建立了一套形式化的语义学体系。"}, {"id": "1-1-6-2", "name": "修正版本", "category": 4, "symbolSize": 22, "desc": "可证实性原则弱化为可确证性和可检验性原则", "detail": "(1)由于可证实性原则遇到了一系列理论上的困难，卡尔纳普将其弱化。(2)弱化为可确证性原则和可检验性原则。(3)由对确认度的定量研究转向对概率归纳逻辑的研究。"}, {"id": "1-1-6-3", "name": "可证实性原则", "category": 4, "symbolSize": 22, "desc": "一个陈述的意义在于它的证实条件", "detail": "(1)一个陈述的意义在于它的证实条件，有意义的当且仅当在原则上是可证实的。(2)基本精神：理论、陈述、语词的意义必须是直接或间接地从经验事实中获得的。"}, {"id": "1-1-6-4", "name": "宽容规则", "category": 4, "symbolSize": 22, "desc": "每个人都可以自由地选择他的语言和逻辑", "detail": "(1)在《语言的逻辑句法》中提出著名的宽容规则。(2)指出了语言、逻辑的约定性、相对性。(3)揭示了多种语言、多种逻辑并存的根源。"}]}, {"id": "1-1-7", "name": "蒯因的逻辑哲学贡献", "category": 3, "symbolSize": 26, "desc": "整体主义知识观、本体论承诺与逻辑真理可修正性", "children": [{"id": "1-1-7-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "用整体主义知识观抨击经验论的两个教条", "detail": "(1)分析命题和综合命题的传统区分是不成立的。(2)知识是作为一个整体面对感觉经验法庭的，在顽强不屈的经验面前，知识整体的任何部分都可被修正，甚至逻辑和数学的命题也不能例外。(3)由此间接肯定了逻辑真理的可修正性。"}, {"id": "1-1-7-2", "name": "经典诘难", "category": 4, "symbolSize": 22, "desc": "对分析-综合区分的批判与对模态逻辑的激烈抨击", "detail": "(1)反对把涵义和指称混为一谈，赞同弗雷格的区分，主张对一切内涵性概念的激进怀疑论。(2)对模态逻辑特别是模态谓词逻辑的合理性及存在权利进行激烈抨击，从反面刺激了模态逻辑的发展。"}, {"id": "1-1-7-3", "name": "代表人物", "category": 4, "symbolSize": 22, "desc": "蒯因及其主要著作", "detail": "(1)蒯因（1908—2000），许多著作与逻辑哲学有关，如《从逻辑的观点看》、《逻辑哲学》、《真之追求》等。(2)两篇经典论文：《论有什么》（1948）和《经验论的两个教条》（1951）。"}, {"id": "1-1-7-4", "name": "本体论承诺", "category": 4, "symbolSize": 22, "desc": "存在就是作为约束变项的值，没有同一性就没有实体", "detail": "(1)主张从对本体论'事实问题'的研究转到对一个理论的'本体论承诺问题'的研究。(2)提出'存在就是作为约束变项的值'作为本体论承诺的识别标准。(3)提出'没有同一性就没有实体'作为本体论承诺的认可标准。"}]}, {"id": "1-1-8", "name": "克里普克的逻辑哲学贡献", "category": 3, "symbolSize": 26, "desc": "历史因果命名理论、严格指示词与先验偶然命题", "children": [{"id": "1-1-8-1", "name": "代表人物", "category": 4, "symbolSize": 22, "desc": "克里普克及其最重要著作与论文", "detail": "(1)克里普克（1940—），最重要著作《命名和必然性》（1972）。(2)重要论文包括《同一和必然性》（1971）、《真理论概要》（1975）、《说话者指称和语义学指称》（1977）、《信念之谜》（1979）等。"}, {"id": "1-1-8-2", "name": "历史因果命名理论", "category": 4, "symbolSize": 22, "desc": "名称只有指称而无涵义，指称由历史因果链条决定", "detail": "(1)名称（至少是一部分名称）只有指称而无涵义。(2)指称关系的确立依据于名称与某个命名活动的历史因果联系，依据于人们对有关历史及因果影响的了解。(3)一个名称的所指是由与使用该名称有关的社会历史传递链条决定的。(4)专名和通名都是严格指示词，在所有可能世界内指称同样的个体或类。"}, {"id": "1-1-8-3", "name": "先验偶然与后天必然", "category": 4, "symbolSize": 22, "desc": "区分形而上学、认识论和语言哲学三类范畴", "detail": "(1)'必然的和偶然的'是形而上学区分，'先验的和后验的'是认识论区分，'分析的和综合的'是语言哲学区分。(2)不能将这三者等同起来，即不能认为分析命题、必然命题、先验命题三者同一。(3)认为存在着'先验偶然命题'和'后天必然命题'，并给出了论证。"}, {"id": "1-1-8-4", "name": "真理论与不动点", "category": 4, "symbolSize": 22, "desc": "基于有根性概念的语义悖论解决方案", "detail": "(1)提出了'有根性'或一个语言的'不动点'（固定点）的概念。(2)如果真值追溯过程最后终止于一些不提真假概念的句子，使得能够确定原句子的真值，则原句子是有根的，否则是无根的。(3)导致悖论的句子都是无根的，它们有意义但无真假可言。(4)一句子是否有根通常依赖于经验事实，而非句子的内在固有性质。"}]}]}, {"id": "1-2", "name": "逻辑哲学与哲学逻辑", "category": 2, "symbolSize": 32, "desc": "梳理哲学逻辑与逻辑哲学两词的来龙去脉并界定其精确涵义", "children": [{"id": "1-2-1", "name": "哲学逻辑一词的起源", "category": 3, "symbolSize": 26, "desc": "罗素最早明确使用哲学逻辑一词，指对逻辑形式的研究", "children": [{"id": "1-2-1-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "哲学逻辑的真正对象是为各种命题和推理所共有的逻辑形式", "detail": "(1)罗素在《我们关于外间世界的知识》中最早明确使用'哲学逻辑'一词。(2)他认为哲学逻辑的真正对象乃是为各种命题和推理所共有的逻辑形式，哲学逻辑乃是对于逻辑形式的研究。(3)以往的哲学家由于被语言表面的语法形式所蒙骗，未能认清其隐藏着的真正的逻辑形式，因而犯了许多重大的哲学错误。"}, {"id": "1-2-1-2", "name": "代表人物", "category": 4, "symbolSize": 22, "desc": "罗素与维特根斯坦对哲学逻辑一词的不同态度", "detail": "(1)罗素在《我们关于外间世界的知识》中明确使用'哲学逻辑'一词。(2)历史最早可追溯到弗雷格，他曾被人称为'哲学逻辑'的发现之父。(3)维特根斯坦极力反对'哲学逻辑'一词，认为'根本没有哲学逻辑这样的东西'。"}]}, {"id": "1-2-2", "name": "斯特劳森的哲学逻辑概念", "category": 3, "symbolSize": 26, "desc": "将逻辑分为形式逻辑和哲学逻辑，后者关注逻辑的哲学方面", "children": [{"id": "1-2-2-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "哲学逻辑关注逻辑的哲学方面及其引起的哲学问题", "detail": "(1)形式逻辑研究命题之间的可演绎关系或蕴涵关系，以抽象的形式系统的方式排列有关规律。(2)哲学逻辑关注逻辑的哲学方面，如各种逻辑理论产生的哲学背景和哲学预设，成果、方法所具有的哲学意义和用处。(3)哲学逻辑研究所引起的一系列哲学问题：究竟什么是命题？说一命题为真是什么意思？命题联结词的准确性质是什么？意义概念应当怎样分析？真理概念和分析性概念应当怎样分析？"}, {"id": "1-2-2-2", "name": "代表人物", "category": 4, "symbolSize": 22, "desc": "斯特劳森及其影响的英国哲学家群体", "detail": "(1)斯特劳森于1967年编辑出版《哲学逻辑》文集，撰写长篇序言界定哲学逻辑。(2)沃尔夫拉姆在《哲学逻辑引论》（1989）中完全接受斯特劳森的二重划分。(3)格雷林指出哲学逻辑是哲学的工场，研究哲学逻辑就是研究西方分析哲学的主要概念。"}]}, {"id": "1-2-3", "name": "哲学逻辑的双重涵义", "category": 3, "symbolSize": 26, "desc": "哲学逻辑兼具哲学和逻辑双重涵义", "children": [{"id": "1-2-3-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "哲学逻辑既指哲学研究也指新的逻辑分支", "detail": "(1)哲学逻辑既指由逻辑产生或引起的哲学概念或问题的哲学研究。(2)也指由这种研究所建立起来的新的逻辑分支。(3)前者是非形式的，后者则是用形式化方法建立起来的形式系统。"}, {"id": "1-2-3-2", "name": "修正版本", "category": 4, "symbolSize": 22, "desc": "恩格尔主张区分非形式的哲学逻辑和形式的哲学逻辑", "detail": "(1)恩格尔在《真理的准则——逻辑哲学引论》（1991）中主张把哲学逻辑区分为两部分。(2)非形式的哲学逻辑和形式的哲学逻辑。(3)随着新的逻辑学分支越来越多，人们越来越倾向于把新兴的逻辑学科群体叫做'哲学逻辑'。"}]}, {"id": "1-2-4", "name": "变异逻辑与应用逻辑", "category": 3, "symbolSize": 26, "desc": "哲学逻辑学科群体的两大子群", "children": [{"id": "1-2-4-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "哲学逻辑包括变异逻辑（择代系统）和应用逻辑（扩充系统）", "detail": "(1)哲学逻辑以数理逻辑（主要是一阶逻辑）为直接基础，以传统的哲学概念、范畴以及逻辑在各门具体学科中的应用为研究对象。(2)变异逻辑是由否定或修改一阶逻辑的某些基本假定而形成的逻辑分支，表现为经典逻辑的择代系统。(3)应用逻辑是利用经典逻辑的工具去分析某些具体学科特别是哲学中的概念或范畴而建立的逻辑学分支，表现为经典逻辑的扩充系统。"}, {"id": "1-2-4-2", "name": "主要分支", "category": 4, "symbolSize": 22, "desc": "变异逻辑与应用逻辑各自包含的具体逻辑分支", "detail": "(1)变异逻辑包括：相干逻辑、直觉主义逻辑、自由逻辑、偏逻辑、反事实条件句逻辑、多值逻辑、量子逻辑、模糊逻辑等。(2)应用逻辑包括：模态逻辑、道义逻辑、时态逻辑、认知逻辑、问题逻辑、命令逻辑、优先逻辑等。(3)冯·赖特说：'哲学逻辑有时定义为运用逻辑去分析传统上哲学家所关心的概念的结构。'"}]}, {"id": "1-2-5", "name": "逻辑哲学的学科界定", "category": 3, "symbolSize": 26, "desc": "逻辑哲学作为一门正在形成中的新兴哲学学科", "children": [{"id": "1-2-5-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "被斯特劳森等人当作哲学的哲学逻辑宜改称逻辑哲学", "detail": "(1)当哲学逻辑被用来指称新的逻辑学科群体后，被斯特劳森、格雷林等人当作哲学的'哲学逻辑'则宜改称'逻辑哲学'。(2)施太格缪勒借助卡尔纳普的意义公设概念重新界定形式逻辑和哲学逻辑的关系。"}, {"id": "1-2-5-2", "name": "论证依据", "category": 4, "symbolSize": 22, "desc": "逻辑哲学作为学科尚未完全成熟和定形的证据", "detail": "(1)在1991年出版的《真理的准则——逻辑哲学引论》中，作者恩格尔指出'逻辑哲学是一个保护伞式的词'，关于逻辑哲学的主题不存在一个单一的既定看法。(2)有一些所讨论的问题和内容大同小异的英文出版物被冠以不同名称：'逻辑哲学'、'哲学逻辑'、'现代逻辑中的哲学问题'等。(3)这足以说明逻辑哲学作为一门学科即使在当代西方也未完全成熟，尚未成为一个严整的知识体系。"}]}]}, {"id": "1-3", "name": "逻辑哲学与语言哲学", "category": 2, "symbolSize": 32, "desc": "讨论逻辑哲学与语言哲学的联系与区别", "children": [{"id": "1-3-1", "name": "语言哲学的三种涵义", "category": 3, "symbolSize": 26, "desc": "语言哲学对应三个不同英文词，涵义各不相同", "children": [{"id": "1-3-1-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "语言哲学有三种不同涵义：语言化的哲学、语言学的哲学、关于语言的哲学", "detail": "(1)'linguistic philosophy'（语言化的哲学）：与语言转向有关，把哲学问题归结为语言问题，几乎与分析哲学同义。(2)'philosophy of linguistics'（语言学的哲学）：研究作为专门学科的语言学，考察语言学理论的基本假定、方法论和概念问题。(3)'philosophy of language'（关于语言的哲学）：包括意义理论、指称理论、真理论、语用学研究、隐喻研究等内容。"}]}, {"id": "1-3-2", "name": "逻辑哲学与语言哲学的联系", "category": 3, "symbolSize": 26, "desc": "两者具有共同起源、共同课题和共同研究者", "children": [{"id": "1-3-2-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "共同的起源、课题和研究者使逻辑哲学与语言哲学密切关联", "detail": "(1)共同起源：都是现代哲学'语言转向'的产物，都以现代数理逻辑的产生为历史前提。(2)共同研究课题：意义理论、指称理论、真理理论、言语行为理论以及有关的本体论问题。(3)共同研究者：当代许多大哲学家几乎既可算作语言哲学家又可算作逻辑哲学家。根源在于：研究逻辑要经过语言的中介，而语言的背后总是隐藏着一定的逻辑。"}]}, {"id": "1-3-3", "name": "逻辑哲学与语言哲学的区别", "category": 3, "symbolSize": 26, "desc": "论题差异与研究角度、侧重点的不同", "children": [{"id": "1-3-3-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "论题覆盖面和同一论题的研究角度均有明显区别", "detail": "(1)论题只是部分相同，并非全部相同。逻辑哲学研究逻辑学发展中提出的各种哲学问题，语言哲学一般不会研究这些专门的逻辑问题。(2)即使是在共同论题上，研究的角度和侧重点也不同。逻辑哲学重点考察如何在逻辑理论中处理意义及其带来的逻辑或哲学后果；语言哲学在研究真理问题时更着重语义约定、意义公设等起的作用。"}]}]}, {"id": "1-4", "name": "逻辑哲学与数学哲学", "category": 2, "symbolSize": 32, "desc": "讨论逻辑哲学与数学哲学的联系与区别", "children": [{"id": "1-4-1", "name": "数学哲学的核心问题", "category": 3, "symbolSize": 26, "desc": "数学的定义性质、对象实在性、命题真理性和方法论问题", "children": [{"id": "1-4-1-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "数学哲学研究数学的本体论、认识论和方法论问题", "detail": "(1)数学本身的定义和性质：数学的本质特性是什么？是一门经验科学还是纯演绎科学？涉及数学基础研究三大流派（逻辑主义、形式主义、直觉主义）。(2)数学对象的实在性：能否把数学对象看成独立的存在？数学无穷是实无穷还是潜无穷？(3)数学命题和原理的真理性：数学真理是否具有客观意义？围绕分析性和综合性、必然性和偶然性、先验性和后验性展开。(4)数学的方法论问题：数学的发现或发明是如何作出的？哪些数学方法能在自然科学和社会科学中得到普遍应用？"}]}, {"id": "1-4-2", "name": "逻辑哲学与数学哲学的联系", "category": 3, "symbolSize": 26, "desc": "根源于逻辑和数学在根本特性上的类似", "children": [{"id": "1-4-2-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "逻辑和数学在纯形式特征、抽象性、精确性和应用性上类似", "detail": "(1)纯形式特征：都撇开外部对象的具体内容而专注于形式方面。(2)高度的抽象性。(3)极端的精确性和严格性。(4)广泛的应用性。因此逻辑学家和数学家的角色有时候可以互易，逻辑哲学和数学哲学常常具有一批共同的或类似的课题。"}]}, {"id": "1-4-3", "name": "逻辑哲学与数学哲学的区别", "category": 3, "symbolSize": 26, "desc": "论题范围和研究角度、侧重点的不同", "children": [{"id": "1-4-3-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "论题范围不同且同一论题的研究角度和侧重点各异", "detail": "(1)论题并不完全相同。数学哲学一般不会研究可能世界语义学引起的哲学问题，也不会研究模态逻辑、归纳逻辑等引起的哲学问题，更不会直接研究'逻辑究竟是什么'的问题。(2)即使研究类似问题，各自角度、侧重点和研究方式也不同：逻辑哲学主要从逻辑角度出发，数学哲学主要从数学角度出发。(3)在研究真理时前者侧重于逻辑真理后者侧重于数学真理；在研究实在性时前者侧重于逻辑对象后者侧重于数、类、集合等的实在性。"}]}]}, {"id": "1-5", "name": "逻辑哲学的主要论题", "category": 2, "symbolSize": 32, "desc": "概述逻辑哲学力图研究的十一大类主要问题及本书计划", "children": [{"id": "1-5-1", "name": "意义理论与逻辑类型", "category": 3, "symbolSize": 26, "desc": "不同的意义理论决定不同类型逻辑的创立", "children": [{"id": "1-5-1-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "对意义的不同理解反映着不同的逻辑眼界", "detail": "(1)有人将语言表达式的意义等同于心理意象（观念），有人等同于其所指（指称、外延），有人理解为涵义，有人理解为涵义和所指两者。(2)有人区分抽象意义（字面意义、语义意义）和具体意义（非字面意义、语用涵义）。(3)还有人将其理解为语言表达式的用法或所执行的言语行为。(4)对于意义问题的不同处理决定着不同类型逻辑的创立，如心理学化的逻辑、外延逻辑、内涵逻辑、自然语言逻辑等。"}]}, {"id": "1-5-2", "name": "摹状词与名称理论", "category": 3, "symbolSize": 26, "desc": "评析摹状词理论和名称的描述理论与因果历史理论", "children": [{"id": "1-5-2-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "作者提出新描述理论，主张名称有涵义且由描述簇决定", "detail": "(1)任何名称都有涵义和所指。(2)名称的涵义决定它的所指。(3)构成名称涵义的是一组或一簇描述，而不是一个描述。(4)名称的涵义是人们从社会交际活动所构成的因果历史链条上获得的。(5)名称的涵义不是一次性获得的，而是在一系列社会交际活动中逐渐获得的。"}, {"id": "1-5-2-2", "name": "论证依据", "category": 4, "symbolSize": 22, "desc": "吸收原有描述理论和因果历史理论的积极成果", "detail": "(1)详细评析罗素、斯特劳森和唐奈兰关于摹状词的不同理论。(2)评析弗雷格、罗素等人关于名称的描述理论，以及维特根斯坦、塞尔等人关于名称的簇描述理论。(3)评析克里普克、普特南等人所主张的因果历史理论。"}, {"id": "1-5-2-3", "name": "代表人物", "category": 4, "symbolSize": 22, "desc": "摹状词与名称理论的主要争论各方", "detail": "(1)罗素、斯特劳森、唐奈兰关于摹状词的不同理论。(2)弗雷格、罗素的描述理论；维特根斯坦、塞尔的簇描述理论。(3)克里普克、普特南的因果历史理论。"}]}, {"id": "1-5-3", "name": "\"是\"的逻辑哲学分析", "category": 3, "symbolSize": 26, "desc": "系词\"是\"的八种理论及其逻辑哲学意义", "children": [{"id": "1-5-3-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "对\"是\"的分析隐藏着理解不同逻辑类型的奥秘", "detail": "(1)区分出关于'是'的八种理论：存在理论、外延理论、内涵理论、相似理论、语用理论、扩大理论、同一理论、实体—属性理论。(2)对'是'之意义的精确分析不仅对于逻辑学是重要的，而且对于哲学也是重要的，这里隐藏着理解不同哲学立场特别是不同逻辑类型的奥秘。(3)逻辑本质上是多元的——语言现象和思维现象纷繁复杂，要想用一种逻辑或哲学理论统一说明所有语言现象几乎不可能。"}]}, {"id": "1-5-4", "name": "推理、后承关系与蕴涵", "category": 3, "symbolSize": 26, "desc": "考察推理有效性标准与各种蕴涵理论及其相互关系", "children": [{"id": "1-5-4-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "蕴涵是对\"如果…则…\"的逻辑解读，决定对推理有效性的看法", "detail": "(1)逻辑是研究推理有效性的科学，但何谓推理的有效性？区别有效推理与非有效推理的标准是什么？(2)通常所谓的蕴涵是对于自然语言中联结词'如果……则……'的逻辑解读，实际上是被用来刻画推理的。(3)对于蕴涵怎么看，对于推理的有效性就会怎么看，这就是围绕蕴涵产生那么多争议的原因。"}, {"id": "1-5-4-2", "name": "论证依据", "category": 4, "symbolSize": 22, "desc": "考察各种蕴涵类型及其引发的深层哲学问题", "detail": "(1)详细考察各种不同的蕴涵：实质蕴涵、严格蕴涵、相干蕴涵、衍推、直觉主义蕴涵、反事实蕴涵、自然语言中的推论等及其相互关系。(2)触及更深层次的问题：对于有效推理来说最根本的特征或最本质的要求是什么？(3)应如何看待逻辑与直观的一致或不一致？逻辑与日常思维直觉是什么关系？"}]}, {"id": "1-5-5", "name": "形式化方法的哲学考察", "category": 3, "symbolSize": 26, "desc": "考察形式化的本质、合理性根据、作用范围与内在限度", "children": [{"id": "1-5-5-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "形式化方法与西方演绎主义传统和唯理论思潮密切关联", "detail": "(1)形式化是现代逻辑最重要的方法，是其特征之所在。(2)把形式化程序本身作为研究对象，考察它的哲学背景、本质、合理性根据、作用范围与内在限度。(3)形式化方法的发展与西方科学中的演绎主义传统以及西方哲学中的唯理论思潮密切关联，这一方法的作用与限度就是演绎主义和唯理主义的作用与限度。"}, {"id": "1-5-5-2", "name": "论证依据", "category": 4, "symbolSize": 22, "desc": "探讨模型演变、希尔伯特规划及哲学研究的形式化", "detail": "(1)形式化方法及其本质。(2)模型：从现实世界到可能世界的演变。(3)希尔伯特规划和形式主义。(4)形式化方法的作用和限度。(5)哲学研究的形式化。"}]}, {"id": "1-5-6", "name": "模态的形而上学", "category": 3, "symbolSize": 26, "desc": "讨论模态逻辑和可能世界语义学相关的哲学问题", "children": [{"id": "1-5-6-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "可能世界语义学引发的本体论、认识论难题", "detail": "(1)蒯因从来源、动机、解释方面对模态逻辑的合理性及存在权利进行激烈批评，涉及模态语境中的指称晦暗性问题、内涵性对象引出的对象增殖问题、从物模态和本质主义问题。(2)可能世界概念能否定义？如何定义？(3)可能世界的本体论地位如何？是一种与现实世界同样真实的存在，还只是一种说话方式，或者是某种另外的东西？(4)跨界同一性和跨界识别问题：是否存在跨越不同可能世界的个体？如果有，如何识别？涉及本质主义和反本质主义的争论。"}]}, {"id": "1-5-7", "name": "逻辑真理", "category": 3, "symbolSize": 26, "desc": "探讨逻辑真理与一般真理观、分析性、必然性及先验性的关系", "children": [{"id": "1-5-7-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "逻辑真理问题是极其困难的，涉及多种传统哲学区分", "detail": "(1)什么是逻辑真理？这一问题与'什么是逻辑'密切相关，是极其困难的。(2)逻辑真理既与一般真理观相关，又与分析命题和综合命题、必然命题和偶然命题、先验命题和后验命题等传统区分相关。(3)由于哲学逻辑的出现，它们与一阶逻辑在哪些公式是逻辑真理的问题上存在不同看法甚至严重歧异，正如在矛盾律、排中律上面已经出现的那样。"}, {"id": "1-5-7-2", "name": "论证依据", "category": 4, "symbolSize": 22, "desc": "经典逻辑和哲学逻辑中的逻辑真及其可修正性", "detail": "(1)几种主要的真理论。(2)经典逻辑中的逻辑真。(3)哲学逻辑中的逻辑真。(4)逻辑真理的分析性、先验性、必然性和可修正性。"}]}, {"id": "1-5-8", "name": "逻辑悖论与本体论承诺", "category": 3, "symbolSize": 26, "desc": "悖论的定义、分类、根源及解决方案；逻辑中的本体论问题", "children": [{"id": "1-5-8-1", "name": "逻辑悖论的核心问题", "category": 4, "symbolSize": 22, "desc": "悖论的定义、分类、根源与各种解决方案的批判性评价", "detail": "(1)究竟什么是悖论？如何定义它？悖论能否分类？如何分类？(2)产生悖论的原因是什么？悖论究竟是一种逻辑矛盾还是所谓的辩证矛盾或者其他？(3)对悖论采取什么样的态度更为合宜？是拒斥、消解、容忍还是干脆承认？(4)已有的各种悖论解决方案的优劣得失如何？容许'真矛盾'的次协调逻辑或'悖论逻辑'是否合理？(5)悖论是否要导致放弃或限制矛盾律这样激进的对已有逻辑的修改？"}, {"id": "1-5-8-2", "name": "本体论承诺的核心问题", "category": 4, "symbolSize": 22, "desc": "逻辑在双重意义上与本体论发生关系", "detail": "(1)逻辑理论也会断定或预设一定类型的本体存在，会建立在一定的本体论基础之上，具体化为各种抽象实体（如意义、命题、性质、类或集合、可能世界、可能个体等）的实在性问题。(2)可以利用现代逻辑的精确工具去讨论和处理传统哲学的本体论问题，例如蒯因所揭示的量词和本体论承诺的关系，罗素的摹状词理论及其哲学后果。(3)'存在'是不是一个逻辑谓词？量词与本体论承诺的关系如何？在抽象实体的本体地位上发生唯名论和柏拉图主义之争。"}, {"id": "1-5-8-3", "name": "归纳问题的解决方案", "category": 4, "symbolSize": 22, "desc": "休谟对归纳法的诘难及其激起的深刻历史回响", "detail": "(1)休谟诘难要点：归纳法不能必然得出全称结论，从观察到的事例跳到未观察到的事例、从过去现在跳到未来没有逻辑上的保证；作为归纳法理论基础的客观因果律没有充分根据，只是习惯性心理联想。(2)逻辑经验主义者暗中接受休谟诘难的正确性，从古典归纳纲领上退却，发展概率归纳逻辑。(3)现代科学哲学中关于可证实性原则、可确证性原则、可检验性规则、可证伪性原则的种种争论，都与归纳逻辑有十分密切的关系。"}, {"id": "1-5-8-4", "name": "逻辑的界定问题", "category": 4, "symbolSize": 22, "desc": "逻辑的研究对象、划界标准、一元多元之辩及与相关学科的关系", "detail": "(1)逻辑的研究对象是什么？是思维的结构、语言的结构还是外部实在的结构？或几者兼而有之？(2)逻辑与非逻辑的划界标准是什么？逻辑有哪些基本类型？根据什么标准分类？(3)逻辑是一元的、多元的还是工具论的？正确的逻辑是只有一种还是有多种？或者逻辑根本无所谓正确错误之分而只是一种是否方便有用的工具？(4)逻辑与数学、哲学、语言学等相关学科的关系如何？"}]}]}]}, {"id": "c02", "name": "第二章 意义理论和逻辑类型", "desc": "正文 · 共4个小节", "isAppendix": false, "children": [{"id": "2-1", "name": "观念论和逻辑中的心理主义", "category": 2, "symbolSize": 32, "desc": "探讨观念论及其引发的逻辑心理主义与反心理主义之争", "children": [{"id": "2-1-1", "name": "观念论", "category": 3, "symbolSize": 26, "desc": "语词和语句的意义就是它们所代表的观念或精神意象", "children": [{"id": "2-1-1-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "语词和语句的意义就是与它们有固定联系的观念", "detail": "(1)语言是表达思想的工具，思想由人们意识中的一系列观念组成\n(2)一个人使用语言将他的观念外在化，若在别人心中唤起相同的观念，他的语言使用就是合适的，就达到了交流的目的\n(3)任何一个有意义的词所指示的不是事物，而是作为精神实体的观念"}, {"id": "2-1-1-2", "name": "代表人物", "category": 4, "symbolSize": 22, "desc": "笛卡尔首倡，洛克集大成，英国近代经验论者均为代表", "detail": "(1)观念论从笛卡尔以后开始流行\n(2)洛克集观念论之大成，主要主张大多来自洛克的表述\n(3)英国近代经验论者几乎都是观念论者"}]}, {"id": "2-1-2", "name": "逻辑心理主义", "category": 3, "symbolSize": 26, "desc": "把逻辑研究对象等同于主观心智过程的思潮", "children": [{"id": "2-1-2-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "从心理要素和心理学规律中推导出逻辑规律", "detail": "(1)逻辑学变成为心理学的一章，具有纯粹主观的性质\n(2)可细分为哲学心理主义和逻辑心理主义\n(3)哲学心理主义认为心理学是基础科学，哲学、逻辑学、美学等都是应用科学\n(4)逻辑心理主义把逻辑对象和逻辑运算等同于表象知觉和心理过程"}, {"id": "2-1-2-2", "name": "代表人物", "category": 4, "symbolSize": 22, "desc": "里普斯、弗里斯、布伦塔诺、冯特、密尔父子等", "detail": "(1)里普斯明确指出：逻辑学是心理学的一个分支，逻辑学要么是心理学要么什么也不是\n(2)哲学心理主义代表：弗里斯、布伦塔诺、冯特、迈农、齐亨\n(3)逻辑心理主义代表：霍布斯、洛克、贝克莱、休谟、托马斯·里德、汉密尔顿、密尔父子"}]}, {"id": "2-1-3", "name": "强心理主义", "category": 3, "symbolSize": 26, "desc": "逻辑规律就是人类心理学规律的自然主义版本", "children": [{"id": "2-1-3-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "逻辑规律就是人类心理学的规律即思维的规律", "detail": "(1)逻辑不是一门说我们应该如何思维的规范科学，而是一门关于我们实际上如何思维的自然科学\n(2)矛盾律只不过是来自经验的概括，根据在于信念与相反信念相互排斥\n(3)排中律是普遍经验的概括，肯定意识模式与否定模式相互排斥\n(4)逻辑规律不是必然规律而是偶然的和可变的"}, {"id": "2-1-3-2", "name": "经典诘难", "category": 4, "symbolSize": 22, "desc": "若逻辑描述思维规律，逻辑错误如何可能发生", "detail": "(1)第一种解释：有时之所以很坏地进行推理，是由于外在于心理学规律的事实因素造成的，例如注意力不集中\n(2)第二种解释：思维规律并不是必然规律，而是偶然的和可变的"}, {"id": "2-1-3-3", "name": "代表人物", "category": 4, "symbolSize": 22, "desc": "密尔、贝恩为主要代表", "detail": "(1)密尔认为逻辑并不是不同于心理学的一门科学\n(2)贝恩认为排中律是普遍经验的概括"}]}, {"id": "2-1-4", "name": "弱心理主义", "category": 3, "symbolSize": 26, "desc": "逻辑规律起源于心智操作但获得自主性和独立性", "children": [{"id": "2-1-4-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "逻辑规律起源于心智操作但获得相对于起源的自主性", "detail": "(1)信念是行为的倾向或心智的习惯，为人种的进化着的习惯所强化\n(2)在漫长的进化过程中，这些习惯变得对所有人都是相同的\n(3)通过切断与先前信念的关联而能够发挥规范作用\n(4)逻辑是一门规范性科学，它并不问事实上如何而问必须如何"}, {"id": "2-1-4-2", "name": "代表人物", "category": 4, "symbolSize": 22, "desc": "皮尔士为其主要代表", "detail": "(1)皮尔士的立场：逻辑规律起源于心智操作但获得自主性\n(2)逻辑推理像任何类型的思维一样也是某种形式的行动\n(3)皮尔士最终给出的逻辑定义与反心理主义者惊人地类似"}]}, {"id": "2-1-5", "name": "反心理主义", "category": 3, "symbolSize": 26, "desc": "否认逻辑与心理学有任何关系的客观主义立场", "children": [{"id": "2-1-5-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "始终把心理的东西和逻辑的东西严格区分开来", "detail": "(1)逻辑中的问题不在于偶然的法则而在于必然的法则\n(2)不在于我们如何思维而在于我们应该如何思维\n(3)语言表达式的涵义和所指具有客观实在性或主体间性，与主观内在的意象、心象无关\n(4)逻辑并不研究主体如何或为何作判断，只研究客观思想本身的性质及其关系"}, {"id": "2-1-5-2", "name": "论证依据", "category": 4, "symbolSize": 22, "desc": "心理主义不能说明逻辑规律的客观性和必然性", "detail": "(1)心理主义不能说明逻辑规律的客观性：主观表象是私人性的，而逻辑规律是公共性的，思想不能化归于主观表象\n(2)心理主义不能说明逻辑规律的必然性：主观表象因人而异，关于可变规律的想法是无意义的"}, {"id": "2-1-5-3", "name": "经典诘难", "category": 4, "symbolSize": 22, "desc": "弗雷格强实在论药方比疾病本身更坏，且未驳倒弱心理主义", "detail": "(1)弗雷格的批评主要是针对强心理主义，它并没有驳倒弱心理主义\n(2)反心理主义使我们与逻辑规律的关系变得神秘莫测，无法说明逻辑为何可以应用于各种不同的领域\n(3)作者对弱心理主义持同情态度，认为逻辑仍是一门与人的思维有关的科学"}, {"id": "2-1-5-4", "name": "代表人物", "category": 4, "symbolSize": 22, "desc": "康德首倡，弗雷格和胡塞尔猛烈攻击或反叛", "detail": "(1)康德率先擎起反心理主义大旗\n(2)弗雷格提出三原则，首要原则区分心理与逻辑、主观与客观\n(3)胡塞尔随后对心理主义发起更猛烈的攻击或反叛"}]}]}, {"id": "2-2", "name": "指称论、真值条件论和外延逻辑", "category": 2, "symbolSize": 32, "desc": "探讨指称论与真值条件论及其基础上的外延逻辑", "children": [{"id": "2-2-1", "name": "指称论", "category": 3, "symbolSize": 26, "desc": "语词的意义就是它们所指称的客观对象", "children": [{"id": "2-2-1-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "语言表达式的意义等同于客观可公共理解和交流的东西", "detail": "(1)是对观念论的直接反叛\n(2)语词的意义就是它们所指称的客观对象\n(3)语句的所指就是它们所具有的真值"}, {"id": "2-2-1-2", "name": "代表人物", "category": 4, "symbolSize": 22, "desc": "罗素、早期维特根斯坦；弗雷格持类似但有差异的观点", "detail": "(1)罗素、早期维特根斯坦是指称论的代表人物\n(2)弗雷格持有与此类似但有差异的观点\n(3)在此基础上弗雷格和罗素成功地建立起命题演算和谓词演算"}]}, {"id": "2-2-2", "name": "真值条件论", "category": 3, "symbolSize": 26, "desc": "通过陈述语句的成真条件可以给出语句的意义", "children": [{"id": "2-2-2-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "知道一个语句的意义就是知道如果它是真的情况是怎样的", "detail": "(1)维特根斯坦首先表达这一核心思想\n(2)戴维森主张把塔斯基关于真的语义学概念应用于对意义的理解\n(3)将约定T'X是真的当且仅当p'改换为'X的意思是p'\n(4)强调意义的组合性：语句意义是部分表达式意义及结构关系的函项"}, {"id": "2-2-2-2", "name": "代表人物", "category": 4, "symbolSize": 22, "desc": "戴维森提出戴维森纲领；维特根斯坦首先表达核心思想", "detail": "(1)戴维森提出戴维森纲领，把真理论变为意义论\n(2)维特根斯坦首先表达了知道语句意义即知其成真条件的思想\n(3)直接导致了逻辑经验主义的可证实性原则"}]}, {"id": "2-2-3", "name": "外延逻辑", "category": 3, "symbolSize": 26, "desc": "只考虑语言表达式外延的一阶逻辑体系", "children": [{"id": "2-2-3-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "表达式的意义就是其外延，坚持组合性原则和等值置换规则", "detail": "(1)表达式的意义就是它们的外延：个体常项外延是可能世界中特定个体，谓词外延是个体集合或特征函项；非真实事物名称被给予空集；语句外延是真值\n(2)坚持弗雷格的组合性原则：复合表达式的外延是其部分表达式外延的函项，命题逻辑是真值函项逻辑\n(3)等值置换规则和同一替换规则成立：外延相同的表达式可以相互替换"}, {"id": "2-2-3-2", "name": "经典诘难", "category": 4, "symbolSize": 22, "desc": "外延逻辑的等值置换规则和同一替换规则存在反例", "detail": "(1)厄勒克特拉悖论：她知道奥列斯特是她哥哥，但不知道站在面前的人是她哥哥，然而两人是同一人，导致既知道又不知道的矛盾\n(2)许多日常语言中明显有效的推理在外延逻辑中无法得到说明，如从康德知道5+7=12和5+7=12是必然的，推不出存在康德知道且必然的命题\n(3)根本原因在于外延逻辑只考虑语言表达式的外延"}]}]}, {"id": "2-3", "name": "精致的指称论和内涵逻辑", "category": 2, "symbolSize": 32, "desc": "探讨弗雷格涵义所指区分及在此基础上建立的内涵逻辑", "children": [{"id": "2-3-1", "name": "精致的指称论", "category": 3, "symbolSize": 26, "desc": "语言表达式区分为涵义和所指的弗雷格意义理论", "children": [{"id": "2-3-1-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "语言表达式都具有涵义和所指，涵义是识别所指的根据", "detail": "(1)语言表达式不仅指称客观的对象，而且表达一定的意思\n(2)涵义是识别、确定其所指的根据、标准和手段\n(3)作者将弗雷格区分涵义和所指的意义理论叫做精致的指称论"}, {"id": "2-3-1-2", "name": "代表人物", "category": 4, "symbolSize": 22, "desc": "弗雷格为精致的指称论的创立者", "detail": "(1)弗雷格区分了语言表达式的涵义和所指\n(2)在此基础上可同时处理涵义和所指，建立内涵逻辑"}]}, {"id": "2-3-2", "name": "内涵", "category": 3, "symbolSize": 26, "desc": "语言表达式所表达的意思，是从可能世界到外延的函项", "children": [{"id": "2-3-2-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "内涵是从可能世界到外延的函项，决定着其外延", "detail": "(1)个体常项的内涵是个体概念，是从可能世界到对象域中特定个体的函项\n(2)属性是谓词的内涵，是从可能世界到该谓词外延的函项\n(3)语句的内涵是命题，即从可能世界到真值的函项\n(4)若两个表达式内涵不同，则外延不同至少是可能的\n(5)非真实事物名称因内涵不同而有不同外延，如孙悟空与福尔摩斯"}]}, {"id": "2-3-3", "name": "外延语境与内涵语境", "category": 3, "symbolSize": 26, "desc": "区分同一替换规则是否适用的两种语言语境", "children": [{"id": "2-3-3-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "外延语境允许等值置换和同一替换，内涵语境不允许", "detail": "(1)外延语境又叫透明的语境，是函项性原则、等值置换规则、同一替换规则适用的语境\n(2)内涵语境又叫晦暗语境，是上述规则不适用的语境\n(3)知道、相信、认识、必然、可能、允许、禁止等提供内涵语境；杀死、见到、拥抱等提供外延语境"}, {"id": "2-3-3-2", "name": "论证依据", "category": 4, "symbolSize": 22, "desc": "通过例3与例4对比说明两种语境的本质区别", "detail": "(1)例3：厄勒克特拉杀死了奥列斯特，奥列斯特是她唯一的哥哥，所以她杀死了她唯一的哥哥——有效的外延语境推理\n(2)例4：任何人都知道晨星是晨星，晨星就是暮星，所以任何人都知道晨星就是暮星——无效的内涵语境推理\n(3)关键在于例4中有人可能不知道晨星和暮星指同一颗星"}]}, {"id": "2-3-4", "name": "内涵逻辑", "category": 3, "symbolSize": 26, "desc": "同时处理语言表达式涵义和所指的形式逻辑系统", "children": [{"id": "2-3-4-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "内涵逻辑须处理外延逻辑能处理的问题并克服其局限", "detail": "(1)在内涵语境中语言表达式以通常的内涵作为外延\n(2)函项性原则可改述为新形式：复合表达式的外延是出现于外延语境的部分表达式的外延加上出现于内涵语境的部分表达式的内涵的函项\n(3)广义内涵逻辑包括模态逻辑、时态逻辑、道义逻辑、认知逻辑、问题逻辑等\n(4)狭义内涵逻辑包括谓词逻辑算子、λ-表达式以及模态或内涵算子"}, {"id": "2-3-4-2", "name": "代表人物", "category": 4, "symbolSize": 22, "desc": "丘奇、蒙塔古、扎尔塔等建立了内涵逻辑系统", "detail": "(1)丘奇建立了LSD系统\n(2)蒙塔古建立了IL系统\n(3)扎尔塔建立了FIL系统"}]}]}, {"id": "2-4", "name": "使用论和自然语言逻辑", "category": 2, "symbolSize": 32, "desc": "探讨使用论、言语行为理论及在此基础上发展的自然语言逻辑", "children": [{"id": "2-4-1", "name": "使用论", "category": 3, "symbolSize": 26, "desc": "一个词的意义就是它在语言中的使用", "children": [{"id": "2-4-1-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "一个词的意义就是它在语言中的使用", "detail": "(1)后期维特根斯坦提倡使用论\n(2)考虑使用语言的环境、使用语言的人以及人的意向对语言表达式意义的影响\n(3)从语言的抽象意义进入到一定语境中表现出的具体意义和社会意义"}, {"id": "2-4-1-2", "name": "代表人物", "category": 4, "symbolSize": 22, "desc": "后期维特根斯坦提倡使用论", "detail": "(1)后期维特根斯坦提出使用论\n(2)在此基础上提出了著名的语言游戏说"}]}, {"id": "2-4-2", "name": "语言游戏说", "category": 3, "symbolSize": 26, "desc": "语言的述说是一种活动或生活形式的一部分", "children": [{"id": "2-4-2-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "语言和行动组成的整体叫做语言游戏", "detail": "(1)把语言和与语言交织在一起的那些行动组成的整体叫做语言游戏\n(2)语言的述说乃是一种活动\n(3)是生活形式的一个部分\n(4)在使用论的基础上提出"}, {"id": "2-4-2-2", "name": "代表人物", "category": 4, "symbolSize": 22, "desc": "维特根斯坦提出语言游戏说", "detail": "(1)后期维特根斯坦提出语言游戏说\n(2)意在突出语言的述说是一种活动或生活形式的一部分"}]}, {"id": "2-4-3", "name": "言语行为理论", "category": 3, "symbolSize": 26, "desc": "说话就是做事，言语行为是意义和交际的最小单位", "children": [{"id": "2-4-3-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "说话就是做事，言语行为在本质上是社会行为", "detail": "(1)言语行为是意义和人类交际的最小单位\n(2)人们使用语言不仅述事说理、描情状物，更重要的是意图改变或影响对方的信念、态度和行为\n(3)说话、作文也是在从事一种行为，目的在于取得特定的效果"}, {"id": "2-4-3-2", "name": "代表人物", "category": 4, "symbolSize": 22, "desc": "奥斯汀、塞尔等人发展言语行为理论", "detail": "(1)奥斯汀和塞尔等人发展了言语行为理论\n(2)其核心主张是说话就是做事"}, {"id": "2-4-3-3", "name": "修正版本", "category": 4, "symbolSize": 22, "desc": "在言语行为理论基础上发展出语力逻辑", "detail": "(1)在言语行为理论的基础上，已发展出一种语力逻辑（illocutionary logic）\n(2)语力逻辑是研究言语行为中语力的形式化逻辑理论"}]}, {"id": "2-4-4", "name": "会话涵义学说", "category": 3, "symbolSize": 26, "desc": "把握人们说话时的言外之意和弦外之音", "children": [{"id": "2-4-4-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "会话涵义与语境和说话者意图相关的具体语用意义", "detail": "(1)旨在把握人们说话时的言外之意和弦外之音\n(2)不仅与话语的抽象的一般意义相关，更重要的是与说话时的语境和说话者的意图相关\n(3)与人们的话语的具体意义或语用意义相关"}, {"id": "2-4-4-2", "name": "代表人物", "category": 4, "symbolSize": 22, "desc": "格赖斯发展了会话涵义学说", "detail": "(1)格赖斯发展了会话涵义学说\n(2)该学说旨在把握言外之意和弦外之音"}, {"id": "2-4-4-3", "name": "修正版本", "category": 4, "symbolSize": 22, "desc": "在会话涵义学说基础上正在发展关于语用推理的理论", "detail": "(1)格赖斯会话涵义学说基础上正在发展关于语用推理的理论\n(2)语用推理关注语境和说话者意图对推理的影响"}]}, {"id": "2-4-5", "name": "自然语言逻辑", "category": 3, "symbolSize": 26, "desc": "透过指谓性和交际性研究自然语言推理的逻辑学科", "children": [{"id": "2-4-5-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "透过自然语言的指谓性和交际性研究推理", "detail": "(1)自然语言的指谓性：每一语言单位都要指称或谓述一定的对象\n(2)自然语言的交际性：自然语言是人类所专有的最重要的交际工具\n(3)自然语言具有表达和交际两种职能，交际职能是最重要的职能"}]}, {"id": "2-4-6", "name": "语境", "category": 3, "symbolSize": 26, "desc": "言语交际的具体环境，对表达式意义有重要影响", "children": [{"id": "2-4-6-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "语境分狭义上下文和广义社会历史条件，深刻影响表达式意义", "detail": "(1)狭义语境仅指一个语词、一个句子出现的上下文\n(2)广义语境包括时间、地点、条件、讲话的人、听话的人及交际双方共同具有的背景知识\n(3)语境具有消除多义性、歧义性和模糊性的能力\n(4)自然语言的句子常常依赖语境，离开语境无法确定指称对象\n(5)语境使表达式意义偏离通常抽象意义而产生新的语用意义"}]}]}]}, {"id": "c03", "name": "第三章 关于摹状词和名称的理论", "desc": "正文 · 共4个小节", "isAppendix": false, "children": [{"id": "3-1", "name": "摹状词理论", "category": 2, "symbolSize": 32, "desc": "讨论罗素、斯特劳森和唐奈兰等人对摹状词的不同理论分析", "children": [{"id": "3-1-1", "name": "罗素的摹状词理论", "category": 3, "symbolSize": 26, "desc": "区分专名与摹状词，将摹状词消解为量词和谓词的逻辑组合", "children": [{"id": "3-1-1-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "摹状词是不完全符号，无独立意义，在命题中可被改写消除", "detail": "(1)摹状词不同于专名，不直接指称个体，是\"不完全的符号\"，没有独立的意义，其意义只有在命题的前后关系中才能确定。(2)包含限定摹状词的命题可改写为不含摹状词的命题，只出现量词、联结词、约束变项和谓词变项等要素。(3)摹状词的出现可以消去，不必指称实在或想象中的事物或对象，从而减少本体论承诺。(4)包含摹状词的命题非真即假，当摹状词不具有唯一性时一律为假。(5)存在是命题函项的基本属性，用于专名则不合逻辑句法，说\"a存在\"是无意义的。"}, {"id": "3-1-1-2", "name": "论证依据", "category": 4, "symbolSize": 22, "desc": "通过三个疑难论证摹状词与专名逻辑作用不同的必要性", "detail": "(1)同一替换规则失效：乔治四世想知道司各脱是否是《威弗利》的作者，用\"司各脱\"替换\"《威弗利》的作者\"得到\"乔治四世想知道司各脱是否是司各脱\"，这不成立。(2)排中律失效：\"当今法国国王是秃子\"和\"当今法国国王不是秃子\"可能都假，因为当今法国无国王。(3)存在悖论：\"当今法国国王不存在\"若为真则主词无指称而无意义，若为假则主词有指称而有意义，证明该语句不可能既真又有意义。(4)假定专名有意义即其指、摹状词与专名逻辑作用相同，会导出这三个疑难，故必须区分二者。"}, {"id": "3-1-1-3", "name": "经典诘难", "category": 4, "symbolSize": 22, "desc": "摩尔、斯特劳森、唐奈兰等人从不同角度批评罗素理论", "detail": "(1)斯特劳森批评罗素混淆语句、语句的使用、语句的表达，错误地把语词的意义等同于它的指称。(2)斯特劳森批评罗素混淆指称某个实体和断定该实体存在，没有区分预设和断定。(3)斯特劳森批评罗素错误地认为含摹状词的语句非真即假，忽视了既不真也不假的第三种可能。(4)唐奈兰批评罗素理论充其量只对摹状词的归属性使用成立，对于指称性使用则不成立。"}, {"id": "3-1-1-4", "name": "代表人物", "category": 4, "symbolSize": 22, "desc": "罗素是摹状词理论的创始人，在多个著作中阐述该理论", "detail": "(1)罗素最早在《论指示》(1905)一文中提出摹状词理论的全部基本思想。(2)在《数学原理》(1910-1913)中给出形式化处理，将摹状词纳入逻辑演算系统。(3)在《数理哲学导论》(1919)、《西方哲学史》(1945)等书中多次重述该理论。"}, {"id": "3-1-1-5", "name": "修正版本", "category": 4, "symbolSize": 22, "desc": "希尔伯特、蒯因等人对摹状词无唯一性时的真值有不同处理", "detail": "(1)希尔伯特、贝尔奈斯认为，当摹状词不具有唯一性时，该摹状词不是一个项，因而包含它的那个命题无意义。(2)蒯因、罗塞尔认为，当摹状词不具有唯一性时，它等于一个体变项，指称一个预先固定或临时指定的个体，公式仍有意义且真假有待进一步确定。(3)罗素未区分这些复杂情况，认为包含摹状词的命题非真即假。"}]}, {"id": "3-1-2", "name": "斯特劳森的指称理论", "category": 3, "symbolSize": 26, "desc": "区分语句、使用和表达，强调语境对意义和指称的影响", "children": [{"id": "3-1-2-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "语词的意义不等同于指称，语句的真假依赖于使用场合", "detail": "(1)严格区分语句、语句的使用、语句的表达，并相应区分语词、语词的使用、语词的表达。(2)真假不是语句本身的特征，而是语句使用的特征，不能谈论语句本身的真或假。(3)语词的意义不可能等同于它在特定场合下所指称的对象。(4)意义是使用语词于指称中的一套规则、习惯和约定，是抽象、一般和公共的。(5)有意义的语句除真或假之外还有第三种可能：既不真也不假，以无所指摹状词作主词的句子即如此。"}, {"id": "3-1-2-2", "name": "论证依据", "category": 4, "symbolSize": 22, "desc": "以\"当今法国国王是贤明的\"在不同场合的使用为例论证", "detail": "(1)同一语句可在不同场合被表达：路易十四时期说出、路易十五时期说出、同一时期说出或写出、教师作为例句举出——五次不同表达，三次不同使用。(2)三次不同使用中摹状词\"当今法国国王\"指称不同，语句的真假值也不同。(3)语词\"我\"可由无数人中任一正确使用来指称本人，说\"我\"指称某个特定人物毫无意义。"}, {"id": "3-1-2-3", "name": "经典诘难", "category": 4, "symbolSize": 22, "desc": "唐奈兰指出斯特劳森忽视归属性使用，克里普克也提出异议", "detail": "(1)唐奈兰认为斯特劳森理论注意到指称性使用但走得太远，以致忽视了摹状词的归属性使用。(2)在没有指称对象的情况下，斯特劳森认为说话者没有指称任何东西，但唐奈兰证明即使没有对象满足摹状词也能完成指称。(3)斯特劳森未能解释在对摹状词作归属性使用时没有适合对象的情形下话语也缺乏真值。"}]}, {"id": "3-1-3", "name": "唐奈兰的摹状词用法区分", "category": 3, "symbolSize": 26, "desc": "区分限定摹状词的归属性使用和指称性使用两种用法", "children": [{"id": "3-1-3-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "摹状词有归属性使用和指称性使用，二者预设和真值条件不同", "detail": "(1)归属性使用：说话者述说凡是适合该摹状词的人或物的某件事情，关注对象具有何种性质，对语境依赖较小。(2)指称性使用：说话者用摹状词让听者辨认正在谈论的对象，摹状词作为完成指称的工具，更多依赖特定语境中的特殊意义。(3)二者的区别：关注重点不同（性质vs对象）、预设不同（仅存在预设vs存在+特定对象预设）、预设为假时真值情况不同。"}, {"id": "3-1-3-2", "name": "论证依据", "category": 4, "symbolSize": 22, "desc": "通过\"杀害史密斯的凶手\"与\"饮马丁尼酒的人\"等案例说明", "detail": "(1)\"杀害史密斯先生的凶手简直是疯子\"：不知凶手是谁而归属性使用，将\"疯子\"属性归属于凶手。(2)同一语句在琼斯受审的法庭听证会上说：用摹状词指称琼斯，是指称性使用，即使琼斯并非真凶也能成功指称。(3)\"饮马丁尼酒的人是谁\"：即使杯中装的是白水而非马丁尼酒，也能用该摹状词询问关于特定人的问题。(4)\"她的丈夫对她很亲热\"：即使女士是独身，说话者仍用摹状词指称与她在一起的男士。"}, {"id": "3-1-3-3", "name": "经典诘难", "category": 4, "symbolSize": 22, "desc": "克里普克将归属性与指称性区别转换为说话者指称与语义指称", "detail": "(1)克里普克在《说话者指称和语义指称》中对唐奈兰的观点提出异议，认为唐奈兰没有驳倒斯特劳森特别是罗素的理论。(2)克里普克把指称性使用和归属性使用的区别转换为说话者指称和语义指称的区别，认为后者能说明前者所不能说明的语言现象。"}, {"id": "3-1-3-4", "name": "代表人物", "category": 4, "symbolSize": 22, "desc": "唐奈兰于1966年发表《指称和限定摹状词》正式提出该区分", "detail": "(1)唐奈兰(Donnellan)在《指称和限定摹状词》(1966)中正式区分摹状词的两种用法。(2)斯特劳森在《论指称》(1950)中早已提出类似思想，但未详细展开。(3)克里普克在《说话者指称和语义指称》一文中提出不同观点。"}]}]}, {"id": "3-2", "name": "名称的描述理论", "category": 2, "symbolSize": 32, "desc": "讨论弗雷格、罗素、簇描述理论和自由逻辑对名称意义的分析", "children": [{"id": "3-2-1", "name": "弗雷格的涵义与所指理论", "category": 3, "symbolSize": 26, "desc": "专名有涵义和所指，涵义是所指的呈现方式并决定所指", "children": [{"id": "3-2-1-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "专名表达涵义并命名所指，涵义决定所指", "detail": "(1)专名（词、指号、复合指号、表达式）表达它的涵义，并且命名或指示它的所指，专名的所指就是这个名称命名的对象本身。(2)涵义是所指对象的呈现方式，即对所指对象的描述方式，可用一个能唯一识别其所指的限定摹状词表示。(3)同一对象可用不同的摹状词表示，允许对同一专名的涵义做不同的理解。(4)涵义决定所指：一个表达式只有表达了某种涵义才能指称某种对象；表达式究竟代表哪个对象取决于该对象是否具有该涵义所描述的特征。(5)一个表达式有涵义与其是否有所指无关，存在有涵义却无所指的专名。"}, {"id": "3-2-1-2", "name": "论证依据", "category": 4, "symbolSize": 22, "desc": "通过\"a=a\"与\"a=b\"认知价值不同及晨星暮星等例证说明", "detail": "(1)\"a=a\"与\"a=b\"具有不同的认知价值，因为\"a\"和\"b\"虽有相同所指但涵义不同。(2)三角形中AF与BD的交点和BD与CE的交点，涵义不同但所指相同。(3)晨星与暮星涵义不同但所指相同。(4)亚里士多德可理解为\"柏拉图的学生\"或\"亚历山大的老师\"或\"《形而上学》的作者\"等，同一专名可有不同涵义。"}, {"id": "3-2-1-3", "name": "经典诘难", "category": 4, "symbolSize": 22, "desc": "弗雷格理论存在涵义不明确、封闭意义论、专名概念词混淆等问题", "detail": "(1)弗雷格从未说清楚名称的涵义究竟是什么：涵义是客观的面孔允许不同理解，可能变成纯主观的东西；与名称联系的摹状词很多，无法确定是单个缩写还是全体缩写。(2)涵义决定所指但不说清涵义来源，可能导致内在封闭的意义论：语言框架事先制定意义，然后去解释外部世界。(3)专名是语言的终极构成要素，但涵义可用包含概念词的摹状词来刻画，专名成了比概念词更复杂的语词，专名与概念词的区分不再成立。"}, {"id": "3-2-1-4", "name": "代表人物", "category": 4, "symbolSize": 22, "desc": "弗雷格首先明确区分专名的涵义与所指", "detail": "(1)弗雷格从思考\"a=a\"和\"a=b\"为何具有不同认知价值开始，在《论涵义和所指》中明确区分了专名的涵义与所指。(2)弗雷格将数学中的函数概念引入哲学和逻辑，把概念词视为函数，其值总是一个真值。"}]}, {"id": "3-2-2", "name": "罗素的专名理论", "category": 3, "symbolSize": 26, "desc": "区分逻辑专名与普通专名，普通专名是伪装的或缩略的摹状词", "children": [{"id": "3-2-2-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "逻辑专名无涵义必有所指，普通专名实为伪装的摹状词", "detail": "(1)专名和摹状词有严格区别：知识基础不同（亲知vs描述）、语义结构不同（简单符号vs不完全符号）、含摹状词的命题与用专名替代的命题不同。(2)逻辑专名须满足三个条件：没有涵义、必有所指、说话者亲知其所指。(3)真正的逻辑专名仅是一些像\"这\"或\"那\"的纯粹指示词。(4)任何普通专名如\"苏格拉底\"实际上都不是专名，而是伪装的或缩略的摹状词。(5)普通专名是不完全符号，不直接指称个体，不具有独立意义，只在逻辑专名处获得派生意义。"}, {"id": "3-2-2-2", "name": "论证依据", "category": 4, "symbolSize": 22, "desc": "通过亲知知识论和恒真命题函项\"x=x\"的代入测试论证", "detail": "(1)知识分为亲知的知识和描述的知识，专名基于亲知知识，摹状词基于描述知识。(2)\"x=x\"中代入专名必得真命题，代入摹状词可能为假，因为摹状词摹状没有的东西时恒真命题函项可能变成假的。(3)说\"这是白的\"时，\"这\"是逻辑专名，指称当下可亲知的感觉对象，不是粉笔。(4)我们并未亲知苏格拉底其人，关于他的知识从百科全书查得，所以\"苏格拉底\"不是专名而是摹状词。"}, {"id": "3-2-2-3", "name": "代表人物", "category": 4, "symbolSize": 22, "desc": "罗素在摹状词理论框架内研究专名，继承并突破弗雷格", "detail": "(1)罗素对弗雷格观点既有继承又有突破，在摹状词理论框架内研究专名。(2)罗素的专名理论导致取消亚里士多德的第一实体：一切个别具体事物被归结为感觉材料的逻辑构造。(3)整个世界不过基于感觉材料之上的逻辑构造。"}]}, {"id": "3-2-3", "name": "簇描述理论", "category": 3, "symbolSize": 26, "desc": "名称的涵义由一簇而非一个摹状词构成，由维特根斯坦等人发展", "children": [{"id": "3-2-3-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "名称涵义是一组或一簇限定摹状词，不要求满足全部摹状词", "detail": "(1)维特根斯坦认为名称是伪装的摹状词，但不是单个限定摹状词，而是一组或一簇限定摹状词，名称可同义地定义为一簇摹状词。(2)塞尔指出名称涵义是一簇摹状词，但一个对象成为该名称的所指，不需满足该家族中所有摹状词，只要满足其中足够数量的或大多数的摹状词即可。(3)弗雷格罗素选择了单个摹状词方案，维特根斯坦选择了全体摹状词合取方案，塞尔选择了不确定子集方案，使涵义与摹状词保持松散联系。"}, {"id": "3-2-3-2", "name": "经典诘难", "category": 4, "symbolSize": 22, "desc": "克里普克论证一簇摹状词仍可能只是对象的偶然特性", "detail": "(1)克里普克指出一簇摹状词完全可能只是摹写了对象的偶然特性，并不构成相应专名的涵义，不能决定专名的所指。(2)两个所指即使满足几乎完全相同的两组摹状词也仍可能是不同的个体（如孪生姐妹）。(3)两个所指即使满足几乎完全不同的两组摹状词也仍可是同一个体（如纳粹战犯改名整容后）。"}, {"id": "3-2-3-3", "name": "代表人物", "category": 4, "symbolSize": 22, "desc": "维特根斯坦、丘奇、塞尔等人修正和发展了描述理论", "detail": "(1)维特根斯坦提出名称是一簇摹状词，由全簇摹状词决定所指。(2)丘奇参与修正和发展摹状词理论。(3)塞尔提出\"足够数量或大多数\"标准，使名称涵义与摹状词保持松散联系，此松散性源于专名的指称功能。"}]}, {"id": "3-2-4", "name": "自由逻辑", "category": 3, "symbolSize": 26, "desc": "摆脱存在预设的逻辑，允许空词项以逻辑主词身份出现", "children": [{"id": "3-2-4-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "允许空词项在形式系统中作为真正的逻辑主词出现", "detail": "(1)一阶逻辑有两个存在预设：个体域非空且量词有存在涵义；每一词项都有所指。自由逻辑摆脱这两条假设。(2)允许空词项在形式系统中以真正的逻辑主词身份出现，不必将其解释为摹状词。(3)对空词项有两种理解：一指称不存在的事物（外域自由逻辑），二根本不指称什么（无所指自由逻辑）。(4)自由逻辑的量词只在内个体域上量化，对空词项不能使用存在概括规则，需附加E!a条件。"}, {"id": "3-2-4-2", "name": "论证依据", "category": 4, "symbolSize": 22, "desc": "罗素摹状词处理空词项的方案繁琐且违反常识和直观", "detail": "(1)按罗素摹状词理论，\"孙悟空会七十二变\"和\"孙悟空＝孙悟空\"都是假的。(2)但按常识，前者为真后者为假，罗素的方案繁琐复杂且违反常识和直观。(3)自由逻辑系统L*采纳IE*和II*两条初始推理规则：即使非实存之物也自身等同；若a、b相等则a有什么性质b也有什么性质。(4)L*具有两个优点：对空词项的解释大大简化；承认存在是性质或谓词，使表达个体存在的语句符合逻辑句法。"}, {"id": "3-2-4-3", "name": "代表人物", "category": 4, "symbolSize": 22, "desc": "列布朗克、赫尔帕林等构造自由逻辑系统", "detail": "(1)斯蒂芬·里德区分了外域自由逻辑和无所指自由逻辑。(2)列布朗克和赫尔帕林构造自由逻辑系统L*。(3)本西文加(Bencivenga)和斯科特·莱曼(Scott Lehmann)等对自由逻辑有进一步发展，详见《哲学逻辑手册》相关章节。"}]}]}, {"id": "3-3", "name": "名称的因果历史理论", "category": 2, "symbolSize": 32, "desc": "讨论克里普克提出的严格指示词、因果命名链条和本质主义", "children": [{"id": "3-3-1", "name": "克里普克对描述理论的批评", "category": 3, "symbolSize": 26, "desc": "专名不是伪装的摹状词，描述理论的两个基本点都不能成立", "children": [{"id": "3-3-1-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "专名不与摹状词同义，摹状词也不决定专名的所指", "detail": "(1)专名并不是与一个或一组摹状词同义的，因为摹状词并不表达对象的必然属性或本质，如亚里士多德可以不是柏拉图的学生。(2)摹状词并不决定专名的所指：一个不满足摹状词的对象不一定不是专名的所指；一个满足相应摹状词的对象不一定是专名的所指。(3)描述理论忽视了指称的社会历史性，似乎一个人关在房间里就能决定一个名称的所指。(4)弗雷格罗素等人错误的根源在于不知道专名是严格指示词而摹状词一般是非严格指示词。"}, {"id": "3-3-1-2", "name": "论证依据", "category": 4, "symbolSize": 22, "desc": "以模态论证、尼克松案例和哥德尔施米特案例说明", "detail": "(1)模态论证：\"必然地9>7\"和\"行星的数目=9\"出发，用摹状词\"行星的数目\"替代\"9\"得假命题\"必然地行星的数目>7\"，证明专名与摹状词在模态语境逻辑作用不同。(2)尼克松可能未当选或连任美国总统，但他仍是尼克松——不满足摹状词的对象仍是专名所指。(3)汉弗莱可能当选第37届美国总统——满足摹状词的对象不一定是专名所指。(4)哥德尔的朋友施米特可能实际证明了不完全性定理——满足摹状词\"证明不完全性的聪明人\"的对象不是哥德尔而是施米特。"}]}, {"id": "3-3-2", "name": "严格指示词与非严格指示词", "category": 3, "symbolSize": 26, "desc": "专名是严格指示词在所有可能世界指称同一对象，摹状词不是", "children": [{"id": "3-3-2-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "严格指示词在所有可能世界指称同一对象，专名是严格指示词", "detail": "(1)如果一个指示词在所有可能世界中都指示同一个对象，就是严格的指示词；否则是非严格的或偶然的指示词。(2)专名在所有可能世界指称同一对象，是严格指示词；摹状词在不同可能世界可能指称不同对象，是非严格指示词。(3)直观检验标准：如果事实上的D可能不是D，则是非严格指示词；如果事实上的D必然是D，则是严格指示词。(4)摹状词之所以是非严格指示词，原因在于它有涵义；要保持指称的严格性就必须没有涵义。"}, {"id": "3-3-2-2", "name": "论证依据", "category": 4, "symbolSize": 22, "desc": "通过\"美国第37届总统\"与\"尼克松\"对比等案例论证", "detail": "(1)美国第37届总统可能没有当过美国第37届总统，而尼克松不可能不是尼克松。(2)因此\"美国第37届总统\"是非严格指示词，\"尼克松\"是严格指示词。(3)专名在所有可能世界都指称同一个对象，而摹状词在不同的可能世界中可能指称不同的对象。(4)在模态语境中不能用摹状词替换专名，否则会由真命题得出假命题。"}]}, {"id": "3-3-3", "name": "因果历史命名链条", "category": 3, "symbolSize": 26, "desc": "专名的所指通过社会共同体中一环一环传播的因果历史链条确定", "children": [{"id": "3-3-3-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "专名所指通过命名行为和传播链条在社会共同体中确定", "detail": "(1)婴儿出生后，其父母给其命名，通过各类谈论该名字在社会共同体中一环一环传播开来，像链条一样。(2)一旦在这个链条某处的人使用了这个名字，他实际上就已根据这个链条确定了该名字的所指。(3)重要的问题不是名字的说出者如何考虑他知道所指的方式，而是实际传递链条的建立。(4)名字接受者用该名字所指称的对象必须相当于他由以知道该名字的人所指称的对象。(5)一般说来，所指不仅依赖于说话者自己怎样想，还依赖于社会中其他人及该专名传到我们这里的那段历史等因素。"}, {"id": "3-3-3-2", "name": "代表人物", "category": 4, "symbolSize": 22, "desc": "克里普克提出该理论，唐奈兰和普特南等人加以补充和发展", "detail": "(1)克里普克从可能世界语义学角度在20世纪60年代末提出因果历史命名理论。(2)唐奈兰在专名问题上对该理论作出过重要贡献。(3)普特南在通名（自然种类词）问题上对该理论作出过重要贡献。"}]}, {"id": "3-3-4", "name": "自然种类词的本质主义", "category": 3, "symbolSize": 26, "desc": "通名也是严格指示词，其所指由内在结构这一本质属性决定", "children": [{"id": "3-3-4-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "自然种类词是严格指示词，内在结构构成该类事物的本质", "detail": "(1)通名也是严格指示词，在一切可能世界中都指称同样的对象。(2)通名与对象的联系也是通过一个类似于命名式的活动确定，且可沿传递链条传递下去。(3)确定通名所指的是该种类跨一切可能世界恒定不变的本质属性，即该种类所具有的内部结构。(4)水的本质属性是H2O，黄金的本质属性是原子序数为79。(5)一个或一类事物只要具有其本质，即使失掉许多其他特性也仍是该类事物；失去其本质则不再是该类事物。"}, {"id": "3-3-4-2", "name": "论证依据", "category": 4, "symbolSize": 22, "desc": "通过水与铁、虎与鸟交换外部特征的极端可能世界论证", "detail": "(1)因果起源说（针对个别事物）：一个事物的因果起源决定着它的本质和自身同一性，亚氏的受精卵构成其本质。(2)内在结构说（针对自然种类）：水的分子结构H2O是水的本质，黄金的原子序数79是黄金的本质。(3)极端例子：可能世界中有呈灰白色、坚硬、有延展性但具有H2O内在结构的物质应称之为水；有无色透明液体但具有Fe内在结构的应称之为铁。(4)具有虎全部外显特征但具有鸟的内在结构的动物应称之为鸟而非虎。"}, {"id": "3-3-4-3", "name": "经典诘难", "category": 4, "symbolSize": 22, "desc": "作者指出克里普克本质主义混淆逻辑必然性与事实必然性", "detail": "(1)作者认为克里普克的极端例子十分荒谬。(2)克里普克把本质特性等同于极强的逻辑必然性，在现实世界中许多话语都不再成立。(3)克里普克完全忽视甚至排除了本质属性与非本质属性及外显特征的内在联系，但本质属性决定和派生其他属性。(4)非本质属性作为整体不是可有可无的，克里普克设想本质结构不变而非本质属性全部改变的情况绝不可能发生。(5)在许多情况下本质属性较之非本质属性具有小得多的重要性，如纸张的化学结构差异和桌子的材料差异。"}]}]}, {"id": "3-4", "name": "名称的新描述理论", "category": 2, "symbolSize": 32, "desc": "作者在批判因果历史理论基础上提出整合描述论与因果论的新理论", "children": [{"id": "3-4-1", "name": "对严格指示词区分的批评", "category": 3, "symbolSize": 26, "desc": "名称具有涵义，涵义从因果历史链条上获得，非无涵义的严格指示词", "children": [{"id": "3-4-1-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "专名和通名都不是无任何涵义的严格指示词", "detail": "(1)无论是专名还是通名，都不是无任何涵义的严格指示词。(2)我们从因果历史链条上得到的首先不是名字的所指，而是它的涵义，即它所指称的对象所具有的一系列特性。(3)以\"苏格拉底\"为例，从因果历史链条上知道其家庭出身、生卒年月、生平事迹等，基于这一切了解才识别出苏格拉底的所指。(4)重名同名现象中，人们主要依据对不同名称的不同涵义的把握来区分其所指。"}, {"id": "3-4-1-2", "name": "论证依据", "category": 4, "symbolSize": 22, "desc": "以名称涵义的历史演变过程和重名现象为证据", "detail": "(1)客观事物不断发展，人的认识不断发展，反映到名称涵义上使之有从贫乏到丰富、由浅显到深刻的过程。(2)\"亚里士多德\"刚出生时涵义最为贫乏，仅\"诞生在斯塔吉拉的由某人共同生育的那个孩子\"等；随亚氏本人不断成熟，涵义不断增多，趋于丰富的过程甚至不会完结。(3)克里普克的基本假定——对象在形成之初就有确定不变的本质、名称出现之时就有确定不变的意义——是错误的。(4)把握名称的全部涵义在人们具体社会实践活动中既无必要也不可能。"}]}, {"id": "3-4-2", "name": "对克里普克本质主义的批评", "category": 3, "symbolSize": 26, "desc": "克里普克本质主义将导致荒谬后果，应回到亚里士多德的本质主义", "children": [{"id": "3-4-2-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "克里普克混淆逻辑必然性与事实必然性，忽视本质与非本质属性的内在联系", "detail": "(1)克里普克把本质特性等同于逻辑必然性，这种必然性非常强，许多现实世界话语如\"人必有一死\"都不再成立。(2)日常话语中事物的本质属性是较弱的事实必然特性，基本只考虑现实世界的情形。(3)克里普克完全忽视甚至排除了本质属性与非本质属性及外显特征的内在联系，认为前者不支配后者的观点完全错误。(4)本质属性决定和派生其他属性，非本质属性作为整体不是可有可无的，克里普克设想的那种非本质属性全部改变的情况绝不可能发生。(5)应抛弃克里普克的本质主义，回到亚里士多德的本质主义传统，从而摧垮严格与非严格指示词的区分。"}, {"id": "3-4-2-2", "name": "论证依据", "category": 4, "symbolSize": 22, "desc": "以人的本质属性派生其他特征和纸张桌子的化学结构为例", "detail": "(1)人的本质属性是能够制造和使用劳动工具的动物，由此派生手足功能分离（两足直立）、使用语言交流思维（理性动物）、建立群体和社会（社会性动物）等。(2)各类纸张在化学结构上的差异并不妨碍我们将其称之为纸。(3)桌子无论由木头、纤维板还是金属做成，都不妨碍我们将其称之为桌子。(4)本质属性的重要性在于它决定非本质属性的存在，本质属性的存在完全依赖于它和其他属性之间的因果联系。"}]}, {"id": "3-4-3", "name": "新描述理论的五个要点", "category": 3, "symbolSize": 26, "desc": "作者整合描述理论和因果历史理论优点后提出的新名称理论", "children": [{"id": "3-4-3-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "任何名称都有涵义和所指，涵义决定所指，涵义是一簇描述", "detail": "(1)任何名称都有内涵和外延，有内涵无外延或者有外延无内涵的名称都是不存在的。空名也具有内涵和外延，只不过其外延是可能世界中的对象。(2)名称的涵义决定它的所指，涵义是确定所指的根据、标准和手段。在名称、涵义、所指三者中真正重要的是涵义。(3)构成名称涵义的是一组或一簇描述，而不是一个描述。(4)名称的涵义是人们从社会交际活动所构成的因果历史链条上获得的。(5)名称的涵义不是一次性获得的，而是在一系列社会交际活动中逐渐获得的，名称的涵义常常有一个历史演变过程。"}, {"id": "3-4-3-2", "name": "论证依据", "category": 4, "symbolSize": 22, "desc": "以因果历史理论的优点修正描述论，以社会交际说明涵义来源", "detail": "(1)因果历史理论的重大贡献：第一次明确揭示语言和社会的联系，使社会因素在决定所指中起决定作用，识别名称所指的活动是社会共同体的交际活动。(2)描述理论同样具有重大缺陷：只指出任何名称都有涵义，却未能揭示名称的涵义之来源。(3)某人在特定意义上使用一个词能否成为该名称的涵义取决于社会共同体是否接受此用法，不被接受则很快被遗忘，被接受则成为涵义的一部分，且常被修改或增补。(4)两个名称只要具有相同的涵义必指称同样的对象，这解释了改名换名现象。"}, {"id": "3-4-3-3", "name": "代表人物", "category": 4, "symbolSize": 22, "desc": "作者（陈波）主张新描述理论，综合弗雷格、罗素和克里普克", "detail": "(1)作者（陈波）比较赞成弗雷格、罗素等人所主张的描述理论，不太赞成克里普克、普特南等人所主张的因果历史理论。(2)在吸收因果历史理论和描述理论积极成果的基础上提出新描述理论。(3)新描述理论的五个要点统一了描述理论和因果历史理论的关键洞见：涵义来自社会因果历史链条，涵义作为一簇描述决定所指。"}]}]}]}, {"id": "c04", "name": "第四章 \"是\"的逻辑哲学分析", "desc": "正文 · 共9个小节", "isAppendix": false, "children": [{"id": "4-1", "name": "存在理论", "category": 2, "symbolSize": 32, "desc": "探讨系词'是'作为命题第二要素表示'存在'的意义及其引发的逻辑哲学争论。", "children": [{"id": "4-1-1", "name": "本体论", "category": 3, "symbolSize": 26, "desc": "以'是'为词源，研究存在之作为存在的学问，是西方哲学的核心分支。", "children": [{"id": "4-1-1-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "存在是哲学的根本问题，一切事物必须先'是'然后才能'是其所是'。", "detail": "(1)ontology源自希腊系词to on的中性现在分词ontos(存在，存在物)。(2)亚里士多德确立存在论内容：以本体为中心的一切存在形式、存在之作为存在的本质属性和原则。(3)海德格尔前后期以两种方式追问存在：前期追问存在在时间状态中的意义，后期追问存在在无蔽状态中的意义。"}, {"id": "4-1-1-2", "name": "代表人物", "category": 4, "symbolSize": 22, "desc": "巴门尼德、亚里士多德、海德格尔为本体论的主要代表人物。", "detail": "(1)巴门尼德首次将'存在'确立为哲学关键概念，源自希腊系词的中性现在分词。(2)亚里士多德将ontology系统化为以本体为中心的普遍科学，指出存在的各种涵义都指向一个中心点即本体。(3)海德格尔毕终身之力追问存在意义，其双重主题构成其哲学核心。"}]}, {"id": "4-1-2", "name": "安瑟伦本体论证明", "category": 3, "symbolSize": 26, "desc": "中世纪安瑟伦从上帝观念推出上帝存在的著名论证，笛卡尔几乎完全照搬。", "children": [{"id": "4-1-2-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "上帝是最伟大的实体，既存在于理智中也存在于现实中。", "detail": "(1)我们心中有一个上帝的观念，确信它是最伟大的实体，无法设想任何比它更伟大的东西。(2)假定它仅仅存在于理智中，就能设想存在于现实中更伟大，因此它必须也存在于现实中。(3)笛卡尔几乎完全照搬了这个证明。"}, {"id": "4-1-2-2", "name": "论证依据", "category": 4, "symbolSize": 22, "desc": "证明可归结为三段论形式：上帝具有一切性质，存在是性质，故上帝存在。", "detail": "(1)前提(1)：上帝是无限完满的，即上帝具有一切性质。(2)前提(2)：存在是性质之一种。(3)结论：所以，上帝具有存在性，即上帝存在。"}, {"id": "4-1-2-3", "name": "经典诘难", "category": 4, "symbolSize": 22, "desc": "批判矛头指向前提(2)，引发'存在究竟是不是谓词'的长期争论。", "detail": "(1)甚至在经院哲学家内部也遇到反对意见。(2)人们大都认为存在并不是性质(谓词)。(3)在现代分析哲学中，摩尔、罗素、蒯因、斯特劳森、达米特等人都曾著文讨论。"}, {"id": "4-1-2-4", "name": "代表人物", "category": 4, "symbolSize": 22, "desc": "安瑟伦首创该证明，笛卡尔加以继承和发展。", "detail": "(1)安瑟伦：欧洲中世纪哲学家，最初提出关于上帝存在的本体论证明。(2)笛卡尔：17世纪法国哲学家，几乎完全照搬了安瑟伦的证明。"}]}, {"id": "4-1-3", "name": "存在非谓词论", "category": 3, "symbolSize": 26, "desc": "主张'存在'不是逻辑谓词，不能给主词增添新内容的否定性观点。", "children": [{"id": "4-1-3-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "'存在'不是逻辑谓词，说某物存在并不给主词增添新内容。", "detail": "(1)'存在'虽在表面上与性质相近，实际上却非真正的性质。(2)在一阶逻辑中可将包含'存在'的语句改述为不包含'存在'但起同样作用的语句。(3)康德以想象中一百元与口袋中一百元的区别说明不能从观念推出存在。"}, {"id": "4-1-3-2", "name": "论证依据", "category": 4, "symbolSize": 22, "desc": "罗素以命题函项理论论证存在是命题函项的性质而非个体的性质。", "detail": "(1)罗素在摹状词理论中否认前提(2)，认为存在非个体的性质。(2)'存在实际上是命题函项的一种性质'，'金山存在'意味着有个体满足'……金山'这个复合谓词。(3)存在可以化归为存在量词(∃x)，起量词的作用而非谓词的作用。"}, {"id": "4-1-3-3", "name": "代表人物", "category": 4, "symbolSize": 22, "desc": "康德、弗雷格、罗素、摩尔、斯特劳森、W.涅尔持此否定观点。", "detail": "(1)康德在《纯粹理性批判》中认为'存在'虽表面与性质相近，实际上却非真正的性质。(2)弗雷格和罗素认为存在是命题函项的性质，相当于存在量词。(3)摩尔、斯特劳森、W.涅尔等人也持有类似观点。(4)罗素还进一步否定了前提(1)，指出存在概括会导致怪论。"}]}, {"id": "4-1-4", "name": "罗素摹状词存在论", "category": 3, "symbolSize": 26, "desc": "罗素以摹状词理论处理存在语句，认为'存在'是命题函项的谓词。", "children": [{"id": "4-1-4-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "'存在本质上是命题函项的一个谓词'，表示命题函项的可满足性。", "detail": "(1)命题函项是指带空位的表达式F(…)，空位处可填上个体词。(2)'金山存在'所表明的是有个体满足'……金山'这个复合谓词。(3)'金山不存在'则有两种诠释方式。"}, {"id": "4-1-4-2", "name": "经典诘难", "category": 4, "symbolSize": 22, "desc": "处理办法过于人为，不自然，不符合日常语言直觉。", "detail": "(1)不把名称看作独立的意义单元，而作为伪装的摹状词消除掉。(2)在自然语言中，'存在'完全可以作为谓词修饰个体。(3)弗雷格、罗素的理论不尽如人意之处甚多。"}, {"id": "4-1-4-3", "name": "修正版本", "category": 4, "symbolSize": 22, "desc": "皮尔斯和自由逻辑分别对罗素理论提出了修正方案。", "detail": "(1)皮尔斯从'存在不是谓词'观点中抽象出最低程度表述。(2)自由逻辑直截了当地承认'存在是谓词'。(3)作者本人也持有存在是谓词的观点。"}]}, {"id": "4-1-5", "name": "皮尔斯最低限度表述", "category": 3, "symbolSize": 26, "desc": "皮尔斯从'存在不是谓词'诸观点中抽象出最低限度表述并指出其局限。", "children": [{"id": "4-1-5-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "'存在不是谓词'至少意味着'to exist'产生指称重言式和指称矛盾式。", "detail": "(1)指称重言式：主词通过指称暗示存在，动词'存在'再次肯定存在显得多余，如'这个房间存在着'。(2)指称矛盾式：主词通过指称暗示存在，但动词'不存在'反过来否认存在，如'这个房间不存在'。(3)最低限度表述：动词'to exist'以上述方式产生指称重言式和指称矛盾式。"}, {"id": "4-1-5-2", "name": "论证依据", "category": 4, "symbolSize": 22, "desc": "三种情形下最低限度表述不成立：虚构世界、时间差异、幻觉对象。", "detail": "(1)虚构世界情形：主词指称虚构世界个体，断定其在现实世界存在增添了新内容。(2)时间差异情形：'阿房宫不复存在'中彼时存在不等于此时存在，作出新说明。(3)幻觉对象情形：区分视觉经验层次的存在与空间中的存在，不造成指称矛盾。"}, {"id": "4-1-5-3", "name": "代表人物", "category": 4, "symbolSize": 22, "desc": "英国哲学家大卫·皮尔斯(David Pears)提出该理论。", "detail": "(1)皮尔斯在《存在是谓词吗？》一文中提出该看法。(2)他力图从各种'存在不是谓词'的观点中抽象出一个最低程度表述。(3)其最后结论是：'存在'不是一个一般的谓词，而是一个特殊的谓词。"}]}, {"id": "4-1-6", "name": "作者存在谓词论", "category": 3, "symbolSize": 26, "desc": "作者主张存在是在话语跨越不同可能世界时所使用的一个谓词。", "children": [{"id": "4-1-6-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "'存在'是限界谓词，断定个体存在于某个特定的可能世界之中。", "detail": "(1)'存在'是在话语跨越不同的可能世界时所使用的一个谓词，但'存在'所表示的是个体存在于某个特定的可能世界之中，因此'存在'是限界谓词。(2)自然语言中以'存在'作语法谓词的语句实际上是一个命题函项：a存在于w。(3)任何词项或名称都有涵义和所指，其所指相对于不同的可能世界而言。"}, {"id": "4-1-6-2", "name": "论证依据", "category": 4, "symbolSize": 22, "desc": "日常话语常涉及多个世界，'a存在'断定其存在于某个具体世界，增添新内容。", "detail": "(1)日常话语常常涉及多个不同世界：历史现实世界、科学理论世界、神话世界、小说世界等。(2)当说'a存在'时，断定它存在于某个具体世界中，给它增添了新内容。(3)说'a不存在'也不是说词项a没有所指，而是说它的所指不存在于某个特定的世界中。"}, {"id": "4-1-6-3", "name": "经典诘难", "category": 4, "symbolSize": 22, "desc": "若按此说，安瑟伦所证明的只是上帝存在于某个可能世界，不会引发争论。", "detail": "(1)自然语言中'存在'一词常常(并不总是)意味着在现实世界中存在。(2)安瑟伦所要证明的正是'上帝存在于现实的时空中'，这个结论是荒谬的。(3)作者认为安瑟伦和笛卡尔本体论证明的错误在于前提(1)，而不在于前提(2)。"}, {"id": "4-1-6-4", "name": "代表人物", "category": 4, "symbolSize": 22, "desc": "作者本人及自由逻辑学派持存在是谓词的观点。", "detail": "(1)作者陈波持有存在是谓词的立场，具体包括三个观点。(2)新近发展的自由逻辑直截了当地承认'存在是谓词'。(3)此说能与日常语言直觉保持一致，且具有逻辑处理的异常简洁性。"}, {"id": "4-1-6-5", "name": "修正版本", "category": 4, "symbolSize": 22, "desc": "以'上帝能否创造自己举不起来的石头'二难推理驳倒本体论证明的前提(1)。", "detail": "(1)作者认为本体论证明的错误不在前提(2)而在前提(1)，一个个体不可能具有一切性质。(2)著名的二难推理：若上帝能创造自己举不起来的石头，则他不是万能的；若不能创造，也不是万能的。(3)绝对空词项(如'圆的方')在任何可能世界中都没有所指，说其存在的语句恒假。"}]}]}, {"id": "4-2", "name": "外延理论", "category": 2, "symbolSize": 32, "desc": "系词'是'表示S和P之间的外延关系，包括同一、包含于和属于三种情形。", "children": [{"id": "4-2-1", "name": "外延关系三分法", "category": 3, "symbolSize": 26, "desc": "'S是P'中系词表示个体或类之间的同一、包含于或属于三种外延关系。", "children": [{"id": "4-2-1-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "系词'是'在命题中表示S和P之间的外延关系，共有三种情形。", "detail": "(1)同一关系：S是专名，P是摹状词，或S和P表示同一类事物的两种不同特有属性，如'老舍是《四世同堂》的作者'。(2)包含于关系：子类与类之间的关系，对任一x，若x属于S则x属于P，如'人是动物'。(3)属于关系：个体与类之间的属于关系，如'苏格拉底是人'。"}, {"id": "4-2-1-2", "name": "论证依据", "category": 4, "symbolSize": 22, "desc": "传统逻辑和现代谓词演算均建立在对'S是P'作外延性解释的基础上。", "detail": "(1)传统逻辑用欧拉图和文恩图表示S和P之间的外延关系。(2)直言命题中的主词和谓词可以换质、换位、换质位。(3)在大词(P)、小词(S)和中词(M)的外延关系基础上作三段论推理。(4)数理逻辑中的谓词演算在对词项及其关系作外延性理解上与传统逻辑完全一致。"}, {"id": "4-2-1-3", "name": "经典诘难", "category": 4, "symbolSize": 22, "desc": "外延理论不能解释S或P为抽象名称的命题，实体化处理牵强附会。", "detail": "(1)当S或P表示某种性质时，将其'实体化'为具有该性质的事物类，如将'姑娘都是美丽可爱的'解释为姑娘类包含于美丽可爱事物类。(2)当遇到'勇敢是一种品德''大于是一种关系''人生是一首歌'等命题时，外延解释几乎完全行不通。(3)作者认为外延理论实际上只适用于S和P都是实体名称的情形。"}]}, {"id": "4-2-2", "name": "关系命题的外延解释", "category": 3, "symbolSize": 26, "desc": "关系词的外延被定义为有序偶的集合，'是'表示有序偶属于序偶集。", "children": [{"id": "4-2-2-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "在'曹丕和曹植是兄弟'中，'是'表示〈曹丕，曹植〉这个有序偶属于'兄弟'序偶集。", "detail": "(1)关系词的外延被定义为有序偶的集合(或类)。(2)'是'仍起系词的作用，表示特定的序偶属于某个序偶集，并不直接表示关系。(3)二项或多项关系在句子中只能由相应的关系词来表达，'是'的作用在于把具有某种关系的对象与该种关系连接起来。"}]}, {"id": "4-2-3", "name": "概括原则", "category": 3, "symbolSize": 26, "desc": "外延理论基本假定：任一性质都可决定一个类，但其假定太强导致悖论。", "children": [{"id": "4-2-3-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "任一性质都可决定一个类(概括原则)，这是外延理论的基本假定。", "detail": "(1)外延理论有一个基本假定，即任一性质都可决定一个类(概括原则)。(2)这是将外延理论推广到一切语言现象的基础。(3)但该假定太强，罗素证明由此可以导致悖论。"}, {"id": "4-2-3-2", "name": "经典诘难", "category": 4, "symbolSize": 22, "desc": "罗素悖论：一切不以自身为元素的类所构成的类导致矛盾。", "detail": "(1)将一切不以自身为元素的类收集起来构成一个类z。(2)若z不以自身为元素，则据z的定义z应以自身为元素；若z以自身为元素，同样据z的定义z不应以自身为元素。(3)导致z属于自身当且仅当z不属于自身的悖论。"}, {"id": "4-2-3-3", "name": "代表人物", "category": 4, "symbolSize": 22, "desc": "罗素发现该悖论并推动公理集合论对概括原则的修改。", "detail": "(1)罗素证明了概括原则可以导致悖论。(2)公理集合论中已将概括原则修改为：在一个已形成的类中，由任意性质可以决定一个类。(3)在采用修改过的概括规则的集合论中，没有发现悖论。"}]}, {"id": "4-2-4", "name": "直谓与非直谓性质", "category": 3, "symbolSize": 26, "desc": "性质分为直谓和非直谓两种，非直谓性质通过对象所在总体叙说该对象。", "children": [{"id": "4-2-4-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "非直谓性质通过一对象所在的总体来叙说该对象，可能不决定一个类。", "detail": "(1)非直谓性质是通过一对象所在的总体来叙说该对象的性质，如'小王是所有在座的人中个头最高的'、'一切集合所组成的集合'。(2)直谓性质是不凭借对象所在总体来叙说该对象的性质，如'树叶是绿色的'、'这个苹果是红色的'。(3)直谓的性质都决定一个类，但至少有些非直谓性质并不决定一个类，否则将导致悖论。"}]}]}, {"id": "4-3", "name": "内涵理论", "category": 2, "symbolSize": 32, "desc": "从内涵角度分析S和P，系词'是'表示词项间的内涵关系，比外延理论更具普适性。", "children": [{"id": "4-3-1", "name": "义素分析法", "category": 3, "symbolSize": 26, "desc": "凯茨和福多发展的语义分析方法，将义项分析为由义素组合而成。", "children": [{"id": "4-3-1-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "义项可分析为一些最基本的语义单位——义素的组合。", "detail": "(1)义项是与语词大致相应的语义单位，单义词就是一个义项，多义词包括若干个义项。(2)义项可分析为由最基本的语义单位——义素组合而成。(3)例如'男人'=[+人+男性+成年]，'单身汉'=[+人+男性+成年+未婚]。"}, {"id": "4-3-1-2", "name": "代表人物", "category": 4, "symbolSize": 22, "desc": "语言学家J.J.凯茨和J.A.福多系统发展了义素分析法。", "detail": "(1)凯茨(J.J.Katz)和福多(J.A.Fodor)是义素分析法的系统发展者。(2)他们在现代语义学中用'+''-'表示某个义素的'有''无'。(3)义素分析法为'是'的内涵解释提供了基本分析工具。"}]}, {"id": "4-3-2", "name": "同义关系与定义", "category": 3, "symbolSize": 26, "desc": "两个词项具有基本相同义素时构成同义关系，'是'揭示两者同义。", "children": [{"id": "4-3-2-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "系词'是'在定义中揭示两个词项之间的同义关系。", "detail": "(1)两个词项具有完全相同或基本相同的义素，则具有同义关系，包括等义关系和近义关系。(2)以同义词作主项和谓项的'S是P'，其中的'是'表示S和P的同义关系，如'姥姥就是外婆'。(3)在定义中，系词'是'揭示两个词项之间的同义关系。"}]}, {"id": "4-3-3", "name": "上下义关系", "category": 3, "symbolSize": 26, "desc": "义素多的词项为下义词，义素少的为上义词，'是'表达上下义关系。", "children": [{"id": "4-3-3-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "词项的上下义关系通常用'S是P'形式的命题表达。", "detail": "(1)两个词项，若一个的义素多于另一个，则它们具有上下义关系，义素多的叫下义词，义素少的叫上义词。(2)上下义关系通常用'S是P'形式的命题表达，例如'单身汉是男人'、'勇敢是一种品德'、'红是一种颜色'。(3)从外延看，有上下义关系的词项之间具有属种关系，上义词外延较大。"}]}, {"id": "4-3-4", "name": "反义关系", "category": 3, "symbolSize": 26, "desc": "包含相反义素的词项互为反义词，包括矛盾对立、相对对立和两极对立。", "children": [{"id": "4-3-4-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "反义关系用'S不是P'的句式表达，包括三种对立情形。", "detail": "(1)矛盾对立：如'静'与'动'。(2)相对对立：如'父'与'子'，'原因'和'结果'。(3)两极对立：如'轻'与'重'，'大'与'小'。(4)反义关系可以用'S不是P'的句式表达，例如'鲸不是鱼'，'真理不是口袋中现成的铸币'。"}]}, {"id": "4-3-5", "name": "语义场理论", "category": 3, "symbolSize": 26, "desc": "属义素相同的词项集合构成语义场，汉语有五个最基本语义场。", "children": [{"id": "4-3-5-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "属义素相同的词项集合构成语义场，同一义场内可有反义、同义和并列关系。", "detail": "(1)属义素相同的各个词项的集合构成一个语义场，如星体:{恒星，行星，卫星，彗星……}。(2)汉语有五个最基本语义场：实体义场、表述义场、时间义场、空间义场、数量义场。(3)同一义场中的词项根据种义素的不同可有三种关系：反义关系、同义关系和并列关系。"}]}]}, {"id": "4-4", "name": "同一理论", "category": 2, "symbolSize": 32, "desc": "中世纪逻辑学理论，认为系词'是'断定主词和谓词代表同样的东西。", "children": [{"id": "4-4-1", "name": "范畴词与助范畴词", "category": 3, "symbolSize": 26, "desc": "中世纪逻辑学家将命题成分区分为范畴词(有独立意谓)和助范畴词(表命题形式)。", "children": [{"id": "4-4-1-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "范畴词有确定意谓和指代，可作主谓词；助范畴词无独立意谓，表命题形式。", "detail": "(1)范畴词具有确定的意谓和指代，能够用作直言命题的主词或谓词，如'人'、'动物'。(2)助范畴词没有确定的意谓和指代，只有与范畴词相配合才能一起表示事物的数量、范围、方式等，不能作主词和谓词。(3)中世纪逻辑学家讨论了50多个助范畴词，分为修饰主词的、修饰谓词的和修饰主谓联系方式的三类。"}, {"id": "4-4-1-2", "name": "代表人物", "category": 4, "symbolSize": 22, "desc": "中世纪逻辑学家萨克森的阿尔伯特和布里丹是该理论的主要代表。", "detail": "(1)萨克森的阿尔伯特指出系词'是'意谓着主词和谓词代表相同的东西。(2)布里丹指出对于肯定的直言命题的真来说，其必要条件是主词和谓词代表同一东西或同一些东西。(3)同一理论实际上被14世纪的逻辑学家们普遍接受。"}]}, {"id": "4-4-2", "name": "同一理论的命题解释", "category": 3, "symbolSize": 26, "desc": "系词'是'本质上是一个存在量词，表示主词和谓词代表同样的个体。", "children": [{"id": "4-4-2-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "系词'是'本质上是一个存在量词，使变元受约束后命题才成立。", "detail": "(1)一个直言命题断定了由它的词项所意谓的一个或多个实例。(2)没有系词连接，仅词项加在一起只是带自由变元的表达式。(3)系词'是'本质上是一个存在量词，约束变元后使之变成一个命题。(4)'有些S是P'意谓着存在个体x，词项S和P都指代x。"}, {"id": "4-4-2-2", "name": "论证依据", "category": 4, "symbolSize": 22, "desc": "'S是P'为合取：有x使S、P指x，有f、g使S意谓f、P意谓g且f、g属x。", "detail": "(1)存在个体对象x，词项S和P都指代x。(2)存在着属性f，使得词项S意谓f。(3)存在着属性g，使得词项P意谓g。(4)f和g都属于x。"}]}, {"id": "4-4-3", "name": "与现代谓词逻辑的比较", "category": 3, "symbolSize": 26, "desc": "同一理论与现代谓词逻辑在基本点上相通，都找出了独立实存的个体对象。", "children": [{"id": "4-4-3-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "两者都在命题的主谓词之外找出第三种因素——独立实存的个体对象作为逻辑主词。", "detail": "(1)共同之处：在命题的形式上的主词和谓词之外，还找出了第三种因素——逻辑主词，即独立实存的个体对象。(2)差异在于：根据同一理论，词项S和P指称或代表这些个体；根据谓词逻辑，词项S和P则谓述这些个体。(3)作者认为两者的共同之处是主要的，同一理论与现代谓词逻辑在基本点上相通。"}]}]}, {"id": "4-5", "name": "扩大理论", "category": 2, "symbolSize": 32, "desc": "中世纪逻辑学理论，讨论时态和模态因素如何引起词项指代域由小到大的改变。", "children": [{"id": "4-5-1", "name": "时态扩大规则", "category": 3, "symbolSize": 26, "desc": "系词的时态变化引起主词和谓词指代域的扩大，中世纪逻辑学家制定了规则。", "children": [{"id": "4-5-1-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "系词的时态因素会引起命题中词项指代域由小到大的变化。", "detail": "(1)现在时态动词使词项指代目前存在的东西，指代域不发生变化。(2)过去时态动词使它前面词项的指代扩大到现在存在或过去存在的东西。(3)将来时态动词使它前面词项的指代扩大到现在存在或将要存在的东西。"}, {"id": "4-5-1-2", "name": "论证依据", "category": 4, "symbolSize": 22, "desc": "具体规则示例说明了时态扩大的效果。", "detail": "(1)现在时：'克雷拉特(现在)是非洲某国总统'意思是'一个现在叫克雷拉特的人是非洲某国当下的总统'。(2)过去时：'有些白的东西曾是黑的'中主词扩大到'现在是白的或过去是白的东西'。(3)将来时：'所有的儿童将是老人'中主词扩大到代表'现在是儿童或将来是儿童的东西'。"}]}, {"id": "4-5-2", "name": "模态扩大规则", "category": 3, "symbolSize": 26, "desc": "模态词的加入也能引起S和P指代域由小到大的改变。", "children": [{"id": "4-5-2-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "动词'能够是'和模态副词使它前面和后面的词项扩大到指称各种可能存在的东西。", "detail": "(1)动词'能够是'(can be)和副词'可能地''必然地''偶然地'使它前面和后面的词项扩大到指称现在存在、过去存在、将要存在和能够存在的东西。(2)例如，'一个人能够是一名反基督徒'的意思是：'一个现在是或能够是人的东西能够是一名反基督徒'。"}]}, {"id": "4-5-3", "name": "de dicto与de re区分", "category": 3, "symbolSize": 26, "desc": "中世纪逻辑学家首先提出的关于模态词辖域的重要区分。", "children": [{"id": "4-5-3-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "de dicto是关于语句的模态，de re是关于事物的模态，涉及模态词辖域。", "detail": "(1)de dicto('关于语句的')：模态词所修饰的是意义完整的句子或命题函项，如''苏格拉底有死'是必然的'。(2)de re('关于事物的')：将模态词插入句子中间，置于系词或动词之前，如'苏格拉底可能跑步'。(3)扩大理论本质上是de re读法，不是把时态词和模态词当作形成命题的算子，而是作为修饰主谓联系方式的。"}, {"id": "4-5-3-2", "name": "代表人物", "category": 4, "symbolSize": 22, "desc": "中世纪逻辑学家首先提出这一区分，属于现代时态和模态谓词逻辑的讨论范围。", "detail": "(1)de dicto与de re的区分是中世纪逻辑学家首先提出来的。(2)模态命题逻辑处理de dicto模态，但只有模态谓词逻辑才能处理de re模态。(3)扩大理论本质上属于现代时态谓词逻辑和模态谓词逻辑的讨论范围。"}]}]}, {"id": "4-6", "name": "相似理论", "category": 2, "symbolSize": 32, "desc": "系词'是'表示两类不同事物在某一点上相似，用于解释比喻性命题。", "children": [{"id": "4-6-1", "name": "系词'是'的相似解释", "category": 3, "symbolSize": 26, "desc": "在比喻性命题中，系词'是'表示两类外延互不相容的事物具有相似属性或作用。", "children": [{"id": "4-6-1-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "系词'是'表示相似关系，即'S好像P'，'S类似于P'。", "detail": "(1)比喻性'S是P'的'是'既不能用存在理论解释，也不能用外延理论和内涵理论解释。(2)系词'是'表示相似关系，可以是性质上相似(如'儿童是祖国的花朵')，也可以是作用上相似(如'长征是宣言书')，还可以是其他方面相似。(3)上述'S是P'表示两类外延上互不相容的事物有着相似的属性或起着相似的作用。"}, {"id": "4-6-1-2", "name": "论证依据", "category": 4, "symbolSize": 22, "desc": "比喻性'S是P'为合取命题：S指x，P指y，x非y，有f属x、g属y且f似g。", "detail": "(1)存在对象x，S指称或代表x。(2)存在对象y，P指称或代表y。(3)没有对象z，z既是x又是y。(4)存在着某种性质或作用f，f属于x。(5)存在着某种性质或作用g，g属于y。(6)f类似于g。"}]}, {"id": "4-6-2", "name": "比喻命题与逻辑规律", "category": 3, "symbolSize": 26, "desc": "比喻性'S是P'是否服从矛盾律、排中律等通常逻辑规律值得研究。", "children": [{"id": "4-6-2-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "比喻性命题使通常的逻辑规律如矛盾律、排中律在一定程度上失效。", "detail": "(1)'生活是一团麻'与'生活不是一团麻'仅从形式上看是两个互相否定的命题，但作为比喻，两者均可真或均可假。(2)'他不是坏人，也不是不坏的人'把两者都否定了，但话语中并不包含逻辑矛盾。(3)矛盾律、排中律对此类语句失效，逻辑规律的普适性需要重新解释。"}]}, {"id": "4-6-3", "name": "佩雷尔曼新修辞学", "category": 3, "symbolSize": 26, "desc": "佩雷尔曼力求复活亚里士多德传统，重新将逻辑学和修辞学结合起来。", "children": [{"id": "4-6-3-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "回归亚里士多德传统，建立论辩修辞学以处理形式化逻辑不能处理的语言现象。", "detail": "(1)西方逻辑学界出现回归亚里士多德传统的倾向，发展了非形式逻辑、新修辞学等新分支。(2)佩雷尔曼力求复活亚里士多德传统，重新把逻辑学和修辞学结合起来。(3)1959年与人合著《新修辞学：论论辩》，奠定了论辩修辞学的基础；1982年出版《修辞世界》，标志着理论更趋完善。"}, {"id": "4-6-3-2", "name": "代表人物", "category": 4, "symbolSize": 22, "desc": "比利时逻辑学家佩雷尔曼是该领域的代表性人物。", "detail": "(1)佩雷尔曼是比利时逻辑学家，力求复活亚里士多德传统。(2)他重新把逻辑学和修辞学结合起来，建立一套完整的论辩理论。(3)论辩修辞学无论是作为现代修辞学的一个流派，还是作为现代逻辑的一个分支，都得到学术界认可。"}]}]}, {"id": "4-7", "name": "语用理论", "category": 2, "symbolSize": 32, "desc": "在交际语境中，形如'S是S'的句子并非同语反复，而是传达丰富的语用涵义。", "children": [{"id": "4-7-1", "name": "拟重言式", "category": 3, "symbolSize": 26, "desc": "形如'S是S'的句子脱离语境看似重言式，置于交际语境中传达丰富意涵。", "children": [{"id": "4-7-1-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "形如'S是S'的句子在交际语境中不是真正重言式而是拟重言式，产生特殊涵义。", "detail": "(1)脱离交际语境看，'孩子总归是孩子''战争就是战争'等句子是同义反复，不传达意义信息。(2)一旦放回言语交际过程，它们就不再是同义反复，而是传达了丰富的意涵。(3)'孩子总归是孩子嘛！'的可能涵义是孩子可以谅解，不必赔偿；'战争就是战争'的可能涵义是战争是残酷的，无谓伤感不管用。"}]}, {"id": "4-7-2", "name": "格赖斯隐涵理论", "category": 3, "symbolSize": 26, "desc": "格赖斯提出implicature概念，区分字面意义与具体语境中产生的语用涵义。", "children": [{"id": "4-7-2-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "语言表达式在具体语境中的意义才是完全的真正意义，即隐涵。", "detail": "(1)格赖斯造了'implicature'一词表示不同于字面意义的特殊涵义，一般译为'隐涵''语用涵义''会话涵义'。(2)字面意义叫做'语义意义''抽象意义'，脱离语境就只具有抽象的意义。(3)一语言表达式在具体语境中的意义才是它的完全的真正的意义。"}, {"id": "4-7-2-2", "name": "代表人物", "category": 4, "symbolSize": 22, "desc": "保罗·格赖斯于1975年提出交际合作原则和隐涵理论。", "detail": "(1)保罗·格赖斯(Paul Grice)提出implicature概念和交际合作原则。(2)他认为语用涵义有五个特点：可取消性、不可分离性、可推导性、非规约性、不确定性。(3)从说话人S说的话语p推出语用涵义q需经过六个步骤。"}]}, {"id": "4-7-3", "name": "交际合作原则", "category": 3, "symbolSize": 26, "desc": "格赖斯提出的确定自然语言具体意义的普遍原则，包括总则和四准则。", "children": [{"id": "4-7-3-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "参与会话时要使会话贡献符合交流的公认目的或方向。", "detail": "(1)总则(合作原则)：依据你所参与的谈话交流的公认目的或方向，使你的会话贡献符合这种需要。(2)仿照康德将范畴区分为量、质、关系和方式四类，提出四组合作准则。(3)数量准则：给出适中的信息量，不多不少。(4)质量准则：力求讲真话，不说认为假或缺少证据的话。"}, {"id": "4-7-3-2", "name": "论证依据", "category": 4, "symbolSize": 22, "desc": "四准则：数量准则、质量准则、关联准则、方式准则。", "detail": "(1)关联准则：说话要与已定的交际目的相关联。(2)方式准则：说话要意思明确，表达清晰，避免晦涩和歧义，要简洁有序。(3)遵守这些准则作为基本前提，就可以确定和把握自然语言的具体意义(语用涵义)。"}]}, {"id": "4-7-4", "name": "自然语言逻辑", "category": 3, "symbolSize": 26, "desc": "研究如何迅速有效地把握自然语言表达式在具体语境中语用涵义的新兴学科。", "children": [{"id": "4-7-4-1", "name": "核心主张", "category": 4, "symbolSize": 22, "desc": "逻辑应研究确定自然语言具体意义的普遍原则，而非特定语句的独一无二意义。", "detail": "(1)确定某个话语的语用涵义是一个极其复杂的过程，需要综合和分析、归纳和演绎的统一应用，具有一定或然性。(2)自然语言逻辑研究如何
